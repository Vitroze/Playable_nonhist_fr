l_french: 
  czech.50.t:0 "Exigences soviéto-tchèques !"
  czech.50.d:0 "[CZE.GetLeader] et ses nouveaux amis de l'Union soviétique se sont présentés à notre administration avec une demande outrageuse !\n\nUne demande d'assistance a été envoyée aux Français, et ils ont indiqué que, en raison de la menace soudaine et sérieuse à laquelle ils ne sont pas préparés, ils ont abandonné leur garantie avec nous...\n\nLa demande est simple : abandonnez tous les droits sur les territoires de Bessarabie et de Transylvanie, et permettez la formation d'un nouveau gouvernement par [SOV.GetLeader].\n\nQuelle doit être notre réponse ?"
  czech.50.a:0 "Il semble que nous n'ayons pas le choix."
  czech.50.b:0 "Nous ignorerons simplement une telle demande ridicule."
  czech.51.t:0 "[From.GetNameDefCap] Accepte"
  czech.51.d:0 "[From.GetLeader] a accepté nos demandes concernant le gouvernement roumain, nous avons maintenant des lignes d'approvisionnement directes et un régime ami entre nous."
  czech.52.t:0 "Notre offre est ignorée !"
  czech.52.d:0 "[CZE.GetLeader] a informé [SOV.GetLeader] via Telegram que [FROM.GetNameDefCap] semble avoir entièrement ignoré notre proposition, aucune réponse diplomatique n'a été tentée du tout dans les jours qui ont suivi l'envoi de la demande, et notre armée rapporte l'accumulation de troupes roumaines à notre frontière."
  czech.52.a:0 "Comment osent-ils ! Alertez les Tchèques ! Nous partons en guerre !"
  czech.52.b:0 "Cela pourrait s'escalader, reculez."
  czech.53.d:0 "Depuis que nos demandes ont été envoyées au gouvernement [From.GetNameAdj], il n'y a eu que silence radio, et il y a des rapports de troupes roumaines à notre frontière qui s'installent. Malheureusement, il semble qu'ils n'ont aucune intention d'abandonner sans combat.\n\nIl n'y a rien que nous puissions faire sans l'approbation de [SOV.GetNameAdj], nous devrions les informer."
  czech.53.a:0 "Préparez les troupes ! Nous attendons les instructions soviétiques !"
  czech.54.t:0 "[SOV.GetLeader] Recule !"
  czech.54.d:0 "[SOV.GetLeader] nous a informés qu'ils ne donneront pas suite à leurs menaces envers la Roumanie. Malheureusement, il y a peu de choses que nous puissions faire sans leur soutien..."
  czech.54.a:0 "À quoi pense-t-il ?!"
  czech.60.t:0 "L'effondrement de la [CZE.GetName]"
  czech.60.d:0 "Nos alliés de la [CZE.GetName] se sont officiellement rendus à [GER.GetLeader] ce matin. Avec une défaite si cuisante, et maintenant un terrain de combat terrible, la question devient maintenant de savoir quoi faire ensuite.\n\nDe nombreux conseillers suggèrent que nous approchions les Allemands avec un accord de paix."
  czech.60.a:0 "À quoi bon les Tchèques de toute façon ?"
  czech.60.b:0 "Nous ne devons pas nous humilier !"
  czech.61.t:0 "[SOV.GetLeader] Se rend !"
  czech.61.d:0 "Nous avons été approchés hier par un petit groupe de diplomates [From.GetNameAdj] offrant une reddition conditionnelle, ils proposent que l'intégralité de la Bohême et de la Slovaquie soit remise entre nos mains, ainsi que des concessions mineures.\n\nNos conseillers suggèrent que nous acceptions ce marché pour l'instant, car pousser plus loin dans les montagnes des Carpates sera une campagne presque impossible."
  czech.61.a:0 "L'Allemagne victorieuse ! Acceptez l'offre."
  czech.61.b:0 "Nous n'avons pas encore fini ! Refusons."
  czech.62.t:0 "Les Allemands refusent la paix !"
  czech.62.d:0 "Les Allemands ont répondu à nos appels à la paix en emprisonnant nos ambassadeurs ! Nous devons continuer le combat !"
  czech.62.a:0 "Maudits bellicistes... Combat nous devons !"
  DOD_romania.400.t:0 "Effondrement du Cordon Sanitaire"
  DOD_romania.400.desc:0 "Avec la capitulation de nos alliés en Pologne, et les récentes pertes territoriales, nos conseillers militaires ont proposé que nous préparions la continuation de notre combat avec les pays alignés démocratiquement en tant que gouvernement en exil. Faire cela nous donnera une bien meilleure chance de pouvoir reprendre notre pays si nous le perdons..."
  DOD_romania.401.t:0 "Proposition de [From.GetAdjective] pour rejoindre les alliances"
  DOD_romania.401.desc:0 "Avec la capitulation de la Pologne, et les pertes territoriales dans leur pays d'origine, [From.GetLeader] a proposé de rejoindre nos factions."
  germany.40.d_4:0 "Les demandes allemandes pour la région des Sudètes en Tchécoslovaquie, où vit un nombre important d'Allemands ethniques, ont atteint un point critique. [GER.GetLeader] a positionné des forces le long de la frontière tchécoslovaque en préparation d'une attaque. Des discussions sont en cours à Munich entre l'Union soviétique et l'Allemagne dans l'espoir de négocier une fin pacifique à la crise des Sudètes. Quelle sera la position russe ?"
  POR_portugal_invasion_of_rio:0 "Reprendre Rio"
  POR_rio_saga.1.t:0 "Une proposition curieuse"
  POR_rio_saga.1.desc:0 "Peu après nos annonces de récentes revendications sur le territoire colonial portugais légitime au Brésil, certains de nos meilleurs membres du personnel naval se sont présentés à nous avec une proposition.\n\nLa proposition suggère que nous envoyions des marins portugais pour infiltrer discrètement la ville de Rio de Janeiro et les ports environnants pour un coup d'État en douceur de l'administration locale. Si ce plan réussit, il nous donnera une excellente zone de débarquement pour que nos forces commencent discrètement une invasion à grande échelle sans déclaration officielle de guerre jusqu'à plus tard dans le processus.\n\nLe plan est simple, mais extrêmement risqué pour de nombreux membres du personnel naval et marins si nous sommes découverts. Il est également fortement critiqué par les forces armées portugaises, ce qui signifie qu'un échec pourrait nuire à notre réputation avec elles.\n\nMaintenant, il ne reste plus qu'à décider d'accepter une telle proposition."
  POR_rio_saga.1.a:0 "Accepter le plan."
  POR_rio_saga.1.b:0 "Le Brésil a toujours été amical, modifier le plan pour utiliser notre influence à la place."
  POR_rio_saga.1.a_tt:0 "Le plan prendra quelques mois à exécuter."
  POR_rio_saga.2.t:0 "Activité étrange dans les docks de Rio"
  POR_rio_saga.2.desc:0 "Nous avons reçu des rapports récemment d'un niveau dramatiquement augmenté de marins, visiteurs et immigrants portugais débarquant à Rio de Janeiro depuis les derniers mois.\n\nNormalement, cela ne poserait aucun problème et serait chaleureusement accueilli, cependant, beaucoup de ces hommes sont en forme et en âge militaire. Et avec les nouvelles des prétendues nouvelles revendications du gouvernement portugais sur le territoire brésilien, commencent à paraître suspectes aux locaux.\n\nEn plus de cela, ce matin même, la police locale a répondu à des rapports d'activité suspecte et a découvert un cache d'armes modernes sans marque, et même trois pièces d'artillerie modernes stockées et démontées.\n\nDeux suspects ont été mis en garde à vue, comment devons-nous les traiter ?"
  POR_rio_saga.2.a:0 "Les 'interroger'."
  POR_rio_saga.2.b:0 "Rien à craindre. Mais nous prendrons ces armes..."
  POR_rio_saga.3.t:0 "Infiltration réussie !"
  POR_rio_saga.3.desc:0 "Le plan a été un succès complet !\n\nNous avons perdu quelques bons hommes en chemin, mais aucun d'eux ne nous a déçus et tous ont pu garder leurs lèvres scellées.\n\nNos hommes sont en position pour une prise de contrôle discrète de la ville et des terres environnantes par l'occupation des routes locales, des hôpitaux, des commissariats de police, des bâtiments gouvernementaux et des services essentiels. Juste maintenant, trop tard, les autorités locales remarquent notre présence et montent une défense, nous estimons qu'elles auront besoin d'au moins quelques jours pour rassembler leurs forces.\n\nIl est temps de déplacer rapidement nos hommes plus professionnels dans la région avant d'être repoussés."
  POR_rio_saga.3.a:0 "Rio est à nous ! Maintenant le reste du Brésil !"
  POR_rio_saga.4.t:0 "L'interrogatoire atteint une impasse"
  POR_rio_saga.4.desc:0 "Notre opération de collecte de renseignements auprès de nos nouveaux invités a atteint une impasse, selon tous les comptes, il semble que le duo ait agi seul et souhaité vendre les armes sur le marché noir. Comment ils ont réussi à faire entrer une si grande cache dans le pays, et à qui ils avaient l'intention de les vendre, reste inconnu."
  POR_rio_saga.4.a:0 "C'est tout ce qu'il y a à dire ?"
  POR_rio_saga.5.t:0 "Infiltration découverte !"
  POR_rio_saga.5.desc:0 "Après qu'un duo de marins portugais a été appréhendé, notre opération pour infiltrer la société de Rio a été exposée. Nous faisons des efforts pour évacuer autant d'hommes que possible, mais il semble qu'un grand nombre de ceux envoyés aient été emprisonnés et attendent leur procès.\n\nIl est à prévoir qu'ils seront exécutés..."
  POR_rio_saga.5.a:0 "Au diable le plan ! Nous reprenons notre terre maintenant !"
  POR_rio_saga.6.t:0 "Complot découvert !"
  POR_rio_saga.6.desc:0 "Les Portugais appréhendés ont finalement décidé qu'ils en avaient assez, nous avons reçu une liste de lieux et de noms liés à un complot portugais pour établir une tête de pont pour une invasion à grande échelle de notre pays.\n\nPourquoi quelqu'un penserait qu'une telle chose passerait inaperçue est déconcertant, mais néanmoins cela semble être vrai. La police nationale et locale est maintenant à la chasse et débusque quiconque est lié au complot."
  POR_rio_saga.6.a:0 "Je ne pense pas que nous ayons vu la fin de cela..."
  POR_rio_saga.7.t:0 "Rio de Janeiro sous occupation soudaine !"
  POR_rio_saga.7.desc:0 "Hier après-midi à 4h, le quartier général de la Polícia Civil do Estado do Rio de Janeiro dans la ville intérieure a été rapidement et professionnellement submergé par une force hostile inconnue.\n\nÀ 4h15, l'administration gouvernementale locale était tenue en joue.\n\nÀ 6h, presque toute la région de notre capitale avait été occupée. Une telle manœuvre inattendue semble être effectuée par la marine portugaise et n'a été rien de moins qu'une honte nationale et une manœuvre effrayante d'une administration portugaise en place depuis moins d'un an.\n\nNous devons agir rapidement si nous avons une chance de repousser ce qui semble être maintenant une invasion à grande échelle..."
  POR_rio_saga.7.a:0 "Nous devons attaquer pour reprendre la ville tout de suite !"
  POR_rio_saga.7.b:0 "Meu Senhor Jesus ! Montez une défense ! Vite !"
  ENG_Raj_Civil_war_tt:1 "§RUne fois ce focus pris, si le Raj entre dans une guerre civile, nous pourrons combattre aux côtés des loyalistes§!\n"
  tfv_raj.50.t:0 "Les nationalistes indiens demandent du soutien"
  tfv_raj.50.desc:0 "Subhas Chandra Bose, leader du Bloc avant de l'Inde tout entière, est venu à Tokyo pour demander notre aide dans la lutte pour la liberté de l'Inde. Dans une lettre à [JAP.GetLeader], il a exprimé son admiration et suggéré qu'une Inde indépendante serait un allié précieux dans nos efforts pour ancrer [JAP.GetNameDef] à sa place légitime dans le monde."
  tfv_raj.50.a:0 "Les jours du Royaume-Uni sont comptés."
  tfv_raj.50.b:0 "Quelle notion absurde."
  tfv_raj.51.t:0 "[JAP.GetNameDefCap] soutient l'indépendance de l'Inde"
  tfv_raj.51.desc:0 "L'ambassadeur [JAP.GetAdjective] a visité le Foreign Office aujourd'hui pour discuter de la question de l'indépendance de l'Inde. Pendant la réunion, il a clairement indiqué que [JAP.GetLeader] considère notre domination continue sur l'Inde comme totalement inacceptable. Il semble que Bose ait promis qu'une Inde indépendante soutiendra les intérêts [JAP.GetAdjective] dans la région. \n\nL'ambassadeur a refusé de préciser ce que son gouvernement était prêt à faire si nous refusions, mais nous devons supposer qu'ils pourraient même recourir à la guerre."
  tfv_raj.51.a:0 "Ils ne nous laissent alors pas le choix. Nous devons les laisser partir."
  tfv_raj.51.b:0 "Nous avons déjà joué au Grand Jeu en Inde. Voyons à quel point les Japonais s'en sortent. \n\n§RNous ne pourrons pas riposter contre un soulèvement à moins de poursuivre une politique de Défense Mondiale ou de faire des investissements en Inde via un focus.§!"
  tfv_raj.52.t:0 "[JAP.GetNameDefCap] reprend notre cause"
  tfv_raj.52.desc_JAP_helps:0 "Après avoir rencontré le ministre des Affaires étrangères [JAP.GetAdjective] et plaidé sa cause, Subhas Chandra Bose a réussi à convaincre les Japonais de nous soutenir. Bose a également rencontré le leader japonais Tojo et a discuté de questions d'intérêt commun pendant plusieurs heures, y compris la levée d'une unité de volontaires indiens parmi les prisonniers de guerre britanniques."
  tfv_raj.52.desc_JAP_helps_ENG_reject:0 "Nos espoirs d'une voie facile vers l'indépendance ont été cruellement anéantis par le bureau colonial britannique. Lorsque l'ambassadeur [JAP.GetAdjective] les a approchés avec la demande que nous soyons autorisés à déterminer notre propre destin, on lui a rapidement répondu qu'il n'y avait rien à discuter. Le gouvernement [ENG.GetAdjective] affirme que la question de notre indépendance est une affaire interne dans laquelle aucune puissance étrangère ne peut intervenir."
  tfv_raj.52.a:0 "Le combat continue."
  tfv_raj.53.t:0 "[JAP.GetAdjective] refuse d'aider"
  tfv_raj.53.desc:0 "Subhas Chandra Bose a tenté d'obtenir l'aide du gouvernement [JAP.GetAdjective] pour notre lutte, mais ses efforts n'ont pas été couronnés de succès. Après avoir attendu plusieurs jours pour parler à Tojo, il a obtenu une audience qui n'a duré que dix minutes. \n\nBien que Tojo ait exprimé une grande admiration pour notre situation et notre esprit fanatique de résistance, il a également clairement indiqué qu'il ne croit pas que notre pays mérite que l'on dépense des ressources pour lui."
  tfv_raj.53.a:0 "Damnation."
  tfv_raj.54.t:0 "Liberté pour l'Inde"
  tfv_raj.54.desc:0 "Aujourd'hui marque le début d'une nouvelle ère dans l'histoire de l'Inde. Après des siècles sous la domination étrangère, nous avons enfin obtenu la pleine indépendance. Les fonctionnaires civils [ENG.GetAdjective] locaux ont reçu l'ordre d'aider à la transition vers l'autonomie [RAJ.GetAdjective] et seront renvoyés chez eux dans les mois à venir. \n\nAvec l'aide de nos nouveaux amis [JAP.GetAdjective], nous pouvons maintenant nous concentrer sur la tâche qui nous attend : construire une nation pour notre peuple."
  tfv_raj.54.a:0 "Triomphe !"
  PRC_take_over_states:0 "Prendre la responsabilité des territoires occupés"
  PRC_take_inner_mongolia:0 "Occuper la Mongolie intérieure"
  PRC_take_upper_manchuria:0 "Occuper la Manchourie du Nord"
  PRC_take_Gansu:0 "Assumer la direction du Gansu"
  PRC_take_Xian:0 "Assumer la direction de Xian"
  PRC_take_Suiyuan:0 "Assumer la direction de Suiyuan"
  PRC_take_Ordos:0 "Assumer la direction de Ordos"
  PRC_remove_Yan_Xishan:0 "Retirer Yan Xishan"
  PRC_remove_sheng_shikai:0 "Retirer Sheng Shikai"
  wtt_xian_incident.300.t:0 "La gravité de la situation"
  wtt_xian_incident.300.desc:0 "[ROOT.GetLeader] a été emmené par certains des principaux membres de l'état-major des forces armées pour avoir une 'discussion' aujourd'hui. Concernant la situation géopolitique dans laquelle nous nous trouvons.\n\nLe maréchal Yu-Ming l'a dit simplement ; 'Nous ne pouvons en aucune circonstance maintenir une guerre sur deux fronts.'\n\nLa main de [ROOT.GetLeader] a essentiellement été forcée, nous devons envoyer une offre d'alliance à [PRC.GetLeader] pour un Front uni chinois. Nous offrirons également des concessions à Xian, et promettons de ne pas interférer avec leurs affaires.\n\nSi nous refusons, cela pourrait coûter très cher."
  wtt_xian_incident.300.a:0 "Très bien, envoyez une offre qu'ils ne pourront pas refuser."
  wtt_xian_incident.300.b:0 "Non ! Nous devons continuer la campagne."
  wtt_xian_incident.301.t:0 "Une offre des nationalistes"
  wtt_xian_incident.301.desc:0 "Voyant la position précaire dans laquelle ils se trouvent, le gouvernement nationaliste est venu à [ROOT.GetLeader] avec une offre.\n\nLeur offre inclut de nombreuses mentions d'un 'Front uni' contre le Japon. Ils proposent de céder Xian, et de ne pas interférer avec les affaires communistes dans un avenir prévisible.\n\nNous pensons que nous devrions l'accepter, la révolution sera sans signification si l'impérialisme japonais prend le contrôle de la Chine."
  wtt_xian_incident.301.a:0 "Nous acceptons !"
  wtt_xian_incident.301.b:0 "Ces chiens offrent trop peu !"
  wtt_xian_incident.302.t:0 "[ROOT.GetLeader] Accepte !"
  wtt_xian_incident.302.desc:0 "Notre offre a été acceptée. Le Front uni doit être formé immédiatement !"
  wtt_xian_incident.302.a:0 "Il est temps de concentrer nos efforts à l'Est !"
  wtt_xian_incident.303.t:0 "[ROOT.GetLeader] nous refuse !"
  wtt_xian_incident.303.desc:0 "Notre offre a été rejetée. Nous devrons combattre les Japonais et les Communistes seuls."
  wtt_xian_incident.303.a:0 "Sombre, mais nous devons encore combattre."
  BUL_free_balkan_states_guarantees_communist_tt:0 "Garantir chaque pays §Ycommuniste§! indépendant ou allié à §Y[BUL.GetNameWithFlag]§! :"
  BUL_confederation_will_invite_more_tt:0 "Si le focus §YEnterrer les rancœurs du passé§! est pris, il invitera également les nations non-alignées dans les Balkans."
  BUL_bury_the_grudges_of_the_past_explanatory_monarchist_tt:0 "Toute nation indépendante §Ydémocratique§! ou §Ynon-alignée§! dans les Balkans recevra l'événement §Y'[BUL.GetNameDef] nous invite à la [GetDemocraticBalkanConfederationName]'§!.\n§RBulgarie renoncera à toute revendication territoriale dans ces pays§!."
  nonhist_ENG.1.t:0 "Victoire des vrais révolutionnaires !"
  nonhist_ENG.1.desc:0 "Après la victoire sur le faux régime qui refusait de coopérer, les peuples conquis d'Écosse, du Pays de Galles et d'Irlande du Nord se sont enfin libérés des Anglais !\n\nDes pourparlers de paix sont en cours pour permettre à la nation 'britannique' de ne plus exister."
  nonhist_ENG.1.a:0 "Hourra !"
  nonhist_ENG.2.t:0 "Paix avec [SOV.GetLeader] ?"
  nonhist_ENG.2.desc:0 "Après la capitulation de la Pologne, et nos perspectives pour l'Europe devenant de plus en plus sombres, certains ministres du gouvernement ont approché le parlement avec une proposition de pardonner l'occupation soviétique de la Pologne. Cela découle d'une théorie selon laquelle [SOV.GetLeader] pourrait un jour devenir notre allié contre l'Allemagne.\n\nBien que cela décevra certainement les Polonais, il n'y a pas grand-chose que nous puissions faire en étant obstinés et en jurant de combattre deux grandes puissances déjà dangereusement alignées.\n\nNous devrions reconnaître formellement la validité du pacte Molotov-Ribbentrop, et convaincre les Polonais d'abandonner pour l'instant leur moitié orientale..."
  nonhist_ENG.2.a:0 "Reconnaître le pacte."
  nonhist_ENG.2.b:0 "Pas de paix pour les agresseurs !"
  nonhist_ENG.3.t:0 "Paix avec [ENG.GetNameDef] ?"
  nonhist_ENG.3.desc:0 "Après la capitulation de la Pologne, le gouvernement de Londres nous a contactés en déclarant qu'ils reconnaîtront nos revendications sur leur allié, la Pologne, dans le cadre des stipulations décrites dans le pacte Molotov-Ribbentrop.\n\nBien que cela décevra certainement nos nouveaux amis les Allemands, le fait que nos gains soient reconnus par le Royaume-Uni les consolidera si la guerre tourne mal pour l'Axe."
  nonhist_ENG.3.a:0 "La paix avec Londres est préférable."
  nonhist_ENG.3.b:0 "Pas de paix pour les capitalistes !"
  ROM_might_change_sides_tt:0 "§RLa Roumanie pourrait finir par changer de camp dans la guerre !§!"
  ROM_cannot_change_sides_flag:0 "A la règle de jeu 'La Roumanie ne peut pas changer de camp'"
  ROM_cannot_change_sides_tt:0 "§RSi toutes les parties sont d'accord, la Roumanie doit rester loyale à cette faction.§!"
  nonhist_ROM.1.t:0 "[FROM.GetNameDef] exige la Transnistrie"
  nonhist_ROM.1.desc:0 "[ROM.GetNameDef] a envoyé des diplomates ce matin pour demander que nous transférions la propriété de nos territoires 'occupés' en Transnistrie sous contrôle roumain.\n\nNos conseillers disent qu'ils menacent de quitter la [Root.GetFactionName].\n\nComment devons-nous répondre ?"
  nonhist_ROM.1.a:0 "Accepter, mais ils doivent être liés à nous"
  nonhist_ROM.1.b:0 "Ils n'ont aucune conséquence, ignorons cela"
  nonhist_ROM.2.t:0 "[FROM.GetNameDef] accepte"
  nonhist_ROM.2.desc:0 "[FROM.GetNameDef] a accepté nos conditions, à condition que nous signions certains documents garantissant notre alliance."
  nonhist_ROM.3.t:0 "[FROM.GetNameDef] nous ignore !"
  nonhist_ROM.3.desc:0 "Il s'est écoulé plusieurs jours depuis que [FROM.GetNameDef] a reçu notre demande, et lorsque nous avons demandé à nouveau aujourd'hui, on nous a dit qu'il y avait des questions plus importantes à traiter !"
  nonhist_ROM.3.a:0 "C'est un outrage, notre alliance est terminée !"
  nonhist_ROM.3.b:0 "Nous n'avons pas le choix, nous resterons dans la [Root.GetFactionName]."
  HOL_join_the_major_fascist_powers:0 "Rejoindre les puissances fascistes montantes d'Europe"
  HOL_join_the_major_fascist_powers_desc:0 "Les nouvelles puissances nationalistes montantes en Europe se sont de plus en plus montrées comme une alternative au nazisme allemand, et nous n'avons pas manqué de le remarquer, une alliance serait bénéfique."
  RAJ_seek_help_from_japan:0 "Chercher de l'aide auprès du Japon"
  RAJ_seek_help_from_japan_promised:0 "Les Japonais ont promis leur aide"
  RAJ_seek_help_from_japan_desc:0 "La nouvelle sphère de prospérité japonaise promet de purger l'Asie des puissances coloniales européennes. Nous devrions nous rapprocher d'eux et chercher leur soutien."
  RAJ_squeeze_western_asia:0 "Pressurer l'Asie occidentale"
  RAJ_squeeze_western_asia_desc:0 "Nous devons assurer une administration du Komintern en Afghanistan et en Iran, pour sécuriser des ressources précieuses et des lignes d'approvisionnement dans la guerre contre les Allemands."
  RAJ_himalayan_conquests:0 "Conquêtes himalayennes"
  RAJ_himalayan_conquests_desc:0 "Il est temps d'établir enfin une administration indienne en utilisant nos nouvelles libertés et notre unité dans les régions du nord."
  CAN_will_support_communists_tt:0 "L'IA canadienne sera plus susceptible de soutenir ces nations avec du matériel et des volontaires"
  HOL_join_the_western_alliance:0 "Rejoindre l'Ouest socialiste"
  HOL_join_the_western_alliance_desc:0 "Le mouvement communiste en Europe occidentale est devenu de plus en plus réussi, et maintenant ils ont choisi de se tenir à l'écart du Komintern. Comme ils sont beaucoup plus proches de nous géographiquement, nous aligner avec eux bénéficiera davantage à la cause du communisme que de compter sur les Soviétiques lointains."
  FRA_has_restored_napoleon_tt:0 "La France a restauré le règne de Napoléon VI."
  GRE_byzantium_restored_tt:0 "Byzance a été restaurée par les réfugiés anatoliens"
  POL_seek_an_alliance_with_french_empire:0 "Rejoindre le Système continental"
  POL_seek_an_alliance_with_byzantine:0 "Rejoindre la nouvelle Rome"
  POL_seek_an_alliance_with_tsar:0 "Chercher une alliance avec le Tsar"
  YUG_independent_kingdoms:0 "Consommer l'indépendance"
  nonhist_generic.1.t:0 "[From.GetNameDefCap] cherche à unir [From.GetFactionName] et [Root.GetFactionName]"
  nonhist_generic.1.d.a:0 "Face à des menaces croissantes pour la liberté et les valeurs démocratiques, les [alliance_applicant.GetAdjective] voient nos alliances respectives comme des défenseurs de la liberté. Ils souhaitent maintenant rejoindre nos deux alliances, pour se tenir avec nous contre les forces qui menaceraient la démocratie."
  nonhist_generic.3.d.a:0 "Face à ce qui peut être vu comme une reddition inévitable à leurs ennemis, les [FROM.GetAdjective] voient notre alliance comme des défenseurs de la liberté. Ils souhaitent maintenant rejoindre nos deux factions, pour se tenir avec nous contre les forces qui menaceraient la démocratie."
  nonhist_generic.1.d.b:0 "Notre combat pour renverser l'ordre mondial actuel n'a pas échappé à l'attention des nations partageant les mêmes idées. Les [alliance_applicant.GetAdjective] reconnaissent que leur meilleure chance de se tailler un avenir prospère est de s'aligner avec nous dans le conflit à venir, et ils ont donc proposé de rejoindre formellement nos deux alliances ensemble, pour mieux nous défendre contre nos ennemis communs."
  nonhist_generic.3.d.b:0 "Face à ce qui peut être vu comme une reddition inévitable à leurs ennemis, les [FROM.GetAdjective] voient notre alliance comme ayant une cause mutuelle. Ils souhaitent maintenant rejoindre nos deux factions, pour se tenir avec nous contre les forces qui menaceraient l'avenir que nous convoitons."
  nonhist_generic.1.d.c:0 "[alliance_applicant.GetNameDefCap] a reconnu qu'elle doit s'unir avec d'autres républiques socialistes pour renforcer la place du communisme dans le monde. En acceptant notre rôle de premier plan dans la lutte internationale des travailleurs, les [alliance_applicant.GetAdjective] demandent maintenant de rejoindre formellement nos deux alliances ensemble en une seule."
  nonhist_generic.3.d.c:0 "Face à ce qui peut être vu comme une reddition inévitable à leurs ennemis, les [FROM.GetAdjective] voient notre alliance comme un défenseur de la lutte du peuple. Ils souhaitent maintenant rejoindre nos deux factions, pour se tenir avec nous contre les forces qui menaceraient la cause de Marx internationalement."
  nonhist_generic.1.d.e:0 "Alors que les bouleversements actuels en politique internationale continuent de réverbérer à travers le monde, les [alliance_applicant.GetAdjective] nous ont estimés être leur meilleure chance de survivre à ces temps tumultueux. Ils demandent donc de rejoindre ensemble leur propre faction avec la nôtre, afin que nous puissions traverser ensemble la tempête à venir."
  nonhist_generic.1.a:0 "Tous ceux qui se tiennent pour la liberté et la démocratie peuvent se tenir avec nous."
  nonhist_generic.1.b:0 "Le monde appartient à tous ceux qui sont forts !"
  nonhist_generic.1.c:0 "Si nous nous tenons ensemble, la révolution ne peut que prévaloir."
  nonhist_generic.1.e:0 "Et nous la traverserons !"
  nonhist_generic.1.f:0 "Nous sommes mieux sans eux."
  nonhist_generic.1.g:0 "Nous avons déjà les alliés dont nous avons besoin."
  nonhist_generic.2.t:0 "[alliance_applicant.GetFactionName] est fusionné avec la faction [alliance_applicant.GetAdjective]"
  nonhist_generic.2.d:0 "[alliance_inviter.GetNameDefCap] a décidé d'accepter notre demande de rejoindre la faction [alliance_applicant.GetAdjective] avec la [alliance_applicant.GetFactionName]. Désormais, nous nous tiendrons ou tomberons ensemble."
  nonhist_generic.2.a:0 "Ensemble, nous défendrons la démocratie."
  nonhist_generic.2.b:0 "Personne ne peut se tenir contre nous !"
  nonhist_generic.2.c:0 "La lutte des travailleurs ne pourrait pas demander de meilleurs champions !"
  nonhist_generic.2.e:0 "Nous mettrons nos différences de côté, pour l'instant."
  nonhist_generic.4.t:0 "Fusionner [ROOT.GetFactionName] et [global.major_alliance_merger.GetFactionName] ?"
  nonhist_generic.4.desc:0 "Comme prévu, notre guerre actuelle contre un ennemi beaucoup plus fort ne se passe pas aussi bien que nous l'espérions. Les principaux membres de notre administration ont fait une recommandation pour que nous contactions les délégués de [global.major_alliance_merger.GetAdjective] afin d'organiser une fusion de nos efforts de guerre. Un tel acte assure également une option pour nous de mettre en place un gouvernement en exil au sein de la [global.major_alliance_merger.GetFactionName] si le pire devait arriver. Puisque nous partageons des valeurs fondamentales avec eux, nous sommes assez confiants qu'ils accepteront notre proposition."
  nonhist_generic.4.a:0 "Envoyer la délégation."
  nonhist_generic.4.b:0 "Nous n'avons pas besoin d'eux..."
  POL_GRE_ALLIANCE:0 "Pacte de Przeworsk"
  POL_FRA_ALLIANCE:0 "Alliance continentale"
  POL_SOV_ALLIANCE:0 "Nations congressionnelles"
  SOV_comintern_after_breakup:0 "Axe de Moscou"
  GER_axis_after_breakup:0 "Axe de Berlin"
  DEN_north_sea_alliance:0 "Alliance de la mer du Nord"
  DEN_normandy_treaty:0 "Traité de Normandie"
  DEN_baltic_sea_zone:0 "Zone de défense de la mer Baltique"
  DEN_bonn_copenhagen_declarations:0 "Déclarations de Bonn-Copenhague"
  soviet_german_friendship_NHMMAP:0 "§YAmitié soviéto-allemande§!"
  nonhist_POL.1.t:0 "[From.GetNameDefCap] Propose une Alliance"
  nonhist_POL.1.d.a:0 "Des responsables de [From.GetNameDef] ont annoncé leur intérêt à signer une alliance avec le nouvel Empire allemand. Croyant que le Kaiser [Root.GetLeader] est plus favorable à l'indépendance [From.GetAdjective] que [Root.GetHerHis] prédécesseur, et citant que l'incarnation moderne de [From.GetNameDef] peut être directement attribuée à l'Acte du 5 novembre signé par les Puissances centrales, [From.GetNameDef] propose que les deux États signent une alliance formelle.\nAccepter marquerait une anomalie monumentale dans l'histoire des relations [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] et marquerait un avenir potentiellement radieux pour les deux nations."
  nonhist_POL.1.d.b:0 "Des responsables de [From.GetNameDef] ont annoncé leur intérêt à signer une alliance avec le nouvel Empire russe. Croyant que le Tsar [Root.GetLeader] est plus favorable à l'indépendance [From.GetAdjective] que [Root.GetHerHis] prédécesseur, et citant que l'incarnation moderne de [From.GetNameDef] peut être directement attribuée aux Actes congressionnels signés par l'Empire russe dans le passé, [From.GetNameDef] propose que les deux États signent une alliance formelle.\nAccepter marquerait une anomalie monumentale dans l'histoire des relations [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] et marquerait un avenir potentiellement radieux pour les deux nations."
  nonhist_POL.1.d.c:0 "Des responsables de [From.GetNameDef] ont annoncé leur intérêt à signer une alliance avec le nouvel Empire byzantin. Croyant que l'Archon [Root.GetLeader] est plus favorable à l'indépendance [From.GetAdjective] que toute autre grande puissance, et citant que l'incarnation moderne de [From.GetNameDef] peut être directement attribuée à la tradition orthodoxe grecque, [From.GetNameDef] propose que les deux États signent une alliance formelle.\nAccepter marquerait une anomalie monumentale dans l'histoire des relations [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] et marquerait un avenir potentiellement radieux pour les deux nations."
  nonhist_POL.1.d.e:0 "Des responsables de [From.GetNameDef] ont annoncé leur intérêt à signer une alliance avec le nouvel Empire français. Croyant que [Root.GetLeader] est plus favorable aux intérêts [From.GetAdjective] que [Root.GetHerHis] prédécesseur, et citant que l'incarnation moderne de [From.GetNameDef] peut être directement attribuée au Duché de Varsovie accordé par Napoléon lui-même, [From.GetNameDef] propose que les deux États signent une alliance formelle.\nAccepter marquerait une anomalie monumentale dans l'histoire des relations [Root.GetNonIdeologyName]-[From.GetNonIdeologyName] et marquerait un avenir potentiellement radieux pour les deux nations."
  nonhist_POL.1.a:0 "Nous acceptons !"
  nonhist_POL.1.b:0 "[From.GetNonIdeologyName] est toujours notre ennemi."
  nonhist_POL.1.c:0 "Transférer Dantzig et ils ont un accord !"
  nonhist_POL.1.e:0 "Transférer la Pologne de l'Est et ils ont un accord !"
  nonhist_POL.1.f:0 "Restaurer le Duché et ils ont un accord !"
  nonhist_POL.2.t:0 "[From.GetNonIdeologyName] Accepte !"
  nonhist_POL.2.desc:0 "[From.GetNameDefCap] est revenu vers nous avec une gracieuse acceptation de notre proposition, que notre nouvelle alliance soit fructueuse !"
  nonhist_POL.2.a:0 "À un partenariat durable !"
  nonhist_POL.3.t:0 "[From.GetNonIdeologyName] Décline."
  nonhist_POL.3.desc:0 "Citant des griefs historiques, et suggérant subtilement des territoires disputés, [From.GetNonIdeologyName] a décliné notre offre. Cela a provoqué un tollé au sein du cabinet, exigeant une compensation pour les promesses non tenues."
  nonhist_POL.3.a:0 "Ils auront ce qui leur revient !"
  nonhist_POL.401.t:0 "Une alliance pour l'Est ?"
  nonhist_POL.401.desc:0 "[From.GetNameDefCap] est revenu vers nous avec une offre conditionnelle qu'ils affirment être mutuellement bénéfique pour les deux parties. Ils affirment que les Actes congressionnels du royaume original [Root.GetAdjective] dans l'Empire russe comprenaient des régions de territoire russe 'occupé' en Pologne. Ils affirment qu'ils accepteraient de signer une alliance, mais seulement si ce qu'ils revendiquent est reconnu et rectifié."
  nonhist_POL.401.a:0 "Échanger ces terres problématiques contre une armée semble bénéfique."
  nonhist_POL.401.b:0 "Ils demandent trop !"
  nonhist_POL.402.t:0 "Contrôle français sur la politique étrangère ?"
  nonhist_POL.402.desc:0 "[From.GetNameDefCap] est revenu vers nous avec une offre conditionnelle qu'ils affirment être mutuellement bénéfique pour les deux parties. Ils affirment que la dissolution du Duché de Varsovie en 1813 était un acte illégitime, et que la restauration du Duché (avec le contrôle français sur la politique étrangère, bien sûr) est requise afin d'accepter les demandes [Root.GetAdjective] pour une alliance."
  nonhist_POL.402.a:0 "Un retour en arrière."
  nonhist_POL.402.b:0 "Ne soyez pas ridicule !"
  nonhist_POL.5.t:0 "[From.GetNameDefCap] Refuse"
  nonhist_POL.5.desc:0 "Malheureusement, il semble qu'aucun accord ne puisse être conclu avec les Polonais et ils ont refusé notre offre de concessions en échange d'une alliance. Les tensions montent déjà à la frontière [From.GetAdjective] et certains craignent que la guerre soit à l'horizon."
  nonhist_POL.5.a:0 "Nous prendrons ce qui nous est dû."
  nonhist_POL.6.t:0 "La Pologne exige la Transylvanie"
  nonhist_POL.6.desc:0 "Le nouveau gouvernement polonais est venu vers nous avec une demande outrageante, ils 'demandent humblement' que nous restaurions leur propriété 'légitime et donnée par Dieu' de la région de Transylvanie. \n\nCette demande est apparemment soutenue par une promesse de 'violence juste' si elle n'est pas satisfaite...\n\nDevons-nous prendre cela au sérieux ?"
  nonhist_POL.6.a:0 "Ils sont fous, mais nous n'avons pas le choix..."
  nonhist_POL.6.b:0 "Sinon...quoi ?"
  nonhist_POL.7.t:0 "[From.GetNameDefCap] transfère la Transylvanie"
  nonhist_POL.7.desc:0 "Plutôt que de faire face à la puissance de nos armées, les [From.GetAdjective] lâches ont décidé de nous rendre nos territoires légitimes. L'intégralité de la Transylvanie qui était contrôlée par [From.GetNameDefCap] a été remise à notre administration, et nos forces ont pris le contrôle total."
  nonhist_POL.7.a:0 "Comme il se doit."
  nonhist_POL.8.t:0 "[From.GetNameDefCap] refuse d'abandonner la Transylvanie"
  nonhist_POL.8.desc:0 "Les oppresseurs des Slaves de [From.GetNameDefCap] ont décidé d'ignorer notre revendication légitime. Citant notre revendication comme à la fois 'illégitime' et 'ridicule', ils ont complètement rejeté notre demande."
  nonhist_POL.8.a:0 "Eh bien, il n'y a pas beaucoup de Slaves dans la région..."
  nonhist_POL.8.b:0 "Ils sont allés trop loin !"
  nonhist_POL.9.t:0 "La Pologne offre la paix en échange de leurs revendications"
  nonhist_POL.9.desc:0 "[POL.GetNameDefCap] a envoyé un message demandant que nous nous rendions en échange de toutes les revendications territoriales polonaises et rien de plus. Une telle demande risible, cependant, ne peut être ignorée en raison des circonstances actuelles autour de la perte de Kiev... Devons-nous la considérer ?"
  nonhist_POL.9.a:0 "Il semble que nous n'ayons pas le choix..."
  nonhist_POL.9.b:0 "Nyet ! Les Polonais seront repoussés !"
  nonhist_POL.10.desc:0 "[FROM.GetNameDefCap] a accepté nos demandes, et notre argile légitime nous sera remise dans les jours à venir !"
  nonhist_POL.11.desc:0 "[FROM.GetNameDefCap] a refusé nos demandes ! Il semble que nous devrons marcher jusqu'à Moscou !"
  nonhist_POL.11.a:0 "En avant alors !"
  nonhist_CAN.1.t:0 "Soutien canadien pour un Baja synarchiste"
  nonhist_CAN.1.desc:0 "Le nouveau gouvernement de [FROM.GetNameDefCap] a récemment commencé une campagne pour financer, approvisionner et soutenir un groupe paramilitaire synarchiste.\n\nLe groupe a rapidement gagné du terrain dans les régions les plus pauvres et religieuses du pays. Leurs efforts pourraient renverser notre gouvernement si nous ne faisons pas attention. Devons-nous agir ?"
  nonhist_CAN.1.a:0 "Combattons-les maintenant ! Pendant que nous le pouvons !"
  nonhist_CAN.1.b:0 "Arrêter les dirigeants."
  nonhist_CAN.1.c:0 "Ils ne sont pas une menace."
  nonhist_CAN.1.d:0 "Nous devrions soutenir cela."
  CAN_mexican_baja_tt:0 "§RLe Mexique peut encore combattre notre influence.§!"
  NHMMAP_suprise_attack:0 "Attaque surprise !"
  NHMMAP_suprise_attack_desc:0 "Il semblerait que nous subissions une invasion à grande échelle par les forces grecques, cette attaque inattendue de la part de la république grecque amicale semble provenir de forces internes au sein du pays qui ont renversé leur gouvernement. Notre nation est attaquée avec une telle ferveur inattendue que nous avons été complètement pris au dépourvu !"
  POL_the_carpathian_pathway:0 "La Voie des Carpates"
  POL_the_carpathian_pathway_desc:0 "Les montagnes des Carpates ont depuis longtemps été un sujet de dispute entre la Hongrie et la Roumanie, tandis que les minorités slaves (admettons-le, petites) ont été prises entre les deux. Plus maintenant ! Nous devons exiger que la région soit remise à notre administration ! Cette action nous donne également une bonne raison et un accès à la Yougoslavie, rendant l'unification slave plus réalisable."
  GER_baltic_wargoal:0 "Ouvrir un front nordique"
  GER_baltic_wargoal_desc:0 "Dans notre guerre contre l'Union soviétique, étendre l'ennemi est la clé. Nous devons nous assurer que l'ennemi doit couvrir autant de terrain que possible, donc les États baltes doivent se soumettre à notre volonté."
  LAT_enforce_military_rule:0 "Imposer la loi martiale"
  LAT_enforce_military_rule_desc:0 "La Lettonie n'est pas seule dans sa lutte pour l'indépendance. La Lituanie et l'Estonie sont également entourées par les mêmes ennemis que les nôtres, mais leurs gouvernements manquent de courage pour faire ce qui est nécessaire pour défendre leur peuple. Nous devons imposer la règle militaire à travers toutes les Baltes."
  control_all_nordic_states_NHMMAP_tt:0 "Contrôler ou avoir un membre de la faction contrôler tous les États §Ysuédois§!, §Ynorvégiens§!, et §Ydanois§!"
  transfer_nordic_occupied_tt:0 "Transfère tous les États §Ynordiques§! non centraux occupés par les membres de votre faction."
  JAP_expand_northern_bases:0 "Préparations pour l'expansion nordique"
  JAP_SOV_prepare_magadan_invasion:0 "Préparer une invasion de Magadan"
  JAP_SOV_prepare_kamchatka_invasion:0 "Préparer une invasion du Kamtchatka"
  JAP_SOV_begin_invasions:0 "Exécuter le plan"
  JAP_magadan_prepared_tt:0 "Lorsque la guerre avec le [SOV.GetNameDefCap] commence, une force d'invasion sera envoyée à Magadan sous couverture et construira des lignes d'approvisionnement naval dans la région.\n§Y3 unités japonaises apparaîtront dans l'État§!"
  JAP_kamchatka_prepared_tt:0 "Lorsque la guerre avec le [SOV.GetNameDefCap] commence, une force d'invasion sera envoyée au Kamtchatka sous couverture et construira des lignes d'approvisionnement naval dans la région.\n§Y3 unités japonaises apparaîtront dans l'État§!"
  JAP_kamchatka_invade_tt:0 "Un débarquement naval aura lieu au Kamtchatka et des ports d'approvisionnement seront construits dans la région."
  JAP_magadan_invade_tt:0 "Un débarquement naval aura lieu à Magadan et des ports d'approvisionnement seront construits dans la région."
  JAP_SOV_small_gains_promised:0 "promesses territoriales nordiques mineures"
  JAP_SOV_mid_gains_promised:0 "promesses territoriales nordiques"
  JAP_SOV_large_gains_promised:0 "grandes promesses territoriales nordiques"
  JAP_SOV_promise_small_gains:0 "Investir dans une petite victoire"
  JAP_SOV_promise_mid_gains:0 "Investir dans une victoire solide"
  JAP_SOV_promise_large_gains:0 "Investir dans une grande victoire"
  JAP_promise_expectations_small_tt:0 "Bien que décevant pour certains, les attentes §Ypetites§! sont §Yfaciles§! à satisfaire, mais §Ypeu récompensées§!. Nous promettons d'annexer jusqu'à §YAmur§!."
  JAP_promise_expectations_mid_tt:0 "Comme un bon compromis, les attentes §Ymoyennes§! sont §Ydéfier§! à satisfaire, et viennent avec une §Ybonne récompense§!. Nous promettons d'annexer jusqu'à §YBuryatia§!."
  JAP_promise_expectations_large_tt:0 "Certains diraient que nous sommes gourmands. Les attentes §Ygrandes§! seront §Ydifficiles et exigeantes§! à satisfaire, mais apporteraient une §Yrécompense exceptionnelle§!. Nous promettons d'annexer jusqu'à §YKrasnoïarsk§!."
  JAP_north_states_tt:0 "@JAP§YJapon§! ou un allié contrôle les États suivants :\n§YUraji\nKhabarovsk\nKita Karafuto\nBirobidzhan\nNikolayevsk\nAmur\nMagadan\nKamchatka§!\n"
  JAP_north_states_2_tt:0 "En plus de cela, tous les États suivants :\n§YChita\nBuryatia\nChukotka\nET UN§! des États suivants :\n §YGobi\n Dornod\n Bodaybo\n Yakutsk\n Kolyma§!\n"
  JAP_north_states_3_tt:0 "Et enfin, tous les États suivants :\n§YIrkutsk\nKrasnoyarsk\nET UN§! des États suivants :\n §YKhovd\n Kirensk\n Udachny\n Novonikolayevsk§!\n"
  nonhist_CHI.1.t:0 "Intégration chinoise !"
  nonhist_CHI.1.desc:0 "Nos amis de [FROM.GetNameDefCap] sont venus vers nous avec un plan de coopération et d'intégration, le plan énonce clairement l'intention de [From.GetLeader].\n\n Devons-nous mal performer dans l'année à venir, ils assumeront la responsabilité de nos territoires."
  nonhist_CHI.1.a:0 "Ensemble nous défendrons la Chine."
  nonhist_CHI.1.b:0 "Nous ne laisserons pas cela se produire."
  PRC_cannot_integrate_me_tt:0 "Choisir cette option signifie que vous ne serez pas complètement annexé par vos alliés quoi qu'il arrive. L'IA ne choisira pas cette option."
  POR_potential_civil_war_high_requirement_NHMMAP_tt:0 "§RSi la §YStabilité§! est §Yinférieure à 40%§R au moment où ce focus est complété, une guerre civile commencera !§!§!§!§!"
  wtt_germany.18.c:0 "Tenir des procès équitables. Certains d'entre eux ne sont pas coupables."
  GER_held_fair_trials_for_nazis:0 "A tenu des §Yprocès équitables§! pour les §Ydirigeants fascistes§!."
  GER_democratic_countries_wont_accept_deals_tt:0 "§RSi les fascistes sont autorisés au gouvernement, les pays démocratiques n'accepteront pas les accords.§!"
  GER_reinstate_nazi_leadership:0 "Autoriser les fascistes au gouvernement"
  GER_reinstate_nazi_leadership_desc:0 "Après leurs procès équitables, beaucoup des dirigeants fascistes ont eu des peines légères, et certains ont même été trouvés non coupables de toute intention criminelle. Permettre à ces dirigeants, admettons-le utiles et diligents, de revenir au gouvernement pourrait en fait être bénéfique dans les jours à venir, mais cela risquerait de susciter la controverse."
  GER_exchange_for_colonies_ENG:0 "Racheter les colonies britanniques"
  GER_exchange_for_colonies_ENG_desc:0 "Nous devrions approcher les Britanniques avec une offre, nous rachèterons nos possessions coloniales légitimes auprès d'eux, à un prix équitable bien sûr. Espérons qu'ils soient réceptifs."
  GER_exchange_for_colonies_JAP:0 "Racheter les colonies japonaises"
  GER_exchange_for_colonies_JAP_desc:0 "Nous devrions approcher les Japonais avec une offre, nous rachèterons nos possessions coloniales légitimes auprès d'eux, à un prix équitable bien sûr. Espérons qu'ils soient réceptifs."
  GER_china_ally:0 "Allié des nationalistes chinois"
  GER_china_ally_desc:0 "Le Kuomintang a été un allié très utile, et nos nouveaux bureaux des possessions impériales et coloniales suggèrent que la Chine peut être une grande richesse de ressources pour nous, comme elle l'a toujours été."
  GER_rekindle_imperial_sentiment_ENG:0 "Raviver le royalisme en Grande-Bretagne"
  GER_rekindle_imperial_sentiment_ENG_desc:0 "Comme nos nouveaux alliés du Royaume-Uni peuvent en témoigner, la richesse et la prospérité apportées par l'ère victorienne étaient sans précédent dans l'histoire, un retour à l'esprit impérial de cette époque devrait être promu au sein de ce pays, pour un allié plus amicaux."
  JAP_help_from_russian_exiles:0 "Soutenir un gouvernement en exil"
  JAP_help_from_russian_exiles_desc:0 "L'Armée blanche exilée de Russie et actuellement en Mandchourie a été un excellent allié pendant notre invasion de la Sibérie, nous devrions conclure un accord avec eux, afin qu'ils puissent commencer à recruter des troupes russes pour notre cause."
  JAP_exiles_will_help:0 "Libère un gouvernement fantoche en exil à §YChita§! avec des cœurs sur l'ensemble de l'§YUnion soviétique§!, ils pourront mettre en place des opérations de §Ysabotage§! en §YUnion soviétique§!"
  JAP_turn_our_gaze_eastward:0 "Tourner notre regard vers l'Est"
  JAP_turn_our_gaze_eastward_desc:0 "Notre nouvel empire avance ! De nouvelles revendications doivent être faites dans les territoires de l'Alaska et des îles du Pacifique ! Banzai !"
  JAP_turn_our_gaze_eastward_alt:0 "Tourner notre regard vers l'Est"
  JAP_turn_our_gaze_eastward_alt_desc:0 "Notre nouvel empire avance ! De nouvelles revendications doivent être faites dans les territoires de l'Alaska et des îles du Pacifique ! Banzai !"
  JAP_expand_mengkukuo:0 "Étendre la revendication mongole"
  JAP_expand_mengkukuo_desc:0 "Nos sujets de Mongolie intérieure ont une revendication sur la Mongolie extérieure, en raison des garanties russes presque nulles avec la nouvelle guerre civile, c'est maintenant le moment de frapper la Mongolie !"
  JAP_support_the_russian_exiles:0 "Soutenir le gouvernement en exil"
  JAP_support_the_russian_exiles_desc:0 "Nous ferons une offre aux exilés russes qu'ils ne pourront pas refuser, en échange de terres sibériennes orientales, et peut-être plus..."
  JAP_establish_the_northern_resource_area_alt:0 "Établir la zone de ressources du Nord"
  JAP_establish_the_northern_resource_area_alt_desc:0 "Les vastes étendues sibériennes riches doivent être exploitées pour notre machine de guerre en constante expansion."
  himmler_prison_tt:0 "§YHeinrich Himmler§! a été condamné à la prison."
  goebbels_prison_tt:0 "§YJoseph Goebbels§! a été condamné à la prison."
  hess_prison_tt:0 "§YRudolf Hess§! a été condamné à la prison."
  bormann_prison_tt:0 "§YMartin Bormann§! a été condamné à la prison."
  keitel_prison_tt:0 "§YWilhelm Keitel§! a été condamné à la prison."
  goring_prison_tt:0 "§YHermann Göring§! a été condamné à la prison."
  nonhist_GER.1.t:0 "Rétablir les positions nazies"
  nonhist_GER.1.desc:0 "Après notre décision de mener des procès équitables sur les dirigeants du gouvernement fasciste vaincu, quelques membres du gouvernement vaincu ont signé des accords, leur accordant de la clémence en échange de leur service continu.\n\nLa question reste de savoir si nous devons permettre à leurs rangs de continuer à servir dans leurs positions précédentes. D'une part, cela serait difficile à justifier auprès de la population, mais d'autre part, certains de ces dirigeants sont très compétents et pourraient être bénéfiques dans les jours à venir pour notre nouvel empire."
  nonhist_GER.1.a:0 "Autoriser uniquement les dirigeants militaires"
  nonhist_GER.1.b:0 "Autoriser ceux qui ont signé et ont été trouvés non coupables."
  GER_agreed_states_have_been_transferred_tt:0 "§YLes territoires convenus ont été transférés.§!"
  NHMMAP_nazis_in_government:0 "§RFascistes au gouvernement§!"
  NHMMAP_nazis_in_government_desc:0 "De nombreux membres du parti d'Hitler sont toujours dans l'armée et les gouvernements locaux. Certains ont même été autorisés à retourner à leurs postes précédents dans le gouvernement du Kaiser, et les équipes de recherche."
  NHMMAP_repaying_debts_5:0 "§YRemboursement des dettes coloniales mineures§!"
  NHMMAP_repaying_debts_5_desc:0 "Nos dettes envers nos rivaux géopolitiques sont actuellement en cours de remboursement."
  NHMMAP_repaying_debts_10:0 "§YRemboursement des dettes coloniales mineures§!"
  NHMMAP_repaying_debts_10_desc:0 "Nos dettes envers nos rivaux géopolitiques sont actuellement en cours de remboursement."
  NHMMAP_repaying_debts_15:0 "§YRemboursement des dettes coloniales mineures§!"
  NHMMAP_repaying_debts_15_desc:0 "Nos dettes envers nos rivaux géopolitiques sont actuellement en cours de remboursement."
  NHMMAP_repaying_debts_20:0 "§YRemboursement des dettes coloniales§!"
  NHMMAP_repaying_debts_20_desc:0 "Nos dettes, admettons-le importantes, envers nos rivaux géopolitiques sont actuellement en cours de remboursement."
  NHMMAP_repaying_debts_25:0 "§YRemboursement des dettes coloniales§!"
  NHMMAP_repaying_debts_25_desc:0 "Nos dettes, admettons-le importantes, envers nos rivaux géopolitiques sont actuellement en cours de remboursement."
  NHMMAP_repaying_debts_30:0 "§YRemboursement des dettes coloniales§!"
  NHMMAP_repaying_debts_30_desc:0 "Nos dettes, admettons-le importantes, envers nos rivaux géopolitiques sont actuellement en cours de remboursement."
  NHMMAP_repaying_debts_35:0 "§RRemboursement des énormes dettes coloniales§!"
  NHMMAP_repaying_debts_35_desc:0 "Nos énormes dettes envers nos rivaux géopolitiques sont actuellement en cours de remboursement, cela en valait-il la peine ?"
  NHMMAP_repaying_debts_40:0 "§RRemboursement des énormes dettes coloniales§!"
  NHMMAP_repaying_debts_40_desc:0 "Nos énormes dettes envers nos rivaux géopolitiques sont actuellement en cours de remboursement, cela en valait-il la peine ?"
  NHMMAP_getting_paid_5:0 "§YRecevoir le remboursement des dettes coloniales mineures§!"
  NHMMAP_getting_paid_5_desc:0 "En échange de quelque arrière-pays colonial inutile, les Allemands nous paient bien."
  NHMMAP_getting_paid_10:0 "§YRecevoir le remboursement des dettes coloniales mineures§!"
  NHMMAP_getting_paid_10_desc:0 "En échange de quelque arrière-pays colonial inutile, les Allemands nous paient bien."
  NHMMAP_getting_paid_15:0 "§YRecevoir le remboursement des dettes coloniales mineures§!"
  NHMMAP_getting_paid_15_desc:0 "En échange de quelque arrière-pays colonial inutile, les Allemands nous paient bien."
  NHMMAP_getting_paid_20:0 "§YRecevoir le remboursement des dettes coloniales§!"
  NHMMAP_getting_paid_20_desc:0 "En échange de certains territoires inutilisés, les Allemands nous paient grassement."
  NHMMAP_getting_paid_25:0 "§YRecevoir le remboursement des dettes coloniales§!"
  NHMMAP_getting_paid_25_desc:0 "En échange de certains territoires inutilisés, les Allemands nous paient grassement."
  NHMMAP_getting_paid_30:0 "§YRecevoir le remboursement des dettes coloniales§!"
  NHMMAP_getting_paid_30_desc:0 "En échange de certains territoires inutilisés, les Allemands nous paient grassement."
  NHMMAP_getting_paid_35:0 "§YRecevoir le remboursement des énormes dettes coloniales§!"
  NHMMAP_getting_paid_35_desc:0 "En échange de certains territoires inutilisés, les Allemands nous paient remarquablement bien, nous sommes vraiment les maîtres de l'accord."
  NHMMAP_getting_paid_40:0 "§YRecevoir le remboursement des énormes dettes coloniales§!"
  NHMMAP_getting_paid_40_desc:0 "En échange de certains territoires inutilisés, les Allemands nous paient remarquablement bien, nous sommes vraiment les maîtres de l'accord."
  NHMMAP_getting_paid_40_desc:0 "Nous avons décidé de soutenir les intérêts du Kuomintang en Chine."
  NHMMAP_getting_paid_SOV:0 "§YL'achat de la Sibérie§!"
  NHMMAP_getting_paid_SOV_desc:0 "Les Japonais nous ont fourni un soutien financier étendu en échange de certains territoires sur la côte de Sibérie."
  NHMMAP_repaying_debts_JAP:0 "§YL'achat de la Sibérie§!"
  NHMMAP_repaying_debts_JAP_desc:0 "Les Russes ont accepté notre offre d'acheter la côte sibérienne orientale."
  NHMMAP_treaty_of_toyohara:0 "§YLe traité de Toyohara§!"
  NHMMAP_treaty_of_toyohara_desc:0 "'Les stipulations du traité dictent des concessions à l'Union des républiques socialistes soviétiques pour les dommages causés par la guerre, et des accords ont été conclus selon lesquels aucune alliance et mobilisation majeure ne doit avoir lieu jusqu'à la fin de la période du traité.'"
  NHMMAP_treaty_of_harbin_1:0 "§YLe traité de Harbin§!"
  NHMMAP_treaty_of_harbin_1_desc:0 "Après une défaite initiale, nous avons accepté des concessions mineures envers le Japon à l'Est, en échange de leur signature de la paix avec nous. Bien que cela soit une défaite de propagande, cela nous aidera à concentrer notre attention ailleurs."
  NHMMAP_treaty_of_harbin_2:0 "§YLe traité de Harbin§!"
  NHMMAP_treaty_of_harbin_2_desc:0 "Après la percée japonaise, nous avons accepté des concessions envers le Japon à l'Est, en échange de leur signature de la paix avec nous. Bien que cela soit une défaite majeure de propagande, cela nous aidera à concentrer notre attention ailleurs."
  NHMMAP_treaty_of_harbin_3:0 "§YLe traité de Harbin§!"
  NHMMAP_treaty_of_harbin_3_desc:0 "Après la percée japonaise incroyable et nos forces submergées, nous avons accepté des concessions significatives envers le Japon à l'Est, en échange de leur signature de la paix avec nous. Bien que cela soit une énorme défaite de propagande, cela nous aidera toujours à concentrer notre attention immédiate ailleurs."
  NHMMAP_tired_in_the_east_JAP:0 "§YL'armée du Nord est fatiguée§!"
  NHMMAP_tired_in_the_east_SOV:0 "§YL'armée de l'Est est fatiguée§!"
  NHMMAP_time_to_finish_the_east_JAP:0 "§YLe moral de l'armée du Nord est élevé§!"
  NHMMAP_time_to_finish_the_east_SOV:0 "§YLe moral de l'armée de l'Est est élevé§!"
  nonhist_GER.2.t:0 "Afrique orientale allemande"
  nonhist_GER.2.desc:0 "Après des semaines d'arrangements initiaux, le premier sujet de discussion est enfin arrivé sur la table, les anciennes colonies allemandes en Afrique de l'Est.\n\nAccueillant une petite minorité d'Allemands ethniques et de grandes perspectives pour les ressources naturelles, le Tanganyika était autrefois une partie majeure de l'Empire colonial allemand...\n\nMaintenant, nous devons décider de ce qu'il vaut."
  nonhist_GER.2.a:0 "Proposer un §Ypetit§! paiement"
  nonhist_GER.2.b:0 "Proposer un §Rgrand§! paiement"
  nonhist_GER.2.c:0 "Nous n'avons aucun intérêt pour ce territoire"
  nonhist_GER.201.t:0 "Offre allemande pour l'Afrique de l'Est"
  nonhist_GER.201.d.a:0 "Après des semaines d'arrangements initiaux, le premier sujet de discussion est enfin arrivé sur la table, les anciennes colonies allemandes en Afrique de l'Est.\n\nLes Allemands ont mis une somme §Yimportante§!, et tentante sur la ligne pour ce territoire.\n\nLes corps consultatifs nous disent que le paiement en vaut la peine... Devons-nous accepter ?"
  nonhist_GER.201.d.b:0 "Après des semaines d'arrangements initiaux, le premier sujet de discussion est enfin arrivé sur la table, les anciennes colonies allemandes en Afrique de l'Est.\n\nLes Allemands ont offert un investissement attendu en échange de ce territoire.\n\nDevons-nous accepter ?"
  nonhist_GER.201.a:0 "Les termes sont acceptables"
  nonhist_GER.201.b:0 "Nous devons décliner."
  nonhist_GER.202.t:0 "Réponse [FROM.GetAdjective]"
  nonhist_GER.202.d.a:0 "[FROM.GetNameDefCap] a répondu à notre offre avec une signature et un tampon d'approbation. Nous avons remporté une grande victoire diplomatique !"
  nonhist_GER.202.d.b:0 "[FROM.GetNameDefCap] a répondu à notre offre avec un rejet, il semble que nous ne parviendrons pas à un accord concernant ce territoire..."
  nonhist_GER.202.b:0 "Dommage, mais pas inattendu."
  nonhist_GER.203.t:0 "[FROM.GetNameDefCap] veut racheter leurs colonies"
  nonhist_GER.203.desc:0 "Des diplomates allemands se sont présentés aux bureaux du Commonwealth pour commencer des discussions sur un éventuel transfert des anciennes possessions coloniales. Et ils sont apparemment prêts à payer grassement...\n\nAprès des discussions initiales, ils ont dit qu'ils reviendraient bientôt avec une offre..."
  nonhist_GER.203.a:0 "Nous verrons ce qu'ils offrent en premier."
  nonhist_GER.3.t:0 "Afrique du Sud-Ouest allemande"
  nonhist_GER.3.desc:0 "Après nos premiers arrangements, la discussion sur le prochain sujet a commencé, les anciennes colonies allemandes en Afrique du Sud-Ouest.\n\nAccueillant une minorité significative d'Allemands ethniques, la Namibie était autrefois une partie majeure de l'Empire colonial allemand...\n\nMaintenant, nous devons décider de ce qu'il vaut."
  nonhist_GER.301.t:0 "Offre allemande pour l'Afrique du Sud-Ouest"
  nonhist_GER.301.d.a:0 "Après des semaines d'arrangements, le prochain sujet de discussion est enfin arrivé sur la table, les anciennes colonies allemandes en Afrique du Sud-Ouest.\n\nLes Allemands ont mis une somme §Yimportante§!, et tentante sur la ligne pour ce territoire.\n\nLes corps consultatifs nous disent que le paiement en vaut la peine... Devons-nous accepter ?"
  nonhist_GER.301.d.b:0 "Après des semaines d'arrangements, le prochain sujet de discussion est enfin arrivé sur la table, les anciennes colonies allemandes en Afrique du Sud-Ouest.\n\nLes Allemands ont offert un investissement attendu en échange de ce territoire.\n\nDevons-nous accepter ?"
  nonhist_GER.4.t:0 "Papouasie allemande"
  nonhist_GER.4.desc:0 "Après nos précédents arrangements, la discussion sur le prochain sujet a commencé, les anciennes colonies allemandes en Papouasie et Bismarck.\n\nServant de base majeure pour l'Allemagne en Océanie, la Papouasie était autrefois une partie significative de l'Empire colonial allemand...\n\nMaintenant, nous devons décider de ce qu'il vaut."
  nonhist_GER.401.t:0 "Offre allemande pour la Papouasie"
  nonhist_GER.401.d.a:0 "Après des semaines d'arrangements, le prochain sujet de discussion est enfin arrivé sur la table, les anciennes colonies allemandes en Papouasie et Bismarck.\n\nLes Allemands ont mis une somme §Yimportante§!, et tentante sur la ligne pour ce territoire.\n\nLes corps consultatifs nous disent que le paiement en vaut la peine... Devons-nous accepter ?"
  nonhist_GER.401.d.b:0 "Après des semaines d'arrangements, le prochain sujet de discussion est enfin arrivé sur la table, les anciennes colonies allemandes en Papouasie et Bismarck.\n\nLes Allemands ont offert un investissement attendu en échange de ce territoire.\n\nDevons-nous accepter ?"
  nonhist_GER.5.t:0 "Samoa allemande"
  nonhist_GER.5.desc:0 "Après nos précédents arrangements, la discussion sur le dernier sujet a commencé, l'ancien avant-poste allemand aux Samoa.\n\nServant de base mineure pour l'Allemagne en Océanie, les Samoa étaient autrefois une petite partie de l'Empire colonial allemand...\n\nMaintenant, nous devons décider de ce qu'il vaut."
  nonhist_GER.501.t:0 "Offre allemande pour les Samoa"
  nonhist_GER.501.d.a:0 "Après des semaines d'arrangements, le dernier sujet de discussion est enfin arrivé sur la table, l'ancien avant-poste allemand aux Samoa.\n\nLes Allemands ont mis une somme §Yimportante§!, et tentante sur la ligne pour ce territoire.\n\nLes corps consultatifs nous disent que le paiement en vaut la peine... Devons-nous accepter ?"
  nonhist_GER.501.d.b:0 "Après des semaines d'arrangements, le dernier sujet de discussion est enfin arrivé sur la table, l'ancien avant-poste allemand aux Samoa.\n\nLes Allemands ont offert un investissement attendu en échange de ce territoire.\n\nDevons-nous accepter ?"
  nonhist_GER.6.t:0 "Derniers arrangements"
  nonhist_GER.6.d.a:0 "Après des mois de discussions, de réunions, de formalités et de banalités, nos arrangements n'ont abouti à absolument rien de valeur.\n\nNous n'avons pu parvenir à aucun accord avec les pays du Commonwealth du tout..."
  nonhist_GER.6.d.b:0 "Après des mois de discussions, de réunions, de formalités et de banalités, nos arrangements ont abouti à un succès.\n\nBien que nous n'ayons pas obtenu tout ce que nous voulions, étant donné les circonstances géopolitiques, nos efforts semblent en valoir la peine...\n\nMaintenant, à payer nos dettes."
  nonhist_GER.6.d.c:0 "Après des mois de discussions, de réunions, de formalités et de banalités, nos efforts ont porté leurs fruits.\n\nNos nouveaux amis étaient très amicaux et enthousiastes, et nous avons pu acquérir tout ce que nous recherchions.\n\nIl ne reste plus que la dette colossale..."
  nonhist_GER.6.a:0 "Quel gaspillage colossal de temps."
  nonhist_GER.6.b:0 "Notre empire restauré !"
  nonhist_GER.601.t:0 "Les paiements allemands arrivent"
  nonhist_GER.601.desc:0 "Notre arrangement avec l'Allemagne a finalement porté ses fruits, et nous avons commencé à recevoir les paiements attendus."
  nonhist_GER.601.a:0 "C'est... Beaucoup de marks..."
  nonhist_GER.8.t:0 "[FROM.GetNameDefCap] propose de soutenir la revendication royale"
  nonhist_GER.8.desc:0 "Notre récente alliance du Commonwealth avec le Kaiser, et leur récent achat de nos anciens titres coloniaux, ont laissé une grande quantité d'influence allemande sur notre économie, et aussi sur notre classe supérieure...\n\nUn petit groupe d'aristocrates britanniques a été approché avec une offre des Allemands pour soutenir la revendication de notre monarque.\n\nVont-ils accepter l'offre ?"
  nonhist_GER.8.a:0 "Dites aux Allemands que nous sommes intéressés."
  nonhist_GER.8.b:0 "Le système parlementaire restera."
  nonhist_GER.801.t:0 "L'aristocratie britannique accepte"
  nonhist_GER.801.desc:0 "Les factions anti-parlementaires au sein des loyalistes britanniques et des classes supérieures ont accepté notre proposition. Il ne reste plus qu'à ce qu'ils utilisent notre soutien financier et politique pour mettre en œuvre les changements que nous désirons."
  nonhist_GER.802.t:0 "L'aristocratie britannique rejette"
  nonhist_GER.802.desc:0 "Les factions anti-parlementaires au sein des loyalistes britanniques et des classes supérieures ont rejeté notre proposition. Il semble que la scène politique en Grande-Bretagne ne changera pas de sitôt."
  nonhist_GER.9.t:0 "Îles allemandes d'Asie de l'Est"
  nonhist_GER.9.desc:0 "Après la perte de la Grande Guerre, notre empire a perdu des possessions qui ont été données à la nation du Japon, depuis lors, le Japon semble avoir trouvé peu d'utilité pour ces îles, mais elles sont considérées comme un butin de guerre valant la peine d'être conservé par l'administration japonaise.\n\nAutrefois servant de petits avant-postes navals pour l'Allemagne en Océanie, ces îles étaient autrefois une petite partie de l'Empire colonial allemand...\n\nSi nous devons approcher le Japon avec une offre pour ces îles, nous devrions considérer ce qu'elles valent pour nous, et pour eux."
  nonhist_GER.9.c:0 "Ne faites pas d'offres, faites des demandes !"
  nonhist_GER.10.t:0 "[FROM.GetNameDefCap] cherche les îles micronésiennes !"
  nonhist_GER.10.d.a:0 "Le [FROM.GetNameDefCap] est venu à notre table diplomatique ces derniers jours en tentant de créer des négociations pour racheter leurs anciens avant-postes coloniaux dans les îles micronésiennes.\n\nLes Allemands ont mis une somme §Yimportante§!, et tentante sur la ligne en échange des îles Carolines, des îles Marshall, de Saipan et de Palau.\n\nLes terres ne détiennent pas une grande valeur autre que des avant-postes sur le Pacifique profond, ce qui pourrait être utile dans un avenir proche. Les corps consultatifs nous disent que le paiement en vaut la peine... Devons-nous accepter ?"
  nonhist_GER.10.d.b:0 "Le [FROM.GetNameDefCap] est venu à notre table diplomatique ces derniers jours en tentant de créer des négociations pour racheter leurs anciens avant-postes coloniaux dans les îles micronésiennes.\n\nLes Allemands ont mis une somme attendue, mais légèrement décevante sur la ligne en échange des îles Carolines, des îles Marshall, de Saipan et de Palau.\n\nLes terres ne détiennent pas une grande valeur autre que des avant-postes sur le Pacifique profond, ce qui pourrait être utile dans un avenir proche. Les corps consultatifs nous disent que cela pourrait ne pas valoir ce prix, mais un coup de pouce économique de la vente pourrait être utile. Devons-nous accepter ?"
  nonhist_GER.10.d.c:0 "Le [FROM.GetNameDefCap] est venu à notre table diplomatique ces derniers jours en exigeant le retour de leurs anciens avant-postes coloniaux dans les îles micronésiennes.\n\nLes Allemands ont présenté une demande courtoise, mais légèrement insultante, de remettre les îles Carolines, les îles Marshall, Saipan et Palau.\n\nLes terres ne détiennent pas une grande valeur autre que des avant-postes sur le Pacifique profond, ce qui pourrait être utile dans un avenir proche. Les corps consultatifs nous disent que nous ne devrions accepter que si nous pensons que les Allemands sont une menace dans la région. Devons-nous accepter ?"
  nonhist_GER.11.desc:0 "[FROM.GetNameDefCap] a accepté notre proposition, et tous les droits sur les territoires demandés nous seront remis dans les jours à venir.\n\nNos premières garnisons devraient arriver dans quelques semaines."
  nonhist_GER.12.a:0 "Cela en valait la peine."
  nonhist_GER.13.desc:0 "Bien que nous pensions que notre proposition avait été soigneusement considérée, il semble que l'administration japonaise ait décidé de refuser notre demande. Que devrions-nous faire ?"
  nonhist_GER.13.a:0 "Cela valait la peine d'essayer, mais pas plus."
  nonhist_GER.13.b:0 "Alors, un embargo."
  nonhist_GER.13.c:0 "Ah, nos nouveaux amis chinois !"
  nonhist_JAP.1.t:0 "Tout ce que nous nous étions fixé"
  nonhist_JAP.1.desc:0 "Après une longue période de combat dans les terres désolées gelées de Sibérie, nos objectifs ont enfin été accomplis.\n\nAyant accompli tout ce que nous nous étions fixé, et les positions soviétiques étant repoussées plus à l'ouest, nos corps consultatifs suggèrent que c'est maintenant le moment d'envoyer une proposition d'accord de paix à [SOV.GetLeader].\n\nBien sûr, nous pourrions continuer à pousser plus loin, mais nous ne pourrions peut-être pas obtenir une autre opportunité comme celle-ci."
  nonhist_JAP.1.a:0 "Envoyez l'offre."
  nonhist_JAP.1.b:0 "Non ! Nous allons plus loin !"
  JAP_SOV_upgrade_promise_tt:0 "Cela §Yaugmentera les attentes§! pour cette guerre, si vous avez déjà fait des §Ygrandes§! promesses, alors cela §Yaugmentera les attentes§! à §Ycapitulation complète§!."
  nonhist_JAP.2.t:0 "[FROM.GetNameDefCap] propose la paix"
  nonhist_JAP.2.desc:0 "Les dirigeants [FROM.GetAdjective] se sont présentés aujourd'hui à notre gouvernement pour proposer une proposition de paix pour notre conflit en Sibérie.\n\nIls proposent d'arrêter leurs avancées en échange de concessions territoriales et économiques, et soutiendront nos efforts pour garder cette perte embarrassante sous silence pour notre propre population à l'ouest.\n\nDevons-nous accepter ?"
  nonhist_JAP.2.a:0 "Nous n'avons pas le choix."
  nonhist_JAP.2.b:0 "Pour qui nous prennent-ils ?"
  nonhist_JAP.3.desc:0 "En ce jour historique, [FROM.GetLeader] a accepté notre proposition de paix, marquant la victoire dans notre conflit !\n\nLes concessions commenceront dans les jours à venir !"
  nonhist_JAP.3.a:0 "Pour l'Empereur !"
  nonhist_JAP.4.t:0 "Les exilés russes"
  nonhist_JAP.4.desc:0 "Après avoir enfin commencé à réorganiser nos nouveaux territoires à l'est, et nos concessions de l'ouest qui affluent, la question suivante devient que faire de ces Russes qui ont combattu avec nous.\n\nNous avons techniquement promis à la fois un soutien pour leur gouvernement d'opposition et tout le territoire de l'ex-Union soviétique sauf les régions côtières, mais il n'y a vraiment rien qui nous oblige à cet accord...\n\nQue devons-nous faire ?"
  nonhist_JAP.4.a:0 "Respecter notre accord"
  nonhist_JAP.4.b:0 "Les installer à l'ouest d'Irkoutsk"
  nonhist_JAP.4.c:0 "Leur donner un petit État à Chita"
  nonhist_JAP.4.e:0 "Les oublier, mettre en place une zone d'occupation"
  nonhist_JAP.4.f:0 "Les oublier, annexer Chita."
  nonhist_JAP.5.desc:0 "[FROM.GetLeader] a rejeté nos demandes généreuses, il semble que cette guerre sera longue..."
  nonhist_JAP.5.a:0 "Sont-ils stupides ?"
  nonhist_JAP.501.t:0 "Effort de guerre public japonais diffamé !"
  nonhist_JAP.501.desc:0 "L'administration japonaise, qui a eu des difficultés à répondre aux attentes territoriales fixées par leur gouvernement à la population plus large, a eu du mal contre les rumeurs et les murmures selon lesquels ces attentes ne seront en fait jamais satisfaites. Cela a conduit à une démoralisation générale de leurs unités militaires sur le terrain, et réduit leur soutien à la maison.\n\nIls sont fatigués et c'est maintenant le moment idéal pour riposter !"
  nonhist_JAP.6.t:0 "[FROM.GetNameDefCap] offre un soutien direct"
  nonhist_JAP.6.desc:0 "Le gouvernement [FROM.GetAdjective] nous a approchés aujourd'hui avec une offre, nous menaçant essentiellement des perspectives de conflit futur si nous n'acceptons pas. Ils souhaitent parvenir à un 'compromis' qui 'répond à nos intérêts mutuels'.\n\nEn échange des droits sur les ressources en Sibérie, et du transfert direct des territoires sur la côte orientale, ils enverront des troupes et de l'équipement pour nous aider à gagner la guerre civile.\n\nSi nous n'acceptons pas maintenant, cela garantit presque que les Japonais nous verront comme une cible facile à l'avenir..."
  nonhist_JAP.6.a:0 "Merci pour le soutien ?"
  nonhist_JAP.6.b:0 "Est-ce qu'ils nous commandent ?!"
  nonhist_JAP.601.desc:0 "Le gouvernement [FROM.GetAdjective] a accepté notre offre. La Sibérie est maintenant à nous !"
  nonhist_JAP.602.desc:0 "Le gouvernement [FROM.GetAdjective] a complètement ignoré notre offre...\n\nCela semble être une question qui ne peut être résolue que sur le champ de bataille."
  nonhist_JAP.602.a:0 "Appeler l'État-Major"
  nonhist_JAP.7.t:0 "Acheter un désert"
  nonhist_JAP.7.desc:0 "Le gouvernement [FROM.GetAdjective] nous a approchés aujourd'hui avec une offre, nous menaçant essentiellement des perspectives de conflit futur si nous n'acceptons pas. Ils souhaitent parvenir à un 'compromis' qui 'répond à nos intérêts mutuels'.\n\nIls souhaitent acheter certaines des grandes zones côtières sur la côte orientale de la Sibérie. Un tel accord nous couperait entièrement du Pacifique.\n\nCependant, si nous n'acceptons pas, il semblerait que les Japonais nous voient comme une cible facile pour une expansion agressive..."
  nonhist_JAP.7.a:0 "Mieux vaut des affaires que le champ de bataille"
  nonhist_JAP.7.b:0 "Nous ne pouvons pas accepter cela..."
  JAP_tech_sharing_with_russia:0 "Partage de technologie avec la Russie"
  JAP_tech_sharing_with_russia_desc:0 "Nos nouveaux amis russes ont un équipement à jour que nous pourrions utiliser... Demandons-leur de partager."
  SOV_japan_will_be_angry_tt:0 "§RLe Japon nous attaquera probablement pour ces territoires à l'avenir§!"
  NHMMAP_when_civil_war_over:0 "Une fois la guerre civile soviétique terminée :\n"
  SOV_japan_will_take_these_states:0 "Le Japon prendra le contrôle de chaque État côtier à l'extrême est de la Sibérie, coupant la Russie du Pacifique."
  nonhist_news.1.t:0 "Conférence d'échange colonial allemand"
  nonhist_news.1.desc:0 "Après des mois de discussions, l'[GER.GetName] a arrangé avec l'[ENG.GetName] d'échanger d'anciennes possessions coloniales allemandes contre des paiements à effectuer au cours de l'année à venir.\n\nLa manière dont cela change les résultats mondiaux à l'avenir reste à voir, mais de nombreux commentateurs suggèrent que c'est un autre signe que le monde se dirige vers une répétition de la Grande Guerre, dans laquelle l'Allemagne a perdu ces colonies.\n\nQuant aux personnes vivant sur ces territoires, il semble que leurs souhaits pour ou contre n'aient pas été considérés du tout."
  nonhist_news.1.a:0 "Nous sommes enfin de retour !"
  nonhist_news.1.b:0 "Cela valait ce qu'ils ont payé"
  nonhist_news.1.c:0 "Un développement intéressant"
  nonhist_news.2.t:0 "Échec de la conférence allemande"
  nonhist_news.2.desc:0 "Après des mois de discussions, l'[GER.GetName] n'a pas pu parvenir à un accord avec l'[ENG.GetName] pour échanger d'anciennes possessions coloniales allemandes perdues lors de la Grande Guerre. Les discussions semblent avoir aigri les relations entre les deux pays."
  nonhist_news.2.a:0 "L'Anglais est inévitablement avide"
  nonhist_news.2.b:0 "Ils n'ont pas offert assez."
  nonhist_news.3.t:0 "Le traité de Harbin"
  nonhist_news.3.desc:0 "Au cours de la dernière année de combat, le [JAP.GetNameDefCap] a poussé profondément en Sibérie orientale. Il y a seulement 24 heures, un traité silencieux a été signé à Harbin, pour signifier la fin de ce conflit, et les concessions soviétiques au Japon, y compris une grande partie du territoire sibérien.\n\nAucune presse internationale n'a été informée du traité, donc la seule source d'information semble provenir du Japon lui-même, le régime de [ROOT.GetLeader] étant mortellement silencieux sur la question.\n\nLe temps dira si le traité est respecté."
  nonhist_news.3.a:0 "Banzai !"
  nonhist_news.3.b:0 "Gardez la presse silencieuse, bon sang !"
  nonhist_news.3.c:0 "Embarrassant, mais nous avons des problèmes plus importants"
  nonhist_news.3.e:0 "[SOV.GetLeader] doit diriger un cirque, pas une armée..."
  nonhist_news.3.f:0 "[SOV.GetLeader] a clairement du mal..."
