  JAP_war_with_sov_mission:0 "Respecter nos promesses"
  ITA_defend_the_land_invite_NHMMAP_tt:0 "§YL'Italie§! rejoindra une §Yfaction majeure non stalinienne§! en §YEurope§!, §YAfrique§! ou au §YMoyen-Orient§! si elles existent. \n\n Sinon, §Ytout pays communiste indépendant ne faisant pas partie d'une faction§! en §YEurope§!, §YAfrique§! ou au §YMoyen-Orient§! sera invité à rejoindre le §YFront socialiste uni§!."
  ITA_demand_recognition_of_bulgarian_macedonia:0 "Exiger la reconnaissance de la Macédoine bulgare"
  nonhist_ITA.1.t:0 "L'Italie nous enlève [106.GetName] !"
  nonhist_ITA.1.desc:0 "L'Italie tente de nous enlever [106.GetName] en l'ajoutant au territoire de notre allié en Bulgarie ! Si nous ne faisons rien, nos revendications sur la région seront perdues à jamais."
  DOD_yugoslavia.50.f:0 "Princesse Gilone de France"
  TUR_join_the_allies:0 "Rejoindre la Grande-Bretagne"
  TUR_cooperate_with_european_radar_techs:0 "Parler avec les techniciens européens du RADAR"
  TUR_cooperate_with_european_radar_techs_desc:0 "De nouvelles entités corporatives et des techniciens apparaissent en Europe, utilisant les récentes avancées dans la technologie RADAR. Nous devrions inviter certaines de ces entreprises à soutenir notre entreprise pour utiliser cette technologie."
  TUR_tank_research_exchange:0 "Avancées européennes en matière de chars"
  TUR_tank_research_exchange_desc:0 "Les recherches tchèques, italiennes et allemandes sur les tankettes seront utiles pour notre nation !"
  TUR_join_the_minor_democracies:0 "Accord avec les démocraties mineures"
  TUR_join_the_minor_democracies_desc:0 "Il y a des pays mineurs en Europe qui souhaitent créer des alliances avec nous pour aider à défendre leur nation et la nôtre contre les menaces posées par les grandes puissances européennes."
  TUR_invite_the_saadabad:0 "Inviter les pays de Saadabad"
  TUR_invite_the_saadabad_desc:0 "Bien que cela puisse être difficile à convaincre certains, ces nations qui ont signé l'accord de Saadabad avec nous devraient avoir quelques sympathies pour aider notre objectif de défense mutuelle."
  TUR_join_the_axis:0 "Rejoindre l'Allemagne"
  TUR_discuss_investment_possibilities_with_FROM_NHMMAP:0 "Discuter des possibilités d'investissement avec [FROM.GetNameDef] - §YInfluence actuelle : [?var:FROM.TUR_influence]§!"
  ROOT_turkish_investment_ai_NHMMAP_tt:0 "\n\nPlus notre §Yinvestissement§! dans @TUR§Y[TUR.GetNameDef]§! est important, plus nous pouvons lier leurs intérêts aux nôtres tout en l'aliénant à nos ennemis. Notre §YInfluence actuelle§! sur la politique étrangère @TUR§Y[TUR.GetNameDef]§! est : §Y[?var:ROOT.TUR_influence]§!\n"
  ROOT_turkish_investment_influence_1_tt:0 "\nAugmente notre §Yinfluence§! sur la politique étrangère @TUR§Yturque§! de §Y1§!\n"
  ROOT_turkish_investment_influence_2_tt:0 "\nAugmente notre §Yinfluence§! sur la politique étrangère @TUR§Yturque§! de §Y2§!\n"
  ROOT_turkish_investment_influence_3_tt:0 "\nAugmente notre §Yinfluence§! sur la politique étrangère @TUR§Yturque§! de §Y3§!\n"
  bftb_turkey_NHMMAP.126.desc:0 "Des représentants de [FROM.GetNameDef] ont visité notre pays et ont rencontré beaucoup de nos politiciens dans l'espoir d'obtenir des soutiens pour leur schéma d'investissement. Le gouvernement de [FROM.GetNameDef] aimerait que nous utilisions nos ressources pour améliorer leurs propres capacités et production industrielles. Les responsables [FROM.GetAdjective] ont laissé entendre qu'en aidant leur nation, nous pourrions nous attendre à une aide en retour à l'avenir sous la forme d'une alliance militaire entre nos nations.\n\n@TUR§B[TUR.GetNameDef]§! sera §Bplus susceptible§! (mais pas garanti) de s'aligner avec les nations qui ont fait le plus d'§Binvestissements§!.\nVous pouvez voir les investissements d'autres pays dans vos §BDécisions§!."
  TUR_influence_icon_desc:0 "Cette nation a influencé [TUR.GetNameDef] au degré du nombre indiqué."
  TUR_influence_category:0 "Influence turque"
  TUR_influence_category_desc:0 "@TUR[TUR.GetNameDef] propose officieusement §Yinfluence§! sur sa propre politique étrangère en échange d'§Yinvestissements§!. Plus nous §Yinvestissons§!, plus la probabilité que §Y[TUR.GetNameDef]§! s'aligne avec nous à l'avenir est élevée.\n\n\n"
