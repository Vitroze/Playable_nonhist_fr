  TUR_ankara_treaty:0 "Traité d'Ankara"
  nonhist_TUR.2.t:0 "[FROM.GetNameDefCap] Poursuit l'Alliance"
  nonhist_TUR.4.desc:0 "[FROM.GetNameDefCap] a suggéré que, bien que le cours d'action soit regrettable, pour des raisons de sécurité nationale, les régions [GRE.GetNameDef] doivent être détruites. Nos responsables ont enthousiastement et de tout cœur convenu avec les opinions de nos alliés [FROM.GetAdjective]. Si [FROM.GetNameDefCap] occupe [GRE.GetNameDef], nous obtiendrons, espérons-le, une part du gâteau."
  TUR_turkish_interventionism_NHMMAP:0 "Interventionnisme turc"
  SWI_NHMMAP_warning_communist_despotic_tt:0 "§RAvertissement :§! Si le §YPrésident actuel§! est §gnon-aligné§! ou §Ocommuniste§!, les exigences pour ce focus et les futurs §Ychangeront!§!\n\n"
  SWI_NHMMAP_warning_communist_tt:0 "§RAvertissement :§! Si le §YPrésident actuel§! est §Ocommuniste§!, les exigences pour ce focus et les futurs §Ychangeront!§!\n\n"
  BBA_italy_interaction_events_NHMMAP.40:0 "Maintenant que les concessions territoriales ont été décidées, [ITA.GetName] a initié un processus qui amènera l'Italie et [ROOT.GetNameDef] dans une alliance militaire appelée le Front de Stresa. Ce n'est pas le moment de rester les bras croisés, car [ROOT.GetNameDef] doit agir dans son propre intérêt et rejoindre l'Italie contre la menace allemande."
  ITA_stresa_was_negotiated_tt_NHMMAP:0 "A négocié un accord avec les Alliés sur les revendications italiennes."
  nonhist_NOR.1.desc:0 "Alors que nous étions occupés à faire avancer notre économie et à garder un œil vigilant sur les fascistes à l'étranger, nous avons permis au fascisme domestique de se développer, juste sous notre nez. Malgré sa base de soutien en diminution et son parti, le Nasjonal Samling, n'ayant jamais obtenu un seul siège au Storting, Vidkun Quisling a occupé les studios de diffusion de la NRK et s'adresse maintenant à la nation, affirmant avoir formé un gouvernement soutenu par [?NOR.NOR_cw_fascist_attacker.GetAdjective] avec lui-même comme Premier ministre. Il vise à parvenir à un accord avec la police d'Oslo et les conseils locaux pour prendre le contrôle de [ROOT.GetNonIdeologyName]."
  nonhist_NOR.1.a:0 "Le peuple de [ROOT.GetNonIdeologyName] ne fera jamais confiance à ce traître."
  nonhist_NOR.1.b:0 "Les paroles de Quisling sont convaincantes..."
  NOR_switch_to_fascist_NHMMAP_TT:0 "§Y[NOR.GetFascistLeader]§! convaincra la police locale, et §L$NOR_fascism$§! deviendra le nouveau gouvernement une fois le focus §YCoup de Quisling§! pris. §RQuisling sera maintenant trop influent pour être arrêté.§!"
  NOR_stay_democratic_NHMMAP_TT:0 "§Y[NOR.GetFascistLeader]§! §Céchouera§! à convaincre la police locale, et pourra être §Carrêté en toute sécurité.§! Le focus §YCoup de Quisling§! §Rne sera pas disponible.§!"
  NOR_switched_to_fasc_hist:0 "Quisling a convaincu la police d'Oslo."
  NOR_refused_to_switch_to_fasc_NHMMAP:0 "Quisling a échoué à convaincre la police d'Oslo."
