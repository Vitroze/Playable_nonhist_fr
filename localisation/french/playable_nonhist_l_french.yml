  TUR_influence_focus_tt:0 "\nUne fois que nous choisissons une politique étrangère dans la deuxième moitié de l'§YArbre de focus§!, nous gagnerons ou perdrons §YStabilité§! en fonction des §YPuissances étrangères§! qui ont le plus investi."
