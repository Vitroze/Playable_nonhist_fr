  RULE_OPTION_FIN_FASCIST_COUP_NORDIC: "Coup d'État fasciste - Ligue de Suprématie"
  RULE_OPTION_FIN_FASCIST_COUP_NORDIC_DESC: "La droite @FINFinlandaise, dirigée par le §LMouvement populaire patriotique§!, organisera un coup d'État contre le gouvernement avant de créer la Ligue de Suprématie finlandaise en 1938, invitant d'autres nations @SWE@NOR@DENNordiques et @EST@LIT@LATBaltes penchant pour le §Lfascisme§!."
  RULE_OPTION_FIN_FASCIST_COUP_NORDIC_EXP: "Coup d'État fasciste - Expansionnisme de la Ligue de Suprématie"
  RULE_OPTION_FIN_FASCIST_COUP_NORDIC_EXP_DESC: "La droite @FINFinlandaise, dirigée par le §LMouvement populaire patriotique§!, organisera un coup d'État contre le gouvernement avant de créer la Ligue de Suprématie finlandaise en 1938, invitant et éventuellement annexant d'autres nations @SWE@NOR@DENNordiques et @EST@LIT@LATBaltes penchant pour le §Lfascisme§!, et tentera également de créer une insurrection en @KARCarélie pour provoquer une guerre expansionniste contre l'@SOVUnion soviétique."
