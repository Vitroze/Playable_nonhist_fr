 RULE_OPTION_ITA_COMMUNIST_GRAMSCI_PLAN:0"Communiste/Antistalinien"
 RULE_OPTION_ITA_COMMUNIST_GRAMSCI_PLAN_AI_DESC:0"@ITALes antifascistes italiens uniront leurs forces pour renverser le régime fasciste par la force, formant ainsi un §Rcommuniste§ ! gouvernement laissé par Antonio Gramsci et créant une faction de la Fédération italienne avec les colonies.
 RULE_OPTION_ITA_COMMUNIST_PERTINI_PLAN:0"Communiste/Antistalinien/Anticolonial"
 RULE_OPTION_ITA_COMMUNIST_PERTINI_PLAN_AI_DESC:0"@ITALes antifascistes italiens uniront leurs forces pour renverser le régime fasciste par la force, formant ainsi un §Rcommuniste§ ! gouvernement laissé par Sandro Pertini et abolissant ou intégrant les colonies. L'IA tentera de former une faction avec d'autres §Rcommunistes§ ! puissances en Europe. »
 RULE_OPTION_ITA_DEMOCRATIC_ALLIES_PLAN:0"Socialiste/Rejoignez les alliés"
 RULE_OPTION_ITA_DEMOCRATIC_ALLIES_PLAN_AI_DESC:0"@ITALes antifascistes italiens uniront leurs forces pour renverser le régime fasciste par la force, formant ainsi un §Csocial-démocrate§ ! gouvernement et cherchant à rejoindre les Alliés.
 RULE_OPTION_ITA_DEMOCRATIC_PLAN:0"Confédération socialiste/italienne"
 RULE_OPTION_ITA_DEMOCRATIC_PLAN_AI_DESC:0"@ITALes antifascistes italiens uniront leurs forces pour renverser le régime fasciste par la force, formant ainsi un §Csocial-démocrate§ ! gouvernement et cherchant à former une Confédération avec les anciennes colonies d’Afrique. »
 RULE_OPTION_ITA_DEMOCRATIC_FREESTATES_PLAN:0"Etats socialistes/libres d'Europe"
 RULE_OPTION_ITA_DEMOCRATIC_FREESTATES_PLAN_AI_DESC:0"@ITALes antifascistes italiens uniront leurs forces pour renverser le régime fasciste par la force, formant ainsi un §Csocial-démocrate§ ! gouvernement et cherchant à former une faction avec d’autres puissances démocratiques en Europe, et garantira aux pays mineurs d’Europe le maintien de la paix. »
 RULE_OPTION_FIN_FASCIST_AXIS:"Élus fascistes - Axe"
 RULE_OPTION_FIN_FASCIST_AXIS_DESC:"La @FINDroite finlandaise, dirigée par le §LPMouvement populaire patriotique§!, remportera les élections nationales, en s'appuyant sur des organisations comme le Mustapaidat et le Suojeluskunta pour développer une armée et une économie puissantes avant de rejoindre l'Axe à la fin des années 1940. »
 RULE_OPTION_FIN_FASCIST_AXIS_BALTIC:"Élus fascistes - Revendications de l'Axe Baltique"
 RULE_OPTION_FIN_FASCIST_AXIS_BALTIC_DESC:"La @FINDroite finlandaise, dirigée par le §LPMouvement populaire patriotique§!, remportera les élections nationales, en s'appuyant sur des organisations comme le Mustapaidat et le Suojeluskunta pour développer une armée et une économie puissantes avant de tenter un accord pour fusionner avec @ESTEstonie et faire des revendications sur d'autres @LAT@LITnations baltes. @FINFinland rejoindra l'Axe en 1941."
 RULE_OPTION_FIN_FASCIST_AXIS_EXP:"Élus fascistes - Expansionnisme de l'Axe"
 RULE_OPTION_FIN_FASCIST_AXIS_EXP_DESC:"La @FINDroite finlandaise, dirigée par le §LPMouvement populaire patriotique§!, remportera les élections nationales, en s'appuyant sur des organisations comme le Mustapaidat et le Suojeluskunta pour développer une armée et une économie puissantes avant de tenter un accord pour fusionner avec l'@ESTEstonie et faire des revendications sur d'autres @LAT@LITnations baltes, et tentera également d'annexer tout autre pays aligné sur l'Axe. @NOR@SWE@DEN@ICEPays nordiques après que @FINFinlande ait rejoint l'Axe lui-même en 1941."
 RULE_OPTION_FIN_FASCIST_NORDIC:"Élus fascistes - Supremacy League"
 RULE_OPTION_FIN_FASCIST_NORDIC_DESC:"La @FINDroite finlandaise, dirigée par le §LPMouvement populaire patriotique§!, remportera les élections nationales, en s'appuyant sur des organisations comme le Mustapaidat et le Suojeluskunta pour développer une armée et une économie puissantes avant de créer la Ligue pour la suprématie finlandaise à la fin des années 1940, invitant d'autres §Lfascistes§! @SWE@NOR@DENPays nordiques et @EST@LIT@LATBaltique."
 RULE_OPTION_FIN_FASCIST_NORDIC_EXP:"Élus fascistes - Expansionnisme de la Supremacy League"
 RULE_OPTION_FIN_FASCIST_NORDIC_EXP_DESC:"La @FINDroite finlandaise, dirigée par le §LPMouvement populaire patriotique§!, remportera les élections nationales, en s'appuyant sur des organisations comme le Mustapaidat et le Suojeluskunta pour développer une armée et une économie puissantes avant de créer la Ligue pour la suprématie finlandaise à la fin des années 1940, invitant et finalement annexant d'autres §Lfascistes§! @SWE@NOR@DENNordic et @EST@LIT@LATBaltic, et tentera également de créer un soulèvement en @KARKarelia pour déclencher une guerre expansionniste contre l'@SOVUnion soviétique."
