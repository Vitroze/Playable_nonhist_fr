 RULE_OPTION_HISTORICAL_BOL_DEM_INT_AI_DESC:"@BOLBolivie vaincra le coup d'État socialiste, en restant §Cdémocratique§!, et adoptera la politique du plurinationalisme, en rebaptisant le pays et en intégrant plus rapidement tous les États non essentiels potentiellement possédés.
