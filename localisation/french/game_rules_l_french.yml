 RULE_OPTION_DEFAULT:0"Défaut"
 RULE_OPTION_DEFAULT_AI_DESC:0"L'IA prendra des décisions basées sur d'autres paramètres de jeu, tels que la possibilité de forcer les focus historiques et d'autres scénarios de jeu. C'est le même comportement que dans la version 1.5 et antérieure."
 RULE_OPTION_RANDOM_AI_DESC:0"L'IA décidera au hasard d'un plan de jeu au début du jeu et tentera de l'exécuter. §YSi vous avez déjà désactivé les focus historiques, cela n'a aucun effet !§!"
 RULE_OPTION_DEFAULT_NONHIST_AI_DESC:0"Lorsque la focalisation historique est désactivée, l'IA sélectionnera au hasard une stratégie au début du jeu et l'exécutera, certaines stratégies sont plus susceptibles de se produire que d'autres, des règles d'équilibrage du jeu seront mises en œuvre afin que les idéologies soient à peu près égales. Il s'agit du comportement par défaut de l'IA."
 RULE_OPTION_HISTORICAL_PATHS:0"Mode principalement historique"
 RULE_OPTION_HISTORICAL_PATHS_NONHIST_AI_DESC:0"Lorsque les focus historiques sont désactivés, l'IA suivra toujours l'arborescence des focus historiques, mais l'IA §YNOT§! suivre l'histoire dans les événements, les décisions et la stratégie générale. \n§RMASSUREZ-VOUS D'AVOIR DÉSACTIVÉ L'IA HISTORIQUE !!!§!"
 RULE_OPTION_NO_GAME_BALANCE:0"Désactiver l'équilibre du jeu"
 RULE_OPTION_NO_GAME_BALANCE_NONHIST_AI_DESC:0"Lorsque le focus historique est désactivé, l'IA sélectionne au hasard une stratégie au début du jeu et l'exécute, certaines stratégies sont plus susceptibles de se produire que d'autres, les règles d'équilibrage du jeu sont volontairement désactivées, de sorte que les idéologies sont §YNOT§ ! équilibré.\n§RMASSUREZ-VOUS D'AVOIR DÉSACTIVÉ LES CONCENTRATIONS HISTORIQUES DE L'IA !!!§!"
 RULE_OPTION_MINORS_ONLY:0"Mode Majeures Historiques"
 RULE_OPTION_MINORS_ONLY_NONHIST_AI_DESC:0"Lorsque les focus historiques sont désactivés, cette option fait la même chose que §YPar défaut§!, cependant les principaux pays (y compris la Chine) resteront sur les focus historiques.\n§RMASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS !!!§!"
 RULE_OPTION_MINORS_FACTIONS:0"Mode Guerre Mondiale"
 RULE_OPTION_MINORS_FACTIONS_NONHIST_AI_DESC:0"Lorsque le focus historique est désactivé, les principaux pays (y compris la Chine) restent sur le focus historique. Tous les autres pays choisiront uniquement des voies qui les alignent sur l’une des factions majeures, ou une voie qui suppose qu’une faction majeure les annexera pacifiquement. \n§RMASSUREZ-VOUS D'AVOIR DÉSACTIVÉ L'IA HISTORIQUE !!!§!"
 RULE_OPTION_ANTI_HISTORICAL:0"Mode anti-historique"
 RULE_OPTION_ANTI_HISTORICAL_NONHIST_AI_DESC:0"Lorsque les focus historiques sont désactivés, cette option fait que l'IA de chaque pays ne choisit JAMAIS les chemins historiques, l'IA peut toujours rester la même idéologie.\n§RMASSUREZ-VOUS DE DÉSACTIVER LES CONCENTRATIONS HISTORIQUES DE L'IA !!!§!"
 RULE_OPTION_REALISTIC:0"Mode semi-réaliste"
 RULE_OPTION_REALISTIC_NONHIST_AI_DESC:0"Lorsque l’accent historique est désactivé, l’IA sélectionne uniquement les voies qui ont une chance réaliste de se produire réellement dans l’histoire. Par exemple, le Japon ne deviendra pas communiste et les États-Unis resteront toujours démocrates. Cela réduira également les chances que d'autres chemins irréalistes mais techniquement possibles se produisent.\n§RMASSUREZ-VOUS D'AVOIR DÉSACTIVÉ LES CONCENTRATIONS HISTORIQUES DE L'IA !!!§ !"
 RULE_OPTION_TRUE_RANDOM:0"Mode véritablement aléatoire »
 RULE_OPTION_TRUE_RANDOM_NONHIST_AI_DESC:0"Lorsque les focus historiques sont désactivés, l'IA sélectionnera au hasard une stratégie au début du jeu et l'exécutera, chaque stratégie a une chance égale d'être choisie, les règles d'équilibrage du jeu sont volontairement désactivées, donc §Ycela risque d'être assez chaotique§!\n§RMASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA !!!§!"
 RULE_OPTION_NO_AI_STRATEGY:0"Mode Chaos"
 RULE_OPTION_NO_AI_STRATEGY_NONHIST_AI_DESC:0"Lorsque les focus historiques sont désactivés, l'IA ne choisira aucune stratégie, mais sélectionnera des focus au hasard quand bon lui semble, sans égard à la situation mondiale. §YCe sera très chaotique.§!\n§RMASSUREZ-VOUS D'AVOIR LE CONCENTRAGE HISTORIQUE DE L'IA !!!§!"
 RULE_OPTION_FASCIST_ONLY:0"Nouvel Ordre Mondial"
 RULE_OPTION_FASCIST_ONLY_NONHIST_AI_DESC:0"Lorsque le focus historique est désactivé, l'IA tentera de toujours choisir un §Lfasciste§ au hasard ! itinéraire. Si ce n’est pas le cas, l’IA choisira une stratégie aléatoire comme d’habitude. \n§RMASSUREZ-VOUS D'AVOIR DÉSACTIVÉ L'IA HISTORIQUE !!!§!"
 RULE_OPTION_COMMUNIST_ONLY:0"Révolution mondiale"
 RULE_OPTION_COMMUNIST_ONLY_NONHIST_AI_DESC:0"Lorsque le focus historique est désactivé, l'IA tentera de toujours choisir un §Rcommuniste§ au hasard ! itinéraire. Si ce n’est pas le cas, l’IA choisira une stratégie aléatoire comme d’habitude. \n§RMASSUREZ-VOUS D'AVOIR DÉSACTIVÉ L'IA HISTORIQUE !!!§!"
 RULE_OPTION_DEMOCRATIC_ONLY:0"Fin de l'Histoire"
 RULE_OPTION_DEMOCRATIC_ONLY_NONHIST_AI_DESC:0"Lorsque les focus historiques sont désactivés, l’IA tentera de toujours choisir un §Cdémocratique§ aléatoire ! itinéraire. Si ce n’est pas le cas, l’IA choisira une stratégie aléatoire comme d’habitude. \n§RMASSUREZ-VOUS D'AVOIR DÉSACTIVÉ L'IA HISTORIQUE !!!§!"
 RULE_OPTION_MONARCHIST_ONLY:0"Jus Divinum Regum"
 RULE_OPTION_MONARCHIST_ONLY_NONHIST_AI_DESC:0"Lorsque le focus historique est désactivé, l'IA tentera de toujours choisir un §0monarchiste§ au hasard ! itinéraire. Si ce n’est pas le cas, l’IA choisira une stratégie aléatoire comme d’habitude. \n§RMASSUREZ-VOUS D'AVOIR DÉSACTIVÉ L'IA HISTORIQUE !!!§!"
 RULE_OPTION_AUTHORITARIAN_ONLY:0"Le siècle de l'État"
 RULE_OPTION_AUTHORITARIAN_ONLY_NONHIST_AI_DESC:0"Lorsque les focus historiques sont désactivés, l'IA tentera de toujours choisir un §7autoritaire/oligarchique§ aléatoire ! itinéraire. Si ce n’est pas le cas, l’IA choisira une stratégie aléatoire comme d’habitude. \n§RMASSUREZ-VOUS D'AVOIR DÉSACTIVÉ L'IA HISTORIQUE !!!§!"
 RULE_OPTION_FASCIST_GER_AI_DESC:0"L'IA @GERallemande restera §Lfasciste§ ! et tenter de conquérir l'Europe en empruntant la voie appropriée dans l'arbre des priorités nationales, en exigeant l'annexion de la @CZEla République tchèque et en exigeant que la @POLla Pologne lui remette Dantzig ou entre en guerre, c'est un comportement historique.
 RULE_OPTION_FASCIST_ALTERNATE_GER_AI_DESC:0"L'IA @GERallemande restera §Lfasciste§ ! et tenter de promouvoir le fascisme chez ses voisins, et avoir un axe aussi large que possible (AI tentera de se lier d'amitié avec @CZETchécoslovaquie, @DENDenmark, @NORNorvège, @SWESuède et @HOLPays-Bas mais envahira toujours @POLPologne et @YUGYougoslavie)"
 RULE_OPTION_FASCIST_ALTERNATE_2_GER_AI_DESC:0"L'IA @GERallemande restera §Lfasciste§ ! et tenter de prendre agressivement le territoire environnant avant d'échanger @SLOSlovaquie contre @POLDantzig. (AI tentera de se lier d'amitié avec @POLPologne, ignorera @DEN@NORScandinavie, annexera @CZE@YUGBalkans. Va envahir @HOL@BEL@LUXBenelux et @SWISuisse)"
 RULE_OPTION_FASCIST_BERLIN_MOSCOW_GER_AI_DESC:0"L'IA @GERallemande restera §Lfasciste§ ! et tenter de former l'axe @GER@SOVBerlin-Moscou avec l'Union soviétique, cela déclenchera chaque §Cdémocratique§ ! nation du monde à former une alliance mutuelle en matière de défense. Cette alliance risque de se briser quelques années seulement après sa formation. L'IA @GERallemande tentera également d'attaquer @ITAItalie, @SPREspagne et @PORPortugal."
 RULE_FASCIST_JAP_AI_DESC:"L’IA japonaise poursuivra sa voie historique et tentera de frapper les alliés occidentaux vers le sud en empruntant la voie appropriée dans l’arbre des priorités nationales. »
 RULE_FASCIST_ALTERNATE_JAP_AI_DESC:0"L'IA @JAPJaponaise se préparera un peu plus avant de se rendre au @CHIChine, et contournera le @PHIPhilippines au lieu de provoquer les @USAÉtats-Unis."
 RULE_OPTION_COMMUNIST_JAP_AI_DESC:0"L'IA @JAPJaponaise va tenter de devenir §Rcommuniste§ ! et rejoignez le Komintern pour éliminer @MANManchuria.
 RULE_OPTION_COMMUNIST_ASIAN_SOLIDARITY_JAP_AI_DESC:0"L'IA @JAPJaponaise va tenter de devenir §Rcommuniste§ ! et soutenir d'autres régimes communistes en Asie et tenter d'éliminer @MANManchuria.
 RULE_OPTION_COMMUNIST_JAP_AI:"Le soleil rouge se lève"

 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI:"L'ascendant de la faction travailliste-agriculteur"
 RULE_OPTION_COMMUNIST_RONOHA_JAP_AI_DESC:"L'IA @JAPJaponaise va tenter de devenir §Rcommuniste§ ! et installer un gouvernement dirigé par Ronoha, menant une croisade contre l'impérialisme en Asie en suivant la voie pertinente dans l'arbre des priorités nationales.

 RULE_OPTION_JAP_NEUTRALITY:"La faction Kodoha victorieuse"

 RULE_OPTION_JAP_DEMOCRATIC:"Une démocratie propre"

 RULE_OPTION_JAP_FASCIST:"Association d'assistance aux règles impériales"
 RULE_OPTION_NEUTRALITY_SHOGUN_JAP_AI_DESC:0"L'@JAPIA japonaise tentera de frapper le nord contre l'@SOVUnion soviétique et de faire cause commune avec l'Axe."
 RULE_OPTION_NEUTRALITY_SHOWA_JAP_AI_DESC:0"L'IA @JAPjaponaise restaurera la pleine souveraineté de l'empereur Showa et prendra son temps à se développer, avant de frapper le nord contre l'@SOVUnion soviétique en fin de partie et de tenter de rejoindre l'Axe.
 RULE_DEMOCRATIC_JAP_AI_DESC:0"L'IA @JAPJaponaise tentera de se réformer en une §Cdémocratie§ ! et rejoignez @ENGBritain ou le plus grand §Cdemocratic§ ! alliance."
 RULE_DEMOCRATIC_PACIFIC_TREATY_JAP_AI_DESC:0"L'IA @JAPJaponaise tentera de se réformer en une §Cdémocratie§ ! et créer une alliance du Traité Asie-Pacifique avec d'autres §Cdémocratiques§ proches ! pouvoirs s’il en existe. En fin de partie, il exigera @PHIla libération des Philippines des @USAÉtats-Unis."
 RULE_OPTION_BOLSHEVIK_PRC:"28 ½ bolchevique"
 RULE_OPTION_BOLSHEVIK_PRC_DESC:"L’IA empruntera la voie des 28 ½ bolcheviques, en essayant de s’aligner sur l’Union soviétique. Si elle fait partie du Deuxième Front Uni, l’IA tentera d’influencer diplomatiquement la faction. »
 RULE_OPTION_ALTERNATE_GUOMAO:"La diarchie involontaire"
 RULE_OPTION_ALTERNATE_GUOMAO_DESC:"L'IA empruntera le chemin de la Diarchie Involontaire, Mao et Guotao tentant de coopérer contre les seigneurs de guerre. L’IA ne cherchera pas à rejoindre le Deuxième Front uni. »
 RULE_KAISER_GER_AI_DESC:0"L'IA @GERallemande tentera de ramener l'empereur Guillaume II sur le trône, en lançant une nouvelle course aux armements navals avec les puissances coloniales @ENG@FRA@BEL et en se réarmant via le programme MEFO avec des tactiques prussiennes restaurées. En garantissant la @POLPologne pour Dantzig et en exigeant que Qingdao se sépare du @CHIChine, l'@GERAllemagne tentera alors de se faire un @AUS@HUNallié austro-hongrois à partir des Balkans du nord, et d'attaquer les @ENG@FRA@BELpuissances coloniales en fin de partie. L'IA pourrait également attaquer l'@SOVUnion soviétique en fonction des circonstances mondiales. »
 RULE_KAISER_ALT_GER_AI_DESC:0"L'IA @GERallemande tentera de ramener le Kaiser Wilhelm II sur le trône, en se réarmant via le programme MEFO avec une nouvelle doctrine panzer. Garantir à la fois @POLPologne pour Dantzig et les @LIT@LAT@ESTÉtats baltes pour les hommages. L'@GERAllemagne tentera alors d'annexer ou d'allier l'@AUSAutriche et la @CZETchécoslovaquie, avant de frapper l'@SOVUnion soviétique. L'IA peut également attaquer les puissances coloniales @ENG@FRA@BELen fin de partie."
 RULE_OPTION_KAISER_EXP:0"Militaire Kaiserreich - Expansionniste"
 RULE_KAISER_EXP_GER_AI_DESC:0"L'IA @GERallemande tentera de restaurer le Kaiserreich allemand sous une dictature militaire. lancer une nouvelle course aux armements navals avec les puissances coloniales @ENG@FRA@BEL, en se réarmant via le programme MEFO avec une nouvelle doctrine panzer. Exiger des concessions territoriales de @POLPologne et @LITLituanie. L'@GERAllemagne tentera alors d'annexer ou d'allier l'@AUSAutriche et la @CZETchécoslovaquie, avant de frapper l'@SOVUnion soviétique. L'IA peut également attaquer les puissances coloniales @ENG@FRA@BELen fin de partie."
 RULE_OPTION_KAISER_BLITZKRIEG:0"Kaiserreich militaire - Blitzkrieg"
 RULE_KAISER_BLITZKRIEG_GER_AI_DESC:0"L'IA @GERallemande tentera de restaurer le Kaiserreich allemand sous une dictature militaire. Réarmement via le programme MEFO avec une nouvelle doctrine panzer. Exiger des concessions territoriales de @POLPologne et @LITLituanie. L'@GERAllemagne tentera alors d'annexer ou d'allier l'@AUSl'Autriche et la @CZEla Tchécoslovaquie, avant de frapper la @ENG@FRA@BELles puissances coloniales et l'@SOVl'Union soviétique le plus tôt possible. (Habituellement en 1939)"
 RULE_OPTION_KAISER_CHINA_ALLY:0"Restaurer le Kaiser - Allier le Kuomintang"
 RULE_KAISER_CHINA_ALLY_GER_AI_DESC:0"L'IA @GERallemande tentera de ramener l'empereur Guillaume II sur le trône, en lançant une nouvelle course aux armements navals avec les puissances coloniales @ENG@FRA@BEL et en se réarmant via le programme MEFO avec des tactiques prussiennes restaurées. Garantissant la @POLPologne en échange de Dantzig, l'@GERAllemagne tentera alors de créer une alliance avec le @CHIKuomintang, avant de frapper la @ENG@FRA@BELpuissances coloniales et de créer des sphères d'influence entre l'@GERAllemagne, le @CHIChine et les autres @IRA@IRQ@AFG@TIBMoyen-Orient et Alliés asiatiques. »
 RULE_OPTION_KAISER_DIPLO:0"Restaurer le Kaiser - Diplomatique"
 RULE_KAISER_DIPLO_GER_AI_DESC:0"L'IA @GERallemande tentera de ramener le Kaiser Guillaume II sur le trône, en acceptant la domination navale @ENGbritannique et en se concentrant sur une nouvelle politique économique. L'IA empruntera la voie la plus amicale possible dans la plupart des scénarios, notamment en concluant des alliances dans les @YUG@ROM@HUN@GRE@BULBalkans, en garantissant la @POLPologne et le @LIT@LAT@ESTÉtats baltes sans aucune condition, en concluant des accords avec @CHIChine et le @ENGRoyaume-Uni, et en tentant de s'aligner. @AUSAutriche, @CZETchécoslovaquie et @ITAItalie. L'IA n'attaquera que l'@SOVUnion Soviétique, à moins qu'elle ne soit attaquée en premier."
 RULE_OPTION_KAISER_ENG_ALLY:0"Kaiserreich militaire - Alliance dans l'ombre"
 RULE_KAISER_ENG_ALLY_GER_AI_DESC:0"L'IA @GERallemande tentera de restaurer le Kaiserreich allemand sous une dictature militaire, en se soumettant à la @ENGdominance navale britannique et en se concentrant sur une nouvelle politique économique avec des tactiques prussiennes restaurées. L'IA mettra en place des garanties mutuelles avec @ENGBritain et tentera de récupérer les anciennes propriétés coloniales @GERallemandes avant de garantir @POLPologne en échange de Dantzig. @GERAllemagne attaquera alors @FRAFrance et tentera de contourner Maginot via @SWISwitzerland. L'IA est plus susceptible d'attaquer également l'@ITAItalie et l'@SOVUnion soviétique en fin de partie."
 RULE_DEMOCRATIC_GER_AI_DESC:0"L'IA @GERallemande tentera de créer une monarchie constitutionnelle avec un §Cdémocratique§ ! gouvernement, tenter de créer des alliances avec @AUSAutriche et @CZETchécoslovaquie, étendre autant que possible l'influence de la Mitteleuropa, échanger Dantzig contre des garanties sur @POLPologne, et signer un pacte de défense avec le @ENGRoyaume-Uni et @FRAFrance, demandant la restauration des anciennes colonies @GERallemandes. L'IA déclarera la guerre à l'@SOVUnion soviétique en fin de partie pour s'attaquer une fois pour toutes au communisme."
 RULE_DEMOCRATIC_DIPLO_GER_AI_DESC:0"L'IA @GERallemande tentera de créer une monarchie constitutionnelle avec un §Cdémocratique§ ! gouvernement, tenter de créer des alliances avec @AUSAutriche et @CZETchécoslovaquie, étendre autant que possible l'influence de la Mitteleuropa, donner des garanties sur @POLPologne et @LIT@LAT@ESTBaltiques sans aucune condition, et signer un pacte de défense avec @FRAFrance, demandant que Qingdao soit restaurée de @CHIChine. L'IA ne déclarera la guerre à aucun pays, à l'exception de l'@SOVUnion soviétique dans des scénarios de jeu spécifiques.
 RULE_OPTION_DEMOCRATIC_EXP:0"Démocratique - Expansionniste"
 RULE_DEMOCRATIC_EXP_GER_AI_DESC:0"L'IA @GERallemande tentera de créer une monarchie constitutionnelle avec un §Cdémocratique§ ! Le gouvernement, tout en conservant le système de facturation fasciste MEFO, @GERL'Allemagne tentera d'élargir ses frontières autant que possible, exigeant le @POLle territoire polonais et @LITlituanien, tentant d'annexer ou de s'allier à l'@AUSAutriche, et déclarant la guerre au @ENGRoyaume-Uni et à la @FRAFrance pour les anciennes colonies @GERallemandes. L'IA déclarera également la guerre à l'@SOVUnion soviétique en fin de partie pour s'attaquer une fois pour toutes au communisme.
 RULE_OPTION_DEMOCRATIC_COLONIAL:0"Démocratique – Restaurer les possessions coloniales"
 RULE_DEMOCRATIC_COLONIAL_GER_AI_DESC:0"L'IA @GERallemande tentera de créer une monarchie constitutionnelle avec un §Cdémocratique§ ! gouvernement, signant des traités de défense avec le @ENGRoyaume-Uni et la @FRAFrance afin de demander le retour des @GERexploitations coloniales allemandes. L'IA exigera alors également Qingdao à @CHIChine, et les anciennes terres impériales à @POLPologne.  L'IA peut déclarer la guerre à l'@SOVUnion soviétique en fin de partie, en fonction de la situation mondiale."
