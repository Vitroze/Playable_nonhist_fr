 RULE_OPTION_ITA_POPE_ROME_AI_DESC:0"L'@ITAIA italienne renversera Mussolini en faveur du roi Vittorio Emanuele, qui établira une monarchie absolutiste. La monarchie perdra de son influence au profit du pape, qui prendra le pouvoir sur l'Italie dans les années 1940. Le pape tentera de s’emparer de l’Europe et de reformer l’Empire romain. »
