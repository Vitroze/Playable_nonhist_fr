 SOV_FRAGMENTATION_STATUS:0"Statut de fragmentation de l'Union soviétique"
 RULE_OPTION_SOV_FRAGMENTED:1"Union Soviétique Dissoute"
 RULE_OPTION_SOV_FRAGMENTED_DESC:1"L'Union Soviétique verra tous ses RSS libérés dès le début du jeu et ressemblera à ce qu'elle était juste après sa dissolution à la fin de la Guerre froide. »
 RULE_OPTION_SOV_UTTERLY_FRAGMENTED:0"L'Union Soviétique Fragmentée"
 RULE_OPTION_SOV_UTTERLY_FRAGMENTED_DESC:0"Toutes les républiques, Okrugs et territoires libérables comprenant l'Union soviétique sont libérés en tant que nations libres et indépendantes au début du jeu. "
 NORDICS_FRAGMENTATION_STATUS:"Statut de fragmentation nordique"
 RULE_OPTION_SAPMI_RELEASED:"Sápmi libéré"
 RULE_OPTION_SAPMI_RELEASED_DESC:"Sápmi sera libéré de Finlande, de Suède et de Norvège. »
 RULE_OPTION_NORDICS_FRAGMENTED:"Les pays nordiques fragmentés"
 RULE_OPTION_NORDICS_FRAGMENTED_DESC:"Les pays nordiques seront fragmentés et divisés. »
 RAJ_FRAGMENTATION_STATUS:0"Statut de fragmentation de l'Inde "
