 RULE_OPTION_DEN_FASCIST_DIPLO_BALTIC_AI_DESC:0"La droite renversera le gouvernement en sortant du §LDNSAP§ ! au pouvoir. L’IA tente d’influencer et de manipuler diplomatiquement les pays @NOR@SWE@ICENordiques, et tente d’annexer la @NORNorvège. L'IA va enfin lancer des campagnes de guerre pour sécuriser @FINFinlande et la @EST@LAT@LIT@POLmer Baltique."
 RULE_OPTION_DEN_FASCIST_DIPLO_ENG:0"Diplo fasciste - Danelaw"
 RULE_OPTION_DEN_FASCIST_DIPLO_ENG_AI_DESC:0"La droite renversera le gouvernement en sortant du §LDNSAP§ ! au pouvoir. L’IA tente d’influencer et de fantocher diplomatiquement les pays @NOR@SWE@ICENordic et @LIT@LAT@ESTBaltique, et tentera d’annexer @NORNorvège. L'IA va enfin lancer des campagnes de guerre pour sécuriser @FINFinlande avant de déclarer la guerre à @ENGEngland pour rétablir le Danelaw."
 RULE_OPTION_DEN_FASCIST_EXP_NORD:0"Fasciste - Union norvégienne"
 RULE_OPTION_DEN_FASCIST_EXP_NORD_AI_DESC:0"La droite renversera le gouvernement en sortant du §LDNSAP§ ! au pouvoir. L’IA tentera d’envahir et d’annexer @NORla Norvège et de manipuler diplomatiquement @LIT@LAT@ESTles pays baltes."
 RULE_OPTION_DEN_FASCIST_EXP_BALTIC:0"Fasciste - Dominion Baltique"
 RULE_OPTION_DEN_FASCIST_EXP_BALTIC_AI_DESC:0"La droite renversera le gouvernement en sortant du §LDNSAP§ ! au pouvoir. L'IA tentera d'envahir et d'annexer @NORNorvège. En fin de partie, l'IA lancera des campagnes de guerre pour sécuriser @FINFinlande et la @EST@LAT@LIT@POLmer Baltique."
 RULE_OPTION_DEN_FASCIST_EXP_ENG:0"Fasciste - Danelaw"
 RULE_OPTION_DEN_FASCIST_EXP_ENG_AI_DESC:0"La droite renversera le gouvernement en sortant du §LDNSAP§ ! au pouvoir. L’IA tentera d’envahir et d’annexer la @NORNorvège et de manipuler diplomatiquement les pays baltes @LIT@LAT@EST. En fin de partie, l'IA lancera des campagnes de guerre pour sécuriser @FINFinland avant de déclarer la guerre à @ENGEngland pour rétablir le Danelaw.
 RULE_OPTION_OVERLORD_RESIST:0"Résistez à Overlord"
 RULE_OVERLORD_RESIST_DEN_AI_DESC:0"Si @DENDenmark est une marionnette, ils chercheront à se libérer de leur pays suzerain et travailleront lentement à déclarer leur indépendance. C'est un comportement historique."
 RULE_OPTION_OVERLORD_RESIST_INDP:0"Déclarons l'indépendance"
 RULE_OVERLORD_RESIST_INDP_DEN_AI_DESC:0"Si @DENDenmark est une marionnette, ils rechercheront l'indépendance de leur pays suzerain et déclareront leur indépendance dès qu'ils le pourront. L’IA rejettera toutes les demandes de son suzerain. »
 RULE_OPTION_OVERLORD_NO_SURRENDER:0"Pas de reddition"
 RULE_OVERLORD_NO_SURRENDER_DEN_AI_DESC:0"@DENDenmark ne se laissera pas manipuler s'ils se retrouvent en guerre, ils se battront jusqu'au bout."
 RULE_OPTION_OVERLORD_COMPLY:0"Collaboration"
 RULE_OVERLORD_COMPLY_DEN_AI_DESC:0"Si @DENDenmark est une marionnette, ils chercheront à collaborer avec leur pays suzerain et à prêter allégeance. »
 RULE_OPTION_OVERLORD_COMPLY_EXP:0"Expansionnisme collaboratif"
 RULE_OVERLORD_COMPLY_EXP_DEN_AI_DESC:0"Si @DENDenmark est une marionnette, ils chercheront à collaborer avec leur pays suzerain et à prêter allégeance. L'IA demandera à son suzerain de lui accorder ses revendications dans les pays @NOR@SWE@ICE@FINNordiques, même si cela signifie déclencher de nouvelles guerres.
 RULE_OPTION_OVERLORD_COMPLY_INDP:0"Pétition pour l'indépendance"
 RULE_OVERLORD_COMPLY_INDP_DEN_AI_DESC:0"Si @DENDenmark est une marionnette, ils chercheront à collaborer avec leur pays suzerain et à prêter allégeance. L’IA demandera l’indépendance à son suzerain et rejoindra sa faction en tant que partenaire et non en tant que marionnette. »
 RULE_OPTION_OVERLORD_COMPLY_SABOTAGE:0"Sabotage collaboratif"
 RULE_OVERLORD_COMPLY_SABOTAGE_DEN_AI_DESC:0"Si @DENDenmark est une marionnette, ils chercheront à collaborer avec leur suzerain, mais saboteront secrètement leur suzerain et déclareront plus tard une guerre d'indépendance. »
 RULE_OPTION_DEN_MONARCHIST:"Monarchie expansionniste"
 RULE_OPTION_DEN_MONARCHIST_AI_DESC:"Le roi Christian X tentera de sécuriser les ressources naturelles et de renforcer les capacités militaires du Danemark en contrôlant le reste des pays nordiques par tous les moyens nécessaires. »
 RULE_OPTION_DEN_FASCIST:"Le Danemark fasciste"
 RULE_OPTION_DEN_FASCIST_AI_DESC:"Le §LFParti fasciste§! tentera de prendre le pouvoir au @DEN Danemark et de rétablir l'ancien empire de la mer du Nord @DEN@NOR@ENG."
 RULE_HISTORICAL_ICE_AI_DESC:"L’IA islandaise @ICE tentera de maintenir sa neutralité et demandera la protection des États-Unis en cas de besoin. »
 RULE_OPTION_ICE_SUPPORT:"Soutenir le Danemark"
 RULE_OPTION_ICE_SUPPORT_AI_DESC:"L'IA islandaise @ICE tentera de soutenir la défense danoise @DEN contre tout attaquant."
 RULE_OPTION_ICE_FASCIST:"Fasciste"
 RULE_OPTION_ICE_FASCIST_AI_DESC:"L'@ICE IA islandaise dénoncera le @DEN roi du Danemark et tentera de créer un §Lfasciste§ ! empire en mer du Nord"
 RULE_OPTION_ICE_COMMUNIST:"Communiste"
 RULE_OPTION_ICE_COMMUNIST_AI_DESC:"L'@ICE IA islandaise dénoncera la monarchie et établira un §Rcommuniste§ ! état dans @ICE Islande."
 RULE_OPTION_HISTORICAL_NORWAY:"Gouvernement travailliste - Historique"
 RULE_HISTORICAL_NOR_AI_DESC:"@NORNorvège maintiendra le §CLabour Party§! de Nygaardsvold. Le gouvernement maintiendra sa position pacifiste antérieure à moins qu'il ne soit attaqué. Vidkun Quisling sera arrêté avant de pouvoir fomenter un coup d'État. Si @NORNorvège capitule, elle continuera à se battre en tant que gouvernement en exil. C'est un comportement historique."
 RULE_OPTION_HISTORICAL_FASCIST_Q:"Gouvernement Travailliste - Coup d'État de Quisling"
 RULE_HISTORICAL_FASCIST_Q_NOR_AI_DESC:"@NORNorvège maintiendra le §CLabour Party§! de Nygaardsvold. Le gouvernement maintiendra sa position pacifiste antérieure à moins qu'il ne soit attaqué. Si @NORNorvège est attaqué par un §Lfasciste§! pouvoir, Vidkun Quisling va reprendre les studios de radiodiffusion NRK à Oslo et convaincre la police locale de le soutenir dans une campagne §Lfasciste§! coup d'État, rejoignant la faction des attaquants et conduisant Quisling à devenir le nouveau « Premier ministre ».
 RULE_OPTION_HISTORICAL_FASCIST_RK:"Gouvernement travailliste - Coup d'Etat de Terboven"
 RULE_HISTORICAL_FASCIST_RK_NOR_AI_DESC:"@NORNorvège maintiendra le §CLabour Party§! de Nygaardsvold. Le gouvernement maintiendra sa position pacifiste antérieure à moins qu'il ne soit attaqué. Si @NORNorvège est attaqué par un §Lfasciste§! pouvoir, Vidkun Quisling va reprendre les studios de radiodiffusion NRK à Oslo et convaincre la police locale de le soutenir dans une campagne §Lfasciste§! coup d'État, rejoignant la faction de l'attaquant. Quisling sera bientôt évincé par Josef Terboven qui conduira la Norvège à devenir un sujet de la nation attaquante."

 ### SOUTH AMERICA ###

 CHL_AI_BEHAVIOR:"@CHL Chili"
 RULE_HISTORICAL_CHL_AI_DESC:"L'IA chilienne renforcera le §Cdémocratique§ ! système et choisissent de soutenir les politiques sociales-démocrates tout en maintenant l’équilibre des pouvoirs, et ne rejoindront la lutte mondiale que si elle s’éternise. »

 RULE_OPTION_CHL_COMMUNIST:"La République Socialiste du Chili"
 RULE_OPTION_CHL_COMMUNIST_AI_DESC:"L'IA chilienne utilisera l'instabilité causée par le fascisme pour exiger la démission d'Arturo Alessandri et augmentera les pouvoirs présidentiels afin de pouvoir instaurer un §Rcommuniste§! État."

 RULE_OPTION_CHL_OPERATION_BOLIVAR:"Coopération avec l'Opération Bolivar"
 RULE_OPTION_CHL_OPERATION_BOLIVAR_DESC:"L'IA chilienne s'engagera sur la voie du §Lfascisme§!, choisissant de se ranger du côté du Reich allemand si elle en a l'occasion, pour finalement entrer en guerre et tenter de restaurer l'ancien royaume du Chili.

 RULE_OPTION_CHL_PAN_HISPANISM:"Panhispanisme"
 RULE_OPTION_CHL_PAN_HISPANISM_DESC:"L’IA chilienne s’engagera sur la voie du §Lfascisme§!, choisissant finalement de ne se ranger du côté d’aucune des grandes puissances mondiales. Ils continueront plus tard soit à conquérir le monde hispanique, soit à l'unir diplomatiquement. »

 RULE_OPTION_CHL_ANTI_IMPERIALISM:"Anti-impérialisme"
 RULE_OPTION_CHL_ANTI_IMPERIALISM_DESC:"L'IA chilienne choisira de soutenir les différentes organisations mapuches pour, à terme, leur faire prendre le contrôle du pays. Il lancera plus tard une croisade contre l’impérialisme, chassant les États contrôlés par les Européens d’Amérique du Sud et d’Amérique centrale. »

 RULE_OPTION_CHL_LE_DELUGE:"Le Royaume d'Araucanie et de Patagonie"
 RULE_OPTION_CHL_LE_DELUGE_DESC:"L'IA chilienne s'inspirera de la tradition et chassera ainsi Alessandri du pouvoir, en installant Ibáñez à sa place. Elle entrera alors dans une guerre civile, dans laquelle Antoine III restaurera l'ancien royaume d'Araucanie et de Patagonie, se déclarant successeur de Napoléon.

 BRA_AI_BEHAVIOR:"@BRA Brésil"
 RULE_HISTORICAL_BRA_AI_DESC:"Vargas tentera de rester au pouvoir en éliminant soigneusement l'opposition politique au Brésil avant de finalement rejoindre les Alliés et de travailler avec les États-Unis. »
 RULE_OPTION_FASCISM:"Fascisme"
 RULE_FASCISM_BRA_AI_DESC:"Le §LMouvement Intégraliste§! trahira Vargas et installera l'un des leurs comme chef. Ils tenteront alors de dominer l’Amérique du Sud par la diplomatie et la force. »
 RULE_DEMOCRATIC_BRA_AI_DESC:"Le Brésil tentera de renverser Vargas en mettant fin à l’état d’urgence. Il tentera alors de réformer la nation, en augmentant la §Cdémocratie§! participation avant de finalement coopérer avec les États-Unis contre les puissances de l’Axe. »
 RULE_OPTION_MONARCHIST_HENRIQUE:"Monarchiste - Dom Pedro Henrique"
 RULE_OPTION_MONARCHIST_HENRIQUE_DESC:"L'IA tentera de réformer l'Empire du Brésil en obtenant le soutien de Pedro Henrique en tant qu'héritier légitime du trône. Il tentera alors de conquérir ou d’intégrer les voisins du Brésil. »
 RULE_OPTION_MONARCHIST_ALCANTARA:"Monarchiste - Dom Pedro de Alcântara"
 RULE_OPTION_MONARCHIST_ALCANTARA_DESC:"L'IA tentera de réformer l'Empire du Brésil en obtenant le soutien de Pedro de Alcântara en tant qu'héritier légitime du trône. Elle tentera alors de se réunifier avec le Portugal par la diplomatie ou par la force. »
 RULE_OPTION_BRA_COMMUNIST_STALINISM:"Communisme - Luís Carlos Prestes"
 RULE_OPTION_BRA_COMMUNIST_STALINISM_DESC:"Le Brésil tentera de renverser le gouvernement démocratique et de le remplacer par un §Rcommuniste§ aligné sur les Soviétiques ! gouvernement dirigé par Luís Carlos Prestes. Il rejoindra alors le Komintern et aidera l’Union soviétique. »
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT:"Communisme - Aliança Nacional Libertadora"
 RULE_OPTION_BRA_COMMUNIST_INDEPENDENT_DESC:"Le Brésil va ressusciter l’ANL et tenter de renverser le gouvernement démocratique. Il sera remplacé par le conseil de l'ANL qui mettra alors en œuvre le §Rcommuniste§ ! réformes avant de tenter finalement de libérer le continent du fascisme et de l’impérialisme. »

 ARG_AI_BEHAVIOR:"@ARG Argentine"
 RULE_HISTORICAL_ARG_AI_DESC:"L’IA tentera de s’en tenir aux événements historiques en évitant d’entrer dans la guerre et en coopérant progressivement avec le Royaume-Uni et les États-Unis. »
 RULE_FASCISM_ARG_AI_DESC:"L'IA tentera de rendre le pays §Lfasciste§ ! et rejoindra les puissances de l'Axe pour ouvrir un nouveau front en Amérique du Sud. »
 RULE_COMMUNIST_ARG_AI_DESC:"L'IA tentera de transformer le pays §Rcommuniste§ ! et rejoindra le Komintern pour se concentrer sur la diffusion de leur idéologie en Amérique du Sud. »
 RULE_DEMOCRATIC_ARG_AI_DESC:"L'IA tentera de devenir §Cdémocratique§ ! et rejoindra les Alliés pour sauvegarder la démocratie et la liberté en Amérique du Sud. »

 RULE_ALLOW_RELEASE_NATIONS_NOT_CHILE_TOOLTIP:"§Y[CHL.GetName]§! ne peut libérer ce pays que via la §YCroisade contre l'impérialisme§ ! focus ou en descendant le §CDémocratique§! ou §YCommuniste§! branches dans l'§YFocus Tree§!."

 RULE_ALLOW_RELEASE_NATIONS_NOT_QUEBEC_TOOLTIP:"§Y[CAN.GetName]§! ne peut libérer ce pays via qu'en complétant soit §Y$CAN_forced_quebec_conscription$§! ou §Y$CAN_compromise_with_quebec$§!."


 RULE_OPTION_HISTORICAL_PAR_AI_DESC:"L’IA restera à l’écart de la politique mondiale et se concentrera sur les problèmes internes, traversant des instabilités la gardant à l’écart de la guerre. »
 RULE_OPTION_COMMUNIST_PAR_AI_DESC:"L'IA gardera le §Rcommuniste§ de Rafael Franco ! gouvernement et cherchent à se venger de la Bolivie pour la guerre du Chaco.
 RULE_OPTION_COMMUNIST_PAR_AI:"Communiste"
 RULE_OPTION_DEMOCRATIC_PAR_AI_DESC:"L'IA luttera contre le coup d'État de Raphaël Franco et entrera dans une guerre civile pour tenter de conserver son caractère §démocratique§ ! gouvernement intact. »
 RULE_OPTION_DEMOCRATIC_PAR_AI:"Démocratique"
 URG_AI_BEHAVIOR:"@URG Uruguay"
 RULE_OPTION_HISTORICAL_URG_AI_DESC:"L’IA tentera de rester à l’écart des affaires mondiales et de se concentrer sur l’industrialisation interne, mettant ainsi le parti Colorado au pouvoir. Je n'ai rejoint les alliés qu'à la fin de la guerre. »
 RULE_OPTION_DEMOCRATIC_ALT_AI_URG_DESC:"L'IA tentera de rester à l'écart des affaires mondiales et de se concentrer sur l'industrialisation interne, mettant le §CBlanco§! au pouvoir. Je n'ai rejoint les alliés qu'à la fin de la guerre. »
 RULE_OPTION_DEMOCRATIC_ALT_AI:"Alt Démocratique"
 RULE_OPTION_FASCIST_AI_URG_DESC:"L’IA s’alignera sur l’Axe, transformant le pays en un §Ltremplin§ ! pour une conquête sud-américaine.
 RULE_OPTION_FASCIST_URG_AI:"Fasciste"

 RULE_OPTION_DISPERSE_MILITARY_POWER:"Disperser la puissance militaire"
 RULE_OPTION_DISPERSE_MILITARY_POWER_AI_DESC:"L’IA restera neutre dans les affaires mondiales et tentera de développer son propre pays à moins d’être provoquée. »
 RULE_OPTION_DICTATORSHIP_NEUTRAL:"Dictature neutre"
 RULE_OPTION_DICTATORSHIP_NEUTRAL_AI_DESC:"L'IA empruntera la voie d'une dictature autoritaire mais essaiera de rester neutre."
 DICTATORSHIP_WARMONGER:"Belliciste"
 RULE_OPTION_DICTATORSHIP_WARMONGER_AI_DESC:"L’IA empruntera la voie d’une dictature autoritaire et tentera d’étendre son territoire. »
 PAR_AI_BEHAVIOR:"@PAR Paraguay"

RULE_ALLOW_RELEASE_NATIONS_NO_SLOVAKIA_TOOLTIP:"§Y[HUN.GetName]§! et §Y[CZE.GetName]§! ne peut libérer ce pays que via des événements ou des focus.

 AUS_AI_BEHAVIOR:"@AUS Autriche"
 AUS_AI_ANCHLUSS:"@AUS@GER Refuser l'ancrage"
 RULE_OPTION_HISTORICAL_AUS_AI_DESC:"L'IA deviendra §Lfasciste§ ! et tenter de conjurer l'Anschluss avec le Front Vaterländische à la barre.
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI:"Monarchiste - Assujettissement"
 RULE_OPTION_MONARCHIST_PUPPET_AUS_AI_DESC:"L’IA tentera de réformer l’Empire austro-hongrois en reconstruisant son armée et en exigeant l’assujettissement des pays qui occupent désormais leurs anciennes terres. »
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI:"Monarchiste - Annexion"
 RULE_OPTION_MONARCHIST_ANNEX_AUS_AI_DESC:"L’IA tentera de réformer l’Empire autrichien en reconstruisant son armée, puis en agrandissant et en annexant ses anciens territoires perdus. »
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI:"Fédératif des Non-Alignés"
 RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI_DESC:"L'IA tentera de former la Fédération danubienne en invitant d'autres nations le long du Danube dans le cadre d'un §gnon-aligné§! règle."
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI:"Autrichien soviétique"
 RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI_DESC:"L'IA tentera de devenir §Rcommuniste§ ! et renverser le gouvernement avant de s'aligner sur l'URSS et de rejoindre le Komintern"
 RULE_OPTION_AUS_COMMUNIST_AI:"Communiste"
 RULE_OPTION_AUS_COMMUNIST_AI_DESC:"L'IA tentera de devenir §Rcommuniste§ ! et renverser le gouvernement. Adhérant à un programme austromarxiste strict, ils créeront leur propre faction. »
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI:"Démocrate autrichien - Fédératif"
 RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI_DESC:"L'IA tentera de former la Fédération danubienne en invitant d'autres nations le long du Danube dans un cadre §Cdémocratique§! règle."
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI:"Démocrates autrichiens - Alliés"
 RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI_DESC:"L'IA tentera de rejoindre les Alliés en rétablissant la §Cdémocratie§ ! en Autriche."
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI:"Fédération Démocratique Autrichienne - Alpine"
 RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI_DESC:"L'IA tentera de rétablir la §Cdémocratie§ ! en Autriche et former la Fédération alpine."
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI:"Variante historique - Östfrei!"
 RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI_DESC:"L’IA suivra en grande partie la voie historique, mais tentera d’éviter l’Anschluss par tous les moyens possibles, luttant bec et griffes pour son indépendance jusqu’au bout. Cela pourrait constituer un défi ou un retard dans le déclenchement de la guerre. »


 BEL_AI_BEHAVIOR:"@BEL Belgique"
 RULE_OPTION_HISTORICAL_BEL_AI:"Historique"
 RULE_OPTION_HISTORICAL_BEL_AI_DESC:"La Belgique tentera dans un premier temps de repousser les attaques, mais elle se repliera ensuite sur le Congo et poursuivra la guerre à partir de là. »
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI:"Fascistes nationalistes (Rexist)"
 RULE_OPTION_NATIONALIST_FASCIST_BEL_AI_DESC:"L'IA ira avec les §LRexistes fascistes§! et établira un grand État hautement industriel, puis assistera les fascistes dans la guerre.
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI:"Fascistes expansionnistes (VNV)"
 RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI_DESC:"L'IA ira aux côtés des §LFnationalistes fascistes§!, et tentera de manière agressive d'unifier les pays bas, puis se retournera contre la France.
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI:"Démocrates défensifs"
 RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI_DESC:"L'IA se débarrassera des chaînes de son roi à la volonté faible et tentera de défendre la Belgique à tout prix tout en restant §Cdémocratique§!."
 RULE_OPTION_COMMUNIST_BEL_AI:"Socialistes"
 RULE_OPTION_COMMUNIST_BEL_AI_DESC:"L'IA permettra au parti travailliste de remporter les élections, puis commencera lentement à s'aligner sur le §RCommuniste§ ! bloc."

 COG_AI_BEHAVIOR:"@COG Congo Belge"
 RULE_OPTION_HISTORICAL_COG_AI_DESC:"L'IA congolaise restera en Belgique et utilisera ses relations avec la nation au maximum de leur potentiel, en recherchant éventuellement une autonomie accrue. »
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI:"Mouvements d'émancipation démocratique"
 RULE_OPTION_COG_DEM_INDEPENDENCE_AI_DESC:"L'IA congolaise tentera d'obtenir son indépendance dès que possible par des moyens pacifiques, et fera ensuite campagne pour la §Cdémocratie§ ! dans toute l'Afrique."
 RULE_OPTION_COG_COM_INDEPENDENCE_AI:"Mouvements d'émancipation communistes"
 RULE_OPTION_COG_COM_INDEPENDENCE_AI_DESC:"L'IA congolaise tentera d'obtenir son indépendance dès que possible par des moyens pacifiques, puis tentera de propager le §Rcommunisme§ ! dans toute l'Afrique."
 RULE_OPTION_COG_COM_REVOLUTION_AI:"La révolution de Simba"
 RULE_OPTION_COG_COM_REVOLUTION_AI_DESC:"L'IA congolaise tentera de se libérer de ses suzerains coloniaux par une violente §Rrévolution§ ! et la guerre civile qui s'ensuit, et tenteront ensuite de propager le §Rcommunisme§! sur tout le continent africain. »

 AFG_AI_BEHAVIOR:"@AFG Afghanistan"
 RULE_OPTION_HISTORICAL_AFG_AI_DESC:"L’IA afghane tentera de rester neutre tout au long de cette période tout en tentant d’obtenir des concessions économiques de la part des Alliés, du Komintern et des puissances de l’Axe. »
 RULE_OPTION_FASCISM_AFG_AI_DESC:"L'IA afghane tentera d'évincer le roi Zahir Shah et de le remplacer par §LAmanullah Khan§ ! qui tentera alors de moderniser rapidement le pays. L’Afghanistan cherchera alors à étendre ses frontières avec l’aide des puissances de l’Axe. »
 RULE_OPTION_DEMOCRATIC_AFG_AI_DESC:"L'IA afghane va pousser le roi Zahir Shah à évincer ses oncles avant de poursuivre sur la voie de réformes radicales. Cela aboutira à ce que l’Afghanistan devienne une §Cdémocratie§ ! et rejoindre les Alliés.
 RULE_OPTION_COMMUNIST_AFG_AI_DESC:"L’IA afghane se rapprochera de l’Union soviétique et mettra en œuvre des réformes radicales pour transformer la nation en §RCommuniste§ ! État. Il rejoindra alors le Komintern et tentera de prendre le contrôle de l’Asie centrale. »

 IRQ_AI_BEHAVIOR:"@IRQ Irak"
 RULE_OPTION_HISTORICAL_IRQ_AI:"Historique"
 RULE_OPTION_HISTORICAL_IRQ_AI_DESC:"L’IA fera volte-face entre des coups d’État historiques, culminant avec la prise de contrôle du Carré d’Or et l’entrée en guerre contre le Royaume-Uni avant de finalement restaurer la monarchie et de se rendre. »
 RULE_OPTION_FASCISM_IRQ_AI:"Fascisme - Carré d'Or"
 RULE_OPTION_FASCISM_IRQ_AI_DESC:"L'IA va tenter de mettre le §LCarré d'Or§ ! au pouvoir le plus tôt possible avant de rejoindre l'Axe pour combattre le Royaume-Uni. Ils tenteront alors d’annexer les territoires arabes voisins. »
 RULE_OPTION_HASHEMITE_IRQ_AI:"Hachémite - Non-Alignés"
 RULE_OPTION_HASHEMITE_IRQ_AI_DESC:"L’IA tentera de rester fidèle au Royaume-Uni tout en renforçant son pouvoir dans la région, en prenant progressivement en charge l’administration du territoire et en formant finalement la Fédération arabe hachémite. »
 RULE_OPTION_SIDQI_IRQ_AI:"Bakr Sidqi - Non-Alignés"
 RULE_OPTION_SIDQI_IRQ_AI_DESC:"Bakr Sidqi lancera son coup d'État historique mais ne sera pas assassiné. Au lieu de cela, le gouvernement travaillera avec l’Iran et la Turquie pour former un bloc puissant régional. »
 RULE_OPTION_KURDISTAN_IRQ_AI:"Indépendance du Kurdistan"
