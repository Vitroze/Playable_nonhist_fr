 RULE_GROUP_PEACE_SCORE:0"Répartition du score de paix"
 PEACE_SCORE_TO_OVERLORD:0"Des marionnettes pour dominer"
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_YES_DESC:0"Les marionnettes donnent une partie de leur score de paix à leur suzerain. Le ratio dépend de leur niveau d'autonomie."
 RULE_OPTION_PEACE_SCORE_TO_OVERLORD_NO_DESC:0"Les marionnettes conservent tout le score de paix qu'elles ont gagné pendant la guerre.
 PEACE_SCORE_TO_FACTION_LEADER:0"Des membres de la faction au chef de la faction »
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_YES_DESC:0"Les membres de la faction donnent 10 % de leur score de paix au chef de la faction."
 RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_NO_DESC:0"Les membres de la faction conservent tous les scores de paix qu'ils ont gagnés pendant la guerre.
 PEACE_SCORE_RESET_LOW_SCORES:0"Redistribuer les faibles scores"
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_YES_DESC:0"Les gagnants avec moins de 5 % de participation à la guerre donnent tout leur score aux autres gagnants.\nNe s'applique pas si aucun vainqueur n'a au moins 10 % de participation à la guerre.\nNe s'applique pas aux joueurs humains."
 RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_NO_DESC:0"Tous les vainqueurs conservent tout le score de paix qu'ils ont gagné pendant la guerre. »
 RULE_OPTION_HISTORICAL_SDP:"Social-démocrates - Historique"
 RULE_HISTORICAL_SWE_AI_DESC:"Le @SWESuédois §CParti Social-Démocrate§! maintiendra son emprise sur le gouvernement après les élections de 1936. @SWESweden restera neutre dans les affaires mondiales à moins d’être attaqué, et commercera avec tous les autres pays occidentaux sans se soucier des conflits à leurs frontières. »
 RULE_OPTION_SDP_ASSERTIVE:"Social-démocrates - Assertifs"
 RULE_SDP_ASSERTIVE_SWE_AI_DESC:"Le @SWESuédois §CParti Social-Démocrate§! maintiendra son emprise sur le gouvernement après les élections de 1936. @SWEweden restera neutre dans les affaires mondiales à moins qu'il ne soit attaqué. @SWESweden demandera aux autres pays d'affirmer ses propres intérêts sur la scène mondiale, comme s'emparer de Landsverk, exiger Åland de @FINFinlande et occuper Narvik au nom de @NORNorvège s'ils capitulent, donnant à @SWESweden l'accès au commerce de la mer du Nord.
 RULE_OPTION_SWE_DEM_ALT:"Réarmement démocratique"
 RULE_OPTION_SWE_DEM_ALT_DESC:"Les élections @SWESuédoises de 1936 se dérouleront avec un choix §Cdémocratique§ aléatoire ! Après la victoire du parti, l'IA descendra dans l'arbre démocratique mais maintiendra sa neutralité et se comportera de manière similaire à l'histoire, tout en se réarmant plus rapidement et en s'appuyant davantage sur des politiques de droite. L'IA envoie généralement des volontaires en @FINFinlande pendant la guerre d'hiver."
 RULE_OPTION_SWE_ALLIES:"Démocratique - Protecteur allié"
 RULE_OPTION_SWE_ALLIES_DESC:"Les élections @SWESuédoises de 1936 se dérouleront avec un choix §Cdémocratique§ aléatoire ! Après la victoire du parti, l'IA descendra dans l'arbre démocratique, tout en se réarmant plus rapidement et en s'orientant davantage vers des politiques de droite. L'IA se joindra à la guerre d'hiver aux côtés de @FINFinlande et commencera également des opérations pour libérer @NORNorvège et @DENDanemark de tout pays qui les occupe en 1941. L'IA demandera également de rejoindre les Alliés pendant ces guerres de libération.
 RULE_OPTION_SWE_ALLIES_EXP:"Démocrate – Protecteur allié affirmé"
 RULE_OPTION_SWE_ALLIES_EXP_DESC:"Les élections @SWESuédoises de 1936 se dérouleront avec un choix §Cdémocratique§ aléatoire ! Après la victoire du parti, l'IA descendra dans l'arbre démocratique, tout en se réarmant plus rapidement et en s'orientant davantage vers des politiques de droite. L'IA exigera Åland de @FINFinland et occupera Narvik au nom de @NORNorvège s'ils capitulent. @SWESweden préparera également des opérations pour libérer @NORNorvège et @DENDanemark de tout pays qui les occupera en 1941. L'IA demandera également de rejoindre les Alliés pendant ces guerres de libération, et déclenchera des guerres en 1943 contre @ENGAngleterre, @GERAllemagne ou @SOVRussie s'ils ne le sont pas. §Cdémocratique§!."
 RULE_OPTION_SWE_COMMUNISM:"Communisme"
 RULE_OPTION_SWE_COMMUNISM_DESC:"L'IA @SWE suédoise fera tomber le §Rcommuniste§ ! arbre et allier l'Axe ou les Alliés"
 RULE_OPTION_SWE_FASCIST_INDEPENDENT:"Fasciste - Neutralité"
 RULE_OPTION_SWE_FASCIST_INDEPENDENT_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement maintiendra sa neutralité dans les affaires mondiales, mais pourra rejoindre une faction s'il est attaqué. »
 RULE_OPTION_SWE_FASCIST_NEU_ASSERTIVE:"Fasciste - Assertif"
 RULE_OPTION_SWE_FASCIST_NEU_ASSERTIVE_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement exigera des îles baltes à @DENDenmark et @FINFinlande, et exigera le nord de Narvik à @NORNorvège. Sinon, @SWESweden maintiendra une certaine neutralité, mais pourrait rejoindre une faction fasciste si elle se retrouve en guerre. »
 RULE_OPTION_SWE_FASCIST_NEU_EXP:"Fasciste - Expansionniste"
 RULE_OPTION_SWE_FASCIST_NEU_EXP_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement exigera le territoire et l'assujettissement de @NORNorvège, @DENDenmark et @FINFinlande, et tentera ensuite de former le Stornordiska Riket. Sinon, @SWESweden maintiendra une certaine neutralité, mais pourrait rejoindre une faction fasciste si elle se retrouve en guerre. »
 RULE_OPTION_SWE_FASCIST_NEU_ANTI_SOV:"Fasciste - Expansionniste Antisoviétique"
 RULE_OPTION_SWE_FASCIST_NEU_ANTI_SOV_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement exigera le territoire et l'assujettissement de @NORNorvège, @DENDenmark et @FINFinlande, et tentera ensuite de former le Stornordiska Riket. @SWESweden déclarera une croisade anti-bolchevique en 1941 et rejoindra probablement déjà une faction fasciste ou une faction en guerre avec le @SOVUnion soviétique.
 RULE_OPTION_SWE_FASCIST_ALLIES:"Fasciste - Alliés"
 RULE_OPTION_SWE_FASCIST_ALLIES_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement demandera à rejoindre les Alliés vers 1940. »
 RULE_OPTION_SWE_FASCIST_ALLIES_ASSERTIVE:"Fasciste - Alliés affirmés"
 RULE_OPTION_SWE_FASCIST_ALLIES_ASSERTIVE_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement demandera à rejoindre les Alliés et à demander le contrôle des anciens territoires coloniaux de @SWESuède aux @ENG@FRA@USAGrandes puissances démocratiques. L'IA exigera des îles baltes de @DENDenmark et @FINFinland."
 RULE_OPTION_SWE_FASCIST_ALLIES_EXP:"Fasciste - Alliés expansionnistes"
 RULE_OPTION_SWE_FASCIST_ALLIES_EXP_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement demandera à rejoindre les Alliés et à demander le contrôle des anciens territoires coloniaux de @SWESuède aux @ENG@FRA@USAGrandes puissances démocratiques. L'IA exigera du territoire et de l'assujettissement de @DENDenmark et @FINFinland, puis tentera de former det Stornordiska Riket."
 RULE_OPTION_SWE_FASCIST_ALLIES_ANTI_SOV:"Fasciste - Alliés antisoviétiques"
 RULE_OPTION_SWE_FASCIST_ALLIES_ANTI_SOV_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement demandera à rejoindre les Alliés et à demander le contrôle des anciens territoires coloniaux de @SWESuède aux @ENG@FRA@USAGrandes puissances démocratiques. L'IA exigera du territoire et de l'assujettissement de @DENDenmark et @FINFinland, puis tentera de former det Stornordiska Riket. @SWESweden déclarera une croisade anti-bolchevique en 1941, entraînant probablement les puissances alliées dans cette guerre. »
 RULE_OPTION_SWE_FASCIST_FIN:"Fasciste - Défense finlandaise"
 RULE_OPTION_SWE_FASCIST_FIN_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement exigera d'abord Åland de @FINFinland, tout en rejoignant son camp dans la guerre d'hiver. S'ils acceptent, @SWESweden formera avec eux une faction de défense finno-suédoise."
 RULE_OPTION_SWE_FASCIST_FIN_ASSERTIVE:"Fasciste - Défense finlandaise affirmée"
 RULE_OPTION_SWE_FASCIST_FIN_ASSERTIVE_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement exigera d'abord Åland de @FINFinland, tout en rejoignant son camp dans la guerre d'hiver. S’ils acceptent, @SWESweden formera avec eux une faction de défense finno-suédoise. L'IA exigera Bornholm de @DENDenmark et Narvik de @NORNorvège."
 RULE_OPTION_SWE_FASCIST_FIN_ANTI_SOV:"Fasciste - Défense finlandaise agressive"
 RULE_OPTION_SWE_FASCIST_FIN_ANTI_SOV_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont en mesure d'avoir suffisamment de membres au Rikstag pour promulguer l'abrogation des lois anti-milices. Le @SWEle gouvernement suédois succombera alors à une prise de pouvoir fasciste. Le nouveau gouvernement exigera d'abord Åland de @FINFinland, tout en rejoignant son camp dans la guerre d'hiver. S’ils acceptent, @SWESweden formera avec eux une faction de défense finno-suédoise. L'IA exigera du territoire et de l'assujettissement de @DENDenmark et @NORNorway, puis tentera de former det Stornordiska Riket. @SWESuède déclarera une croisade anti-bolchevique en 1941, entraînant @FINFinlande dans une guerre contre eux."
 RULE_OPTION_SWE_FASCIST_PUPPET:"Reichskommissariat fasciste"
 RULE_OPTION_SWE_FASCIST_PUPPET_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont capables de rassembler suffisamment de membres au Rikstag pour promulguer la révocation des lois anti-milices, mais sont incapables de lancer un coup d'État sans le soutien du @GERallemand. S'ils reçoivent ce soutien, ils deviendront une marionnette du @GERallemand et intégreront l'économie @SWEsuédoise dans le grand Reich."
 RULE_OPTION_SWE_FASCIST_PUPPET_NORDLAND:"Fasciste RK Nordland"
 RULE_OPTION_SWE_FASCIST_PUPPET_NORDLAND_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont capables de rassembler suffisamment de membres au Rikstag pour promulguer la révocation des lois anti-milices, mais sont incapables de lancer un coup d'État sans le soutien du @GERallemand. S’ils reçoivent ce soutien, ils deviendront une marionnette du @GERallemand et intégreront l’économie @SWEsuédoise dans le grand Reich. L'IA revendiquera d'autres @NOR@DEN@FIN@ICEÉtats nordiques et gérera tous les territoires du Nord pour le Reich en tant que Reichskommissariat Nordland."
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER:""Le traître fasciste du RK"
 RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER_DESC:"Face aux craintes d'une résurgence de l'influence bolchevique, le §LNSAP§! sont capables de rassembler suffisamment de membres au Rikstag pour promulguer la révocation des lois anti-milices, mais sont incapables de lancer un coup d'État sans le soutien du @GERallemand. S’ils reçoivent ce soutien, ils deviendront une marionnette du @GERallemand et intégreront l’économie @SWEsuédoise dans le grand Reich. L'IA s'efforcera de résister à l'influence du @GERallemand, et finira par déclarer un nouvel ordre, se libérant et déclarant la guerre à ses anciens maîtres.
 RULE_OPTION_SWE_UNALIGNED:"Monarchiste - Neutralité"
 RULE_OPTION_SWE_UNALIGNED_DESC:"Avec les craintes exacerbées d’une résurgence de l’influence bolchevique, §0le roi Gustave V§ ! il réprimera les opportunistes fascistes et assumera le rôle qu’un roi devrait jouer. Le nouveau gouvernement maintiendra sa neutralité dans les affaires mondiales, mais pourra rejoindre une faction s'il est attaqué. »
