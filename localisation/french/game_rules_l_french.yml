 RULE_KOKOOMUS_NORDIC_BALTIC_FIN_AI_DESC:"@FINFinland maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques. @FINFinlande tentera de parvenir à un accord pour fusionner avec @ESTEstonie et faire valoir ses droits sur d'autres @LAT@LITpays baltes. L'IA tentera de créer le Front de défense du Nord et d'inviter tous les autres §Rnon-communistes§ ! @FIN@DEN@NOR@SWEpays nordique dès qu'ils le pourront - une fois que la tension mondiale sera suffisamment élevée."
