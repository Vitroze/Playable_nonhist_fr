 RULE_OPTION_GER_COMMUNIST_STALINIST_EXP_AI_DESC:"L'IA @GERallemande tentera de renverser les nazis et d'amener le §Rcommuniste§ ! révolution en @GERAllemagne. Ils tenteront alors d'instaurer une dictature du prolétariat. L'IA établira des sphères d'influence avec l'@SOVUnion soviétique, et envahira également l'@AUSl'Autriche, pourrait envahir l'@ITAl'Italie et déclenchera des révolutions dans les pays voisins."
 RULE_OPTION_GER_COMMUNIST_SPARTACUS:"Relancer la Ligue Spartacus"
 RULE_OPTION_GER_COMMUNIST_SPARTACUS_AI_DESC:"L'IA @GERallemande tentera de renverser les nazis et d'amener le §Rcommuniste§ ! révolution en @GERAllemagne. Ils tenteront ensuite d’installer un régime socialiste plus démocratique sous la nouvelle Ligue Spartacus et de propager le feu de forêt révolutionnaire communiste dans toute l’Europe. »
 RULE_OPTION_GER_COMMUNIST_SPARTACUS_NEU:"Ligue Spartacus localisée"
 RULE_OPTION_GER_COMMUNIST_SPARTACUS_NEU_AI_DESC:"L'IA @GERallemande tentera de renverser les nazis et d'amener le §Rcommuniste§ ! révolution en @GERAllemagne. Ils tenteront ensuite d'installer un régime socialiste plus démocratique sous la nouvelle Ligue Spartacus, et se contenteront d'envahir l'Autriche et de susciter des révolutions dans les pays européens voisins.
 RULE_OPTION_FUHRER_HITLER:0"Adolf Hitler - Historique"
 RULE_OPTION_FUHRER_HITLER_GER_AI_DESC:0"Adolf Hitler restera Führer du @GERAllemagne et s'assurera la loyauté du cercle restreint. §RCette option nécessite que @GERAllemagne soit§ ! §LFasciste !§!"
