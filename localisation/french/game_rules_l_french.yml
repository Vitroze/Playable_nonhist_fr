 RULE_ALLOW_LEND_LEASE_BLOCKED_TT:0"Règle du jeu : §RLes pays ne peuvent jamais prêter ou louer d'équipement à un autre pays.§!"
 RULE_VOLUNTEERS_BLOCKED_TT:0"Règle du jeu : §RLes pays ne peuvent jamais envoyer de volontaires dans aucun pays.§!"
 RULE_VOLUNTEERS_NOT_ANARCHISTS_TT:0"§RSLes États souverains ne peuvent pas envoyer de volontaires aux anarchistes !§!"
 RULE_VOLUNTEERS_PORTUGAL_SCW_TT:0"§RLe Portugal ne peut pas envoyer de Volontaires dans une faction espagnole qu'il ne soutient pas.§!"
 RULE_VOLUNTEERS_BULGARIA_SCW_TT:0"§La Bulgarie ne peut pas envoyer de volontaires dans une faction espagnole qu'elle ne soutient pas.§!"
 RULE_VOLUNTEERS_SOVIET_CHINA_SUPPORT_CHOSEN_ONE_TT:0"§L'Union Soviétique ne peut pas envoyer de Volontaires dans une usine chinoise qu'elle ne soutient pas.§!"
 RULE_VOLUNTEERS_SOVIET_CHINA_ONLY_ONE_TT:0"§RNous ne pouvons pas envoyer de Volontaires dans plus d'une faction chinoise.§!"
 RULE_VOLUNTEERS_SOVIET_SCW_TT:0"§L'Union Soviétique ne peut pas envoyer de Volontaires dans une faction espagnole qui s'est rebellée contre le gouvernement républicain.§!"
 RULE_VOLUNTEERS_SOVIET_SCW_COVERT_POUM_TT:0"§L'Union soviétique est toujours sous la doctrine stalinienne et ne peut pas envoyer de volontaires dans une faction espagnole qui s'est rebellée contre le gouvernement républicain.§!"
 RULE_VOLUNTEERS_SOVIET_SCW_POUM_TT:0"§La République socialiste soviétique soutient le POEM et ne peut envoyer de volontaires dans aucune autre faction espagnole.§!"
