 RULE_OPTION_DEN_HISTORICAL:0"Social-démocrates - Historique"
 RULE_HISTORICAL_DEN_AI_DESC:"Les sociaux-démocrates @DENdanois resteront au pouvoir et orienteront les dépenses publiques vers la protection sociale. L’IA tentera de maintenir la neutralité. C'est la voie historique."
