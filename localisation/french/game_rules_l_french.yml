 RULE_VOLUNTEERS_SAME_IDEOLOGY_TT:0"Règle du jeu : §RLes pays ne peuvent envoyer des volontaires que dans des pays partageant la même idéologie dirigeante.§!"
 RULE_KICK_FROM_FACTION_BLOCKED_TOOLTIP:0"Règle du jeu : §RLe chef d'une faction ne peut expulser aucun membre de la faction.§!"
 RULE_ASSUME_LEADERSHIP_BLOCKED_TOOLTIP:0"Règle du jeu : §RLes pays ne peuvent pas prendre la direction d'une faction.§!"
 RULE_ALLOW_LEAVE_FACTION_BLOCKED_TOOLTIP:0"Règle du jeu : §RLes pays ne peuvent pas quitter une faction sauf via des focus et des événements nationaux.§!"
 RULE_COUP_BLOCKED_TT:0"Règle du jeu : §RLes pays ne peuvent pas préparer ou exécuter de coups d'État dans aucune nation.§!"
 RULE_COUP_AI_ONLY_TT:0"Règle du jeu : §RLes pays ne peuvent préparer et exécuter des coups d'État que contre des nations non jouées par un humain.§!"
 RULE_BOOST_PARTY_BLOCKED_TT:0"Règle du jeu : §RLes pays ne peuvent augmenter la popularité d'un parti dans aucun pays.§!"
 RULE_BOOST_PARTY_PLAYER_ONLY_TT:0"Règle du jeu : §RLes pays ne peuvent augmenter la popularité des groupes que dans les pays avec un joueur humain.§!"
 RULE_BOOST_PARTY_AI_ONLY_TT:0"Règle du jeu : §RLes pays ne peuvent augmenter la popularité des groupes que dans les pays non joués par un humain.§!"
 RULE_WARGOALS_BLOCKED_TT:0"Règle du jeu : §RLes objectifs de guerre ne peuvent être obtenus qu'à partir d'objectifs, d'événements et de décisions nationaux.§!"
 RULE_ALLOW_LICENSING_BLOCKED_TT:0"Règle du jeu : §RLes pays ne peuvent jamais acquérir de licences de production en dehors de décisions et d'événements spéciaux.§!"
 RULE_ALLOW_LICENSING_SAME_FACTION_TT:0"Règle du jeu : §RLes pays ne peuvent acquérir des licences de production qu'auprès de pays appartenant à la même faction.§!"
 RULE_ALLOW_LICENSING_SAME_IDEOLOGY_TT:0"Règle du jeu : §RLes pays ne peuvent acquérir des licences de production qu'auprès de pays partageant la même idéologie dirigeante.§!"
 RULE_OPTION_DEMOCRATIC_ENG_AI_DESC:0"L'IA @ENGBritish restera §Cdémocratique§ ! et tenter de protéger @POLPologne et de diriger les alliés dans leur guerre défensive contre les @GERAllemands, en empruntant la voie appropriée dans l'arbre des priorités nationales."
 RULE_OPTION_TRADE_UNIONS:0"Communiste - Komintern"
 RULE_OPTION_TRADE_UNIONS_ENG_AI_DESC:0"L'@ENGBritish AI deviendra §Rcommuniste§ ! et rejoignez le Komintern pour lutter contre le fascisme"
 RULE_OPTION_COMMUNIST_COMINTERN_2:0"Communiste - Komintern Anticapitaliste"
 RULE_OPTION_COMMUNIST_COMINTERN_2_ENG_AI_DESC:0"L'@ENGBritish AI deviendra §Rcommuniste§ ! et rejoignez le Komintern pour lutter contre le capitalisme. Dans la plupart des jeux, cela conduit à une guerre en fin de partie avec @USAUSA."
 RULE_OPTION_COMMUNIST_BCA_ENG_AI_DESC:0"L'@ENGBritish AI deviendra §Rcommuniste§!, formera sa propre faction et imposera la décolonisation aux puissances européennes."
 RULE_OPTION_COMMUNIST_BCA_2_ENG_AI_DESC:0"L'@ENGBritish AI deviendra §Rcommuniste§ ! et joignez-vous aux autres puissances communistes d’Europe occidentale (s’il en existe). »
 RULE_OPTION_THE_KINGS_PARTY:0"Renforcez le parti du roi"
 RULE_OPTION_THE_KINGS_PARTY_AXIS:0"Renforcez le parti du roi - Rejoignez l'Axe »
 RULE_OPTION_THE_KINGS_PARTY_ENG_AI_DESC:0"L'@ENGBritish AI tentera de soutenir le mariage du roi Édouard VIII avec Wallis Simpson et de donner du pouvoir au parti du roi, en suivant la voie appropriée dans l'arbre des priorités nationales. »
 RULE_OPTION_THE_KINGS_PARTY_AXIS_ENG_AI_DESC:0"L'@ENGBritish AI tentera de soutenir le mariage du roi Édouard VIII avec Wallis Simpson et de renforcer le parti du roi, puis de rejoindre la faction @GERAllemagne."
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT:0"Plus d'apaisement"
 RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT_ENG_AI_DESC:0"L'@ENGBritish AI tentera de mettre fin à sa politique d'apaisement et de la remplacer par §Cdémocratique§ ! interventionnisme."
 RULE_OPTION_ORGANIZE_THE_BLACKSHIRTS:0"Organisez les chemises noires"
 RULE_OPTION_FASCIST_ANTI_GERMAN:0"Chemises noires anti-allemandes"
 RULE_OPTION_ORGANIZE_THE_BLACKSHIRTS_ENG_AI_DESC:0"L'@ENGBritish AI va tenter d'organiser les §Lblackshirts§ ! et devenez §Lfasciste§!, et tentez de reconquérir l'empire.
 RULE_OPTION_FASCIST_ANTI_GERMAN_ENG_AI_DESC:0"L'@ENGBritish AI va tenter d'organiser les §Lblackshirts§ ! et devenez §Lfasciste§!, finissant par entrer en guerre contre l'@GERAllemagne pour empêcher une hégémonie continentale.
 RULE_OPTION_ENG_NO_DECOLONIZE:0"Pas de décolonisation"
 RULE_OPTION_ENG_NO_DECOLONIZE_NO_CIVILWAR:0"Pas de décolonisation, pas de guerre civile"
 RULE_OPTION_ENG_NO_DECOLONIZE_AI_DESC:0"L'IA @ENGbritannique ne se décolonisera jamais. Cela conduira à une guerre civile si l'IA devient communiste."
 RULE_OPTION_ENG_NO_DECOLONIZE_NO_CIVILWAR_AI_DESC:0"L'IA @ENGBritish ne décolonisera jamais - La guerre civile communiste a été désactivée (cela fonctionne également pour un joueur @ENGBritain)."
 RULE_OPTION_DEMOCRATIC_DECOLONIZE_ENG_AI_DESC:0"L'@ENGBritish AI restera §CDémocratique§! et adoptera une politique de décolonisation."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_HOL_AI_DESC:0"L'IA @HOLDutch tentera de rester neutre dans les affaires mondiales. À la fin de 1939, l'IA choisira une voie basée sur l'influence commerciale de l'@GERAllemagne et de l'@ENGGrande-Bretagne. (l'@ENGBritish AI investit généralement plus que l'@GER German AI)"
 RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY:0"Communiste - Indépendant"
 RULE_OPTION_COMMUNIST_COMINTERN_HOL_AI_DESC:0"L'IA @HOLDutch tentera de faire revivre l'héritage du
 RULE_OPTION_COMMUNIST_WESTERN_HOL_AI_DESC:0"L'IA @HOLDutch tentera de faire revivre l'héritage du
 RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY_HOL_AI_DESC:0"L'IA @HOLDutch tentera de faire revivre l'héritage du
 RULE_OPTION_ORANJE_BOVEN:0"Monarchiste - Rejoignez les alliés"
 RULE_OPTION_ORANJE_BOVEN_HOL_AI_DESC:0"L'IA @HOLDutch tentera de soutenir le monarchisme et de mettre la reine Wilhelmine au pouvoir, puis rejoindra les Alliés pour s'opposer à l'@GERAllemagne."
 RULE_OPTION_ORANJE_BOVEN_2:0"Monarchiste - Wilhelminisme"
 RULE_OPTION_ORANJE_BOVEN_2_HOL_AI_DESC:0"L'IA @HOLDutch tentera de soutenir le monarchisme et de mettre la reine Wilhelmine au pouvoir, puis rejoindra l'@GERAllemagne si elle est monarchiste, ou déclenchera une guerre avec elle si elle ne l'est pas.
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA:0"Démocratique - Déménager à Batavia"
 RULE_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA_HOL_AI_DESC:0"L'@HOLIA néerlandaise restera §Cdémocratique§!, et rejoindra les alliés à la fin des années 1940, si jamais ils capitulent, ils déplaceront leur capitale à Batavia dans les @INSIndes orientales."
 RULE_OPTION_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS:0"Démocratique - Travaux du Zuiderzee"
 RULE_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS_HOL_AI_DESC:0"L'IA @HOLnéerlandaise restera §Cdémocratique§!, et rejoindra les alliés en 1939, elle se concentrera sur la construction du continent et la défense du continent."
 RULE_CAVE_TO_THE_GERMANS_HOL_AI_DESC:0"L'IA @HOLDutch tentera de §Lcéder aux @GERAllemands§ ! dans la guerre commerciale, et les allier une fois devenus §Lfascistes§!, en empruntant la voie pertinente dans l'arbre des priorités nationales.
 RULE_FASCIST_ALTERNATE_HOL_AI_DESC:0"L'IA @HOLDutch tentera de §Lcéder aux @GERAllemands§ ! dans la guerre commerciale, mais rejetez l'Axe, rejoignant à la place soit une autre alliance fasciste européenne, l'alliance de @FRANapoléon ou le parti du roi en @ENGGrande-Bretagne, si l'une d'entre elles existe."
 RULE_OPTION_NETHERLANDS_FIRST:0"Fasciste - Les Pays-Bas d'abord"
 RULE_NETHERLANDS_FIRST_HOL_AI_DESC:0"L'IA @HOLDutch tentera de §Lcéder aux @GERAllemands§ ! dans la guerre commerciale, mais rejettent l'Axe, visant plutôt des ambitions plus élevées dans les Pays-Bas unis et tentant finalement de reprendre les anciennes colonies.
 RULE_OPTION_DEMOCRATIC_BENELUX:0"Démocratique - BeneLux"
 RULE_DEMOCRATIC_BENELUX_HOL_AI_DESC:0"L'IA @HOLDutch tentera de rester §Cdémocratique§ ! et conduire les pays bas vers la création du @BEL@HOL@LUXBenelux"
 RULE_OPTION_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES:0"Démocratique - Union européenne"
 RULE_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES_HOL_AI_DESC:0"L'IA @HOLDutch tentera de rester §Cdémocratique§ ! et diriger les §Cdémocraties§ mineures d'Europe ! dans la création d'une Union européenne."
 RULE_OPTION_SECULAR_REPUBLIC:0"République laïque"
 RULE_OPTION_SECULAR_REPUBLIC_DESC:0"@MEXMexique évoluera vers une laïcité modérée et une §démocratie républicaine§!. L'État de droit sera renforcé au @MEXMexique par Manuel Ávila Camacho après les élections de 1940. C'est la route historique du @MEXMexico."
 RULE_OPTION_SECULAR_REPUBLIC_LEFT:0"République laïque semi-marxiste"
 RULE_OPTION_SECULAR_REPUBLIC_LEFT_DESC:0"@MEXMexique évoluera vers une laïcité totale et une §démocratie républicaine§!. Les syndicats seront renforcés au @MEXMexico par Vicente Lombardo après les élections de 1940, mais le @MEXMexico restera démocratique."
 RULE_OPTION_SECULAR_REPUBLIC_RIGHT:0"République Démocratique"
 RULE_OPTION_SECULAR_REPUBLIC_RIGHT_DESC:0"@MEXMexique tendra vers une influence chrétienne modérée et une §démocratie républicaine§!. La faction de Cedillo sera renforcée au @MEXMexico et Francisco Múgica remportera les élections de 1940. »
 RULE_OPTION_SOCIAL_CATHOLICISM:0"Catholicisme social"
 RULE_OPTION_SOCIAL_CATHOLICISM_DESC:0"Les réformateurs modérés au sein de l'Église catholique créeront un nouveau concordat au sein du @MEXMexique, mettant fin aux conflits sociaux du totalitarisme et introduisant la §CCDémocratie catholique§ ! sous la direction fidèle de Mgr Luis María Martínez"
 RULE_OPTION_LEFT_MODERATES:0"Institutionnalisme de gauche"
 RULE_OPTION_LEFT_MODERATES_DESC:0"@MEXMexique tendra vers une laïcité modérée et préservera les aspects révolutionnaires du PNR, sans pencher pour la démocratie. Les valeurs libérales seront renforcées au @MEXMexico par Francisco Múgica ou Manuel Ávila Camacho, dont l'un remportera les élections de 1940 avec le soutien de Calles.
 RULE_OPTION_SECULAR_MODERATES:0"Institutionnalisme laïc"
 RULE_OPTION_SECULAR_MODERATES_DESC:0"@MEXMexique tendra vers une laïcité modérée et préservera les valeurs sur lesquelles le PNR a été fondé sans pencher vers la démocratie. L'État de droit sera renforcé au @MEXMexique par Lázaro Cárdenas, qui restera au pouvoir avec le soutien de Calles même après les élections de 1940. »
 RULE_OPTION_RIGHT_MODERATES:0"L'institutionnalisme de Calles"
 RULE_OPTION_RIGHT_MODERATES_DESC:0"@MEXMexique tendra vers une laïcité modérée et préservera les aspects nationalistes du PNR, sans pencher pour la démocratie. Le Jefe Máximo et le gouverneur de San Luis Potosí seront renforcés au Mexique et Saturnino Cedillo remportera les élections de 1940 avec le soutien de Calles.
 RULE_OPTION_FASCIST_DICTATORSHIP:0"La dictature de Calles"
 RULE_OPTION_FASCIST_DICTATORSHIP_DESC:0"Plutarco Calles, Saturnino Cedillo et les autres hommes forts militaires feront avorter les tentatives naissantes de démocratie du @MEXMexique et créeront une dictature athée et §LFasciste§ ! sous la direction restaurée du Jefe Máximo ; Plutarque E. Calles."
 RULE_OPTION_FASCIST_JUNTA:0"La junte de Cedillo"
 RULE_OPTION_FASCIST_JUNTA_DESC:0"Plutarco Calles, Saturnino Cedillo et les autres hommes forts militaires feront avorter les tentatives naissantes de démocratie du @MEXMexique et créeront une junte chrétienne et §LFasciste§ ! sous la direction du gouverneur de San Luis Potosí ; Saturnino Cedillo Martínez."
 RULE_OPTION_MEX_FALANGIST:0"Dictature Synarchiste"
 RULE_OPTION_MEX_FALANGIST_DESC:0"Après l'exil de Plutarco Calles et l'arrestation de Cedillo, d'autres hommes forts militaires désormais sous la bannière synarchiste de Salvador Abascal mettront fin aux tentatives naissantes de démocratie du Mexique et créeront une dictature phalangiste.
 RULE_OPTION_THEOCRATIC_ORDER:0"Ordre Théocratique"
 RULE_OPTION_THEOCRATIC_ORDER_DESC:0"Les Synarchistes et les Cristeros prendront le pouvoir au @MEX Mexique sous l'œil vigilant de Jesús Degollado Guízar, créant ainsi un nouvel ordre latino-américain au service de Dieu.
 RULE_OPTION_INSTITUTIONAL_COMMUNISM:0"Le communisme institutionnel"
 RULE_OPTION_INSTITUTIONAL_COMMUNISM_DESC:0"@MEXMexique évoluera vers une laïcité totale et les valeurs révolutionnaires du parti seront portées au §Rcommuniste§ ! se termine. L'État de droit sera renforcé au @MEXMexique grâce à Lázaro Cárdenas, qui restera en fonction après l'annulation des élections de 1940."
 RULE_OPTION_INSTITUTIONAL_COMMUNISM_LEFT:0"Socialisme révolutionnaire"
 RULE_OPTION_INSTITUTIONAL_COMMUNISM_LEFT_DESC:0"@MEXMexique tendra vers une laïcité totale et les valeurs révolutionnaires du parti seront portées au §Rcommuniste§ ! se termine. Les syndicats seront renforcés au @MEXMexico par Vicente Lombardo après les élections de 1940, qui adoptera une position interventionniste dans les affaires mondiales."
 RULE_OPTION_INSTITUTIONAL_COMMUNISM_RIGHT:0"Socialisme chrétien"
 RULE_OPTION_INSTITUTIONAL_COMMUNISM_RIGHT_DESC:0"@MEXMexique tendra vers l'influence chrétienne et les valeurs révolutionnaires du parti seront portées au §Rcommuniste§ ! se termine. Les sociaux-démocrates et les chrétiens-socialistes seront renforcés au @MEXMexique par Francisco Múgica après les élections de 1940."
 RULE_OPTION_SOVIET_REPUBLIC:0"République Soviétique"
 RULE_OPTION_SOVIET_REPUBLIC_DESC:0"@MEXMexique tendra vers une laïcité totale et les valeurs révolutionnaires du parti seront portées au §Rcommuniste§ ! se termine. Les staliniens seront renforcés au Mexique par Dionisio Encina après les élections de 1940, qui adoptera une position interventionniste dans les affaires mondiales et se concentrera sur le renforcement de l'armée révolutionnaire.
 RULE_OPTION_CARDENISMO:0"Cardenisme"
 RULE_OPTION_CARDENISMO_DESC:0"@MEXMexique évoluera vers le §Rcommunisme§ ! jusqu'à ce que le parti soit renversé par une faction trotskyste, Hernán Laborde prendra la tête de cette faction en 1940 ou avant. @MEXMexico se concentrera sur les affaires politiques internes avant d'adopter une position interventionniste dans les affaires mondiales. »
 RULE_OPTION_TROTSKY:0"Le coup d'Etat de Trotsky"
 RULE_OPTION_TROTSKY_DESC:0"@MEXMexique évoluera vers le §Rcommunisme§ ! jusqu'à ce que le parti soit renversé par une faction trotskyste, alors Lev Trotsky lui-même reprendra cette faction en 1940 ou avant UNIQUEMENT s'il a été exilé de @NORNorvège. @MEXMexique se concentrera sur les affaires politiques internes avant d'adopter une position interventionniste dans les affaires mondiales, et tentera de former un grand §Rcommuniste§ ! faction avec des membres partout dans le monde pour affronter le stalinisme. »
 RULE_OPTION_CEDILLO_REBELS:0"Rébellion de Cedillo"
 RULE_OPTION_CEDILLO_REBELS_DESC:0"Saturnino Cedillo Martínez et les autres hommes forts militaires organiseront et lanceront une rébellion contre Cárdenas, avec le soutien de Plutarco E. Calles, et créeront une §LFJunte fasciste§ ! après une guerre civile contre le parti.
 RULE_OPTION_FP_NEUTRAL_DESC:0"@MEXMexico restera neutre dans les affaires mondiales et ne s'alignera sur aucune faction, ni ne créera sa propre faction, à moins qu'ils ne s'impliquent dans une guerre.
 RULE_OPTION_FP_USA:0"Alignez-vous sur les @USAUSA"
 RULE_OPTION_FP_USA_DESC:0"@MEXMexico alignera sa politique étrangère sur celle des @USAUnited States et tentera de rejoindre n'importe quelle faction dont il fait partie. C'est un comportement historique."
 RULE_OPTION_FP_ENG:0"Alignez-vous sur le @ENGUK"
 RULE_OPTION_FP_ENG_DESC:0"@MEXMexico alignera sa politique étrangère sur celle du @ENGRoyaume-Uni et tentera de rejoindre n'importe quelle faction dont il fait partie.
 RULE_OPTION_FP_GER:0"Alignez-vous avec @GERAllemagne"
 RULE_OPTION_FP_GER_DESC:0"@MEXMexico alignera sa politique étrangère sur @GERAllemagne et tentera de rejoindre n'importe quelle faction dont il fait partie.
 RULE_OPTION_FP_SOV:0"Alignez-vous sur le @SOVUSSR"
 RULE_OPTION_FP_SOV_DESC:0"Le @MEXMexique alignera sa politique étrangère sur celle du @SOVUnion soviétique et tentera de rejoindre n'importe quelle faction dont il fait partie. »
 RULE_OPTION_FP_HISPANIC:0"Alliance hispanique"
 RULE_OPTION_FP_HISPANIC_DESC:0"@MEXMexique tentera de créer sa propre faction avec §Lfasciste §!et §gnon-aligné§ ! puissances en Amérique latine.§Y Nécessite que @MEXMexique soit§! §Lfasciste§! §Votre§ ! §gnon-aligné§!"
 RULE_OPTION_FP_BOLIVARIAN:0"Alliance bolivarienne"
 RULE_OPTION_FP_BOLIVARIAN_DESC:0"@MEXMexico tentera de créer sa propre faction avec §Rcommuniste§ ! et §gnon-aligné§! puissances en Amérique latine. §YNécessite que @MEXMexico soit soit§ ! §Rcommuniste§! §Votre§ ! §gnon-aligné§!"
 RULE_OPTION_EXPANSION:0"Marche vers le sud"
 RULE_OPTION_EXPANSION_DESC:0"@MEXMexico commencera à s'étendre vers le sud, vers l'Amérique centrale et l'Amérique du Sud. L'IA pourrait tenter d'attaquer les États-Unis à un moment donné si tout se passe bien. §YNécessite un alignement @GERallemand ou @SOVsoviétique, ou la création de l'Alliance hispanique ou bolivarienne.§!"
 RULE_OPTION_NO_EXPANSION:0"Pas d'extension"
 RULE_OPTION_NO_EXPANSION_DESC:0"L’IA n’attaquera pas ses voisins, même si elle en a l’opportunité. »
