 RULE_OPTION_SANATION_LEFT_INTERMARIUM:0"Sanation Gauche - Intermarium"
 RULE_OPTION_SANATION_LEFT_INTERMARIUM_POL_AI_DESC:0"L'@POLAI polonaise consolidera le gouvernement de l'assainissement sous la direction du président de gauche Walery Sławek. L'IA tentera de former une alliance avec les @LIT@LAT@ESTÉtats baltes et d'étendre son adhésion au plus grand nombre de pays européens possible."
 RULE_OPTION_SANATION_RIGHT_ALLIES:0"Droit à l'assainissement - Alliés"
 RULE_OPTION_SANATION_RIGHT_ALLIES_POL_AI_DESC:0"L'@POLPolish AI consolidera le gouvernement de l'assainissement sous la présidence de droite, Edward Rydz-Śmigły. L’IA tentera de rejoindre les alliés (si la tension mondiale est suffisamment élevée) et exigera l’annexion de la Lituanie. »
 RULE_OPTION_SANATION_RIGHT_OZON:0"Droit à l'assainissement - Revanchisme"
