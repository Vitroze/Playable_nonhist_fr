 RULE_DEMOCRATIC_BALANCE_DEN_AI_DESC:0"Le @DEN§CLibéral danois§ ! gagnera les élections après un vote de censure et orientera les dépenses publiques vers un équilibre entre l'aide sociale et l'armée. L’IA tentera de maintenir sa neutralité. »
