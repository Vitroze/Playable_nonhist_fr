  RULE_ARROW_CROSS_MOVEMENT_ROME_HUN_AI_DESC: "L'IA @HUNHongroise tentera d'établir un régime absolu sous le §LMouvement des Croix fléchées§!, en renouvelant les Protocoles de Rome avec l'@ITAItalie. La @HUNHongrie ne fera aucune demande territoriale à ses voisins, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne ou de l'@ITAItalie."
  RULE_ARROW_CROSS_MOVEMENT_ROME_EXP_HUN_AI_DESC: "L'IA @HUNHongroise tentera d'établir un régime absolu sous le §LMouvement des Croix fléchées§!, en renouvelant les Protocoles de Rome avec l'@ITAItalie. La @HUNHongrie attendra jusqu'aux années 1940 pour demander des territoires mineurs à ses voisins @CZE@ROM@YUG@AUS, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne ou de l'@ITAItalie."
  RULE_ARROW_CROSS_MOVEMENT_ROME_ANTI_COMMUNIST_HUN_AI_DESC: "L'IA @HUNHongroise tentera d'établir un régime absolu sous le §LMouvement des Croix fléchées§!, en renouvelant les Protocoles de Rome avec l'@ITAItalie. La @HUNHongrie attendra jusqu'aux années 1940 pour demander des territoires mineurs à ses voisins @CZE@ROM@YUG@AUS, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne ou de l'@ITAItalie. L'IA essaiera également de revendiquer les anciennes terres magyares comme les siennes, et commencera une nouvelle croisade contre les méfaits du communisme athée @SOV."
  RULE_FASCIST_ALTERNATE_KING_HUN_AI_DESC: "L'IA @HUNHongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§! Friedrich Franz de Mecklembourg-Schwerin comme roi, mais n'essayera pas de rejoindre une faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple, si elles sont toutes les deux en guerre). La @HUNHongrie ne fera aucune demande territoriale à ses voisins, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne."
  RULE_FASCIST_ALTERNATE_KING_ALT_HUN_AI_DESC: "L'IA @HUNHongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§! Friedrich Franz de Mecklembourg-Schwerin comme roi, mais n'essayera pas de rejoindre une faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple, si elles sont toutes les deux en guerre). La @HUNHongrie attendra jusqu'à ce qu'elle ait une armée suffisamment importante pour demander des territoires mineurs à ses voisins @CZE@ROM@YUG@AUS, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne."
  RULE_FASCIST_ALTERNATE_KING_AXIS_HUN_AI_DESC: "L'IA @HUNHongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§! Friedrich Franz de Mecklembourg-Schwerin comme roi, et tentera de rejoindre l'Axe. La @HUNHongrie ne fera aucune demande territoriale à ses voisins, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne."
  RULE_FASCIST_ALTERNATE_KING_AXIS_ALT_HUN_AI_DESC: "L'IA @HUNHongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§! Friedrich Franz de Mecklembourg-Schwerin comme roi, et tentera de rejoindre l'Axe. La @HUNHongrie attendra jusqu'à ce qu'elle ait une armée suffisamment importante pour demander des territoires mineurs à ses voisins @CZE@ROM@YUG@AUS, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne."
  RULE_FASCIST_ALTERNATE_KING_ROME_HUN_AI_DESC: "L'IA @HUNHongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§! Friedrich Franz de Mecklembourg-Schwerin comme roi, en renouvelant les Protocoles de Rome avec l'@ITAItalie. La @HUNHongrie ne fera aucune demande territoriale à ses voisins, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne ou de l'@ITAItalie."
  RULE_FASCIST_ALTERNATE_KING_ROME_ALT_HUN_AI_DESC: "L'IA @HUNHongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§! Friedrich Franz de Mecklembourg-Schwerin comme roi, en renouvelant les Protocoles de Rome avec l'@ITAItalie. La @HUNHongrie attendra jusqu'à ce qu'elle ait une armée suffisamment importante pour demander des territoires mineurs à ses voisins @CZE@ROM@YUG@AUS, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne ou de l'@ITAItalie."
  RULE_HORTHYIST_KING_HUNGARY_HUN_AI_DESC: "L'IA @HUNHongroise couronnera Miklós Horthy comme roi de Hongrie, respectant techniquement les stipulations de la Petite Entente. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant d'essayer d'établir un plus grand Royaume de Hongrie en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM@AUS dans les années 1940."
  RULE_HORTHYIST_KING_HUNGARY_FAST_HUN_AI_DESC: "L'IA @HUNHongroise couronnera Miklós Horthy comme roi de Hongrie, respectant techniquement les stipulations de la Petite Entente. L'IA tentera ensuite d'établir un plus grand Royaume de Hongrie en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM@AUS dès qu'elle le pourra, prête ou non."
  RULE_HORTHYIST_KING_HUNGARY_ANTI_COMMUNIST_HUN_AI_DESC: "L'IA @HUNHongroise couronnera Miklós Horthy comme roi de Hongrie, respectant techniquement les stipulations de la Petite Entente. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant d'essayer d'établir un plus grand Royaume de Hongrie en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM@AUS dans les années 1940, et attaquera directement les principaux régimes communistes et voisins dans le monde en fin de partie."
  RULE_HORTHYIST_KING_HUNGARY_ALT_HUN_AI_DESC: "L'IA @HUNHongroise couronnera Miklós Horthy comme roi de Hongrie, respectant techniquement les stipulations de la Petite Entente. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant d'essayer d'établir un plus grand Royaume de Hongrie en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM@AUS dans les années 1940, et tentera de former un Royaume apostolique en attaquant d'autres nations @YUG@ROM@CZE@AUS@POL@GRE@TUR voisines et @SOV@ENG@FRA impériales pour des revendications magyares anciennes."
  RULE_HORTHYIST_KING_HUNGARY_ALLIES_HUN_AI_DESC: "L'IA @HUNHongroise couronnera István Horthy comme roi de Hongrie, respectant techniquement les stipulations de la Petite Entente. L'IA construira ensuite son industrie et son armée tout en tentant de rejoindre les @ENGAnglais dans une alliance, avant d'essayer d'établir un plus grand Royaume de Hongrie en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM@AUS dans les années 1940."
  RULE_HORTHYIST_KING_HUNGARY_ALLIES_FAST_HUN_AI_DESC: "L'IA @HUNHongroise couronnera István Horthy comme roi de Hongrie, respectant techniquement les stipulations de la Petite Entente. L'IA tentera de rejoindre les @ENGAnglais dans une alliance, tout en essayant d'établir un plus grand Royaume de Hongrie en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM@AUS dès qu'elle le pourra, prête ou non."
  RULE_HORTHYIST_KING_HUNGARY_ALLIES_ANTI_COMMUNISM_HUN_AI_DESC: "L'IA @HUNHongroise couronnera István Horthy comme roi de Hongrie, respectant techniquement les stipulations de la Petite Entente. L'IA construira ensuite son industrie et son armée tout en tentant de rejoindre les @ENGAnglais dans une alliance, avant d'essayer d'établir un plus grand Royaume de Hongrie en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM@AUS dans les années 1940, et attaquera directement les principaux régimes §Rcommunistes§! et voisins dans le monde en fin de partie."
  RULE_OPTION_DEMOCRATIC_HUN_AI_DESC: "L'IA @HUNHongroise tentera de devenir une monarchie constitutionnelle en suivant la voie pertinente dans l'arbre de focus national, en élisant le §Cdémocratique§! sympathisant Carl V Wilhelm comme son nouveau Roi apostolique. Cette IA restera généralement neutre dans les affaires mondiales."
  RULE_OPTION_DEMOCRATIC_ALLIES_HUN_AI_DESC: "L'IA @HUNHongroise tentera de devenir une monarchie constitutionnelle en suivant la voie pertinente dans l'arbre de focus national, en élisant le §Cdémocratique§! sympathisant Carl V Wilhelm comme son nouveau Roi apostolique. La @HUNHongrie tentera de rejoindre les Alliés avant 1939."
  RULE_OPTION_DEMOCRATIC_BALKAN_HUN_AI_DESC: "L'IA @HUNHongroise tentera de devenir une monarchie constitutionnelle en suivant la voie pertinente dans l'arbre de focus national, en élisant le §Cdémocratique§! sympathisant Carl V Wilhelm comme son nouveau Roi apostolique. La @HUNHongrie tentera de créer une alliance et une union avec la @ROMRoumanie, avec l'option d'inviter d'autres pays @CZE@YUG@AUS@BUL@GRE@BALBalkaniques."
  RULE_OPTION_AUSTRIA_HUNGARY_HUN_AI_DESC: "L'IA @HUNHongroise restaurera la domination des Habsbourg sur la nation, en sélectionnant Otto von Habsbourg comme leur dirigeant s'il est disponible. La @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et tentera de recréer les Puissances centrales avec l'@GERAllemagne. L'IA pourrait exiger des terres @CROCroates de la @YUGYougoslavie, et la @TRATransylvanie de la @ROMRoumanie."
  RULE_OPTION_AUSTRIA_HUNGARY_CP_AGGR_HUN_AI_DESC: "L'IA @HUNHongroise restaurera la domination des Habsbourg sur la nation, en sélectionnant Otto von Habsbourg comme leur dirigeant s'il est disponible. La @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et tentera de recréer les Puissances centrales avec l'@GERAllemagne. L'IA exigera des terres @CROCroates de la @YUGYougoslavie, la @TRATransylvanie de la @ROMRoumanie, et la @UKRGalicie de la @POLPologne, et tentera de restaurer pleinement l'@AUS@HUNAutriche-Hongrie."
  RULE_OPTION_AUSTRIA_HUNGARY_ALLIES_HUN_AI_DESC: "L'IA @HUNHongroise restaurera la domination des Habsbourg sur la nation, en sélectionnant Otto von Habsbourg comme leur dirigeant s'il est disponible. La @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et tentera de recréer la Grande Alliance avec le @ENGRoyaume-Uni. L'IA pourrait exiger des terres @CROCroates de la @YUGYougoslavie, et la @TRATransylvanie de la @ROMRoumanie."
  RULE_OPTION_AUSTRIA_HUNGARY_ALLIES_AGGR_HUN_AI_DESC: "L'IA @HUNHongroise restaurera la domination des Habsbourg sur la nation, en sélectionnant Otto von Habsbourg comme leur dirigeant s'il est disponible. La @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et tentera de recréer la Grande Alliance avec le @ENGRoyaume-Uni. L'IA exigera des terres @CROCroates de la @YUGYougoslavie, la @TRATransylvanie de la @ROMRoumanie, et la @UKRGalicie de la @POLPologne, et tentera de restaurer pleinement l'@AUS@HUNAutriche-Hongrie."
  RULE_OPTION_AUSTRIA_HUNGARY_HB_HUN_AI_DESC: "L'IA @HUNHongroise restaurera la domination des Habsbourg sur la nation, en sélectionnant Otto von Habsbourg comme leur dirigeant s'il est disponible. La @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et créera une alliance royaliste avec leurs nations sujettes pour exiger que la @POLPologne et la @UKRUkraine rétablissent la domination des Habsbourg, si l'@AUS@HUNAutriche-Hongrie contrôle ce territoire. L'IA pourrait exiger des terres @CROCroates de la @YUGYougoslavie, et la @TRATransylvanie de la @ROMRoumanie."
  RULE_OPTION_AUSTRIA_HUNGARY_HB_AGGR_HUN_AI_DESC: "L'IA @HUNHongroise restaurera la domination des Habsbourg sur la nation, en sélectionnant Otto von Habsbourg comme leur dirigeant s'il est disponible. La @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et créera une alliance royaliste avec leurs nations sujettes pour exiger que d'autres nations rétablissent la domination des Habsbourg. L'IA exigera des terres @CROCroates de la @YUGYougoslavie, la @TRATransylvanie de la @ROMRoumanie, la @UKRGalicie de la @POLPologne, et tentera de restaurer pleinement l'@AUS@HUNAutriche-Hongrie."
  RULE_OPTION_AUSTRIA_HUNGARY_NEU_AGGR_HUN_AI_DESC: "L'IA @HUNHongroise restaurera la domination des Habsbourg sur la nation, en sélectionnant Otto von Habsbourg comme leur dirigeant s'il est disponible. La @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, mais ne créera pas sa propre faction, ni ne tentera de rejoindre les Puissances centrales ou les Alliés. L'IA exigera des terres @CROCroates de la @YUGYougoslavie, la @TRATransylvanie de la @ROMRoumanie, la @UKRGalicie de la @POLPologne, et tentera de restaurer pleinement l'@AUS@HUNAutriche-Hongrie."
  RULE_HABSBURG_HUNGARY_HUN_AI_DESC: "L'IA @HUNHongroise élira Joseph August von Habsbourg comme son roi. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant d'essayer de restaurer la Grande Hongrie sous la domination des Habsbourg en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM dans les années 1940."
  RULE_HABSBURG_HUNGARY_FAST_HUN_AI_DESC: "L'IA @HUNHongroise élira Joseph August von Habsbourg comme son roi. L'IA tentera ensuite de restaurer la Grande Hongrie sous la domination des Habsbourg en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM dès qu'elle le pourra, prête ou non."
  RULE_HABSBURG_HUNGARY_ANTI_COMMUNIST_HUN_AI_DESC: "L'IA @HUNHongroise élira Joseph August von Habsbourg comme son roi. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant d'essayer de restaurer la Grande Hongrie sous la domination des Habsbourg en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM dans les années 1940, et attaquera directement les principaux régimes §Rcommunistes§! et voisins dans le monde en fin de partie."
  RULE_HABSBURG_HUNGARY_ALT_HUN_AI_DESC: "L'IA @HUNHongroise élira Joseph August von Habsbourg comme son roi. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant d'essayer de restaurer la Grande Hongrie sous la domination des Habsbourg en s'emparant de territoires de ses voisins directs @YUG@CZE@ROM dans les années 1940, et tentera de former un Royaume apostolique en attaquant d'autres nations @YUG@ROM@CZE@AUS@POL@GRE@TUR voisines et @SOV@ENG@FRA impériales pour des revendications magyares anciennes."
  RULE_REPUBLICAN_DEMOCRACY_HUN_AI_DESC: "L'IA @HUNHongroise s'opposera à Horthy, et tentera d'amener la §Cdémocratie§! à la nation par une révolution, en établissant la Deuxième République et en formant la Fédération danubienne avec d'autres nations @CZE@YUG@AUS@BUL@GRE@ROMBalkaniques, l'IA ne demandera pas l'autonomie de la @TRASzékely de la @ROMRoumanie."
  RULE_REPUBLICAN_DEMOCRACY_NEU_HUN_AI_DESC: "L'IA @HUNHongroise s'opposera à Horthy, et tentera d'amener la §Cdémocratie§! à la nation par une révolution, en établissant la Deuxième République hongroise. L'IA ne fera aucune demande à ses voisins ni ne formera une faction propre."
  RULE_REPUBLICAN_DEMOCRACY_AGGR_HUN_AI_DESC: "L'IA @HUNHongroise s'opposera à Horthy, et tentera d'amener la §Cdémocratie§! à la nation par une révolution, en établissant la Deuxième République et en formant la Fédération danubienne avec d'autres nations @CZE@YUG@AUS@BUL@GRE@ROMBalkaniques, l'IA demandera l'autonomie de la @TRASzékely de la @ROMRoumanie, et poursuivra l'expansion de sa faction de manière plus agressive."
  RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_FAST_HUN_AI_DESC: "L'IA @HUNHongroise s'opposera à Horthy, et tentera d'amener la §Cdémocratie§! à la nation par une révolution, en établissant la Deuxième République et en embrassant le Mouvement du Dragon. L'IA commencera à attaquer ses voisins dès que possible dans une tentative de restaurer la Grande Hongrie."
  RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_HUN_AI_DESC: "L'IA @HUNHongroise s'opposera à Horthy, et tentera d'amener la §Cdémocratie§! à la nation par une révolution, en établissant la Deuxième République et en embrassant le Mouvement du Dragon. L'IA commencera à attaquer ses voisins dans les années 1940 dans une tentative de restaurer la Grande Hongrie."
  RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_AGGR_HUN_AI_DESC: "L'IA @HUNHongroise s'opposera à Horthy, et tentera d'amener la §Cdémocratie§! à la nation par une révolution, en établissant la Deuxième République et en embrassant le Mouvement du Dragon. L'IA commencera à attaquer ses voisins dès que possible dans une tentative de restaurer la Grande Hongrie. L'IA commencera également à attaquer chaque pays européen majeur §Ynon démocratique§! après cela."
  RULE_OPTION_COMMUNIST_HUN_AI_DESC: "L'IA @HUNHongroise s'opposera à Horthy, et tentera de provoquer une révolution §Rcommuniste§! dirigée par Mátyás Rákosi, qui tentera de rejoindre le Komintern. Cette IA n'attaquera pas ses voisins."
  RULE_OPTION_COMMUNIST_AGGR_HUN_AI_DESC: "L'IA @HUNHongroise s'opposera à Horthy, et tentera de provoquer une révolution §Rcommuniste§! dirigée par Mátyás Rákosi, qui tentera de rejoindre le Komintern. Cette IA mettra la pression sur l'@SOVUnion soviétique pour diviser la @ROMRoumanie et attaquera plus tard la @CZETchécoslovaquie au sujet des revendications de la @HUNHongrie."
  RULE_RESTORE_THE_SOCIALIST_REPUBLIC_HUN_AI_DESC: "L'IA @HUNHongroise s'opposera à Horthy, et tentera de provoquer une révolution socialiste dirigée par Béla Kun, restaurant la République fédérative socialiste. La @HUNHongrie embrassera le revanchisme et attaquera ses voisins @CZE@ROM@YUG pour leurs revendications nécessaires pour amener un État de la Grande Hongrie rouge, et peut-être même un État des Balkans unis."
  RULE_RESTORE_THE_SOCIALIST_REPUBLIC_NEU_HUN_AI_DESC: "L'IA @HUNHongroise s'opposera à Horthy, et tentera de provoquer une révolution socialiste dirigée par Béla Kun, restaurant la République fédérative socialiste. La @HUNHongrie rejettera le revanchisme et essaiera de rester neutre dans les affaires mondiales."
