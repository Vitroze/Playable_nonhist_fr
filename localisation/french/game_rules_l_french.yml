  RULE_OPTION_GER_COMMUNIST_STALINIST: "Dictature prolétarienne - Neutre"
  RULE_OPTION_GER_COMMUNIST_STALINIST_AI_DESC: "L'IA @GERAllemande tentera de renverser les nazis, et d'amener la révolution §Rcommuniste§! en @GERAllemagne. Elle tentera ensuite d'établir une dictature du prolétariat. L'IA ne mettra pas en place des sphères d'influence avec l'@SOVUnion soviétique, ni ne déclenchera de révolutions dans les pays voisins."
  RULE_OPTION_GER_COMMUNIST_STALINIST_SPHERES: "Dictature prolétarienne - Sphères d'influence"
  RULE_OPTION_GER_COMMUNIST_STALINIST_SPHERES_AI_DESC: "L'IA @GERAllemande tentera de renverser les nazis, et d'amener la révolution §Rcommuniste§! en @GERAllemagne. Elle tentera ensuite d'établir une dictature du prolétariat. L'IA mettra en place des sphères d'influence avec l'@SOVUnion soviétique, mais ne déclenchera pas de révolutions dans les pays voisins."
  RULE_OPTION_GER_COMMUNIST_STALINIST_EXP: "Dictature prolétarienne - Déclencher des révolutions"
  RULE_OPTION_GER_COMMUNIST_STALINIST_EXP_AI_DESC: "L'IA @GERAllemande tentera de renverser les nazis, et d'amener la révolution §Rcommuniste§! en @GERAllemagne. Elle tentera ensuite d'établir une dictature du prolétariat. L'IA mettra en place des sphères d'influence avec l'@SOVUnion soviétique, et envahira également l'@AUSAutriche, pourrait envahir l'@ITAItalie et déclenchera des révolutions dans les pays voisins."
  RULE_OPTION_GER_COMMUNIST_SPARTACUS: "Ressusciter la Ligue spartakiste"
  RULE_OPTION_GER_COMMUNIST_SPARTACUS_AI_DESC: "L'IA @GERAllemande tentera de renverser les nazis, et d'amener la révolution §Rcommuniste§! en @GERAllemagne. Elle tentera ensuite d'installer un régime socialiste plus démocratique sous la nouvelle Ligue spartakiste, et de propager l'incendie révolutionnaire communiste à travers l'Europe."
  RULE_OPTION_GER_COMMUNIST_SPARTACUS_NEU: "Ligue spartakiste localisée"
  RULE_OPTION_GER_COMMUNIST_SPARTACUS_NEU_AI_DESC: "L'IA @GERAllemande tentera de renverser les nazis, et d'amener la révolution §Rcommuniste§! en @GERAllemagne. Elle tentera ensuite d'installer un régime socialiste plus démocratique sous la nouvelle Ligue spartakiste, et n'envahira que l'@AUSAutriche, et instiguera des révolutions dans les pays européens voisins."
  RULE_OPTION_FUHRER_HITLER:0 "Adolf Hitler - Historique"
  RULE_OPTION_FUHRER_HITLER_GER_AI_DESC:0 "Adolf Hitler restera Führer de l'@GERAllemagne, et sécurisera la loyauté du cercle intérieur. §RCette option nécessite que l'@GERAllemagne soit§! §LFasciste!§!"
  RULE_OPTION_FUHRER_TODT:0 "Fritz Todt - Reichsingenieur"
  RULE_OPTION_FUHRER_TODT_GER_AI_DESC:0 "Fritz Todt remplacera Hitler en tant que Führer de l'@GERAllemagne. §RCette option nécessite que l'@GERAllemagne soit§! §LFasciste!§!"
  RULE_OPTION_FUHRER_SPEER:0 "Albert Speer - Reichsarchitekt"
  RULE_OPTION_FUHRER_SPEER_GER_AI_DESC:0 "Albert Speer remplacera Hitler en tant que Führer de l'@GERAllemagne. §RCette option nécessite que l'@GERAllemagne soit§! §LFasciste!§!"
  RULE_OPTION_FUHRER_GORING:0 "Hermann Göring - Reichsmarschall"
  RULE_OPTION_FUHRER_GORING_GER_AI_DESC:0 "Hermann Göring remplacera Hitler en tant que Führer de l'@GERAllemagne. §RCette option nécessite que l'@GERAllemagne soit§! §LFasciste!§!"
  RULE_OPTION_FUHRER_HIMMLER:0 "Heinrich Himmler - Reichsführer-SS"
  RULE_OPTION_FUHRER_HIMMLER_GER_AI_DESC:0 "Heinrich Himmler remplacera Hitler en tant que Führer de l'@GERAllemagne. §RCette option nécessite que l'@GERAllemagne soit§! §LFasciste!§!"
  RULE_OPTION_FUHRER_GOEBBELS:0 "Joseph Goebbels - Reichsleiter"
  RULE_OPTION_FUHRER_GOEBBELS_GER_AI_DESC:0 "Joseph Goebbels remplacera Hitler en tant que Führer de l'@GERAllemagne. §RCette option nécessite que l'@GERAllemagne soit§! §LFasciste!§!"
  RULE_OPTION_FUHRER_HESS:0 "Rudolf Hess - Parteikanzler"
  RULE_OPTION_FUHRER_HESS_GER_AI_DESC:0 "Rudolf Hess remplacera Hitler en tant que Führer de l'@GERAllemagne. §RCette option nécessite que l'@GERAllemagne soit§! §LFasciste!§!"
  RULE_OPTION_FUHRER_BORMANN:0 "Martin Bormann - Reichsminister"
  RULE_OPTION_FUHRER_BORMANN_GER_AI_DESC:0 "Martin Bormann remplacera Hitler en tant que Führer de l'@GERAllemagne. §RCette option nécessite que l'@GERAllemagne soit§! §LFasciste!§!"
  RULE_OPTION_GER_ALT_FASCIST: "Fasciste - Préoccupations de Neurath"
  RULE_OPTION_GER_ALT_FASCIST_AI_DESC: "L'IA @GERAllemande §Ltiendra compte des préoccupations de Von Neurath§!, renonçant au pacte Molotov-Ribbentrop. L'IA envahira également la @SWISuisse et l'@IREIrlande ainsi que les cibles historiques @CZE@POL@HOL@BEL@NOR@DEN et se liera d'amitié avec la @CHIChine au lieu du @JAPJapon."
  RULE_OPTION_GER_ALT_FASCIST_WW: "Fasciste - Technocratique"
  RULE_OPTION_GER_ALT_FASCIST_WW_AI_DESC: "L'IA @GERAllemande suivra principalement la §Lvoie historique§!, mais abandonnera les factures MEFO pour prioriser la croissance économique, se concentrera sur les bonus de recherche et développera des armes miracles, ce qui entraînera un ralentissement des focus politiques. L'IA tentera d'annexer à la fois la @CZETchécoslovaquie et la @YUGYougoslavie avant de déclarer la guerre à la @POLPologne et tentera de s'allier à la fois avec l'@ITAItalie et l'@SPREspagne."
  RULE_OPTION_GER_ALT_FASCIST_FRIENDLY: "Fasciste - Diplomatique"
  RULE_OPTION_GER_ALT_FASCIST_FRIENDLY_AI_DESC: "L'IA @GERAllemande §Ltiendra compte des préoccupations de Von Neurath§!, et abandonnera les factures MEFO pour prioriser la croissance économique. L'IA prendra chaque focus pour améliorer le commerce, les relations diplomatiques et d'alliance avec d'autres nations. L'@GERAllemagne commercera la @POLDantzig pour la @SLOSlovaquie après avoir intégré la @CZETchécoslovaquie, tentera d'influencer les @HOL@BEL@LUXBenelux, les @DEN@NOR@SWENordiques, et les @LIT@LAT@ESTBaltes, ainsi que le @JAPJapon, l'@ITAItalie, l'@SPREspagne, le @PORPortugal et la @TURTurquie. L'IA pourrait ne pas réussir à influencer tout le monde, et déclarera quand même la guerre à la @FRAFrance et aux @SOVSoviétiques."
  RULE_OPTION_GER_ALT_FASCIST_BLITZKRIEG:0 "Fasciste - Vrai Blitzkrieg"
  RULE_OPTION_GER_ALT_FASCIST_BLITZKRIEG_AI_DESC:0 "L'IA @GERAllemande suivra principalement la §Lvoie historique§!, mais se dépêchera de déclarer la guerre à la @POLPologne au sujet de Dantzig un an plus tôt, en 1938, l'IA fera également la guerre tôt contre l'@SOVUnion soviétique."
  RULE_OPTION_GER_ALT_FASCIST_EXP: "Fasciste - Irrédentisme belliqueux"
  RULE_OPTION_GER_ALT_FASCIST_EXP_AI_DESC: "L'IA @GERAllemande §Ltiendra compte des préoccupations de Von Neurath§!, renonçant au pacte Molotov-Ribbentrop. L'IA prendra chaque focus pour envahir et faire des demandes à ces nations : @CZE@YUG@POL@HOL@BEL@LUX@DEN@NOR@FRA@ITA@SPR@POR@SWI@SWE@FIN@GRE@ENG@IRE@USA"
