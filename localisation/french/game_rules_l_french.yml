  RULE_OPTION_FIN_COMMUNIST_ANTISOV_NORDIC_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! commencera à s'opposer à l'@SOVUnion soviétique, et pourrait obtenir une garantie d'une @ENG@FRApuissance majeure, et créera une faction de Défense nordique avec d'autres pays @SWE@NOR@DEN@ICENordiques §CDémocratiques§! et §RCommunistes§! en 1939."
  RULE_OPTION_FIN_COMMUNIST_ANTISOV_NORDIC_BALTIC_PLAN: "Communiste nordique - Gardien des Baltes"
  RULE_OPTION_FIN_COMMUNIST_ANTISOV_NORDIC_BALTIC_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! commencera à s'opposer à l'@SOVUnion soviétique, et pourrait obtenir une garantie d'une @ENG@FRApuissance majeure, et créera une faction de Défense nordique avec d'autres pays @SWE@NOR@DEN@ICENordiques §CDémocratiques§! et §RCommunistes§! en 1939. L'IA tentera d'influencer et de transformer en État fantoche les États @EST@LIT@LATBaltes."
  RULE_OPTION_FIN_COMMUNIST_FINNO_RUSSIAN_PLAN: "République socialiste finno-russe"
  RULE_OPTION_FIN_COMMUNIST_FINNO_RUSSIAN_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! commencera à s'opposer à l'@SOVUnion soviétique, et pourrait obtenir une garantie d'une @ENG@FRApuissance majeure, et créera une faction de Défense nordique avec d'autres pays @SWE@NOR@DEN@ICENordiques §CDémocratiques§! et §RCommunistes§! en 1939. L'IA tentera d'influencer et de transformer en État fantoche les États @EST@LIT@LATBaltes. La @FINFinlande déclarera les républiques socialistes finno-russes confédérées et tentera de renverser le régime @SOVSoviétique en 1941."
  RULE_OPTION_FIN_DEMOCRATIC_PLAN: "Neutralité démocratique"
  RULE_OPTION_FIN_DEMOCRATIC_PLAN_DESC: "Les @FINFinlandais §CSociaux-démocrates§! feront appel au peuple finlandais et mèneront un changement drastique mais sans effusion de sang dans le cours de la politique finlandaise. Le nouveau gouvernement socialiste commencera à s'opposer à l'@SOVUnion soviétique, et pourrait obtenir une garantie d'une @ENG@FRApuissance majeure mais restera sinon neutre dans les affaires mondiales."
  RULE_OPTION_FIN_DEMOCRATIC_ALLIES: "Démocratique Alliés"
