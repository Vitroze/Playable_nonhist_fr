  RULE_OPTION_FIN_FASCIST_NORDIC: "Fascistes élus - Ligue de Suprématie"
  RULE_OPTION_FIN_FASCIST_NORDIC_DESC: "La droite @FINFinlandaise, dirigée par le §LMouvement populaire patriotique§!, remportera les élections nationales, s'appuyant sur des organisations comme les Mustapaidat et Suojeluskunta pour développer une armée et une économie puissantes avant de créer la Ligue de Suprématie finlandaise fin 1940, invitant d'autres nations @SWE@NOR@DENNordiques et @EST@LIT@LATBaltes penchant pour le §Lfascisme§!."
  RULE_OPTION_FIN_FASCIST_NORDIC_EXP: "Fascistes élus - Expansionnisme de la Ligue de Suprématie"
  RULE_OPTION_FIN_FASCIST_NORDIC_EXP_DESC: "La droite @FINFinlandaise, dirigée par le §LMouvement populaire patriotique§!, remportera les élections nationales, s'appuyant sur des organisations comme les Mustapaidat et Suojeluskunta pour développer une armée et une économie puissantes avant de créer la Ligue de Suprématie finlandaise fin 1940, invitant et éventuellement annexant d'autres nations @SWE@NOR@DENNordiques et @EST@LIT@LATBaltes penchant pour le §Lfascisme§!, et tentera également de créer une insurrection en @KARCarélie pour provoquer une guerre expansionniste contre l'@SOVUnion soviétique."
  RULE_OPTION_FIN_FASCIST_COUP_AXIS: "Coup d'État fasciste - Axe"
