  RULE_OPTION_DEFAULT:0 "Par défaut"
  RULE_OPTION_DEFAULT_AI_DESC:0 "L'IA prendra des décisions basées sur d'autres paramètres de jeu, tels que l'option pour forcer les focus historiques et d'autres scénarios de jeu. Ceci est le même comportement que dans la version 1.5 et antérieure."
  RULE_OPTION_RANDOM_AI_DESC:0 "L'IA décidera aléatoirement d'une stratégie au début du jeu et tentera de l'exécuter. §YSi vous avez déjà désactivé les focus historiques, cela n'a aucun effet!§!"
  RULE_OPTION_DEFAULT_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA sélectionnera aléatoirement une stratégie au début du jeu et l'exécutera, certaines stratégies ont plus de chances de se produire que d'autres, les règles d'équilibrage du jeu seront mises en œuvre afin que les idéologies soient à peu près équilibrées. Ceci est le comportement par défaut de l'IA."
  RULE_OPTION_HISTORICAL_PATHS:0 "Mode principalement historique"
  RULE_OPTION_HISTORICAL_PATHS_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA suivra toujours l'arbre de focus historique, cependant l'IA §YNE SUIVRA PAS§! l'histoire dans les événements, les décisions et la stratégie générale. \n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_NO_GAME_BALANCE:0 "Désactiver l'équilibrage du jeu"
  RULE_OPTION_NO_GAME_BALANCE_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA sélectionnera aléatoirement une stratégie au début du jeu et l'exécutera, certaines stratégies ont plus de chances de se produire que d'autres, les règles d'équilibrage du jeu sont délibérément désactivées, donc les idéologies §YNE SONT PAS§! équilibrées.\n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_MINORS_ONLY:0 "Mode des Majors historiques"
  RULE_OPTION_MINORS_ONLY_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, cette option fait la même chose que §YPar défaut§!, cependant les pays majeurs (y compris la Chine) resteront sur les focus historiques.\n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_MINORS_FACTIONS:0 "Mode de Guerre mondiale"
  RULE_OPTION_MINORS_FACTIONS_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, les pays majeurs (y compris la Chine) resteront sur les focus historiques. Tous les autres pays ne sélectionneront que des voies qui les alignent avec l'une des factions majeures, ou une voie qui suppose qu'un majeur les annexera pacifiquement. \n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_ANTI_HISTORICAL:0 "Mode Anti-Historique"
  RULE_OPTION_ANTI_HISTORICAL_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, cette option fait en sorte que l'IA de chaque pays NE CHOISISSE JAMAIS les voies historiques, l'IA pourrait quand même rester la même idéologie.\n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_REALISTIC:0 "Mode Semi-Réaliste"
  RULE_OPTION_REALISTIC_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA ne sélectionnera que des voies qui ont une chance réaliste de se produire réellement dans l'histoire, par exemple, le Japon ne deviendra pas communiste, et les États-Unis resteront toujours démocratiques. Cela rendra également d'autres voies qui sont irréalistes mais techniquement possibles moins susceptibles de se produire.\n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_TRUE_RANDOM:0 "Mode Vraiment Aléatoire"
  RULE_OPTION_TRUE_RANDOM_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA sélectionnera aléatoirement une stratégie au début du jeu et l'exécutera, chaque stratégie a une chance égale d'être choisie, les règles d'équilibrage du jeu sont délibérément désactivées, donc §Ycela sera probablement assez chaotique§!.\n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_NO_AI_STRATEGY:0 "Mode Chaos"
  RULE_OPTION_NO_AI_STRATEGY_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA ne choisira aucune stratégie, au lieu de cela, elle sélectionnera aléatoirement des focus chaque fois qu'elle en aura envie, sans tenir compte de la situation mondiale. §YCela sera très chaotique.§!\n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_FASCIST_ONLY:0 "Nouvel Ordre Mondial"
  RULE_OPTION_FASCIST_ONLY_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA essaiera toujours de choisir une voie §Lfasciste§! aléatoire. S'il n'y en a pas, l'IA choisira une stratégie aléatoire comme d'habitude. \n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_COMMUNIST_ONLY:0 "Révolution mondiale"
  RULE_OPTION_COMMUNIST_ONLY_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA essaiera toujours de choisir une voie §Rcommuniste§! aléatoire. S'il n'y en a pas, l'IA choisira une stratégie aléatoire comme d'habitude. \n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_DEMOCRATIC_ONLY:0 "Fin de l'Histoire"
  RULE_OPTION_DEMOCRATIC_ONLY_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA essaiera toujours de choisir une voie §Cdémocratique§! aléatoire. S'il n'y en a pas, l'IA choisira une stratégie aléatoire comme d'habitude. \n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_MONARCHIST_ONLY:0 "Jus Divinum Regum"
  RULE_OPTION_MONARCHIST_ONLY_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA essaiera toujours de choisir une voie §0monarchiste§! aléatoire. S'il n'y en a pas, l'IA choisira une stratégie aléatoire comme d'habitude. \n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_AUTHORITARIAN_ONLY:0 "Le Siècle de l'État"
  RULE_OPTION_AUTHORITARIAN_ONLY_NONHIST_AI_DESC:0 "Lorsque les focus historiques sont désactivés, l'IA essaiera toujours de choisir une voie §7Autoritaire/Oligarchique§! aléatoire. S'il n'y en a pas, l'IA choisira une stratégie aléatoire comme d'habitude. \n§RASSUREZ-VOUS D'AVOIR LES FOCUS HISTORIQUES DE L'IA DÉSACTIVÉS!!!§!"
  RULE_OPTION_FASCIST_GER_AI_DESC:0 "L'IA @GERAllemande restera §LFasciste§! et tentera de prendre le contrôle de l'Europe en suivant la voie pertinente dans l'arbre de focus national, exigeant l'annexion de la @CZETchécoslovaquie et exigeant que la @POLPologne remette Dantzig ou aille à la guerre, ceci est un comportement historique."
  RULE_OPTION_FASCIST_ALTERNATE_GER_AI_DESC:0 "L'IA @GERAllemande restera §LFasciste§! et tentera de promouvoir le fascisme chez ses voisins, et d'avoir un axe aussi grand que possible (l'IA tentera de se lier d'amitié avec la @CZETchécoslovaquie, le @DENDanemark, le @NORNorvège, le @SWESuède et le @HOLPays-Bas mais envahira toujours la @POLPologne et la @YUGYougoslavie)."
  RULE_OPTION_FASCIST_ALTERNATE_2_GER_AI_DESC:0 "L'IA @GERAllemande restera §LFasciste§! et tentera de prendre agressivement le territoire environnant avant d'échanger la @SLOSlovaquie contre la @POLDantzig. (L'IA tentera de se lier d'amitié avec la @POLPologne, ignorera la @DEN@NORScandinavie, annexera les @CZE@YUGBalkans. Elle envahira les @HOL@BEL@LUXBenelux et la @SWISuisse)."
  RULE_OPTION_FASCIST_BERLIN_MOSCOW_GER_AI_DESC:0 "L'IA @GERAllemande restera §LFasciste§! et tentera de former l'axe @GER@SOVBerlin-Moscou avec l'Union soviétique, cela déclenchera toutes les nations §Cdémocratiques§! du monde à former une alliance mutuelle en défense, cette alliance se fracturera probablement en quelques années après sa formation. L'IA @GERAllemande tentera également d'attaquer l'@ITAItalie, l'@SPREspagne et le @PORPortugal."
  RULE_FASCIST_JAP_AI_DESC:0 "L'IA @JAPJaponaise tentera de frapper au sud contre les alliés occidentaux en suivant la voie pertinente dans l'arbre de focus national."
  RULE_FASCIST_ALTERNATE_JAP_AI_DESC:0 "L'IA @JAPJaponaise se préparera un peu plus avant d'aller en @CHIChine, et contournera les @PHIPhilippines au lieu de provoquer les @USAÉtats-Unis."
  RULE_OPTION_COMMUNIST_JAP_AI_DESC:0 "L'IA @JAPJaponaise tentera de devenir §Rcommuniste§! et de rejoindre le Komintern pour éliminer le @MANMandchoukouo."
  RULE_OPTION_COMMUNIST_ASIAN_SOLIDARITY_JAP_AI_DESC:0 "L'IA @JAPJaponaise tentera de devenir §Rcommuniste§! et de soutenir d'autres régimes communistes en Asie et tentera d'éliminer le @MANMandchoukouo."
  RULE_OPTION_NEUTRALITY_SHOGUN_JAP_AI_DESC:0 "L'IA @JAPJaponaise tentera de frapper au nord contre l'@SOVUnion soviétique et de faire cause commune avec l'Axe."
  RULE_OPTION_NEUTRALITY_SHOWA_JAP_AI_DESC:0 "L'IA @JAPJaponaise restaurera la pleine souveraineté de l'Empereur Showa et prendra son temps pour se construire avant de frapper au nord contre l'@SOVUnion soviétique en fin de partie et tentera de rejoindre l'Axe."
  RULE_DEMOCRATIC_JAP_AI_DESC:0 "L'IA @JAPJaponaise tentera de se réformer en une §Cdémocratie§! et de rejoindre le @ENGRoyaume-Uni ou la plus grande alliance §Cdémocratique§!."
  RULE_DEMOCRATIC_PACIFIC_TREATY_JAP_AI_DESC:0 "L'IA @JAPJaponaise tentera de se réformer en une §Cdémocratie§! et de créer une Alliance du Traité Asie-Pacifique avec d'autres puissances §Cdémocratiques§! à proximité si elles existent. En fin de partie, elle demandera la libération des @PHIPhilippines au @USAÉtats-Unis."
  RULE_KAISER_GER_AI_DESC:0 "L'IA @GERAllemande tentera de ramener le Kaiser Wilhelm II sur le trône, en commençant une nouvelle course aux armements navals avec les puissances coloniales @ENG@FRA@BEL, et en réarmant par le programme MEFO avec des tactiques prussiennes restaurées. En garantissant la @POLPologne pour Dantzig, et en exigeant Qingdao de la @CHIChine, l'@GERAllemagne tentera ensuite de faire un allié @AUS@HUNAustro-hongrois des Balkans du Nord, et d'attaquer les puissances coloniales @ENG@FRA@BEL en fin de partie. L'IA pourrait également attaquer l'@SOVUnion soviétique selon les circonstances mondiales."
  RULE_KAISER_ALT_GER_AI_DESC:0 "L'IA @GERAllemande tentera de ramener le Kaiser Wilhelm II sur le trône, en réarmant par le programme MEFO avec une nouvelle doctrine de Panzer. En garantissant à la fois la @POLPologne pour Dantzig, et les États @LIT@LAT@ESTBaltes pour des tributs. L'@GERAllemagne tentera ensuite de faire une annexion ou une alliance avec l'@AUSAutriche et la @CZETchécoslovaquie, avant de frapper l'@SOVUnion soviétique. L'IA pourrait également attaquer les puissances coloniales @ENG@FRA@BEL en fin de partie."
  RULE_OPTION_KAISER_EXP:0 "Reich impérial militaire - Expansionniste"
  RULE_KAISER_EXP_GER_AI_DESC:0 "L'IA @GERAllemande tentera de restaurer le Kaiserreich allemand sous une dictature militaire, en commençant une nouvelle course aux armements navals avec les puissances coloniales @ENG@FRA@BEL, en réarmant par le programme MEFO avec une nouvelle doctrine de Panzer. En exigeant des concessions territoriales de la @POLPologne et de la @LITLituanie. L'@GERAllemagne tentera ensuite de faire une annexion ou une alliance avec l'@AUSAutriche et la @CZETchécoslovaquie, avant de frapper l'@SOVUnion soviétique. L'IA pourrait également attaquer les puissances coloniales @ENG@FRA@BEL en fin de partie."
  RULE_OPTION_KAISER_BLITZKRIEG:0 "Reich impérial militaire - Blitzkrieg"
  RULE_KAISER_BLITZKRIEG_GER_AI_DESC:0 "L'IA @GERAllemande tentera de restaurer le Kaiserreich allemand sous une dictature militaire, en réarmant par le programme MEFO avec une nouvelle doctrine de Panzer. En exigeant des concessions territoriales de la @POLPologne et de la @LITLituanie. L'@GERAllemagne tentera ensuite de faire une annexion ou une alliance avec l'@AUSAutriche et la @CZETchécoslovaquie, avant de frapper les puissances coloniales @ENG@FRA@BEL et l'@SOVUnion soviétique dès que possible (généralement en 1939)."
  RULE_OPTION_KAISER_CHINA_ALLY:0 "Restaurer le Kaiser - Allié du Kuomintang"
  RULE_KAISER_CHINA_ALLY_GER_AI_DESC:0 "L'IA @GERAllemande tentera de ramener le Kaiser Wilhelm II sur le trône, en commençant une nouvelle course aux armements navals avec les puissances coloniales @ENG@FRA@BEL et en réarmant par le programme MEFO avec des tactiques prussiennes restaurées. En garantissant la @POLPologne en échange de Dantzig, l'@GERAllemagne tentera ensuite de créer une alliance avec le @CHIKuomintang, avant de frapper les puissances coloniales @ENG@FRA@BEL et de mettre en place des sphères d'influence entre l'@GERAllemagne, le @CHIChine et d'autres alliés du @IRA@IRQ@AFG@TIBMoyen-Orient et de l'Asie."
  RULE_OPTION_KAISER_DIPLO:0 "Reich impérial militaire - Alliance dans l'ombre"
  RULE_KAISER_DIPLO_GER_AI_DESC:0 "L'IA @GERAllemande tentera de restaurer le Kaiserreich allemand sous une dictature militaire, en se soumettant à la domination navale @ENGBritannique et en se concentrant sur une nouvelle politique économique avec des tactiques prussiennes restaurées. L'IA mettra en place des garanties mutuelles avec le @ENGRoyaume-Uni et tentera de demander le retour des anciennes possessions coloniales @GERAllemandes avant de garantir la @POLPologne en échange de Dantzig. L'@GERAllemagne attaquera ensuite la @FRAFrance et tentera de contourner la ligne Maginot par la @SWISuisse. L'IA est plus susceptible d'attaquer également l'@ITAItalie et l'@SOVUnion soviétique en fin de partie."
  RULE_DEMOCRATIC_GER_AI_DESC:0 "L'IA @GERAllemande tentera de créer une monarchie constitutionnelle avec un gouvernement §Cdémocratique§!, en tentant de créer des alliances avec l'@AUSAutriche et la @CZETchécoslovaquie, en étendant l'influence du Mitteleuropa autant que possible, en échangeant Dantzig contre des garanties sur la @POLPologne, et en signant un pacte de défense avec le @ENGRoyaume-Uni et la @FRAFrance, en demandant que les anciennes colonies @GERAllemandes soient restaurées. L'IA déclarera la guerre à l'@SOVUnion soviétique en fin de partie pour régler le problème du communisme une fois pour toutes."
  RULE_DEMOCRATIC_DIPLO_GER_AI_DESC:0 "L'IA @GERAllemande tentera de créer une monarchie constitutionnelle avec un gouvernement §Cdémocratique§!, en tentant de créer des alliances avec l'@AUSAutriche et la @CZETchécoslovaquie, en étendant l'influence du Mitteleuropa autant que possible, en donnant des garanties à la @POLPologne et aux pays @LIT@LAT@ESTBaltes sans conditions, et en signant un pacte de défense avec la @FRAFrance, en demandant que Qingdao soit restauré de la @CHIChine. L'IA ne déclarera pas la guerre à d'autres pays à l'exception de l'@SOVUnion soviétique dans des scénarios de jeu spécifiques."
  RULE_OPTION_DEMOCRATIC_EXP:0 "Démocratique - Expansionniste"
  RULE_DEMOCRATIC_EXP_GER_AI_DESC:0 "L'IA @GERAllemande tentera de créer une monarchie constitutionnelle avec un gouvernement §Cdémocratique§!, tout en gardant le système de factures MEFO fasciste, l'@GERAllemagne tentera d'étendre ses frontières autant que possible, en exigeant les territoires @POLPolonais et @LITLituanien, en tentant d'annexer ou de s'allier avec l'@AUSAutriche, et en déclarant la guerre au @ENGRoyaume-Uni et à la @FRAFrance au sujet des anciennes colonies @GERAllemandes. L'IA déclarera également la guerre à l'@SOVUnion soviétique en fin de partie pour régler le problème du communisme une fois pour toutes."
  RULE_OPTION_DEMOCRATIC_COLONIAL:0 "Démocratique - Restaurer les possessions coloniales"
  RULE_DEMOCRATIC_COLONIAL_GER_AI_DESC:0 "L'IA @GERAllemande tentera de créer une monarchie constitutionnelle avec un gouvernement §Cdémocratique§!, en signant des traités de défense avec à la fois le @ENGRoyaume-Uni et la @FRAFrance afin de demander le retour des possessions coloniales @GERAllemandes. L'IA demandera ensuite Qingdao à la @CHIChine, et les anciennes terres impériales à la @POLPologne. L'IA pourrait déclarer la guerre à l'@SOVUnion soviétique en fin de partie selon la situation mondiale."
  RULE_OPTION_HUN_DEMOCRATIC_KING: "Roi démocratique"
  RULE_OPTION_HUN_DEMOCRATIC_KING_ALLIES: "Roi démocratique - Rejoindre les Alliés"
  RULE_OPTION_HUN_DEMOCRATIC_KING_BALKAN: "Roi démocratique - Pacte balkanique"
  RULE_OPTION_HUN_COMMUNIST_STALINISM: "Staline pannonien"
  RULE_OPTION_HUN_COMMUNIST_STALINISM_AGGR: "Staline pannonien - Bloc de l'Est divisé"
  RULE_FASCIST_HUN_AI_DESC:0 "L'IA @HUNHongroise maintiendra la régence de Miklós Horthy, et tentera de rejoindre l'Axe. L'IA attendra jusqu'aux années 1940 pour demander des territoires mineurs à ses voisins @CZE@ROM, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne. Cette IA ne fera pas de demandes sur le Burgenland à l'@AUSAutriche ou à l'@GERAllemagne."
  RULE_OPTION_HUN_HORTHY_AXIS_ALT_HUN_AI_DESC: "L'IA @HUNHongroise maintiendra la régence de Miklós Horthy, et tentera de rejoindre l'Axe. L'IA tentera de demander des territoires mineurs à ses voisins @CZE@ROM dès qu'elle le pourra, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne."
  RULE_OPTION_HUN_HORTHY_ROME_HUN_AI_DESC: "L'IA @HUNHongroise maintiendra la régence de Miklós Horthy, et tentera de renouveler les Protocoles de Rome avec l'@ITAItalie. L'IA attendra jusqu'aux années 1940 pour demander des territoires mineurs à ses voisins @CZE@ROM, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne ou de l'@ITAItalie. Cette IA ne fera pas de demandes sur le Burgenland à l'@AUSAutriche ou à l'@GERAllemagne."
  RULE_OPTION_HUN_HORTHY_ROME_ALT_HUN_AI_DESC: "L'IA @HUNHongroise maintiendra la régence de Miklós Horthy, et tentera de renouveler les Protocoles de Rome avec l'@ITAItalie. L'IA tentera de demander des territoires mineurs à ses voisins @CZE@ROM dès qu'elle le pourra, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne ou de l'@ITAItalie."
  RULE_OPTION_HUN_HORTHY_NEU_HUN_AI_DESC: "L'IA @HUNHongroise maintiendra la régence de Miklós Horthy, mais n'essayera pas de rejoindre une faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple, si elles sont toutes les deux en guerre). L'IA attendra jusqu'aux années 1940 pour demander des territoires mineurs à ses voisins @CZE@ROM, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne. Cette IA ne fera pas de demandes sur le Burgenland à l'@AUSAutriche ou à l'@GERAllemagne."
  RULE_OPTION_HUN_HORTHY_NEU_AGGR_HUN_AI_DESC: "L'IA @HUNHongroise maintiendra la régence de Miklós Horthy, mais n'essayera pas de rejoindre une faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple, si elles sont toutes les deux en guerre). L'IA tentera de demander des territoires mineurs à ses voisins @CZE@ROM dès qu'elle le pourra, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne."
  RULE_ARROW_CROSS_MOVEMENT_NEU_HUN_AI_DESC: "L'IA @HUNHongroise tentera d'établir un régime absolu sous le §LMouvement des Croix fléchées§!, mais n'essayera pas de rejoindre une faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple, si elles sont toutes les deux en guerre). La @HUNHongrie ne fera aucune demande territoriale à ses voisins, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne."
  RULE_ARROW_CROSS_MOVEMENT_HUN_AI_DESC: "L'IA @HUNHongroise tentera d'établir un régime absolu sous le §LMouvement des Croix fléchées§!, mais n'essayera pas de rejoindre une faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple, si elles sont toutes les deux en guerre). La @HUNHongrie attendra jusqu'aux années 1940 pour demander des territoires mineurs à ses voisins @CZE@ROM@YUG@AUS, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne."
  RULE_ARROW_CROSS_MOVEMENT_NEU_ANTI_COMMUNIST_HUN_AI_DESC: "L'IA @HUNHongroise tentera d'établir un régime absolu sous le §LMouvement des Croix fléchées§!, mais n'essayera pas de rejoindre une faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple, si elles sont toutes les deux en guerre). La @HUNHongrie attendra jusqu'aux années 1940 pour demander des territoires mineurs à ses voisins @CZE@ROM@YUG@AUS, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne. L'IA essaiera également de revendiquer les anciennes terres magyares comme les siennes, et commencera une nouvelle croisade contre les méfaits du communisme athée @SOV."
  RULE_ARROW_CROSS_MOVEMENT_AXIS_HUN_AI_DESC: "L'IA @HUNHongroise tentera d'établir un régime absolu sous le §LMouvement des Croix fléchées§!, et tentera de rejoindre l'Axe. La @HUNHongrie ne fera aucune demande territoriale à ses voisins, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne."
  RULE_ARROW_CROSS_MOVEMENT_AXIS_EXP_HUN_AI_DESC: "L'IA @HUNHongroise tentera d'établir un régime absolu sous le §LMouvement des Croix fléchées§!, et tentera de rejoindre l'Axe. La @HUNHongrie attendra jusqu'aux années 1940 pour demander des territoires mineurs à ses voisins @CZE@ROM@YUG@AUS, sauf si ces territoires leur ont déjà été accordés par l'arbitrage de l'@GERAllemagne."
