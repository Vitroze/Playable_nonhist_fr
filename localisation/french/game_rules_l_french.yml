 RULE_FASCIST_ALTERNATE_RAJ_AI_DESC:0"L'IA @RAJIndian va tenter de gagner son §Lindépendance§ ! à travers une alliance avec la Sphère de Co-Prospérité en suivant le chemin pertinent dans l'arbre des priorités nationales.
