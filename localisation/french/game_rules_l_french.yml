 RULE_OPTION_SWE_MONARCHIST_FIN_DESC:"Avec les craintes exacerbées d’une résurgence de l’influence bolchevique, §0le roi Gustave V§ ! il réprimera les opportunistes fascistes et assumera le rôle qu’un roi devrait jouer. Le nouveau gouvernement exigera d'abord Åland de @FINFinland, tout en rejoignant son camp dans la guerre d'hiver. S'ils acceptent, @SWESweden formera avec eux une faction de défense finno-suédoise."
