  RULE_OPTION_ITA_POPE_ISO:0 "Ascension papale"
  RULE_OPTION_ITA_POPE_ISO_AI_DESC:0 "L'IA @ITAItalienne renversera Mussolini en faveur du roi Vittorio Emanuele, qui établira une monarchie absolutiste. La monarchie perdra de l'influence au profit du Pape, qui prendra le contrôle de l'@ITAItalie dans les années 1940. Le Pape tentera de garder l'Italie en isolement général."
  RULE_OPTION_ITA_POPE_ROME:0 "Ascension papale - Empire romain"
  RULE_OPTION_ITA_POPE_ROME_AI_DESC:0 "L'IA @ITAItalienne renversera Mussolini en faveur du roi Vittorio Emanuele, qui établira une monarchie absolutiste. La monarchie perdra de l'influence au profit du Pape, qui prendra le contrôle de l'@ITAItalie dans les années 1940. Le Pape tentera de prendre le contrôle de l'Europe, et de reformer l'Empire romain."
  RULE_OPTION_ITA_COMMUNIST_PLAN:0 "Communiste/Staliniste"
  RULE_OPTION_ITA_COMMUNIST_PLAN_AI_DESC:0 "Les anti-fascistes @ITAItaliens s'uniront pour renverser le régime fasciste par la force, formant un gouvernement §Rcommuniste§! dirigé par Palmiro Togliatti et cherchant à rejoindre le Komintern."
  RULE_OPTION_ITA_COMMUNIST_GRAMSCI_PLAN:0 "Communiste/Anti-Staliniste"
  RULE_OPTION_ITA_COMMUNIST_GRAMSCI_PLAN_AI_DESC:0 "Les anti-fascistes @ITAItaliens s'uniront pour renverser le régime fasciste par la force, formant un gouvernement §Rcommuniste§! dirigé par Antonio Gramsci et créant une faction de la Fédération italienne avec les colonies."
  RULE_OPTION_ITA_COMMUNIST_PERTINI_PLAN:0 "Communiste/Anti-Staliniste/Anti-Colonial"
  RULE_OPTION_ITA_COMMUNIST_PERTINI_PLAN_AI_DESC:0 "Les anti-fascistes @ITAItaliens s'uniront pour renverser le régime fasciste par la force, formant un gouvernement §Rcommuniste§! dirigé par Sandro Pertini et abolissant ou intégrant les colonies. L'IA tentera de former une faction avec d'autres puissances §Rcommunistes§! en Europe."
  RULE_OPTION_ITA_DEMOCRATIC_ALLIES_PLAN:0 "Socialiste/Rejoindre les Alliés"
  RULE_OPTION_ITA_DEMOCRATIC_ALLIES_PLAN_AI_DESC:0 "Les anti-fascistes @ITAItaliens s'uniront pour renverser le régime fasciste par la force, formant un gouvernement §Csocial-démocrate§! et cherchant à rejoindre les Alliés."
  RULE_OPTION_ITA_DEMOCRATIC_PLAN:0 "Socialiste/Confédération italienne"
  RULE_OPTION_ITA_DEMOCRATIC_PLAN_AI_DESC:0 "Les anti-fascistes @ITAItaliens s'uniront pour renverser le régime fasciste par la force, formant un gouvernement §Csocial-démocrate§! et cherchant à former une Confédération avec d'anciennes colonies en Afrique."
  RULE_OPTION_ITA_DEMOCRATIC_FREESTATES_PLAN:0 "Socialiste/États libres d'Europe"
  RULE_OPTION_ITA_DEMOCRATIC_FREESTATES_PLAN_AI_DESC:0 "Les anti-fascistes @ITAItaliens s'uniront pour renverser le régime fasciste par la force, formant un gouvernement §Csocial-démocrate§! et cherchant à former une faction avec d'autres puissances démocratiques en Europe, et garantira les petits pays d'Europe pour maintenir la paix."
  RULE_OPTION_FIN_FASCIST_AXIS: "Fascistes élus - Axe"
  RULE_OPTION_FIN_FASCIST_AXIS_DESC: "La droite @FINFinlandaise, dirigée par le §LMouvement populaire patriotique§!, remportera les élections nationales, s'appuyant sur des organisations comme les Mustapaidat et Suojeluskunta pour développer une armée et une économie puissantes avant de rejoindre l'Axe fin 1940."
