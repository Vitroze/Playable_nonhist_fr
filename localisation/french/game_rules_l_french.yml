 RULE_OPTION_SWE_MONARCHIST_FIN_ASSERTIVE_DESC:"Avec les craintes exacerbées d’une résurgence de l’influence bolchevique, §0le roi Gustave V§ ! il réprimera les opportunistes fascistes et assumera le rôle qu’un roi devrait jouer. Le nouveau gouvernement exigera d'abord Åland de @FINFinland, tout en rejoignant son camp dans la guerre d'hiver. S’ils acceptent, @SWESweden formera avec eux une faction de défense finno-suédoise. L'IA exigera Bornholm de @DENDenmark et Narvik de @NORNorvège."
 RULE_OPTION_SWE_MONARCHIST_FIN_ANTI_SOV:"Monarchiste - Défense finlandaise agressive"
 RULE_OPTION_SWE_MONARCHIST_FIN_ANTI_SOV_DESC:"Avec les craintes exacerbées d’une résurgence de l’influence bolchevique, §0le roi Gustave V§ ! il réprimera les opportunistes fascistes et assumera le rôle qu’un roi devrait jouer. Le nouveau gouvernement exigera d'abord Åland de @FINFinland, tout en rejoignant son camp dans la guerre d'hiver. S’ils acceptent, @SWESweden formera avec eux une faction de défense finno-suédoise. L'IA exigera du territoire et de l'assujettissement de @DENDenmark et @NORNorway, puis tentera de former det Stornordiska Riket. @SWESuède déclarera une croisade anti-bolchevique en 1941, entraînant @FINFinlande dans une guerre contre eux."
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL:"Conseil nordique centralisé"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC:"Les élections @SWESuédoises de 1936 se dérouleront avec un choix §Cdémocratique§ aléatoire ! Après la victoire du parti, l'IA jouera un rôle plus actif dans la défense de la Scandinavie en tentant de former le @SWE@NOR@DEN@FINConseil de défense nordique pour protéger §Cdemocratic§! et §gnon-aligné§! Nordiques en les marionnetant."
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_EXP:"Conseil centralisé assertif"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_EXP_DESC:"Les élections @SWESuédoises de 1936 se dérouleront avec un choix §Cdémocratique§ aléatoire ! Après la victoire du parti, l'IA jouera un rôle plus actif dans la défense de la Scandinavie en rejoignant d'abord la guerre d'hiver aux côtés de @FINFinlande, puis en tentant de former le @SWE@NOR@DEN@FINConseil de défense nordique pour protéger §Cdemocratic§! et §gnon-aligné§! Nordiques en les marionnetant. L'IA déclenchera des guerres en fin de partie contre @ENGEngland, @GERAllemagne ou @SOVRussia s'ils ne sont pas §Cdémocratiques§ !
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION:"Conseil nordique décentralisé"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION_DESC:"Les élections @SWESuédoises de 1936 se dérouleront avec un choix §Cdémocratique§ aléatoire ! Après la victoire du parti, l'IA jouera un rôle plus actif dans la défense de la Scandinavie en tentant de former le @SWE@NOR@DEN@FINConseil de défense nordique pour protéger §Cdemocratic§! et §gnon-aligné§! Nordiques en les alliant. L’IA se concentrera sur le bien-être et la stabilité plutôt que sur le renforcement militaire. »
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION_EXP:"Conseil nordique décentralisé Alt"
 RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION_EXP_DESC:"Les élections @SWESuédoises de 1936 se dérouleront avec un choix §Cdémocratique§ aléatoire ! Après la victoire du parti, l'IA jouera un rôle plus actif dans la défense de la Scandinavie en s'emparant d'abord d'Åland, puis en tentant de former le @SWE@NOR@DEN@FINConseil de défense nordique pour protéger §Cdemocratic§! et §gnon-aligné§! Nordiques en les alliant. L’IA se concentrera sur le renforcement militaire plutôt que sur le bien-être et la stabilité. »
 RULE_OPTION_SWE_COMMUNIST_FLYG:"Le socialisme de Flyg - Neutralité"
 RULE_OPTION_SWE_COMMUNIST_FLYG_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et le pro-allemand Nils Flyg deviendra Premier ministre. Flyg maintiendra son emprise sur le pouvoir, mais maintiendra la position neutre précédente de @SWESweden, en plus d'interdire le @SOVUnion soviétique et de se pencher sur le commerce avec l'Axe.
 RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS:"Le socialisme de Flyg - Axe"
 RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et le pro-allemand Nils Flyg deviendra Premier ministre. Flyg maintiendra son emprise sur le pouvoir et alignera @SWESweden avec @GERAllemagne. @SWESweden rejoindra soit l'Axe, soit un autre §Rcommuniste§ non stalinien ! faction en 1941. »
 RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS_AGGR:"Le socialisme de Flyg - l'Axe assertif"
 RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS_AGGR_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et le pro-allemand Nils Flyg deviendra Premier ministre. Flyg maintiendra son emprise sur le pouvoir et exigera Åland de @FINFinland. @SWESweden rejoindra soit l'Axe, soit un autre §Rcommuniste§ non stalinien ! "
 RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC:"Le socialisme de Flyg - Union nordique"
 RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et le pro-allemand Nils Flyg deviendra Premier ministre. Flyg maintiendra son emprise sur le pouvoir et créera l'Union de défense scandinave en 1941, invitant @NOR@DEN@ICE@FINNordic §Rcommunist§ ! et §CDémocratique§! pays."
 RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC_AGGR:"Le socialisme de Flyg - l'Union nordique affirmée"
 RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC_AGGR_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et le pro-allemand Nils Flyg deviendra Premier ministre. Flyg maintiendra son emprise sur le pouvoir et rejoindra la guerre hivernale aux côtés de @FINFinlande, tout en soutenant les révolutions en @NORNorvège et en @DENDanemark. @SWESweden créera l'Union scandinave de défense en 1940, invitant @NOR@DEN@ICE@FINNordic §Rcommunist§! et §CDémocratique§! pays, et peu de temps après déclencher des guerres avec @GERAllemagne, @ENGAngleterre et @SOVRussie s'ils sont staliniens ou non communistes.
 RULE_OPTION_SWE_COMMUNIST_KILBOM:"Le socialisme de Kilbom - Neutralité"
 RULE_OPTION_SWE_COMMUNIST_KILBOM_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt évincé par le pro-allié Karl Kilbom, qui maintiendra la position neutre précédente de la @SWESuède, en plus d'embarquer l'@GERAllemagne et de se pencher sur le commerce allié.
 RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES:"Le socialisme de Kilbom - Alliés"
 RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt évincé par le pro-allié Karl Kilbom, qui alignera @SWESweden avec le @ENGRoyaume-Uni. @SWESuède rejoindra soit les Alliés, soit un autre §Rcommuniste§ non stalinien ! faction en 1941. »
 RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES_AGGR:"Le socialisme de Kilbom - Des alliés affirmés"
 RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES_AGGR_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt évincé par le pro-allié Karl Kilbom, qui réclamera Åland à @FINFinland. @SWESuède rejoindra soit les Alliés, soit un autre §Rcommuniste§ non stalinien ! "
 RULE_OPTION_SWE_COMMUNIST_LINDEROT:"Le socialisme de Linderot - Neutralité"
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt évincé par le stalinien Sven Linderot, qui maintiendra la position neutre précédente de la @SWESuède, en plus d'embarquer l'@GERAllemagne et de se pencher sur le commerce du Komintern.
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN:"Le socialisme de Linderot - Komintern"
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt évincé par le stalinien Sven Linderot, qui alignera la @SWESuède sur l'@SOVUnion soviétique. @SWESweden rejoindra soit le Komintern, soit un autre §Rcommuniste§ stalinien ! faction en 1941. »
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN_AGGR:"Le socialisme de Linderot - le Komintern affirmé"
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN_AGGR_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt évincé par le stalinien Sven Linderot, qui réclamera Åland à @FINFinland. @SWESweden rejoindra soit le Komintern, soit un autre §Rcommuniste§ stalinien ! faction en 1940, et déclarer la guerre à l'@GERAllemagne et à l'@ENGAngleterre s'ils ne sont pas eux-mêmes staliniens peu après."
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC:"Le socialisme de Linderot - Union nordique"
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt évincé par le stalinien Sven Linderot, qui créera l'Union scandinave de défense en 1941, invitant @NOR@DEN@ICE@FINNordic §Rcommunist§! et §CDémocratique§! pays."
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC_AGGR:"Le socialisme de Linderot - l'Union nordique affirmée"
 RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC_AGGR_DESC:"Avec @SWEla radio suédoise qui s'aligne sur les syndicats, le §RSocialist Party§ ! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt évincé par le stalinien Sven Linderot, qui rejoindra la guerre d'hiver aux côtés de @FINFinlande, tout en soutenant les révolutions en @NORNorvège et @DENDanemark. @SWESweden créera l'Union scandinave de défense en 1940, invitant @NOR@DEN@ICE@FINNordic §Rcommunist§! et §CDémocratique§! pays, et peu après déclencher des guerres avec @GERAllemagne, @ENGAngleterre et @SOVRussie s'ils ne sont pas eux-mêmes staliniens.
 RULE_OPTION_NOR_STALINIST:"Stalinien - Neutralité"
 RULE_OPTION_NOR_STALINIST_AI_DESC:"Le mouvement travailliste @NORnorvégien augmentera la popularité du §RCommunisme§!, tout en alignant @NORNorvège sur l'Union soviétique de Staline, une révolution mettra aux commandes le NKP, qui conservera la politique du gouvernement précédent consistant à rester neutre dans les affaires mondiales sans rejoindre le Komintern.
 RULE_OPTION_NOR_STALINIST_EXP:"Stalinien - Libération finlandaise"
 RULE_OPTION_NOR_STALINIST_EXP_AI_DESC:"Le mouvement travailliste @NORnorvégien augmentera la popularité du §RCommunisme§!, tout en alignant @NORNorvège sur l'Union soviétique de Staline, une révolution mettra le NKP aux commandes, qui commencera une guerre pour libérer @FINFinlande de ses oppresseurs capitalistes sans rejoindre le Komintern.
 RULE_OPTION_NOR_STALINIST_COMINTERN:"Staliniste - Komintern"
 RULE_OPTION_NOR_STALINIST_COMINTERN_AI_DESC:"Le mouvement travailliste @NORnorvégien augmentera la popularité du §RCommunisme§!, tout en alignant @NORNorvège sur l'Union soviétique de Staline, une révolution mettra le NKP aux commandes, qui demandera à rejoindre le Komintern, ou la plus grande faction stalinienne si Staline a été évincé de l'@SOVUnion soviétique.
 RULE_OPTION_NOR_STALINIST_COMINTERN_EXP:"Staliniste - Komintern de libération finlandaise"
 RULE_OPTION_NOR_STALINIST_COMINTERN_EXP_AI_DESC:"Le mouvement travailliste @NORnorvégien augmentera la popularité du §RCommunisme§!, tout en alignant @NORNorvège sur l'Union soviétique de Staline. Une révolution mettra aux commandes le NKP, qui demandera à rejoindre le Komintern, ou la plus grande faction stalinienne si Staline a été évincé de l'@SOVUnion soviétique. L'IA déclenchera une guerre pour libérer @FINFinland de ses oppresseurs capitalistes et les attirer dans le Komintern. »
 RULE_OPTION_NOR_TROSTSKYIST:"Trotskyste - Neutralité"
 RULE_OPTION_NOR_TROSTSKYIST_AI_DESC:"Le mouvement travailliste @NORnorvégien augmentera la popularité du §RCommunisme§!, tout en gardant Lev Trotskij dans le pays et en rejetant la position stalinienne du NKP, une révolution mettra aux commandes le Parti des travailleurs, qui conservera la politique du gouvernement précédent consistant à rester neutre dans les affaires mondiales sans rejoindre ni créer de faction.
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL:"Trotskyste - Internationale"
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_AI_DESC:"Le mouvement travailliste @NORnorvégien augmentera la popularité du §RCommunisme§!, tout en gardant Lev Trotskij dans le pays et en rejetant la position stalinienne du NKP. Une révolution mettra aux commandes le Parti des Travailleurs, qui rejoindra d'autres §Rcommunistes§ non staliniens ! factions en Scandinavie ou en Europe, ou en créer une. L'IA garantira @FINFinland."
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_NORD:"Trotskyste - Internationale Scandinavie"
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_NORD_AI_DESC:"Le mouvement travailliste @NORnorvégien augmentera la popularité du §RCommunisme§!, tout en gardant Lev Trotskij dans le pays et en rejetant la position stalinienne du NKP. Une révolution mettra aux commandes le Parti des Travailleurs, qui rejoindra d'autres §Rcommunistes§ non staliniens ! factions en Scandinavie ou en Europe, ou en créer une. L'IA garantira alors @FINFinlande et déclenchera des guerres expansionnistes en @DENDenmark et en @SWESweden."
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_SOV:"Trotskyste - Internationale Soviétique"
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_SOV_AI_DESC:"Le mouvement travailliste @NORnorvégien augmentera la popularité du §RCommunisme§!, tout en gardant Lev Trotskij dans le pays et en rejetant la position stalinienne du NKP. Une révolution mettra aux commandes le Parti des Travailleurs, qui rejoindra d'autres §Rcommunistes§ non staliniens ! factions en Scandinavie ou en Europe, ou en créer une. L'IA garantira alors la @FINFinlande et commencera des guerres expansionnistes en @DENDenmark et en @SWESweden, avant d'attaquer le @SOVUnion soviétique en 1941 (s'ils ne sont pas alliés)"
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_GER:"Trotskyste - Internationale Allemagne"
 RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_GER_AI_DESC:"Le mouvement travailliste @NORnorvégien augmentera la popularité du §RCommunisme§!, tout en gardant Lev Trotskij dans le pays et en rejetant la position stalinienne du NKP. Une révolution mettra aux commandes le Parti des Travailleurs, qui rejoindra d'autres §Rcommunistes§ non staliniens ! factions en Scandinavie ou en Europe, ou en créer une. L'IA garantira alors la @FINFinlande et commencera des guerres expansionnistes en @DENDanemark et en @SWESweden, avant d'attaquer l'@GERAllemagne en 1941 (s'ils ne sont pas alliés)"
 RULE_OPTION_NOR_FASCIST:"Samling de Quisling - Neutralité"
 RULE_OPTION_NOR_FASCIST_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Quisling dirigera son nouveau gouvernement, mais restera par ailleurs neutre dans les affaires mondiales à moins d'être provoqué ou attaqué. »
 RULE_OPTION_NOR_FASCIST_V_RU:"Samling de Quisling - Bjarmeland"
 RULE_OPTION_NOR_FASCIST_V_RU_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Quisling dirigera son nouveau gouvernement et tentera de réformer l'Empire norvégien en présentant des exigences aux autres @SWE@DENpays nordiques. Finalement, il a fait des revendications et des exigences sur le nord-ouest de la Russie auprès de l'@SOVUnion soviétique en 1941. »
 RULE_OPTION_NOR_FASCIST_V_UK:"Samling de Quisling - Bretland"
 RULE_OPTION_NOR_FASCIST_V_UK_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Quisling dirigera son nouveau gouvernement et tentera de réformer l'Empire norvégien en présentant des exigences aux autres @SWE@DENpays nordiques. Finalement, faire des réclamations et des exigences à @IREIreland, @CANNewfoundland et @SCOScotland depuis le @ENGRoyaume-Uni en 1941 et 42."
 RULE_OPTION_NOR_FASCIST_AXIS:"Samling de Quisling - Axe"
 RULE_OPTION_NOR_FASCIST_AXIS_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Quisling dirigera son nouveau gouvernement et demandera à rejoindre l'Axe. »
 RULE_OPTION_NOR_FASCIST_AXIS_V_RU:"Samling de Quisling - Axis Bjarmeland"
 RULE_OPTION_NOR_FASCIST_AXIS_V_RU_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Quisling dirigera son nouveau gouvernement et demandera à rejoindre l'Axe avant de tenter de réformer l'Empire norvégien en faisant des demandes aux autres @SWE@DENpays nordiques. Finalement, il a fait des revendications et des exigences sur le nord-ouest de la Russie auprès de l'@SOVUnion soviétique en 1941. »
 RULE_OPTION_NOR_FASCIST_AXIS_V_UK:"Samling de Quisling - Axis Bretland"
 RULE_OPTION_NOR_FASCIST_AXIS_V_UK_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Quisling dirigera son nouveau gouvernement et demandera à rejoindre l'Axe avant de tenter de réformer l'Empire norvégien en faisant des demandes aux autres @SWE@DENpays nordiques. Finalement, faire des réclamations et des exigences à @IREIreland, @CANNewfoundland et @SCOScotland depuis le @ENGRoyaume-Uni en 1941 et 42."
 RULE_OPTION_NOR_FASCIST_AXIS_RK:"Le Loyal Reichskommissariat"
 RULE_OPTION_NOR_FASCIST_AXIS_RK_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Josef Terboven dirigera ce nouveau gouvernement et fera de @NORNorway une marionnette de l'Axe avant de céder la direction à l'officier SS Jonas Lie, qui transformera le pays en un Reichskommissariat plus dépendant des puissances de l'Axe.
 RULE_OPTION_NOR_FASCIST_AXIS_PUPPET:"Commissariat du Reich autonome"
 RULE_OPTION_NOR_FASCIST_AXIS_PUPPET_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Josef Terboven dirigera ce nouveau gouvernement et fera de @NORNorway une marionnette de l'Axe avant de rendre la direction à Vidkun Quisling, qui sera désormais coincé à diriger un sujet de l'Axe au lieu d'un partenaire.
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC:"Samling de Quisling - Pangermanique"
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Quisling dirigera son nouveau gouvernement et créera sa propre faction pangermanique, invitant tous les @GER@SWE@DEN@SWI@HOL@LUX@BEL@AUSgermaniques §Lfascistes§ ! et §gnon-aligné§! des pays qui ne font pas déjà partie d'une faction.
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_RU:"Quisling - Bjarmeland pangermanique"
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_RU_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Quisling dirigera son nouveau gouvernement et créera sa propre faction pangermanique, invitant tous les @GER@SWE@DEN@SWI@HOL@LUX@BEL@AUSgermaniques §Lfascistes§ ! et §gnon-aligné§! pays qui ne font pas déjà partie d'une faction avant de tenter de réformer l'Empire norvégien en faisant des demandes aux autres @SWE@DENpays nordiques. Finalement, il a fait des revendications et des exigences sur le nord-ouest de la Russie auprès de l'@SOVUnion soviétique en 1941. »
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_UK:"Quisling - Bretland pangermanique"
 RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_UK_AI_DESC:"Avec les luttes intestines au Storting, l'influence du §LNasjonal Samling§! grandira au fil du temps en @NORNorvège, et finira par atteindre son paroxysme lorsque Vidkun Quisling marchera sur Oslo et de là lancera un coup d'État. Quisling dirigera son nouveau gouvernement et créera sa propre faction pangermanique, invitant tous les @GER@SWE@DEN@SWI@HOL@LUX@BEL@AUSgermaniques §Lfascistes§ ! et §gnon-aligné§! pays qui ne font pas déjà partie d'une faction avant de tenter de réformer l'Empire norvégien en faisant des demandes aux autres @SWE@DENpays nordiques. Finalement, faire des réclamations et des exigences à @IREIreland, @CANNewfoundland et @SCOScotland depuis le @ENGRoyaume-Uni en 1941 et 42."
 RULE_OPTION_DEMOCRATIC_ALT_NOR:"Conservateurs"
 RULE_DEMOCRATIC_ALT_NOR_AI_DESC:"Après un vote de censure contre le Storting, le §CHøyre§! formera un nouveau §Cconservateur§! gouvernement, en adoptant une approche plus active de la défense de @NORNorvège et en luttant contre l'influence communiste et fasciste.
 RULE_OPTION_DEMOCRATIC_NOR_ALLIES:"Conservateurs - Alliés"
 RULE_DEMOCRATIC_ALLIES_NOR_AI_DESC:"Après un vote de censure contre le Storting, le §CHøyre§! formera un nouveau §Cconservateur§! gouvernement, en adoptant une approche plus active de la défense de @NORNorvège et en luttant contre l'influence communiste et fasciste. @NORLa Norvège tentera de rejoindre les Alliés en 1939."
 RULE_OPTION_DEMOCRATIC_NOR_ALLIES_EXP:"Conservateurs - Alliés expansionnistes"
 RULE_DEMOCRATIC_ALLIES_EXP_NOR_AI_DESC:"Après un vote de censure contre le Storting, le §CHøyre§! formera un nouveau §Cconservateur§! gouvernement, en adoptant une approche plus active de la défense de @NORNorvège et en luttant contre l'influence communiste et fasciste. @NORLa Norvège tentera de rejoindre les Alliés en 1938 avant de lancer des campagnes agressives pour sécuriser @DENDenmark et @SWESweden."
 RULE_OPTION_DEMOCRATIC_NORDIC:"Conservateurs - Conseil nordique"
 RULE_DEMOCRATIC_NORDIC_NOR_AI_DESC:"Après un vote de censure contre le Storting, le §CHøyre§! formera un nouveau §Cconservateur§! gouvernement, en adoptant une approche plus active de la défense de @NORNorvège et en luttant contre l'influence communiste et fasciste. @NORLa Norvège tentera de créer le Conseil nordique en 1939."
 RULE_OPTION_DEMOCRATIC_NORDIC_EXP:"Conservateurs - Expansionniste du Conseil Nordique"
 RULE_DEMOCRATIC_NORDIC_EXP_NOR_AI_DESC:"Après un vote de censure contre le Storting, le §CHøyre§! formera un nouveau §Cconservateur§! gouvernement, en adoptant une approche plus active de la défense de @NORNorvège et en luttant contre l'influence communiste et fasciste. @NORNorvège tentera de créer le Conseil nordique en 1939 avant de lancer des campagnes agressives pour sécuriser @DENDenmark et @SWESweden s'ils n'y adhèrent pas. L'IA pourrait déclarer la guerre à l'Allemagne en 1942 ou plus tard, selon la situation mondiale."
 RULE_OPTION_NOR_MONARCHIST:"Royaume de Norvège"
 RULE_OPTION_NOR_MONARCHIST_AI_DESC:"Avec des luttes intestines au Storting, le baron Wedel-Jarlsberg commencera à faire pression sur le roi Haakon VII pour qu'il démantele le Storting et transforme @NORNorway en une monarchie oligarchique. Price Olav sera nommé commandant naval et @NORNorvège rejoindra une faction monarchiste majeure ou créera sa propre faction, tout en exigeant les territoires coloniaux de @DENDanemark en @ICEIslande et @GRNGroenland.
 RULE_OPTION_NOR_MONARCHIST_NORD:"Empire norvégien"
 RULE_OPTION_NOR_MONARCHIST_NORD_AI_DESC:"Avec des luttes intestines au Storting, le baron Wedel-Jarlsberg commencera à faire pression sur le roi Haakon VII pour qu'il démantele le Storting et transforme @NORNorway en une monarchie oligarchique. Price Olav sera nommé commandant de l'armée et @NORNorvège rejoindra une faction monarchiste majeure ou créera sa propre faction, tout en exigeant l'annexion du @DENDanemark et des territoires de la @SWESuède."
 RULE_OPTION_NOR_MONARCHIST_SOV:"Grand Empire norvégien"
 RULE_OPTION_NOR_MONARCHIST_SOV_AI_DESC:"Avec des luttes intestines au Storting, le baron Wedel-Jarlsberg commencera à faire pression sur le roi Haakon VII pour qu'il démantele le Storting et transforme @NORNorway en une monarchie oligarchique. Price Olav sera nommé commandant de l'armée et @NORNorvège rejoindra une faction monarchiste majeure ou créera sa propre faction, tout en exigeant l'annexion du @DENDanemark et des territoires de @SWESuède. L'IA exigera également des territoires du Bjarmeland à l'@SOVUnion Soviétique en 1941."
 RULE_OPTION_KOKOOMUS_HISTORICAL:"Kansalliset Puolueet - Historique"
 RULE_HISTORICAL_FIN_AI_DESC:"@FINFinlande maintiendra sa politique nationale, en parcourant les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale. L'IA aura une coopération militaire limitée avec l'@GERAllemagne pour récupérer les territoires perdus lors de la guerre d'hiver auprès des @SOVSoviets s'ils lancent l'opération Barbarossa."
 RULE_OPTION_KOKOOMUS_ALTERNATE:"Kansalliset Puolueet - Suppléant"
 RULE_KOKOOMUS_ALTERNATE_FIN_AI_DESC:"@FINFinlande maintiendra sa politique nationale, en parcourant les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale. L'IA s'appuiera sur la coopération militaire avec l'@GERAllemagne dès que possible, et donnera la priorité à la construction de l'économie et de la situation politique plutôt qu'aux priorités militaires. »
 RULE_OPTION_KOKOOMUS_BALTIC:"Kansalliset Puolueet - Revendications baltes"
 RULE_KOKOOMUS_BALTIC_FIN_AI_DESC:"@FINFinlande maintiendra sa politique nationale, en parcourant les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale. @FINFinlande tentera de parvenir à un accord pour fusionner avec @ESTEstonie et faire valoir ses droits sur d'autres @LAT@LITpays baltes. L'IA aura une coopération militaire limitée avec l'@GERAllemagne pour récupérer les territoires perdus lors de la guerre d'hiver auprès des @SOVSoviets s'ils lancent l'opération Barbarossa."
 RULE_OPTION_KOKOOMUS_EXP:"Risto Ryti - Expansionnisme"
 RULE_KOKOOMUS_EXP_FIN_AI_DESC:"@FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale, mais en restant fidèle à l'expansionniste Risto Ryti dans le Kansallinen Edistyspuolue. @FINFinlande tentera de parvenir à un accord pour fusionner avec @ESTEstonie et faire valoir ses revendications sur d'autres @LAT@LITpays baltes, et tentera également de créer un soulèvement en @KARCarélie pour déclencher une guerre expansionniste contre l'@SOVUnion soviétique. L'IA aura une coopération militaire limitée avec le @GERAllemagne."
 RULE_OPTION_KOKOOMUS_ALLIES:"Kansalliset Puolueet - Alliés"
 RULE_KOKOOMUS_ALLIES_FIN_AI_DESC:"@FINFinland maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques. L’IA tentera de rejoindre les Alliés dans les années 1940 – généralement après la fin de la guerre d’hiver. »
 RULE_OPTION_KOKOOMUS_ALLIES_BALTIC:"Kansalliset Puolueet - Revendications baltes des alliés"
 RULE_KOKOOMUS_ALLIES_BALTIC_FIN_AI_DESC:"@FINFinland maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques. @FINFinlande tentera de parvenir à un accord pour fusionner avec @ESTEstonie et faire valoir ses droits sur d'autres @LAT@LITpays baltes. L’IA tentera de rejoindre les Alliés dès qu’elle le pourra – une fois que la tension mondiale sera suffisamment élevée. »
 RULE_OPTION_KOKOOMUS_ALLIES_EXP:"Risto Ryti - Expansionnisme des Alliés"
 RULE_KOKOOMUS_ALLIES_EXP_FIN_AI_DESC:"@FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale, mais en restant fidèle à l'expansionniste Risto Ryti dans le Kansallinen Edistyspuolue. @FINFinlande tentera de parvenir à un accord pour fusionner avec @ESTEstonie et faire valoir ses revendications sur d'autres @LAT@LITpays baltes, et tentera également de créer un soulèvement en @KARCarélie pour déclencher une guerre expansionniste contre l'@SOVUnion soviétique. L’IA tentera de rejoindre les Alliés dès qu’elle le pourra – une fois que la tension mondiale sera suffisamment élevée. »
 RULE_OPTION_KOKOOMUS_NORDIC:"Kansalliset Puolueet - Front Nord"
 RULE_KOKOOMUS_NORDIC_FIN_AI_DESC:"@FINFinland maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques. L'IA tentera de créer le Front de défense du Nord et d'inviter tous les autres §Rnon-communistes§ ! @FIN@DEN@NOR@SWEPays nordique dans les années 1940 - généralement après la fin de la guerre d'hiver."
