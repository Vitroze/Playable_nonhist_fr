 RULE_OPTION_GER_ALT_FASCIST:"Fasciste - Les préoccupations de Neurath"
 RULE_OPTION_GER_ALT_FASCIST_AI_DESC:"L'IA @GERallemande §Lendra compte des préoccupations de Von Neurath§!, renonçant au pacte Molotov-Ribbentrop. L'IA envahira également @SWISwitzerland et @IREIreland ainsi que les @CZE@POL@HOL@BEL@FRA@NOR@DENcibles historiques, et se liera d'amitié avec @CHIChina au lieu de @JAPJapan."
 RULE_OPTION_GER_ALT_FASCIST_WW:"Fasciste - Technocratique"
 RULE_OPTION_GER_ALT_FASCIST_WW_AI_DESC:"L'IA @GERallemande suivra principalement la §Lvoie historique§!, mais abandonnera les projets de loi MEFO qui donnent la priorité à la croissance économique, se concentreront sur les primes à la recherche et développeront des armes miracles, ce qui ralentira les orientations politiques. L'IA tentera d'annexer à la fois la @CZEla Tchécoslovaquie et la @YUGla Yougoslavie avant de déclarer la guerre à la @POLla Pologne et de tenter de s'allier à la fois à l'@ITAl'Italie et à la @SPRl'Espagne.
 RULE_OPTION_GER_ALT_FASCIST_FRIENDLY:"Fasciste - Diplomatique"
 RULE_OPTION_GER_ALT_FASCIST_FRIENDLY_AI_DESC:"L'IA @GERallemande §Lire les préoccupations de Von Neurath§! et abandonnera les projets de loi MEFO pour donner la priorité à la croissance économique. L’IA mettra tout en œuvre pour améliorer les relations commerciales, diplomatiques et d’alliance avec d’autres nations. @GERL'Allemagne échangera @POLDanzig contre @SLOSlovaquie après avoir intégré @CZETchécoslovaquie, tentera d'influencer le @HOL@BEL@LUXBenelux, @DEN@NOR@SWENordics et @LIT@LAT@ESTBaltics, ainsi que @JAPJapan, @ITAItaly, @SPRSpain, @PORPortugal et @TURTurkey. L’IA ne réussira peut-être pas à influencer tout le monde et déclarera quand même la guerre à la @FRAFrance et au @SOVSoviets. »
 RULE_OPTION_GER_ALT_FASCIST_BLITZKRIEG:0"Fasciste - Véritable Blitzkrieg"
 RULE_OPTION_GER_ALT_FASCIST_BLITZKRIEG_AI_DESC:0"L'IA @GERallemande suivra principalement la §Lroute historique§!, mais se précipitera pour déclarer la guerre à @POLPologne au-dessus de Dantzig un an plus tôt, en 1938, l'IA débutera également la guerre dans l'@SOVUnion soviétique."
 RULE_OPTION_GER_ALT_FASCIST_EXP:"Fasciste - Irrédentisme belliqueux"
 RULE_OPTION_GER_ALT_FASCIST_EXP_AI_DESC:"L'IA @GERallemande §Lendra compte des préoccupations de Von Neurath§!, renonçant au pacte Molotov-Ribbentrop. L’IA mettra tout en œuvre pour envahir et imposer des exigences à ces nations : "
