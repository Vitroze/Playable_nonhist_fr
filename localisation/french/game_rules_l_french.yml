  RULE_OPTION_YES:0 "Oui"
  RULE_OPTION_NO:0 "Non"
  RULE_GROUP_COUNTRY_SPECIFIC:0 "Règles de jeu spécifiques aux pays"
  RULE_GROUP_GENERAL_FOREIGN_POLICY:0 "Politique étrangère"
  RULE_ALLOW_WARGOALS:0 "Objectifs de guerre"
  RULE_OPTION_ALWAYS_FREE:0 "Toujours libre"
  RULE_ALLOW_WARGOALS_ALWAYS_FREE_DESC:0 "Sans restriction pour toute idéologie à n'importe quelle tension mondiale."
  RULE_OPTION_LIMITED:0 "Limité"
  RULE_ALLOW_WARGOALS_LIMITED_DESC:0 "La génération d'objectifs de guerre est limitée par les idéologies et les limites de tension mondiale."
  RULE_OPTION_FREE_25:0 "Libre à 25% de tension mondiale"
  RULE_OPTION_FREE_50:0 "Libre à 50% de tension mondiale"
  RULE_OPTION_FREE_75:0 "Libre à 75% de tension mondiale"
  RULE_OPTION_FREE_100:0 "Libre à 100% de tension mondiale"
  RULE_ALLOW_WARGOALS_FREE_25_DESC:1 "La génération d'objectifs de guerre est désactivée en dessous de 25% de tension mondiale, mais disponible pour toutes les nations ensuite. Cela annule toute restriction d'idéologie, mais permet toujours d'obtenir des objectifs de guerre par le biais des focus."
  RULE_ALLOW_WARGOALS_FREE_50_DESC:1 "La génération d'objectifs de guerre est désactivée en dessous de 50% de tension mondiale, mais disponible pour toutes les nations ensuite. Cela annule toute restriction d'idéologie, mais permet toujours d'obtenir des objectifs de guerre par le biais des focus."
  RULE_ALLOW_WARGOALS_FREE_75_DESC:1 "La génération d'objectifs de guerre est désactivée en dessous de 75% de tension mondiale, mais disponible pour toutes les nations ensuite. Cela annule toute restriction d'idéologie, mais permet toujours d'obtenir des objectifs de guerre par le biais des focus."
  RULE_ALLOW_WARGOALS_FREE_100_DESC:1 "La génération d'objectifs de guerre est désactivée en dessous de 100% de tension mondiale, mais disponible pour toutes les nations ensuite. Cela annule toute restriction d'idéologie, mais permet toujours d'obtenir des objectifs de guerre par le biais des focus."
  RULE_OPTION_FOCUSES_ONLY:0 "Focus uniquement"
  RULE_ALLOW_WARGOALS_FOCUSES_ONLY_DESC:0 "Les objectifs de guerre ne peuvent être obtenus que par les focus nationaux, les événements et les décisions."
  RULE_OPTION_FOCUSES_ONLY_38:0 "Focus uniquement (jusqu'en 1938)"
  RULE_ALLOW_WARGOALS_FOCUSES_ONLY_38_DESC:0 "Les objectifs de guerre ne peuvent être obtenus que par les focus nationaux, les événements et les décisions, jusqu'en 1938."
  RULE_OPTION_FOCUSES_ONLY_39:0 "Focus uniquement (jusqu'en 1939)"
  RULE_ALLOW_WARGOALS_FOCUSES_ONLY_39_DESC:0 "Les objectifs de guerre ne peuvent être obtenus que par les focus nationaux, les événements et les décisions, jusqu'en 1939."
  RULE_OPTION_FOCUSES_ONLY_40:0 "Focus uniquement (jusqu'en 1940)"
  RULE_ALLOW_WARGOALS_FOCUSES_ONLY_40_DESC:0 "Les objectifs de guerre ne peuvent être obtenus que par les focus nationaux, les événements et les décisions, jusqu'en 1940."
  RULE_ALLOW_MILITARY_ACCESS:0 "Accès militaire et droits d'accostage"
  RULE_OPTION_FREE:0 "Libre"
  RULE_OPTION_SAME_IDEOLOGY:0 "Même idéologie uniquement"
  RULE_OPTION_SAME_FACTION:0 "Même faction uniquement"
  RULE_OPTION_BLOCKED:0 "Bloqué"
  RULE_OPTION_ALLOWED:0 "Autorisé"
  RULE_OPTION_AI_ONLY:0 "Contre l'IA uniquement"
  RULE_OPTION_PLAYER_ONLY:0 "Contre le joueur uniquement"
  RULE_OPTION_NORMAL:0 "Normal"
  RULE_OPTION_NONE:0 "Aucun"
  RULE_ALLOW_ACCESS_FREE_DESC:0 "Les pays peuvent obtenir l'accès militaire et les droits d'accostage de n'importe quel autre pays."
  RULE_ALLOW_ACCESS_SAME_IDEOLOGY_DESC:0 "Les pays peuvent obtenir l'accès militaire et les droits d'accostage des pays qui partagent la même idéologie dirigeante."
  RULE_ALLOW_ACCESS_BLOCKED_DESC:0 "Les pays ne peuvent jamais obtenir l'accès militaire et les droits d'accostage de n'importe quel autre pays en dehors d'une faction."
  RULE_ALLOW_RELEASE_NATIONS:0 "Libérer les nations"
  RULE_ALLOW_RELEASE_NATIONS_FREE_DESC:0 "Les pays peuvent toujours libérer des nations sauf si spécifiquement empêchés."
  RULE_OPTION_PEACE_ONLY:0 "Uniquement en temps de paix"
  RULE_ALLOW_RELEASE_NATIONS_PEACE_ONLY_DESC:0 "Les pays ne peuvent libérer des nations qu'en temps de paix."
  RULE_ALLOW_RELEASE_NATIONS_BLOCKED_DESC:0 "Les pays ne peuvent jamais libérer des nations."
  RULE_ALLOW_RELEASE_NATIONS_NOT_BRITAIN_TOOLTIP:0 "§Y[ENG.GetName]§! ne peut libérer ce pays que via la branche §YDécolonisation§! dans l'§YArbre de focus§!."
  RULE_ALLOW_RELEASE_NATIONS_NOT_YUGOSLAVIA_TOOLTIP:0 "§Y[YUG.GetName]§! ne peut libérer ce pays que via la branche §YAutonomie§! dans l'§YArbre de focus§!."
  RULE_ALLOW_RELEASE_NATIONS_NOT_TRANSYLVANIA_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! ne peut pas libérer ce pays."
  RULE_ALLOW_RELEASE_NATIONS_NOT_GERMAN_CONSTITUENT_STATES_TOOLTIP: "§Y[ROOT.GetNameDefCap]§! ne peut pas libérer les États constitutifs allemands."
  RULE_ALLOW_RELEASE_NATIONS_NOT_ETHIOPIA_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! ne peut pas libérer ce pays."
  RULE_ALLOW_RELEASE_NATIONS_POLAND_DANZIG_TOOLTIP:0 "§Y[DNZ.GetNameDefCap]§! ne peut jamais être libéré."
  RULE_ALLOW_RELEASE_NATIONS_POLAND_KASHUBIA_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! ne peut pas libérer §Y[KSH.GetNameDef]§!."
  RULE_ALLOW_RELEASE_NATIONS_COSSACK_TOOLTIP:0 "Ce pays ne peut être libéré que par événement."
  RULE_ALLOW_RELEASE_NATIONS_POLAND_SILESIA_TOOLTIP:0 "§Y[ROOT.GetNameDefCap]§! ne peut pas libérer §Y[SIL.GetNameDef]§!."
  RULE_ALLOW_RELEASE_NATIONS_NOT_ITALY_TOOLTIP:0 "§Y[ROOT.GetName]§! ne peut pas libérer §YYougoslavie§! en tant que pays, il peut cependant libérer tout autre pays avec un cœur en Yougoslavie."
  RULE_ALLOW_RELEASE_NATIONS_NOT_ETHIOPIA_COMPLIANCE_TOOLTIP:0 "§Y[ROOT.GetName]§! ne peut pas libérer §YÉthiopie§! en tant que pays jusqu'à ce qu'il ait une conformité supérieure à §Y70%§! dans tous les États éthiopiens."
  RULE_ALLOW_RELEASE_NATIONS_ITALY_PAP_TOOLTIP:0 "§Y[ROOT.GetName]§! ne peut pas libérer §Y[PAP.GetName]§! en tant que pays après avoir complété le focus §Y$ITA_seek_papal_support$§!."
  RULE_ALLOW_RELEASE_NATIONS_SPAIN_TOOLTIP:0 "§Y[ROOT.GetName]§! ne peut libérer ce pays qu'après la conclusion de la guerre civile espagnole."
  RULE_ALLOW_RELEASE_NATIONS_ANARCHIST_SPAIN_TOOLTIP:0 "§Y[ROOT.GetName]§! §Rest une commune anarchiste et ne peut pas libérer ou marionneter des nations.§!"
  RULE_ALLOW_RELEASE_NATIONS_SOVIET_TOOLTIP: "§Y[ROOT.GetNameDefCap]§! ne peut pas libérer ce pays sauf après avoir complété le focus §Y$SOV_autonomous_soviet_republics$§! ou le focus §Y$SOV_reconvene_the_zemsky_sobor$§!."
  RULE_ALLOW_RELEASE_NATIONS_PEACE_ONLY_TOOLTIP:0 "Règle de jeu : §RLes pays ne peuvent libérer des nations qu'en temps de paix.§!"
  RULE_ALLOW_RELEASE_NATIONS_BLOCKED_TOOLTIP:0 "Règle de jeu : §RLes pays ne peuvent jamais libérer des nations.§!"
  RULE_ALLOW_LICENSING:0 "Licences de production"
  RULE_ALLOW_LICENSING_FREE_DESC:0 "Les pays peuvent acquérir des licences de production de n'importe quel pays."
  RULE_ALLOW_LICENSING_SAME_IDEOLOGY_DESC:0 "Les pays ne peuvent acquérir des licences de production que des pays qui partagent la même idéologie dirigeante."
  RULE_ALLOW_LICENSING_SAME_FACTION_DESC:0 "Les pays ne peuvent acquérir des licences de production que des pays de la même faction."
  RULE_ALLOW_LICENSING_BLOCKED_DESC:0 "Les pays ne peuvent jamais acquérir de licences de production en dehors des décisions et événements spéciaux."
  RULE_ALLOW_LEND_LEASE:0 "Prêt-bail"
  RULE_ALLOW_LEND_LEASE_FREE_DESC:0 "Les pays peuvent prêter-bailer du matériel à n'importe qui à n'importe quel niveau de tension mondiale."
  RULE_ALLOW_LEND_LEASE_LIMITED_DESC:0 "Le prêt-bail est limité par les règles de tension mondiale et d'idéologie."
  RULE_ALLOW_LEND_LEASE_SAME_IDEOLOGY_DESC:0 "Les pays ne peuvent prêter-bailer du matériel qu'aux pays de la même idéologie dirigeante."
  RULE_ALLOW_LEND_LEASE_SAME_FACTION_DESC:0 "Les pays ne peuvent prêter-bailer du matériel qu'aux pays de la même faction."
  RULE_ALLOW_LEND_LEASE_BLOCKED_DESC:0 "Les pays ne peuvent jamais prêter-bailer du matériel à un autre pays."
  RULE_ALLOW_VOLUNTEERS:0 "Volontaires"
  RULE_ALLOW_VOLUNTEERS_FREE_DESC:0 "Les pays peuvent envoyer des volontaires à n'importe quel pays indépendamment de la tension mondiale."
  RULE_ALLOW_VOLUNTEERS_LIMITED_DESC:0 "L'envoi de volontaires est restreint par les règles de tension mondiale et d'idéologie."
  RULE_ALLOW_VOLUNTEERS_SAME_IDEOLOGY_DESC:0 "Les pays ne peuvent envoyer des volontaires qu'aux pays qui partagent la même idéologie dirigeante."
  RULE_ALLOW_VOLUNTEERS_BLOCKED_DESC:0 "Les pays ne peuvent jamais envoyer de volontaires à un autre pays."
  RULE_ALLOW_GUARANTEES:0 "Garantir l'indépendance"
  RULE_ALLOW_GUARANTEES_FREE_DESC:0 "L'indépendance de n'importe quel pays peut être garantie à tout moment, indépendamment de la tension mondiale."
  RULE_ALLOW_GUARANTEES_LIMITED_DESC:0 "L'émission d'une garantie d'indépendance est restreinte par la tension mondiale et l'idéologie."
  RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_DESC:0 "Les pays ne peuvent garantir l'indépendance qu'aux pays qui partagent leur idéologie dirigeante."
  RULE_ALLOW_GUARANTEES_BLOCKED_DESC:0 "Les pays ne peuvent jamais garantir l'indépendance d'autres pays. Cela n'affecte pas les garanties qui existent au début du jeu ou qui sont émises par le biais de focus nationaux."
  RULE_ALLOW_REVOKE_GUARANTEES:0 "Révoquer les garanties"
  RULE_ALLOW_REVOKE_GUARANTEES_ALLOWED_DESC:0 "Les garanties d'indépendance peuvent être révoquées."
  RULE_ALLOW_REVOKE_GUARANTEES_BLOCKED_DESC:0 "Les garanties d'indépendance ne peuvent jamais être révoquées en dehors des focus nationaux."
  RULE_ALLOW_REVOKE_GUARANTEES_BLOCKED_TOOLTIP:0 "Règle de jeu : §RLes garanties d'indépendance ne peuvent jamais être révoquées en dehors des focus nationaux.§!"
  RULE_ALLOW_LEAVE_FACTION:0 "Quitter la faction"
  RULE_ALLOW_LEAVE_FACTION_ALLOWED_DESC:0 "Les pays entièrement souverains peuvent quitter une faction en temps de paix."
  RULE_ALLOW_LEAVE_FACTION_BLOCKED_DESC:0 "Les pays ne peuvent pas quitter une faction sauf par le biais de focus nationaux et d'événements."
  RULE_ALLOW_KICK_FACTION:0 "Expulser de la faction"
  RULE_ALLOW_KICK_FACTION_ALLOWED_DESC:0 "Le leader d'une faction peut expulser n'importe quel pays de la faction."
  RULE_ALLOW_KICK_FACTION_BLOCKED_DESC:0 "Le leader d'une faction ne peut expulser aucun membre de la faction."
  RULE_ALLOW_TAKE_OVER_FACTION:0 "Prendre le leadership de la faction"
  RULE_ALLOW_TAKE_OVER_FACTION_ALLOWED_DESC:0 "Les pays peuvent prendre le leadership de la faction s'ils remplissent les critères."
  RULE_ALLOW_TAKE_OVER_FACTION_BLOCKED_DESC:0 "Les pays ne peuvent pas prendre le leadership de la faction."
  RULE_GROUP_DIVISION_TEMPLATES:0 "Modèles de division"
  RULE_ALLOW_PARATROOPERS:0 "Parachutages"
  RULE_ALLOW_PARATROOPERS_ALLOWED_DESC:0 "Les pays peuvent exécuter des parachutages librement."
  RULE_ALLOW_PARATROOPERS_BLOCKED_DESC:0 "Les pays ne peuvent exécuter de parachutages dans aucune circonstance. Les divisions parachutistes peuvent toujours être recrutées, mais ne pourront pas exécuter d'attaques aéroportées."
  RULE_ALLOW_PARATROOPERS_BLOCKED_TOOLTIP:0 "Règle de jeu : §RLes pays ne peuvent exécuter de parachutages dans aucune circonstance.§!"
  RULE_GROUP_COVERT_ACTIONS:0 "Actions clandestines"
  RULE_ALLOW_COUPS:0 "Coups d'État"
  RULE_ALLOW_COUPS_FREE_DESC:0 "Les pays peuvent préparer et exécuter des coups d'État librement."
  RULE_ALLOW_COUPS_AI_ONLY_DESC:0 "Les pays ne peuvent préparer et exécuter des coups d'État que contre des nations non jouées par un humain."
  RULE_ALLOW_COUPS_BLOCKED_DESC:1 "Les pays ne peuvent préparer ou exécuter des coups d'État dans aucune nation."
  RULE_ALLOW_PARTY_BOOSTING:0 "Augmenter la popularité du parti"
  RULE_ALLOW_PARTY_BOOSTING_FREE_DESC:0 "Les pays peuvent augmenter la popularité du parti dans n'importe quel autre pays."
  RULE_ALLOW_PARTY_BOOSTING_AI_ONLY_DESC:0 "Les pays ne peuvent augmenter la popularité du parti que dans les pays non joués par un humain."
  RULE_ALLOW_PARTY_BOOSTING_PLAYER_ONLY_DESC:0 "Les pays ne peuvent augmenter la popularité du parti que dans les pays avec un joueur humain."
  RULE_ALLOW_PARTY_BOOSTING_BLOCKED_DESC:0 "Les pays ne peuvent augmenter la popularité du parti dans aucun pays."
  RULE_GROUP_CONSTRUCTION:0 "Construction"
  RULE_GROUP_GAMEPLAY:0 "Règles de jeu"
  RULE_MAXIMUM_FORT_LEVEL:0 "Niveau maximum de fort"
  RULE_MAXIMUM_FORT_LEVEL_NORMAL_DESC:0 "Les pays peuvent construire des forts terrestres et côtiers selon les restrictions normales."
  RULE_MAXIMUM_FORT_LEVEL_DESC:0 "Les pays ne peuvent construire des forts terrestres et côtiers qu'au niveau sélectionné. Les fortifications présentes au début du jeu ne sont pas affectées par ceci. Les bâtiments accordés par les focus nationaux, les décisions et les événements peuvent dépasser le niveau sélectionné."
  RULE_GROUP_RESEARCH:0 "Recherche"
  RULE_RESEARCH_AOT:0 "Recherche en avance sur son temps"
  RULE_RESEARCH_AOT_FREE_DESC:0 "Les pays peuvent rechercher des technologies en avance sur leur temps sans restrictions."
  RULE_RESEARCH_AOT_THREE_YEARS_DESC:0 "Les pays ne peuvent rechercher des technologies que trois ans à l'avance."
  RULE_RESEARCH_AOT_TWO_YEARS_DESC:0 "Les pays ne peuvent rechercher des technologies que deux ans à l'avance."
  RULE_RESEARCH_AOT_ONE_YEARS_DESC:0 "Les pays ne peuvent rechercher des technologies qu'un an à l'avance."
  RULE_RESEARCH_AOT_BLOCKED_DESC:0 "Les pays ne peuvent pas rechercher des technologies en avance sur leur temps."
  RULE_ALLOW_SCORCHED_EARTH:0 "Politique de la terre brûlée"
  RULE_ALLOW_SCORCHED_EARTH_ALLOWED_DESC:0 "Les pays peuvent utiliser la politique de la terre brûlée librement."
  RULE_ALLOW_SCORCHED_EARTH_BLOCKED_DESC:0 "Les pays ne peuvent pas utiliser la politique de la terre brûlée dans aucune circonstance."
  RULE_ALLOW_SCORCHED_EARTH_BLOCKED:0 "La politique de la terre brûlée est désactivée dans les règles de jeu personnalisées."
