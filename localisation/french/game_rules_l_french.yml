 RAJ_PRINCELY_STATES_FREE:0"Etats Princiers Libres"
 RULE_OPTION_RAJ_PRINCELY_STATES_FREE:"Etats Princiers Libres"
 RULE_OPTION_RAJ_PRINCELY_STATES_FREE_DESC:"Les États princiers indiens seront libérés au début du jeu. "
 ETH_FRAGMENTATION_STATUS:0"Statut de fragmentation de l'Éthiopie"
