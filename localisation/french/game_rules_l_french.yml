 RULE_FASCIST_POL_AI_DESC:0"L'IA @POLPolish écrira un nationaliste et §Lfasciste§ ! constitution, et se réconciliera avec le @GERAllemagne pour la protection, demandant le @SOVle territoire soviétique en échange de sa loyauté.
 RULE_OPTION_DEMOCRATIC_ALLIES:0"Démocrate - Rejoignez les alliés"
 RULE_OPTION_DEMOCRATIC_POL_AI_DESC:0"La grève des paysans @POLPolonais renversera le gouvernement, et le §CPSL§ ! prendra le leadership. L'IA polonaise tentera alors de rejoindre les Alliés. Avec le DLC 'No Step Back', l'IA fera pression pour @LIBLiberia et garantira les @EST@LAT@LIT pays baltes."
 RULE_OPTION_DEMOCRATIC_MORGES:0"Démocratique - Pacte de Morges"
 RULE_OPTION_DEMOCRATIC_MORGES_POL_AI_DESC:0"La grève des paysans @POLPolonais renversera le gouvernement, et le §CPSL§ ! prendra le leadership. L'IA polonaise tentera alors de créer le Front Morges avec @FRAFrance, invitera @ROMRomania dans la faction et fera pression pour @LIBLiberia."
 RULE_OPTION_DEMOCRATIC_MIEDZYMORZE:0"Démocratique - Międzymorze"
 RULE_OPTION_DEMOCRATIC_MIEDZYMORZE_POL_AI_DESC:0"La grève des paysans @POLPolonais renversera le gouvernement, et le §CPSL§ ! prendra le leadership. L'IA polonaise tentera alors de créer le Międzymorze avec @FRAFrance, et invitera autant de pays européens que possible à rejoindre l'accord.
 RULE_OPTION_GERMAN_PUPPET:0"Fasciste - Loyauté allemande"
 RULE_OPTION_FASCIST_POL_INDEPENDENT:0"Fasciste - Indépendance polonaise"
 RULE_FASCIST_INDEPENDENT_POL_AI_DESC:0"L'IA @POLPolish écrira un nationaliste et §Lfasciste§ ! constitution, et se réconciliera avec @GERAllemagne pour la protection, mais déclarera son indépendance vis-à-vis de @GERAllemagne en fin de partie."
 RULE_OPTION_FALANGE:0"Phalangiste - Commonwealth"
 RULE_FALANGE_POL_AI_DESC:0"L'IA @POLPolish écrira un nationaliste et §Lfasciste§ ! constitution et adhèrent au falangisme. Ils créeront une faction phalangiste et demanderont à @LITLituanie de former le @POL@LIT Commonwealth polono-lituanien."
 RULE_OPTION_FALANGE_INTERNATIONAL:0"Falangiste Internationale"
 RULE_FALANGE_INTERNATIONAL_POL_AI_DESC:0"L'IA @POLPolish écrira un nationaliste et §Lfasciste§ ! constitution et adhèrent au falangisme. L'IA tentera de créer un Intermarium phalangiste avec autant d'alliés que possible pour s'opposer à la fois à l'@GERAllemagne et à l'@SOVUnion soviétique."
 RULE_OPTION_COMMONWEALTH:0"Monarchiste - Commonwealth"
 RULE_COMMONWEALTH_POL_AI_DESC:0"L'IA @POLpolonaise couronnera Friedrich Christian comme roi et tentera de restaurer le @POL@LITCommonwealth polono-lituanien, y compris les territoires de l'Est."
 RULE_OPTION_COMMONWEALTH_ALLIES:0"Monarchiste - Alliés du Commonwealth"
 RULE_COMMONWEALTH_ALLIES_POL_AI_DESC:0"L'IA @POLPolish couronnera Friedrich Christian comme roi et tentera de restaurer le @POL@LITCommonwealth polono-lituanien. Ils tenteront alors de rejoindre les Alliés. »
 RULE_OPTION_COMMONWEALTH_ALLIANCE:0"Pacte monarchiste - Commonwealth"
 RULE_COMMONWEALTH_ALLIANCE_POL_AI_DESC:0"L'IA @POLPolish couronnera Friedrich Christian comme roi et tentera de restaurer le @POL@LITCommonwealth polono-lituanien. Ils chercheront alors à former une faction avec une puissance impériale européenne continentale, s’il en existe. »
 RULE_OPTION_ROMANIA_ALLIES:0"Monarchiste - Alliés Pologne-Roumanie"
 RULE_ROMANIA_ALLIES_POL_AI_DESC:0"L'IA @POLPolish couronnera un Hohenzollern comme roi et tentera de former une union avec @ROMRomania. Ils tenteront alors de rejoindre les Alliés. »
 RULE_OPTION_ROMANIA_ALLIANCE:0"Pacte monarchiste - Pologne-Roumanie"
 RULE_ROMANIA_ALLIANCE_POL_AI_DESC:0"L'IA @POLPolish couronnera un Hohenzollern comme roi et tentera de former une union avec @ROMRomania. Ils chercheront alors à former une faction avec une puissance impériale européenne continentale, s’il en existe. »
 RULE_OPTION_ROMANIA:0"Monarchiste - Pologne-Roumanie"
 RULE_ROMANIA_POL_AI_DESC:0"L'IA @POLPolish couronnera un Hohenzollern comme roi et tentera de former une union avec @ROMRomania. L'IA tentera alors de revendiquer @SLOSlovaquie et @HUNHongrie comme unions personnelles."
 RULE_OPTION_HABSBURG:0"Monarchiste - Roi des Habsbourg"
 RULE_HABSBURG_POL_AI_DESC:0"L'IA @POLPolish couronnera Karl Albrecht von Habsburg comme roi et tentera de former une union avec la @CZETchécoslovaquie. L'IA tentera alors de créer une alliance avec les Habsbourg ou de faire valoir ses revendications sur la @HUNHongrie."
 RULE_OPTION_HABSBURG_ALLIES:0"Monarchiste - Alliés des Habsbourg"
 RULE_HABSBURG_ALLIES_POL_AI_DESC:0"L'IA @POLPolish couronnera Karl Albrecht von Habsburg comme roi et tentera de former une union avec la @CZETchécoslovaquie. L'IA tentera alors de rejoindre les Alliés."
 RULE_OPTION_HABSBURG_ALLIANCE:0"Pacte monarchiste - Roi des Habsbourg"
 RULE_HABSBURG_ALLIANCE_POL_AI_DESC:0"L'IA @POLPolish couronnera Karl Albrecht von Habsburg comme roi et tentera de former une union avec la @CZETchécoslovaquie. Ils chercheront alors à former une faction avec une puissance impériale européenne continentale, s’il en existe. »
 RULE_OPTION_BERMONDT:0"Monarchiste - Bermondtien"
 RULE_BERMONDT_POL_AI_DESC:0"L'IA @POLpolonaise couronnera Pavel Bermondt-Avalov comme roi, fera des demandes sur le territoire @GERallemand et envahira l'@SOVUnion soviétique en fin de partie."
 RULE_OPTION_BERMONDT_ALLIANCE:0"Pacte monarchiste - Bermondtien"
 RULE_BERMONDT_ALLIANCE_POL_AI_DESC:0"L'IA @POLPolish couronnera Pavel Bermondt-Avalov comme roi et cherchera ensuite à former une faction avec une puissance impériale européenne continentale, s'il en existe."
 RULE_OPTION_BERMONDT_RK_LOYAL:0"Monarchiste - Axe bermondtien"
 RULE_BERMONDT_RK_LOYAL_POL_AI_DESC:0"L'IA @POLpolonaise couronnera Pavel Bermondt-Avalov comme roi et s'alignera sur les intérêts de @GERallemands en échange du @SOVterritoire soviétique."
 RULE_OPTION_BERMONDT_RK_INDEPENDENT:0"Monarchiste - Rebelle bermondtien"
 RULE_BERMONDT_RK_INDEPENDENT_POL_AI_DESC:0"L'IA @POLPolish couronnera Pavel Bermondt-Avalov comme roi et s'alignera sur les intérêts du @GERallemand, mais déclarera son indépendance du @GERAllemagne en fin de partie."
 RULE_OPTION_ROMANOV:0"Monarchiste - Romanov"
 RULE_ROMANOV_POL_AI_DESC:0"L'IA @POLPolish couronnera "Anastasia Romanov" comme roi et visera à créer une Union slave !"
 RULE_OPTION_ROMANOV_ALLIANCE:0"Pacte monarchiste - Romanov"
 RULE_ROMANOV_ALLIANCE_POL_AI_DESC:0"L'IA @POLPolish couronnera « Anastasia Romanov » comme roi, mais ses ambitions seront tempérées ! L’IA cherchera à former une faction avec une puissance impériale européenne continentale s’il en existe, mais ne s’alliera pas avec @SOVRussie. »
 RULE_OPTION_UNITED_FRONT_CHI_AI_DESC:0"L'IA @CHIChinese tentera de se concentrer sur l'unification de la Chine et la formation du Front Uni. »
 RULE_OPTION_INTERIOR_CHI_AI_DESC:0"L'IA @CHIChinese tentera de consolider le pouvoir en Chine en prenant le contrôle des seigneurs de guerre avant de se battre avec les @JAPJaponais."
 RULE_OPTION_HISTORICAL_CHI_AI_DESC:0"L’IA chinoise @CHI maintiendra la domination de Chiang Kai-Shek. »
 RULE_OPTION_FOCUS_HISTORICAL_CHI_AI_DESC:0"L’IA @CHIChinese passera du temps à construire le pays et n’essaiera de former le Front Uni que si la situation mondiale l’exige. (comme la RPCLa Chine communiste proposant une alliance.)"
 RULE_OPTION_DEMOCRATIC_CHI_AI_DESC:0"L'IA @CHIChinese tentera de se réformer lentement en une §Cdémocratie§ moderne ! en utilisant la politique du Yuan. »

 #SEA

 RULE_OPTION_HISTORICAL_SEA:"Historique"
 RULE_OPTION_HISTORICAL_SEA_DESC:"L’IA chinoise tentera de suivre autant que possible la chaîne historique des événements. »

 RULE_OPTION_FASCIST_SEA:"Fasciste"
 RULE_OPTION_FASCIST_SEA_DESC:"L’IA chinoise tentera de suivre la voie fasciste de l’arbre des focus. »

 RULE_OPTION_WANG_JINGWEI_SEA:"Front Wang Jingwei"
 RULE_OPTION_WANG_JINGWEI_SEA_DESC:"L’IA chinoise tentera de suivre la voie de Wang Jingwei de l’arbre de concentration. »
 RULE_OPTION_DEMOCRATIC_SEA:"Ligue Démocratique Chinoise"
 RULE_OPTION_DEMOCRATIC_SEA_DESC:"L’IA chinoise tentera de suivre la voie de la Ligue démocratique dans l’arbre des priorités. »

 RULE_OPTION_MAOIST_PRC_AI_DESC:0"L'IA communiste chinoise de la @RPC suivra la politique du §RMaoïsme§!, cette voie a un comportement légèrement différent selon que l'option de focalisation historique est activée."
 RULE_OPTION_MARXIST_ORTHODOXY_PRC_AI_DESC:0"La @RPCl'IA communiste chinoise suivra la politique du §RSoviet Marxism§ ! promouvant Wang Ming au lieu de Mao, rejoignant finalement le Komintern.
 RULE_OPTION_SOCIAL_DEMOCRACY_PRC_AI_DESC:0"La @RPCl'IA communiste chinoise suivra la politique de la §RSDémocratie sociale§ ! promouvoir Zhang Lan au lieu de Mao, rejoindre le gouvernement @CHInationaliste et « retirer » Chiang Kai-Shek de la direction de la Chine. »
 RULE_OPTION_COMMUNIST_USA_AI_DESC:0"L'IA @USAUS tentera de devenir §Rcommuniste§ ! et rejoignez le Komintern."
 RULE_OPTION_COMMUNIST_ALTERNATE_USA_AI_DESC:0"L'IA des États-Unis et des États-Unis tentera de devenir §Rcommuniste§! et de rejoindre la @RPCChine communiste dans sa lutte. »
 RULE_OPTION_DEMOCRATIC_HISTORICAL_USA_AI_DESC:0"L’IA @USAUS restera §Cdémocratique§ ! et tenter de suivre autant que possible la chaîne historique des événements. »
 RULE_DEMOCRATIC_INTERVENTION_USA_AI_DESC:0"L’IA @USAUS restera §Cdémocratique§ ! et tenter de jouer un rôle plus actif dans les affaires mondiales en empruntant la voie pertinente dans l'arbre des priorités nationales.
 RULE_DEMOCRATIC_NEUTRALITY_USA_AI_DESC:0"L’IA @USAUS restera §Cdémocratique§ ! et tenter de maintenir la neutralité le plus longtemps possible, cette option de l'IA sera annulée si l'IA se retrouve en guerre sans précaution.
 RULE_FASCIST_USA_AI_DESC:0"L'IA @USAUS tentera de devenir §Lfasciste§ ! et relancer la confédération, puis tenter de créer un dominion nord-américain"
 RULE_JUNTA_USA_AI_DESC:0"L'IA @USAUS aura un §Lfasciste§ ! et la junte militaire prend le contrôle du pays, MacArthur ne renoncera pas au pouvoir après le coup d'État, et l'IA ne garantira que des intérêts immédiats dans @CUBCuba et @MEXMexico."
 RULE_HEGEMONY_USA_AI_DESC:0"L'IA @USAUS s'engagera sur le chemin de la guerre et tentera d'installer la liberté et la §Démocratie§ ! sur le monde entier. Par la force."
 RULE_OPTION_OBEDIENCE_MAN_AI_DESC:0"L'IA @MANManchu tentera de rester fidèle et de ne pas s'affirmer. §RCe chemin ne fonctionnera que si @JAPJapan est§! §LFasciste§! ou monarchiste.§!"
 RULE_OPTION_OBEDIENCE_CHINA_MAN_AI_DESC:0"L'IA @MANManchu tentera de rester fidèle autant que possible et de suivre la branche concernée dans l'arbre national, pour finalement devenir l'Empire de Chine.
  RULE_OPTION_INDEPENDENCE_MAN_AI_DESC:0"L'IA @MANManchu tentera de se libérer et de s'emparer de toute la Chine en descendant la branche appropriée de l'arbre national. »
 RULE_OPTION_INDEPENDENCE_FAS_MAN_AI_DESC:0"L'IA @MANManchu tentera de se libérer et de s'emparer de toute la Chine et de la Mandchourie extérieure en descendant la branche appropriée de l'arbre de concentration national.
 RULE_OPTION_INDEPENDENCE_NEU_MAN_AI_DESC:0"L'IA @MANManchu tentera de se libérer et de s'emparer de toute la Chine en tant que monarchie constitutionnelle en descendant la branche appropriée de l'arbre des priorités nationales.
 RULE_OPTION_INDEPENDENCE_DEM_MAN_AI_DESC:0"L'IA @MANManchu tentera de se libérer et d'assumer le rôle du nouveau gouvernement Beiyang en descendant la branche pertinente de l'arbre de concentration national.
 RULE_OPTION_INDEPENDENCE_COM_MAN_AI_DESC:0"L'IA @MANManchu tentera de se libérer et de devenir la République populaire de Chine en descendant la branche appropriée de l'arbre national.
 RULE_OPTION_CHINESE_LEADERSHIP_MAN_AI_DESC:0"L'IA @MANManchu tentera de rester fidèle et de s'affirmer en tant que @JAPgouvernement de coopération japonaise en @CHIChine §RCiette voie ne fonctionnera que si @JAPJapon l'est§ ! §LFasciste§! ou monarchiste.§!"
 RULE_OPTION_MANCHU_QING_MAN_AI_DESC:0"L'IA @MANManchu tentera de se libérer et, si elle obtient la liberté, tentera de conquérir @CHIChine pour le mandat céleste @MANManchurian."
 RULE_OPTION_MANCHU_QING_AGGR_MAN_AI_DESC:0"L'IA @MANManchu tentera de se libérer et si elle obtient la liberté, tentera de vassaliser @CHIChine, en adoptant la politique des « Cinq races sous une seule union »
 RULE_OPTION_COOPERATE_NAT:0"@CHIAlignement Nationaliste"
 RULE_OPTION_COOPERATE_NAT_AI_DESC:0"Ce chef de guerre s'alignera sur le @CHIKuomintang et coopérera avec eux, mais ils continueront à se défendre contre l'agression nationaliste. »
 RULE_OPTION_TAKEOVER_NAT:0"@CHIPrise de contrôle nationaliste"
 RULE_OPTION_TAKEOVER_NAT_AI_DESC:0"Ce chef de guerre s'alignera sur le @CHIKuomintang et coopérera avec eux, et tentera également de prendre la tête du gouvernement nationaliste.
 RULE_OPTION_OPPOSITION_NAT:0"Gouvernement d'opposition"
 RULE_OPTION_OPPOSITION_NAT_AI_DESC:0"Ce chef de guerre renoncera à s'aligner sur une faction existante et formera un nouveau gouvernement en opposition à la fois aux @CHInationalistes et à la @RPCcommunistes."
 RULE_OPTION_COOPERATE_COM:0"@RPCAlignement communiste"
 RULE_OPTION_COOPERATE_COM_AI_DESC:0"Ce chef de guerre s'alignera sur les §R@RPCCommunistes§ ! et coopérer avec eux, mais ils continueront à se défendre contre l'agression communiste. »
 RULE_OPTION_TAKEOVER_COM:0"@RPCPrise de pouvoir communiste"
 RULE_OPTION_TAKEOVER_COM_AI_DESC:0"Ce chef de guerre s'alignera sur les §R@RPCCommunistes§ ! et coopérer avec eux, et également tenter de prendre la tête du mouvement communiste en faisant des concessions au @SOVSoviets.
 RULE_OPTION_OPPOSITION_COM:0"Mouvement communiste d'opposition"
 RULE_OPTION_OPPOSITION_COM_AI_DESC:0"Ce chef de guerre renoncera à s’aligner sur une faction existante et formera un nouveau §Rcommuniste§ ! mouvement d'opposition aux @CHINationalistes et aux @PRCCommunistes."
 RULE_OPTION_COOPERATE_JAP:0"@JAPAlignement japonais"
 RULE_OPTION_COOPERATE_JAP_AI_DESC:0"Ce chef de guerre s'alignera sur le @JAPJaponais et coopérera avec eux contre d'autres factions chinoises, mais ils continueront à se défendre contre l'agression japonaise. »
 RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_TOOLTIP:0"Règle du jeu : §RLes pays ne peuvent garantir que les pays qui partagent leur idéologie dirigeante.§!"
 RULE_ALLOW_GUARANTEES_BLOCKED_TOOLTIP:0"Règle du jeu : §RLes pays ne peuvent jamais garantir les autres pays.§!"
 RULE_ALLOW_MILITARY_ACCESS_SAME_IDEOLOGY_TT:0"Règle du jeu : §RLes pays peuvent obtenir un accès militaire et des droits d'amarrage auprès de pays qui partagent la même idéologie dirigeante.§!"
 RULE_ALLOW_MILITARY_ACCESS_BLOCKED_TT:0"Règle du jeu : §RLes pays ne peuvent jamais obtenir d'accès militaire ni de droits d'amarrage d'un autre pays en dehors d'une faction.§!"
 RULE_ALLOW_LEND_LEASE_SAME_IDEOLOGY_TT:0"Règle du jeu : §RLes pays ne peuvent prêter ou louer du matériel qu'à des pays partageant la même idéologie dirigeante.§!"
