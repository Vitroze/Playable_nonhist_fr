  RULE_OPTION_FIN_DEMOCRATIC_ALLIES_SAMPI: "Alliés démocratiques - Gardien des Samis"
  RULE_OPTION_FIN_DEMOCRATIC_ALLIES_SAMPI_DESC: "Les @FINFinlandais §CSociaux-démocrates§! feront appel au peuple finlandais et mèneront un changement drastique mais sans effusion de sang dans le cours de la politique finlandaise. Le nouveau gouvernement socialiste commencera à s'opposer à l'@SOVUnion soviétique, et pourrait obtenir une garantie d'une @ENG@FRApuissance majeure puis rejoindra les Alliés en 1939. L'IA demandera le contrôle sur les sources de fer dans les territoires Samis de la @SWESuède et de la @NORNorvège."
  RULE_OPTION_FIN_DEMOCRATIC_ALLIES_FEDERATION: "Alliés démocratiques - Grande Fédération"
  RULE_OPTION_FIN_DEMOCRATIC_ALLIES_FEDERATION_DESC: "Les @FINFinlandais §CSociaux-démocrates§! feront appel au peuple finlandais et mèneront un changement drastique mais sans effusion de sang dans le cours de la politique finlandaise. Le nouveau gouvernement socialiste commencera à s'opposer à l'@SOVUnion soviétique, et pourrait obtenir une garantie d'une @ENG@FRApuissance majeure puis rejoindra les Alliés en 1939. L'IA demandera le contrôle sur les sources de fer dans les territoires Samis de la @SWESuède et de la @NORNorvège, et déclarera la guerre à l'@SOVUnion soviétique pour former la Grande Finlande fin 1940."
