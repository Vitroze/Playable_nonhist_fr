  GERMANY_FRAGMENTATION_STATUS: "Statut de fragmentation de l'Allemagne"
  RULE_OPTION_DEFAULT_GER_FRAGEMNTATION_DESC: "L'Allemagne est intacte comme dans l'histoire."
  RULE_OPTION_GERMANY_FRAGMENTED: "Allemagne fragmentée"
  RULE_OPTION_GERMANY_FRAGMENTED_DESC: "L'Allemagne commencera fragmentée en divers États plus petits."
  ASIA_COLONIZATION_STATUS:0 "Statut de colonisation de l'Asie"
  RULE_OPTION_ASIA_DECOLONIZED:0 "Asie décolonisée"
  RULE_OPTION_ASIA_DECOLONIZED_DESC:0 "Toutes les nations colonisées libérables en Asie sont libérées en tant que nations libres et indépendantes dès le début de la partie."
  OCEANIA_COLONIZATION_STATUS:0 "Statut de colonisation de l'Océanie"
  RULE_OPTION_OCEANIA_DECOLONIZED:0 "Océanie décolonisée"
  RULE_OPTION_OCEANIA_DECOLONIZED_DESC:0 "Toutes les nations colonisées libérables en Océanie sont libérées en tant que nations libres et indépendantes dès le début de la partie."
  RULE_OPTION_OCEANIA_UNITED:0 "Empire polynésien"
  RULE_OPTION_OCEANIA_UNITED_DESC:0 "La Polynésie sera unie en un seul pays dès le début de la partie."
  ENG_FRAGMENTATION_STATUS:0 "Statut de fragmentation du Royaume-Uni"
  RULE_OPTION_DEFAULT_FRAGMENTATION_DESC:0 "Aucun État-nation n'est fragmenté en ses parties constituantes."
  RULE_OPTION_ENG_FRAGMENTED:0 "Royaume-Uni fragmenté"
  RULE_OPTION_ENG_FRAGMENTED_DESC:0 "Toutes les nations constituantes libérables composant le Royaume-Uni sont libérées en tant que nations libres et indépendantes dès le début de la partie."
  SPR_FRAGMENTATION_STATUS:0 "Statut de fragmentation de l'Espagne"
  RULE_OPTION_SPR_FRAGMENTED:0 "Espagne fragmentée"
  RULE_OPTION_SPR_FRAGMENTED_DESC:0 "La Catalogne, la Galice et la Navarre seront libérées en tant qu'États libres et indépendants dès le début de la partie."
  RULE_OPTION_SPR_FAMILIAR:0 "11 novembre"
  RULE_OPTION_SPR_FAMILIAR_DESC:0 "Les frontières de l'Espagne seront redessinées en quelque chose de familier."
  FRA_FRAGMENTATION_STATUS:0 "Statut de fragmentation de la France"
  RULE_OPTION_FRA_FRAGMENTED:0 "France fragmentée"
  RULE_OPTION_FRA_FRAGMENTED_DESC:0 "Toutes les nations constituantes libérables composant la France seront libérées en tant qu'États libres et indépendants dès le début de la partie."
  YUG_FRAGMENTATION_STATUS:0 "Statut de fragmentation de la Yougoslavie"
  RULE_OPTION_YUG_FRAGMENTED:0 "Yougoslavie fragmentée"
  RULE_OPTION_YUG_FRAGMENTED_DESC:0 "Toutes les nations constituantes libérables composant la Yougoslavie sont libérées en tant que nations libres et indépendantes dès le début de la partie."
  SOV_FRAGMENTATION_STATUS:0 "Statut de fragmentation de l'Union soviétique"
  RULE_OPTION_SOV_FRAGMENTED:1 "Union soviétique dissoute"
  RULE_OPTION_SOV_FRAGMENTED_DESC:1 "L'Union soviétique aura toutes les RSS libérées dès le début de la partie, et ressemblera à ce qu'elle était juste après sa dissolution à la fin de la Guerre froide."
  RULE_OPTION_SOV_UTTERLY_FRAGMENTED:0 "Union soviétique fragmentée"
  RULE_OPTION_SOV_UTTERLY_FRAGMENTED_DESC:0 "Toutes les républiques, okrugs et territoires libérables composant l'Union soviétique sont libérés en tant que nations libres et indépendantes dès le début de la partie."
  NORDICS_FRAGMENTATION_STATUS: "Statut de fragmentation des pays nordiques"
  RULE_OPTION_SAPMI_RELEASED: "Sápmi libéré"
  RULE_OPTION_SAPMI_RELEASED_DESC: "Sápmi sera libéré de la Finlande, de la Suède et de la Norvège."
  RULE_OPTION_NORDICS_FRAGMENTED: "Pays nordiques fragmentés"
  RULE_OPTION_NORDICS_FRAGMENTED_DESC: "Les pays nordiques seront fragmentés et divisés."
  RAJ_FRAGMENTATION_STATUS:0 "Statut de fragmentation de l'Inde"
  RULE_OPTION_RAJ_FRAGMENTED:0 "Raj britannique fragmenté"
  RAJ_PRINCELY_STATES_FREE:0 "États princiers libres"
  RULE_OPTION_RAJ_PRINCELY_STATES_FREE: "États princiers libres"
  RULE_OPTION_RAJ_PRINCELY_STATES_FREE_DESC: "Les États princiers indiens seront libérés dès le début de la partie."
  ETH_FRAGMENTATION_STATUS:0 "Statut de fragmentation de l'Éthiopie"
  RULE_OPTION_ETH_FRAGMENTED:0 "Éthiopie fragmentée"
  RULE_OPTION_ETH_FRAGMENTED_DESC:0 "L'Éthiopie sera divisée en États régionaux composant le pays."
  RULE_OPTION_RAJ_FRAGMENTED_DESC:0 "Toutes les nations constituantes libérables composant le Raj britannique sont libérées en tant que nations libres et indépendantes dès le début de la partie."
  ITA_FRAGMENTATION_STATUS:0 "Statut de fragmentation de l'Italie"
  RULE_OPTION_ITA_FRAGMENTED:0 "Inverser le Risorgimento"
  RULE_OPTION_ITA_FRAGMENTED_DESC:0 "Inverse le Risorgimento en Italie et rétablit les frontières telles qu'elles étaient juste avant."
  RULE_OPTION_NATIONALIST_HISTORICAL:0 "Renforcer Franco"
  RULE_OPTION_SPA_NATIONALIST_HISTORICAL:0 "Franquisme - Neutralité"
  RULE_OPTION_SPA_NATIONALIST_AXIS:0 "Franquisme - Rejoindre l'Axe"
  RULE_OPTION_SPA_NATIONALIST_ALLIES:0 "Franquisme - Rejoindre les Alliés"
  RULE_OPTION_SPA_NATIONALIST_LATIN_BLOC:0 "Franquisme - Former le Bloc latin"
  RULE_OPTION_NATIONALIST_HISTORICAL_DESC:0 "Franco prendra le contrôle du front nationaliste, une stratégie aléatoire sera décidée à partir de là. §YL'IA NE CHOISIRA PAS LES FALANGISTES AVEC CETTE OPTION, ET LES CARLISTES ONT PEU DE CHANCES DE SE REBELLER§!"
  RULE_OPTION_SPA_NATIONALIST_HISTORICAL_DESC:0 "Après sa victoire, Franco tentera de rester neutre dans le monde à moins d'être attaqué. §YRENFORCER LES FALANGISTES OU LES CARLISTES ANNULERA CETTE OPTION§!"
  RULE_OPTION_SPA_NATIONALIST_AXIS_DESC:0 "Après sa victoire, §LFranco§! tentera de rejoindre l'axe en supposant que soit @GERl'Allemagne soit @ITA l'Italie soient §Lfascistes§!. §YRENFORCER LES FALANGISTES OU LES CARLISTES ANNULERA CETTE OPTION§!"
  RULE_OPTION_SPA_NATIONALIST_ALLIES_DESC:0 "Après sa victoire, §gFranco§! tentera de rejoindre les alliés en supposant que soit les @USAÉtats-Unis soit @ENGle Royaume-Uni soient §Cdémocratiques§!. §YRENFORCER LES FALANGISTES OU LES CARLISTES ANNULERA CETTE OPTION§!"
  RULE_OPTION_SPA_NATIONALIST_LATIN_BLOC_DESC:0 "Après sa victoire, Franco tentera de former un Bloc latin avec @PORle Portugal, il restera sinon neutre à moins d'être attaqué ou entraîné dans une guerre avec @PORle Portugal. §YRENFORCER LES FALANGISTES OU LES CARLISTES ANNULERA CETTE OPTION§!"
  RULE_OPTION_SECOND_REPUBLIC:0 "Renforcer les républicains"
  RULE_OPTION_SPD_SECOND_REPUBLIC_ALLIES:0 "Républicains - Rejoindre les Alliés"
  RULE_OPTION_SPD_SECOND_REPUBLIC_AXIS:0 "Républicains - Accord avec l'Axe"
  RULE_OPTION_SPD_SECOND_REPUBLIC_LOYALIST:0 "Républicains - Rester loyal"
  RULE_OPTION_SECOND_REPUBLIC_DESC:0 "Le gouvernement §Cdémocratique§! de @SPRl'Espagne maintiendra la Deuxième République et deviendra un État fantoche @SOVoviétique (si les @SOVoviétiques ont envoyé un soutien adéquat), une stratégie aléatoire sera décidée à partir de là. §YL'IA NE CHOISIRA PAS LES STALINISTES AVEC CETTE OPTION§!"
  RULE_OPTION_SPD_SECOND_REPUBLIC_ALLIES_DESC:0 "Après la victoire §Crépublicaine§!, @SPRl'Espagne utilisera le soutien @SOVoviétique pour se remettre de la guerre civile, et demandera l'indépendance en fin de partie. Ils tenteront ensuite de rejoindre une alliance démocratique. §YRENFORCER LES STALINISTES ANNULERA CETTE OPTION§!"
  RULE_OPTION_SPD_SECOND_REPUBLIC_AXIS_DESC:0 "Après la victoire §Crépublicaine§!, @SPRl'Espagne utilisera le soutien @SOVoviétique pour se remettre de la guerre civile, et demandera l'indépendance en fin de partie. Ils parviendront ensuite à un accord avec l'Axe pour vaincre l'@SOVUnion soviétique. §YRENFORCER LES STALINISTES ANNULERA CETTE OPTION§!"
  RULE_OPTION_SPD_SECOND_REPUBLIC_LOYALIST_DESC:0 "Après la victoire §Rrépublicaine§!, @SPRl'Espagne utilisera le soutien @SOVoviétique pour se remettre de la guerre civile, puis élira des ministres §Rcommunistes§! au gouvernement. Ils rejoindront l'@SOVUnion soviétique pour vaincre le fascisme, obtenant des objectifs de guerre sur les pays §Lfascistes§!. §YRENFORCER LES STALINISTES ANNULERA CETTE OPTION§!"
  RULE_OPTION_FALANGIST:0 "Renforcer les falangistes"
  RULE_OPTION_SPA_FALANGIST:0 "Falangiste - Impérialiste"
  RULE_OPTION_SPA_FALANGIST_AXIS:0 "Falangiste - Rejoindre l'Axe"
  RULE_OPTION_FALANGIST_DESC:0 "Les §Lfalangistes§! sous José Antonio Primo de Rivera rejetteront le carlisme et mettront en place un État à parti unique, une stratégie aléatoire sera décidée à partir de là. §YL'IA NE CHOISIRA PAS FRANCO AVEC CETTE OPTION§!"
  RULE_OPTION_SPA_FALANGIST_DESC:0 "Après la victoire de la §LFalange§!, l'Espagne cherchera à restaurer l'impérialisme espagnol. §YRENFORCER FRANCO ANNULERA CETTE OPTION§!"
  RULE_OPTION_SPA_FALANGIST_AXIS_DESC:0 "Après la victoire de la §LFalange§!, l'Espagne tentera de rejoindre l'axe. §YRENFORCER FRANCO ANNULERA CETTE OPTION§!"
  RULE_OPTION_CARLIST:0 "Renforcer les carlistes"
  RULE_OPTION_SPB_CARLIST:0 "Carlistes - Récupération lente"
  RULE_OPTION_SPB_CARLIST_AGGRESSIVE:0 "Carlistes - Reconquête de l'Empire"
  RULE_OPTION_CARLIST_DESC:0 "Les carlistes sous Manuel Fal Conde rejetteront le falangisme et assureront un retour à la monarchie absolutiste d'autrefois, sous son roi carliste légitime. Une stratégie aléatoire sera décidée à partir de là. §YL'IA NE CHOISIRA PAS FRANCO AVEC CETTE OPTION§!"
  RULE_OPTION_SPB_CARLIST_DESC:0 "Après la victoire carliste, @SPRl'Espagne passera du temps à se rétablir, tentant éventuellement de former l'union ibérique avec @PORle Portugal. §YCELA NE PREND EFFET QUE SI LES CARLISTES SE REBELLENT. RENFORCER FRANCO ANNULERA CETTE OPTION§!"
  RULE_OPTION_SPB_CARLIST_AGGRESSIVE_DESC:0 "Après la victoire carliste, @SPRl'Espagne déclarera rapidement la guerre à @PORle Portugal, puis tentera de reprendre les possessions impériales. §YCELA NE PREND EFFET QUE SI LES CARLISTES SE REBELLENT. RENFORCER FRANCO ANNULERA CETTE OPTION§!"
  RULE_OPTION_ANARCHIST:0 "Renforcer les anarchistes"
  RULE_OPTION_ANARCHIST_DESC:0 "Les communes anarchistes en Aragon et en Catalogne s'uniront pour vaincre les fascistes et les communistes, et résister à la notion même d'un État-nation. Une stratégie aléatoire sera décidée à partir de là. §YPOUM N'EXISTERA PAS AVEC CETTE OPTION§!"
  RULE_OPTION_SPC_ANARCHIST:0 "Anarchistes - Défense ibérique"
  RULE_OPTION_SPC_ANARCHIST_GLOBAL:0 "Anarchistes - Conseil mondial"
  RULE_OPTION_SPC_ANARCHIST_DESC:0 "Après la victoire anarchiste, les communes absorberont l'Ibérie puis resteront en dehors des événements mondiaux. §YRENFORCER POUM ANNULERA CETTE OPTION§!"
  RULE_OPTION_SPC_ANARCHIST_GLOBAL_DESC:0 "Après la victoire anarchiste, les communes absorberont l'Ibérie puis tenteront d'apporter des révolutions anarchistes au monde entier. §YRENFORCER POUM ANNULERA CETTE OPTION§!"
  RULE_OPTION_INDEPENDENT_COMMUNIST:0 "Renforcer le POUM"
  RULE_OPTION_SPC_INDEPENDENT_COMMUNIST:0 "Communistes du POUM - Récupération lente"
  RULE_OPTION_SPC_INDEPENDENT_COMMUNIST_AGGRESSIVE:0 "Communistes du POUM - Agressif"
  RULE_OPTION_INDEPENDENT_COMMUNIST_DESC:0 "Le POUM et ses alliés anarchistes rejetteront le joug stalinien et chercheront leur propre idéologie §Rcommuniste§! indépendante, une stratégie aléatoire sera décidée à partir de là. §YCNT/FAI N'EXISTERA PAS AVEC CETTE OPTION§!"
  RULE_OPTION_SPC_INDEPENDENT_COMMUNIST_DESC:0 "Après la victoire communiste, @SPRl'Espagne prendra son temps pour se reconstruire après la guerre civile et déclarera éventuellement la guerre à @PORle Portugal. §YCNT/FAI N'EXISTERA PAS AVEC CETTE OPTION§!"
  RULE_OPTION_SPC_INDEPENDENT_COMMUNIST_AGGRESSIVE_DESC:0 "Après la victoire communiste et un certain temps pour se rétablir, @SPRl'Espagne poursuivra une politique étrangère plus puritaine en déclarant des guerres agressives contre ses ennemis idéologiques. §YCNT/FAI N'EXISTERA PAS AVEC CETTE OPTION§!"
  RULE_OPTION_STALINIST:0 "Renforcer les staliniens"
  RULE_OPTION_SPD_STALINIST:0 "Stalinien - Administration soviétique"
  RULE_OPTION_SPD_STALINIST_FREE:0 "Stalinien - République autonome"
  RULE_OPTION_STALINIST_DESC:0 "Les vrais §Rcommunistes§!, prenant leurs ordres de @SOVMoscou, résisteront aux anarchistes et aux fascistes, limiteront l'influence des communistes indépendants, et inaugureront une nouvelle ère pour la Deuxième République sous la guidance stalinienne. §YLES RÉPUBLICAINS N'EXISTERONT PAS AVEC CETTE OPTION§!"
  RULE_OPTION_SPD_STALINIST_DESC:0 "Après la victoire stalinienne, @SPRl'Espagne restera sous la guidance §Soviétique§! en tant que État fantoche tout en se remettant de la guerre civile. §YRENFORCER LES RÉPUBLICAINS ANNULERA CETTE OPTION§!"
  RULE_OPTION_SPD_STALINIST_FREE_DESC:0 "Après la victoire stalinienne, @SPRl'Espagne se concentrera sur le rétablissement après la guerre civile, puis se déclarera membre autonome du Komintern, puis déclarera la guerre à @PORle Portugal et commencera un soulèvement §Rcommuniste§! en @FRAFrance en fin de partie. §YRENFORCER LES RÉPUBLICAINS ANNULERA CETTE OPTION§!"
  RULE_OPTION_HISTORICAL_POR_AI_DESC:0 "Sous le régime de Salazar, @PORle Portugal renforcera l'Estado Novo et tentera de rester neutre pendant la Seconde Guerre mondiale."
  RULE_OPTION_ANGLO_PORTUGESE_POR_AI_DESC:0 "Sous le régime de Salazar, @PORle Portugal renforcera l'Estado Novo et honorera l'alliance @ENG@PORanglo-portugaise, rejoignant la faction de @ENGL'Angleterre sauf s'ils sont sous occupation §Rcommuniste§!."
  RULE_OPTION_FASCIST_POR_AI_DESC:0 "Rafael Pereira prendra le contrôle de @PORle Portugal en tant que dictateur §Lfasciste§!, tentant de rejoindre l'Axe en fin de partie et de commencer des opérations au @BRABrésil."
  RULE_OPTION_FASCIST_FIFTH_EMPIRE:0 "Le Cinquième Empire"
  RULE_OPTION_FASCIST_FIFTH_EMPIRE_DESC:1 "Le gouvernement @PORportugais embrassera le §Lfascisme§!, tentant de récupérer ses territoires perdus en Afrique, en Asie et en Amérique, se relevant en tant que grande puissance une fois de plus."
  RULE_OPTION_FASCIST_SUPPORT_SPAIN:0 "Fasciste - Intervention espagnole"
  RULE_OPTION_FASCIST_SUPPORT_SPAIN_DESC:1 "Rafael Pereira prendra le contrôle de @PORle Portugal en tant que dictateur §Lfasciste§!, rejoindra les @SPRnationalistes dans la guerre civile, et formera un pacte diplomatique avec @SPRl'Espagne."
  RULE_OPTION_NEUTRALITY_MONARCHIST:0 "Monarchiste"
  RULE_OPTION_NEUTRALITY_MONARCHIST_DESC:0 "Après la restauration de la monarchie au @PORPortugal, le roi Duarte fera appel aux monarchistes @BRABrésiliens et tentera de restaurer l'@POR@BRAEmpire du Portugal et du Brésil."
  RULE_OPTION_NEUTRALITY_MONARCHIST_SUPPORT_SPAIN:0 "Monarchiste - Soutien aux carlistes"
  RULE_OPTION_NEUTRALITY_MONARCHIST_SUPPORT_SPAIN_DESC:0 "Après la restauration de la monarchie au @PORPortugal, le roi Duarte enverra son soutien aux factions carlistes en @SPRl'Espagne, rejoignant la guerre civile de leur côté. Après cela, il fera appel aux monarchistes @BRABrésiliens et tentera de restaurer l'@POR@BRAEmpire du Portugal et du Brésil dans une faction avec @SPRl'Espagne."
  RULE_OPTION_DEMOCRATIC_POR_AI_DESC:1 "Influencé par le @ENG Royaume-Uni, un gouvernement §Cdémocratique§! renversera le régime autoritaire de Salazar et, avec l'aide des @ENGBritanniques, se concentrera sur le développement de l'industrie nationale avant de rejoindre les Alliés."
  RULE_OPTION_DEMOCRATIC_IBERIAN_SUMMIT:0 "Démocratique - Intervention espagnole"
  RULE_OPTION_DEMOCRATIC_IBERIAN_SUMMIT_POR_AI_DESC:0 "Influencé par le @ENG Royaume-Uni, un gouvernement §Cdémocratique§! renversera le régime autoritaire de Salazar et rejoindra les @SPR républicains dans la guerre civile, organisant un sommet ibérique pour soumettre des candidatures conjointes aux Alliés."
  RULE_OPTION_COMMUNIST_COMINTERN_DESC:0 "@PORLe Portugal s'§Ralignera§! vers l'@SOVUnion soviétique, soutiendra la @SPR République espagnole et tentera de rejoindre le Komintern."
  RULE_OPTION_COMMUNIST_INDEPENDENT:0 "République socialiste européenne unie"
  RULE_OPTION_COMMUNIST_INDEPENDENT_DESC:0 "Les §Rcommunistes§! renverseront le gouvernement et lutteront contre les @SPR nationalistes espagnols pendant la guerre civile espagnole, unifiant la péninsule ibérique en tant que République socialiste européenne unie, influençant la politique sud-américaine."
  RULE_OPTION_MONARCHIST_ORLEANIST:0 "Monarchiste : Maison d'Orléans"
  RULE_OPTION_MONARCHIST_LEGITIMIST:0 "Monarchiste : Maison de Bourbon"
  RULE_OPTION_MONARCHIST_BONAPARTIST:0 "Monarchiste : Maison de Bonaparte"
  RULE_MONARCHIST_ORLEANIST_FRA_AI_DESC:0 "L'IA @FRAfrançaise tentera de restaurer la monarchie @FRAfrançaise et de placer le prétendant orléaniste sur le trône en suivant le chemin pertinent dans l'arbre de focus."
  RULE_MONARCHIST_LEGITIMIST_FRA_AI_DESC:0 "L'IA @FRAfrançaise tentera de restaurer la monarchie @FRAfrançaise et de placer le prétendant légitimiste sur le trône en suivant le chemin pertinent dans l'arbre de focus."
  RULE_MONARCHIST_BONAPARTIST_FRA_AI_DESC:0 "L'IA @FRAfrançaise tentera de restaurer la monarchie @FRAfrançaise et de placer le prétendant bonapartiste sur le trône en suivant le chemin pertinent dans l'arbre de focus."
  RULE_ALLOW_RELEASE_NATIONS_KURDISTAN_TOOLTIP:0 "§Y[ROOT.GetName]§! n'est pas autorisé à libérer §Y[KUR.GetName]§!."
  RULE_OPTION_DEMOCRATIC_BALTIC_UNION:0 "Démocratique - Union baltique"
  RULE_OPTION_DEMOCRATIC_BALTIC_ENTENTE:0 "Démocratique - Entente baltique"
  RULE_DEMOCRATIC_LIT_AI_DESC:0 "@LITLa Lituanie tentera de se réformer en une §Cdémocratie§! moderne, sinon elle restera en dehors des affaires mondiales."
  RULE_DEMOCRATIC_LAT_AI_DESC:0 "@LATLa Lettonie tentera de se réformer en une §Cdémocratie§! moderne, sinon elle restera en dehors des affaires mondiales."
  RULE_DEMOCRATIC_EST_AI_DESC:0 "@ESTL'Estonie tentera de se réformer en une §Cdémocratie§! moderne, sinon elle restera en dehors des affaires mondiales."
  RULE_DEMOCRATIC_ALLIES_LIT_AI_DESC:0 "@LITLa Lituanie tentera de se réformer en une §Cdémocratie§! moderne, l'IA tentera de rejoindre les alliés au début des années 1940."
  RULE_DEMOCRATIC_ALLIES_LAT_AI_DESC:0 "@LATLa Lettonie tentera de se réformer en une §Cdémocratie§! moderne, l'IA tentera de rejoindre les alliés au début des années 1940."
  RULE_DEMOCRATIC_ALLIES_EST_AI_DESC:0 "@ESTL'Estonie tentera de se réformer en une §Cdémocratie§! moderne, l'IA tentera de rejoindre les alliés au début des années 1940."
  RULE_DEMOCRATIC_BALTIC_UNION_LIT_AI_DESC:0 "@LITLa Lituanie tentera de se réformer en une §Cdémocratie§! moderne, et de créer une union avec les États @LAT@EST baltes. L'IA tentera d'inviter les pays @SWE@NOR@DEN@FIN scandinaves au début des années 1940."
  RULE_DEMOCRATIC_BALTIC_ENTENTE_LIT_AI_DESC:0 "@LITLa Lituanie tentera de se réformer en une §Cdémocratie§! moderne, et de créer une faction avec les États @LAT@EST baltes."
  RULE_DEMOCRATIC_BALTIC_UNION_LAT_AI_DESC:0 "@LATLa Lettonie tentera de se réformer en une §Cdémocratie§! moderne, et de créer une union avec les États @LIT@EST baltes. L'IA tentera d'inviter les pays @SWE@NOR@DEN@FIN scandinaves au début des années 1940."
  RULE_DEMOCRATIC_BALTIC_ENTENTE_LAT_AI_DESC:0 "@LATLa Lettonie tentera de se réformer en une §Cdémocratie§! moderne, et de créer une faction avec les États @LIT@EST baltes."
  RULE_DEMOCRATIC_BALTIC_UNION_EST_AI_DESC:0 "@ESTL'Estonie tentera de se réformer en une §Cdémocratie§! moderne, et de créer une union avec les États @LIT@LAT baltes. L'IA tentera d'inviter les pays @SWE@NOR@DEN@FIN scandinaves au début des années 1940."
  RULE_DEMOCRATIC_BALTIC_ENTENTE_EST_AI_DESC:0 "@ESTL'Estonie tentera de se réformer en une §Cdémocratie§! moderne, et de créer une faction avec les États @LIT@LAT baltes."
  RULE_ENTENTE_EST_AI_DESC:0 "@ESTL'Estonie tentera de formaliser l'Entente baltique et de survivre contre les @SOVoviétiques."
  RULE_ENTENTE_LAT_AI_DESC:0 "@LATLa Lettonie tentera de formaliser l'Entente baltique et de survivre contre les @SOVoviétiques."
  RULE_HISTORICAL_EST_AI_DESC:0 "L'IA @ESTestonienne restera neutre pendant la majeure partie de la campagne, et maintiendra la dictature nationaliste. C'est le comportement historique."
  RULE_HISTORICAL_LAT_AI_DESC:0 "L'IA @LATlettone restera neutre pendant la majeure partie de la campagne, et maintiendra la dictature nationaliste. C'est le comportement historique."
  RULE_HISTORICAL_LIT_AI_DESC:0 "L'IA @LITlituanienne restera neutre pendant la majeure partie de la campagne, et maintiendra la dictature nationaliste. C'est le comportement historique."
  RULE_OPTION_LTS_OCCUPATION:0 "Nationalistes - Collaborationniste"
  RULE_LTS_OCCUPATION_LIT_AI_DESC:0 "L'IA @LITlituanienne maintiendra la dictature nationaliste, et collaborera en tant que État fantoche de @GERl'Allemagne ou des @SOVoviétiques si l'un d'eux fait des demandes."
  RULE_LTS_OCCUPATION_LAT_AI_DESC:0 "L'IA @LATlettone maintiendra la dictature nationaliste, et collaborera en tant que État fantoche de @GERl'Allemagne ou des @SOVoviétiques si l'un d'eux fait des demandes."
  RULE_LTS_OCCUPATION_EST_AI_DESC:0 "L'IA @ESTestonienne maintiendra la dictature nationaliste, et collaborera en tant que État fantoche de @GERl'Allemagne ou des @SOVoviétiques si l'un d'eux fait des demandes."
  RULE_OPTION_JUNTA_RULE:0 "Junte militaire"
  RULE_JUNTA_RULE_LIT_AI_DESC:0 "L'armée @LITlituanienne fusionnera avec le gouvernement civil et imposera la loi martiale, le nouveau gouvernement tentera ensuite d'imposer la règle militaire sur les États @LAT@EST baltes au début des années 1940."
  RULE_JUNTA_RULE_LAT_AI_DESC:0 "L'armée @LATlettone fusionnera avec le gouvernement civil et imposera la loi martiale, le nouveau gouvernement tentera ensuite d'imposer la règle militaire sur les États @LIT@EST baltes au début des années 1940."
  RULE_OPTION_PL_ALLIES:0 "Nationalistes - Alliés"
  RULE_PL_ALLIES_EST_AI_DESC:0 "L'IA @ESTestonienne maintiendra la dictature nationaliste, l'IA tentera de rejoindre les alliés au début des années 1940."
  RULE_OPTION_JUNTA_ALLIES:0 "Junte militaire - Alliés"
  RULE_JUNTA_ALLIES_LIT_AI_DESC:0 "L'armée @LITlituanienne fusionnera avec le gouvernement civil et imposera la loi martiale, le nouveau gouvernement tentera ensuite de rejoindre les alliés au début des années 1940."
  RULE_JUNTA_ALLIES_LAT_AI_DESC:0 "L'armée @LATlettone fusionnera avec le gouvernement civil et imposera la loi martiale, le nouveau gouvernement tentera ensuite de rejoindre les alliés au début des années 1940."
  RULE_OPTION_LTS_BALTIC_UNION:0 "Nationalistes - Union baltique"
  RULE_LTS_BALTIC_UNION_LIT_AI_DESC:0 "L'IA @LITlituanienne maintiendra la dictature nationaliste, et tentera ensuite de former une union avec les États @LAT@EST baltes. L'IA tentera d'inviter les pays @SWE@NOR@DEN@FIN scandinaves au début des années 1940."
  RULE_PL_BALTIC_UNION_EST_AI_DESC:0 "L'IA @ESTestonienne maintiendra la dictature nationaliste, et tentera ensuite de former une union avec les États @LIT@LAT baltes. L'IA tentera d'inviter les pays @SWE@NOR@DEN@FIN scandinaves au début des années 1940."
  RULE_OPTION_LTS_BALTIC_ENTENTE:0 "Nationalistes - Entente baltique"
  RULE_LTS_BALTIC_ENTENTE_LIT_AI_DESC:0 "L'IA @LITlituanienne maintiendra la dictature nationaliste, et tentera ensuite de former une faction avec les États @LAT@EST baltes."
  RULE_PL_BALTIC_ENTENTE_EST_AI_DESC:0 "L'IA @ESTestonienne maintiendra la dictature nationaliste, et tentera ensuite de former une faction avec les États @LIT@LAT baltes."
  RULE_OPTION_MONARCHIST:0 "Monarchiste"
  RULE_OPTION_MONARCHIST_LIT_AI_DESC:0 "@LITLa Lituanie tentera de restaurer la monarchie et de revendiquer le @POL@LIT Commonwealth polono-lituanien."
  RULE_OPTION_MONARCHIST_AGGRESSIVE:0 "Monarchiste - Grand Commonwealth"
  RULE_OPTION_MONARCHIST_AGGRESSIVE_LIT_AI_DESC:0 "@LITLa Lituanie tentera de restaurer la monarchie et de revendiquer le @POL@LIT Commonwealth polono-lituanien, et envahira ensuite l'@SOVUnion soviétique pour former le Grand Commonwealth."
  RULE_OPTION_BALTIC_ENTENTE:0 "Entente baltique"
  RULE_OPTION_FP_NEUTRAL:0 "Parti des agriculteurs - Neutre"
  RULE_FP_LAT_AI_DESC:0 "L'IA @LATlettone restera neutre pendant la majeure partie de la campagne, et restaurera l'influence du Parti des agriculteurs."
  RULE_OPTION_FP_BALTIC_UNION:0 "Parti des agriculteurs - Union baltique"
  RULE_FP_BALTIC_UNION_LAT_AI_DESC:0 "L'IA @LATlettone restaurera l'influence du Parti des agriculteurs, et tentera ensuite de former une union avec les États @LIT@EST baltes. L'IA tentera d'inviter les pays @SWE@NOR@DEN@FIN scandinaves au début des années 1940."
  RULE_OPTION_FP_BALTIC_ENTENTE:0 "Parti des agriculteurs - Entente baltique"
  RULE_FP_BALTIC_ENTENTE_LAT_AI_DESC:0 "L'IA @LATlettone restaurera l'influence du Parti des agriculteurs, et tentera ensuite de former une faction avec les États @LIT@EST baltes."
  RULE_OPTION_FASCIST_RK_OSTLAND:0 "Fasciste - Ostland de l'Axe"
  RULE_OPTION_FASCIST_RK_BALTIC:0 "Fasciste - Axe - Empire baltique"
  RULE_OPTION_FASCIST_BALTIC:0 "Fasciste - Empire baltique"
  RULE_OPTION_FASCIST_BALTIC_2:0 "Fasciste - Empire baltico-scandinave"
  RULE_OPTION_FASCIST_BALTIC_3:0 "Fasciste - Fraternité baltique"
  RULE_OPTION_FASCIST_FINLAND:0 "Fasciste - Coup finlandais de l'Axe"
  RULE_OPTION_FASCIST_AXIS_SCANDI:0 "Fasciste - Empire scandinave de l'Axe"
  RULE_OPTION_FASCIST_AXIS_UGRA:0 "Fasciste - Axe Finno-Ougrien"
  RULE_OPTION_FASCIST_SCANDI:0 "Fasciste - Empire scandinave"
  RULE_OPTION_FASCIST_UGRA:0 "Fasciste - Finno-Ougrien"
  RULE_FASCIST_FINLAND_EST_AI_DESC:0 "L'IA @ESTestonienne aura les Vaps établir un gouvernement §Lfasciste§!, l'IA tentera ensuite de faire un coup d'État contre le gouvernement de @FINla Finlande, puis rejoindra l'Axe avec @FINla Finlande."
  RULE_FASCIST_AXIS_SCANDI_EST_AI_DESC:0 "L'IA @ESTestonienne aura les Vaps établir un gouvernement §Lfasciste§!, l'IA tentera ensuite de faire un coup d'État contre le gouvernement de @FINla Finlande, puis rejoindra l'Axe avec @FINla Finlande. L'IA tentera de former la @DEN@SWE@NOR@FINScandinavie en envahissant ces pays."
  RULE_FASCIST_SCANDI_EST_AI_DESC:0 "L'IA @ESTestonienne aura les Vaps établir un gouvernement §Lfasciste§!, l'IA tentera ensuite de faire un coup d'État contre le gouvernement de @FINla Finlande, et tentera de former la @DEN@SWE@NOR@FINScandinavie en envahissant ces pays en fin de partie. (cela ne se passe généralement pas bien)"
  RULE_FASCIST_AXIS_UGRA_EST_AI_DESC:0 "L'IA @ESTestonienne aura les Vaps établir un gouvernement §Lfasciste§!, l'IA tentera ensuite de s'unir avec @FINla Finlande, puis rejoindra l'Axe. L'IA tentera d'unir les peuples finno-ougriens."
  RULE_FASCIST_UGRA_EST_AI_DESC:0 "L'IA @ESTestonienne aura les Vaps établir un gouvernement §Lfasciste§!, l'IA tentera ensuite de s'unir avec @FINla Finlande et tentera d'unir les peuples finno-ougriens en envahissant @SWElà Suède et @NORla Norvège, et l'@SOVUnion soviétique en fin de partie."
  RULE_FASCIST_RK_OSTLAND_LAT_AI_DESC:0 "L'IA @LATlettone permettra à §LPērkonkrusts§! de renverser le gouvernement, et rejoindra @GERl'Allemagne. L'IA tentera ensuite de former l'Ostland, et gagnera du territoire dans l'@SOVUnion soviétique."
  RULE_FASCIST_RK_BALTIC_LAT_AI_DESC:0 "L'IA @LATlettone permettra à §LPērkonkrusts§! de renverser le gouvernement, et rejoindra @GERl'Allemagne. L'IA tentera ensuite de former l'Empire baltique."
  RULE_FASCIST_BALTIC_LAT_AI_DESC:0 "L'IA @LATlettone permettra à §LPērkonkrusts§! de renverser le gouvernement, mais rejettera une alliance @GERallemande, puis tentera de prendre le contrôle des États @LIT@EST baltes."
  RULE_FASCIST_BALTIC_2_LAT_AI_DESC:0 "L'IA @LATlettone permettra à §LPērkonkrusts§! de renverser le gouvernement, mais rejettera une alliance @GERallemande, puis tentera de prendre le contrôle des États @LIT@EST baltes, et attaquera éventuellement les pays @SWE@DEN@NOR@FIN scandinaves."
  RULE_FASCIST_BALTIC_3_LAT_AI_DESC:0 "L'IA @LATlettone permettra à §LPērkonkrusts§! de renverser le gouvernement, mais rejettera une alliance @GERallemande, puis tentera d'offrir une alliance à d'autres États §Lfascistes§! @LIT@EST baltes, ou de les transformer en États fantoches s'ils ne sont pas fascistes."
  RULE_OPTION_COMMUNIST_BALKAN_FEDERATION:0 "Communiste - Fédération balkanique"
  RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC:0 "@BULLa Bulgarie tentera de former une §Ralliance balkanique§!, influençant ses voisins pour qu'ils embrassent la révolution et unifiant finalement les Balkans."
  RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_AUTONOMY:0 "Communiste - Républiques autonomes des Balkans"
  RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_AUTONOMY_BUL_AI_DESC:0 "@BULLa Bulgarie tentera de former une §Ralliance balkanique§!, influençant ses voisins §Rcommunistes§! pour qu'ils embrassent la révolution et promeuvent le travail ensemble en tant que pays indépendants."
  RULE_OPTION_COMMUNIST_BUL_AI_DESC:0 "@BULLa Bulgarie deviendra §Rcommuniste§! et tentera de rejoindre le Komintern et de combattre avec ses camarades @SOVoviétiques contre le fascisme et le capitalisme en Europe."
  RULE_OPTION_DEMOCRATIC_LIBERAL:0 "Démocratique - Alliés"
  RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC:0 "Le gouvernement dirigé par Nikola Mushanov suivra des politiques §Csocialistes§!, et tentera de rejoindre les Alliés."
  RULE_OPTION_DEMOCRATIC_TSARDOM_ALLIES:0 "Régence démocratique - Alliés"
  RULE_OPTION_DEMOCRATIC_TSARDOM_ALLIES_BUL_AI_DESC:0 "Le parti §Cdémocratique§! @BULbulgare tentera de rejoindre les Alliés en fin de partie alors qu'il complote contre le tsar Boris pour le destituer et former un conseil de régence."
  RULE_OPTION_DEMOCRATIC_TSARDOM_BALKANS:0 "Régence démocratique - Fédération balkanique"
  RULE_OPTION_DEMOCRATIC_TSARDOM_BALKANS_BUL_AI_DESC:1 "Le parti §Cdémocratique§! @BULbulgare cherchera à améliorer ses relations avec les nations voisines §Cdémocratiques§! et §gnon-alignées§! pour former une Confédération balkanique en fin de partie, et unifiera éventuellement les Balkans en un seul pays."
  RULE_OPTION_DEMOCRATIC_SOCIALIST:0 "Démocratique - Alliance balkanique"
  RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC:1 "Le gouvernement dirigé par Nikola Mushanov suivra des politiques §Csocialistes§!, cherchant à améliorer ses relations avec les nations voisines §Cdémocratiques§! pour former une Confédération balkanique et défendre les Balkans contre les agressions étrangères."
  RULE_OPTION_DEMOCRATIC_SOCIALIST_BALKANS:0 "Démocratique - Fédération balkanique"
  RULE_OPTION_DEMOCRATIC_SOCIALIST_BALKANS_BUL_AI_DESC:1 "Le gouvernement dirigé par Nikola Mushanov suivra des politiques §Csocialistes§!, cherchant à améliorer ses relations avec les nations voisines §Cdémocratiques§! pour former une Confédération balkanique et unifier éventuellement les Balkans en un seul pays."
  RULE_OPTION_FASCIST_BUL_AI_DESC:0 "Alors que le §Lfascisme§! monte dans le pays, le leader de droite Hristo Lukov tentera de rejoindre l'Axe, renversant éventuellement le Tsar et imposant une dictature militaire."
  RULE_OPTION_FASCIST_THIRD_EMPIRE:0 "Fasciste - Troisième Empire"
  RULE_OPTION_FASCIST_THIRD_EMPIRE_BUL_AI_DESC:0 "Alors que le §Lfascisme§! monte dans le pays, le leader de droite Hristo Lukov tentera de rejoindre l'Axe, renversant éventuellement le Tsar et formant le Troisième Empire bulgare."
  RULE_OPTION_FASCIST_BALKANS_DOMINANCE:0 "Fasciste - Domination des Balkans"
  RULE_OPTION_FASCIST_BALKANS_DOMINANCE_BUL_AI_DESC:0 "Alors que le §Lfascisme§! monte dans le pays, le leader de droite Hristo Lukov renversera le Tsar et imposera une dictature militaire, puis ira de l'avant pour affirmer la domination @BULbulgare sur les Balkans."
  RULE_OPTION_BORIS_AXIS:0 "Boris III - Rejoindre l'Axe"
  RULE_OPTION_HISTORICAL_BUL_AI_DESC:0 "Le tsar Boris III mènera le pays vers l'Axe, s'appuyant sur l'arbitrage @GERallemand pour étendre les frontières @BULbulgares pacifiquement, signant éventuellement le Pacte tripartite et retardant la participation @BULbulgare à la guerre, un conseil de régence prendra le relais en fin de partie."
  RULE_OPTION_THE_RETURN_OF_FERDINAND:0 "Le Retour de Ferdinand I"
  RULE_OPTION_THE_RETURN_OF_FERDINAND_BUL_AI_DESC:0 "Suite à la mort du tsar Boris III, son père Ferdinand I siégera à nouveau sur le trône, cherchant à se venger de ceux qui l'ont lésé des décennies auparavant."
  RULE_OPTION_REGENCY_COUNCIL:0 "Régence neutre"
  RULE_OPTION_REGENCY_COUNCIL_BUL_AI_DESC:0 "Suite à la mort du tsar Boris III, un conseil de régence se formera qui déclarera la Bulgarie comme un pays neutre dans les affaires mondiales jusqu'à ce que Simeon II soit en âge."
  RULE_OPTION_BORIS_ALLIES:0 "Boris III - Rejoindre les Alliés"
  RULE_OPTION_BORIS_ALLIES_BUL_AI_DESC:0 "Le tsar Boris III mènera le pays vers les Alliés, s'appuyant sur l'arbitrage @ENGBritannique pour étendre les frontières @BULbulgares pacifiquement, ou par la force."
  RULE_OPTION_BALKAN_PRUSSIA:0 "Boris III - Domination balkanique de l'Axe"
  RULE_OPTION_BALKAN_PRUSSIA_BUL_AI_DESC:0 "Le tsar Boris III mènera le pays dans un renforcement prolongé de la force militaire et navale, rejoignant l'Axe en fin de partie et tentant de sécuriser la suprématie sur le Bosphore."
  RULE_OPTION_METAXIST:0 "Historique - Métaxisme"
  RULE_OPTION_METAXIST_GRE_AI_DESC:0 "@GRELa Grèce poursuivra une politique de neutralité tout en développant les idées du Métaxisme."
  RULE_OPTION_MONARCHIST_GRE_AI:0 "Monarchiste - Alliés"
  RULE_OPTION_MONARCHIST_GRE_AI_DESC:0 "@GRELa Grèce deviendra une monarchie absolue et cherchera à rejoindre les Alliés."
  RULE_OPTION_MONARCHIST_GRE_ALTERNATE_AI:0 "Monarchiste - Puissances centrales"
  RULE_OPTION_MONARCHIST_ALTERNATE_GRE_AI_DESC:0 "@GRELa Grèce deviendra une monarchie absolue et cherchera à rejoindre les Puissances centrales avec @GERl'Allemagne ou @AUS@HUNAutriche-Hongrie."
  RULE_OPTION_STALINIST_GRE_AI:0 "Staliniste"
  RULE_OPTION_STALINIST_GRE_AI_DESC:0 "@GRELa Grèce deviendra §Rstaliniste§! et tentera de rejoindre le Komintern et de déclencher une bataille pour le Bosphore avec @TURla Turquie."
  RULE_OPTION_COMMUNIST_GRE_AI:0 "Communiste"
  RULE_OPTION_ALTERNATE_COMMUNIST_GRE_AI_DESC:0 "@GRELa Grèce deviendra §Rsocialiste§! et tentera de combattre le fascisme en Europe aux côtés de la @YUGYougoslavie communiste."
  RULE_OPTION_DEMOCRATIC_GRE_AI:0 "Vénizéliste"
  RULE_OPTION_VENEZELIST_GRE_AI_DESC:0 "@GRELa Grèce deviendra une §Cdémocratie§!, et combattra pour le droit de réaliser l'idée de la Grande Grèce."
  RULE_OPTION_DEMOCRATIC_GRE_AI_DESC:0 "@GRELa Grèce deviendra une §Cdémocratie§!, et restera neutre dans les affaires mondiales."
  RULE_OPTION_FASCISM_METAXIST:0 "Fasciste - Métaxiste"
  RULE_OPTION_FASCISM_METAXIST_GRE_AI_DESC:0 "@GRELa Grèce deviendra une monarchie §Lfasciste métaxiste§! et tentera de rejoindre l'Axe, sabotant les relations de l'Axe avec @TURla Turquie et tentant de former la @GREGrande Grèce."
  RULE_OPTION_FASCISM_HELLENOTURKISM:0 "Fasciste - Helléno-turquisme"
  RULE_OPTION_FASCISM_HELLENOTURKISM_GRE_AI_DESC:0 "@GRELa Grèce deviendra une république §Lnational-socialiste§! et tentera de rejoindre l'Axe aux côtés de @TURla Turquie."
  RULE_OPTION_FASCIST_ALTERNATE_GRE_AI:0 "Fasciste anatolien"
  RULE_OPTION_FASCISM_ALTERNATE_GRE_AI_DESC:0 "@GRELa Grèce deviendra démocratique, subira un §Leffondrement du gouvernement§!, puis aspirera aux plus grandes des ambitions..."
  RULE_OPTION_HISTORICAL_TUR_AI:0 "Neutralité kémaliste"
  RULE_OPTION_HISTORICAL_IDEO_TUR_AI_DESC:1 "@TURLa Turquie poursuivra la politique du kémalisme sous la direction d'İsmet İnönü, et maintiendra la neutralité dans les affaires mondiales plus longtemps."
  RULE_OPTION_KEMALIST_NATIONALIST_TUR_AI:0 "Kémaliste interventionniste"
  RULE_OPTION_KEMALIST_NATIONALIST_TUR_AI_DESC:1 "@TURLa Turquie poursuivra la politique du kémalisme sous la direction d'İsmet İnönü."
  RULE_OPTION_KEMALIST_DEMOCRATIC_TUR_AI:0 "Démocratie kémaliste"
  RULE_OPTION_KEMALIST_DEMOCRATIC_TUR_AI_DESC:1 "@TURLa Turquie passera à une §Cdémocratie kémaliste§! sous la direction de Celâl Bayar, et maintiendra la neutralité dans les affaires mondiales plus longtemps."
  RULE_OPTION_FUNDAMENTALIST_NEUTRAL_TUR_AI:0 "Neutralité traditionaliste"
  RULE_OPTION_FUNDAMENTALIST_NEUTRAL_TUR_AI_DESC:0 "@TURLa Turquie réformera la politique du kémalisme pour s'adapter aux islamistes fondamentalistes sous la direction de Fevzi Çakmak, et maintiendra la neutralité dans les affaires mondiales plus longtemps."
  RULE_OPTION_FUNDAMENTALIST_NATIONALIST_TUR_AI:0 "Traditionaliste interventionniste"
  RULE_OPTION_FUNDAMENTALIST_NATIONALIST_TUR_AI_DESC:0 "@TURLa Turquie réformera la politique du kémalisme pour s'adapter aux islamistes fondamentalistes, passant à une §gdictature quasi-fasciste§! sous la direction de Fevzi Çakmak."
  RULE_OPTION_DEMOCRATIC_FUNDAMENTALIST_TUR_AI:0 "Démocratie traditionaliste"
  RULE_OPTION_DEMOCRATIC_FUNDAMENTALIST_TUR_AI_DESC:1 "@TURLa Turquie passera à une §Cdémocratie traditionaliste§! sous la direction d'Adnan Menderes, et maintiendra la neutralité dans les affaires mondiales plus longtemps."
  RULE_OPTION_FASCIST_TUR_AI:0 "Fascisme kémaliste"
  RULE_OPTION_FASCIST_TUR_AI_DESC:0 "@TURLa Turquie réformera la politique du kémalisme pour s'adapter au Mouvement Kadro et aux §Lchemises rouges fascistes§! sous la direction de Recep Peker."
  RULE_OPTION_COMMUNIST_TUR_AI:0 "Communisme kémaliste"
  RULE_OPTION_COMMUNIST_TUR_AI_DESC:0 "@TURLa Turquie réformera la politique du kémalisme pour s'adapter au Mouvement Kadro et à la §Rmilice ouvrière communiste§! sous la direction de Şevket Süreyya Aydemir."
  RULE_OPTION_OTTOMAN:0 "Restaurer le Sultanat ottoman"
  RULE_OPTION_OTTOMAN_DESC:0 "La République de @TURla Turquie s'effondrera et de ses cendres le Sultanat ottoman sera restauré au pouvoir une fois de plus. §YL'option choisie pour l'alignement turc sera ignorée!§!"
  RULE_OPTION_HISTORICAL_TUR_AI_DESC:0 "@TURLa Turquie s'alignera aléatoirement avec des chances plus élevées assignées aux pays de la même idéologie, mais les pays qui investissent davantage en Turquie au début et au milieu de la partie auront une chance beaucoup plus élevée de voir @TURla Turquie s'aligner avec eux. En supposant qu'ils soient un pays éligible pour l'alignement @TURturc. §Y(doit être soit:@ENG@GER@SOV@SPR ou le plus grand§! §Cdémocratique§!§Y/§!§Lfasciste§!§Y/§!§Rcommuniste§! §Yleader de faction ou pays indépendant en Europe - @FRA@ITA@YUG@GRE, @POL(pas communiste), @BUL(pas fasciste)§!"
  RULE_OPTION_NEUTRALITY_TUR_AI_DESC:0 "@TURLa Turquie ne s'alignera jamais avec une puissance étrangère sauf si elle se trouve en guerre."
  RULE_OPTION_JOIN_BRITAIN_TUR_AI_DESC:0 "@TURLa Turquie s'alignera toujours avec le @ENG Royaume-Uni, même s'ils sont d'une idéologie différente. L'IA rejoindra @ENGL'Angleterre plus tôt s'ils ont plus d'influence."
  RULE_OPTION_JOIN_GERMANY_TUR_AI_DESC:0 "@TURLa Turquie s'alignera toujours avec @GERl'Allemagne, même s'ils sont d'une idéologie différente. L'IA rejoindra @GERl'Allemagne plus tôt s'ils ont plus d'influence. §YCette voie ne fonctionnera que pour une§! §Rcommuniste§! §Y@SOVUnion soviétique.§!"
  RULE_OPTION_JOIN_SOVIET_TUR_AI_DESC:0 "@TURLa Turquie s'alignera toujours avec l'@SOVUnion soviétique, même s'ils sont d'une idéologie différente. L'IA rejoindra les @SOVoviétiques plus tôt s'ils ont plus d'influence. §YCette voie nécessite au moins un§! §Cdémocratique§! §Yleader de faction sur le continent européen§!"
  RULE_OPTION_JOIN_EURO_TUR_AI_DESC:0 "@TURLa Turquie s'alignera toujours avec un leader de faction §Cdémocratique§! en Europe, (pas les Alliés!). L'IA rejoindra cette faction plus tôt s'ils ont plus d'influence. §YCette voie nécessite au moins un§! §Lfasciste§! §Ynation parmi les suivants n'appartenant pas à l'Axe:§!@ITA@FRA@YUG@SPR@GRE@POL"
  RULE_OPTION_JOIN_MED_F_TUR_AI_DESC:0 "@TURLa Turquie s'alignera toujours avec un pays §Lfasciste§! bordant la Méditerranée. L'IA rejoindra cette faction plus tôt s'ils ont plus d'influence. §YCette voie nécessite au moins un§! §Rcommuniste§! §Ynation parmi les suivants n'appartenant pas au Komintern:§!@SPR@FRA@ITA@YUG@GRE@BUL"
  RULE_OPTION_BALKAN_ENTENTE:0 "Sécuriser les Balkans"
  RULE_OPTION_BALKAN_ENTENTE_DESC:0 "@TURLa Turquie s'engagera à maintenir la sécurité dans les Balkans et tentera de former une faction avec @GREla Grèce, @ROMla Roumanie, et @YUGla Yougoslavie."
  RULE_OPTION_PEACE_TUR_AI_DESC:0 "@TURLa Turquie tentera de ne pas commencer de nouvelles guerres ou d'étendre son territoire."
  RULE_OPTION_AGGR_TUR_AI_DESC:0 "@TURLa Turquie n'aura aucune restriction pour commencer de nouvelles guerres ou étendre son territoire, mais ne commencera pas de guerres ridicules ou ne tentera pas de créer un Empire touranien."
  RULE_OPTION_TUR_TURAN_DESC:0 "@TURLa Turquie n'aura aucune restriction pour commencer de nouvelles guerres ou étendre son territoire, et suivra la partie de l'ambition touranienne de son arbre de focus."
  RULE_EXILES_TSARIST_ROME:0 "Exilés tsaristes - Troisième Rome"
  RULE_OPTION_EXILES_TSARIST_ROME_SOV_AI_DESC:0 "L'IA @SOVoviétique expulsera les communistes par une guerre civile, rétablira la Russie tsariste, et promouvra le Métropolite Meletius au rang d'Archi-Patriarche du Troisième Empire orthodoxe."
  RULE_EXILES_TSARIST_PROTECTOR:0 "Exilés tsaristes - Protecteur slave"
  RULE_OPTION_EXILES_TSARIST_PROTECTOR_SOV_AI_DESC:0 "L'IA @SOVoviétique expulsera les communistes par une guerre civile, rétablira la Russie tsariste, et tentera de recréer la Triple Entente et de donner des garanties au monde slave."
  RULE_EXILES_TSARIST_SLAVIC:0 "Exilés tsaristes - Nationalisme pan-slave"
  RULE_OPTION_EXILES_TSARIST_SLAVIC_SOV_AI_DESC:0 "L'IA @SOVoviétique expulsera les communistes par une guerre civile, rétablira la Russie tsariste, et demandera l'annexion des nations slaves pour créer l'Union pan-slave."
  RULE_EXILES_FASCIST_AXIS:0 "Exilés fascistes - Rejoindre l'Axe"
  RULE_OPTION_EXILES_FASCIST_AXIS_SOV_AI_DESC:0 "L'IA @SOVoviétique expulsera les communistes par une guerre civile, établira un gouvernement §Lfasciste§!, puis tentera de rejoindre l'Axe."
  RULE_EXILES_FASCIST_AXIS_AMERICAS:0 "Exilés fascistes - Axe Berlin-Moscou-Tokyo"
  RULE_OPTION_EXILES_FASCIST_AXIS_AMERICAS_SOV_AI_DESC:0 "L'IA @SOVoviétique expulsera les communistes par une guerre civile, établira un gouvernement §Lfasciste§!, puis tentera de rejoindre l'Axe, invitant @JAPle Japon dans la faction s'ils ont un gouvernement fasciste. En fin de partie, @SOVla Russie influencera l'Amérique du Sud et tentera de reprendre @USA l'Alaska."
  RULE_EXILES_FASCIST_PACIFIC:0 "Exilés fascistes - Empire du Pacifique"
  RULE_OPTION_EXILES_FASCIST_PACIFIC_SOV_AI_DESC:0 "L'IA @SOVoviétique expulsera les communistes par une guerre civile, établira un gouvernement §Lfasciste§!, puis tentera de faire la guerre à @JAPle Japon et à @CHIla Chine, pour établir un empire dans le Pacifique, influençant l'Amérique du Sud et faisant la guerre aux @USAÉtats-Unis en fin de partie."
  RULE_EXILES_FASCIST_JAPAN_PUPPET:0 "Exilés fascistes - Marionnette japonaise"
  RULE_OPTION_EXILES_FASCIST_JAPAN_PUPPET_SOV_AI_DESC:0 "L'IA @SOVoviétique expulsera les communistes par une guerre civile, établira un gouvernement §Lfasciste§! avec le soutien de @JAPle Japon, et restera une marionnette fidèle de @JAPle Japon."
  RULE_EXILES_FASCIST_JAPAN_PUPPET_REBEL:0 "Exilés fascistes - Marionnette rebelle"
  RULE_OPTION_EXILES_FASCIST_JAPAN_PUPPET_REBEL_SOV_AI_DESC:0 "L'IA @SOVoviétique expulsera les communistes par une guerre civile et établira un gouvernement §Lfasciste§! avec le soutien de @JAPle Japon. Mais déclarera son indépendance de @JAPle Japon dans les années 1940."
  RULE_OPTION_RIGHT_COUP_ALWAYS:0 "Staline toujours tué"
  RULE_OPTION_RIGHT_COUP_ALWAYS_AI_DESC:0 "Staline est tué avant de pouvoir mobiliser les forces armées, et l'opposition prend le contrôle sans guerre civile. §YNécessite une voie d'opposition de droite pour avoir un effet§!"
  RULE_OPTION_ALWAYS_UNION:0 "Toujours"
  RULE_OPTION_ALWAYS_UNION_FRA_AI_DESC:0 "L'@FRA@ENGUnion franco-britannique se formera toujours §YNécessite que la @FRAFrance capitule dans la même faction que la @ENGBritannique§!"
  RULE_OPTION_ALWAYS_DENY_FRA_AI_DESC:0 "Les @FRAFrançais refuseront toujours la remilitarisation de la Rhénanie par @GERl'Allemagne. (cela conduit généralement à la guerre)"
  RULE_OPTION_RIGHT_COUP_NEVER:0 "Staline jamais tué"
  RULE_OPTION_RIGHT_COUP_NEVER_AI_DESC:0 "Staline ne peut pas être tué avant de pouvoir mobiliser les forces armées, et la guerre civile commencera toujours. §YNécessite une voie d'opposition de droite pour avoir un effet§!"
  RULE_OPTION_NEVER_UNION:0 "Jamais"
  RULE_OPTION_NEVER_UNION_FRA_AI_DESC:0 "L'@FRA@ENGUnion franco-britannique ne se formera jamais."
  RULE_OPTION_NEVER_DENY_FRA_AI_DESC:0 "Les @FRAFrançais ne refuseront jamais la remilitarisation de la Rhénanie par @GERl'Allemagne."
  RULE_OPTION_FASCIST_LIVONIA:0 "Fasciste de l'Axe - Livonie"
  RULE_OPTION_FASCIST_LIVONIA_2:0 "Fasciste - Expansion livonienne"
  RULE_OPTION_FASCIST_COMMONWEALTH:0 "Fasciste de l'Axe - Commonwealth"
  RULE_OPTION_FASCIST_MEMEL:0 "Fasciste - Soutien à la Pologne"
  RULE_FASCIST_MEMEL_LIT_AI_DESC:0 "L'IA @LITlituanienne organisera les partisans du Loup de Fer et créera un gouvernement §Lfasciste§!. L'IA rejettera ensuite l'Axe et soutiendra les falangistes en @POLPologne."
  RULE_FASCIST_LIVONIA_2_LIT_AI_DESC:0 "L'IA @LITlituanienne organisera les partisans du Loup de Fer et créera un gouvernement §Lfasciste§!. L'IA rejettera ensuite l'Axe et commencera les invasions des États @LAT@EST baltes et de la @POLPologne."
  RULE_FASCIST_LIT_AI_DESC:0 "L'IA @LITlituanienne organisera les partisans du Loup de Fer et créera un gouvernement §Lfasciste§!. L'IA tentera ensuite de rejoindre l'Axe et de former le Grand Commonwealth lituanien."
  RULE_FASCIST_LIVONIA_LIT_AI_DESC:0 "L'IA @LITlituanienne organisera les partisans du Loup de Fer et créera un gouvernement §Lfasciste§!. L'IA tentera ensuite de rejoindre l'Axe et de former la Livonie en prenant le contrôle des autres États @LAT@EST baltes."
  RULE_FASCIST_EST_AI_DESC:0 "L'IA @ESTestonienne aura les Vaps établir un gouvernement §Lfasciste§!, et rejoindra ensuite l'Axe."
  RULE_COMMUNIST_BALTIC_AI_DESC:0 "L'IA tentera d'établir un régime §Rcommuniste§!, mais rejettera le soutien @SOVoviétique."
  RULE_OPTION_COMMUNIST_UNITED_BALTIC:0 "Communiste - Baltes unis"
  RULE_COMMUNIST_UNITED_BALTIC_AI_DESC:0 "L'IA tentera d'établir un régime §Rcommuniste§!, mais rejettera le soutien @SOVoviétique, instiguant des révolutions dans les États @LIT@LAT@EST baltes pour former la République populaire unie des Baltes."
  RULE_OPTION_COMMUNIST_BELARUS:0 "Communiste - Unification biélorusse"
  RULE_COMMUNIST_BELARUS_BALTIC_AI_DESC:0 "L'IA tentera d'établir un régime §Rcommuniste§!, mais rejettera le soutien @SOVoviétique, instiguant une révolution en @BLRBiélorussie et annexant les États @LIT@LAT@EST baltes pour former la République unie baltico-biélorusse."
  RULE_OPTION_ETH_HISTORICAL:0 "Société des Nations - Historique"
  RULE_HISTORICAL_ETH_AI_DESC:0 "L'IA @ETHéthiopienne tentera de vaincre @ITA l'Italie en utilisant la Société des Nations, et si cela échoue, tentera de partir en exil. Par la suite, elle tentera de récupérer son territoire d'origine, et de reconstruire @ETH l'Éthiopie. L'IA ne tentera pas d'influencer les nations africaines. §YL'Éthiopie peut encore être annexée si @ITA l'Italie les vainc rapidement!§!"
  RULE_OPTION_LEAVE_PAN_AFRICAN:0 "Société des Nations - Libérer l'Afrique"
  RULE_ETH_LEAVE_PAN_AFRICAN_AI_DESC:0 "L'IA @ETHéthiopienne tentera de vaincre @ITA l'Italie en utilisant la Société des Nations, et si cela échoue, tentera de partir en exil. Par la suite, elle tentera de récupérer son territoire d'origine, et de reconstruire @ETH l'Éthiopie. L'IA attaquera les puissances coloniales pour libérer l'Afrique en fin de partie. §YL'Éthiopie peut encore être annexée si @ITA l'Italie les vainc rapidement!§!"
  RULE_OPTION_LEAVE_AFRICAN_UNION:0 "Société des Nations - Union africaine"
  RULE_ETH_LEAVE_AFRICAN_UNION_AI_DESC:0 "L'IA @ETHéthiopienne tentera de vaincre @ITA l'Italie en utilisant la Société des Nations, et si cela échoue, tentera de partir en exil. Par la suite, elle tentera de récupérer son territoire d'origine, et de reconstruire @ETH l'Éthiopie. L'IA augmentera la résistance et stimulera le gain d'autonomie dans les pays africains pour libérer l'Afrique en fin de partie. §YL'Éthiopie peut encore être annexée si @ITA l'Italie les vainc rapidement!§!"
  RULE_OPTION_LEAVE_FEDERAL_AFRICAN_UNION:0 "Société des Nations - Union fédérale"
  RULE_ETH_LEAVE_FEDERAL_AFRICAN_UNION_AI_DESC:0 "L'IA @ETHéthiopienne tentera de vaincre @ITA l'Italie en utilisant la Société des Nations, et si cela échoue, tentera de partir en exil. Par la suite, elle tentera de récupérer son territoire d'origine, et de reconstruire @ETH l'Éthiopie, formant une union fédérale et accordant l'autonomie au Mekwanint. L'IA augmentera la résistance et stimulera le gain d'autonomie dans les pays africains pour libérer l'Afrique en fin de partie. §YL'Éthiopie peut encore être annexée si @ITA l'Italie les vainc rapidement!§!"
  RULE_OPTION_ETH_IMPERIAL_JAH:0 "Impérial - Empire rastafari"
  RULE_ETH_IMPERIAL_JAH_AI_DESC:0 "L'IA @ETHéthiopienne tentera de vaincre l'Italie par ses propres moyens, sans l'aide de la Société des Nations. Par la suite, elle tentera d'étendre son empire en exigeant que les nations des Caraïbes se soumettent."
  RULE_OPTION_ETH_IMPERIAL_SOLOMON:0 "Impérial - Héritier de Salomon"
  RULE_ETH_IMPERIAL_SOLOMON_AI_DESC:0 "L'IA @ETHéthiopienne tentera de vaincre l'Italie par ses propres moyens, sans l'aide de la Société des Nations. Par la suite, elle tentera d'étendre son empire en exigeant la terre sainte en Palestine."
  RULE_OPTION_ETH_IMPERIAL_PAN_AFRICAN:0 "Impérial - Libérer l'Afrique"
  RULE_ETH_IMPERIAL_PAN_AFRICAN_AI_DESC:0 "L'IA @ETHéthiopienne tentera de vaincre l'Italie par ses propres moyens, sans l'aide de la Société des Nations. Par la suite, elle tentera d'étendre son empire en attaquant les puissances coloniales pour libérer l'Afrique."
  RULE_OPTION_ETH_IMPERIAL_AFRICAN_UNION:0 "Impérial - Union africaine"
  RULE_ETH_IMPERIAL_AFRICAN_UNION_AI_DESC:0 "L'IA @ETHéthiopienne tentera de vaincre l'Italie par ses propres moyens, sans l'aide de la Société des Nations. Par la suite, elle tentera d'étendre son empire en augmentant la résistance et en stimulant le gain d'autonomie dans les pays africains pour libérer l'Afrique."
  RULE_OPTION_ETH_IMPERIAL_AFRICAN_UNION_FEDERAL:0 "Impérial - Union fédérale"
  RULE_ETH_IMPERIAL_AFRICAN_UNION_FEDERAL_AI_DESC:0 "L'IA @ETHéthiopienne tentera de vaincre l'Italie par ses propres moyens, sans l'aide de la Société des Nations. Par la suite, elle formera une union fédérale en accordant l'autonomie au Mekwanint. L'IA tentera ensuite d'étendre son empire en augmentant la résistance et en stimulant le gain d'autonomie dans les pays africains pour libérer l'Afrique."
  RULE_OPTION_ETH_STALINIST_desc:0 "L'IA tentera de faire devenir @ETHl'Éthiopie §Rcommuniste§! et d'obtenir le soutien de l'@SOVUnion soviétique, en faisant d'elle une marionnette stalinienne."
  RULE_OPTION_ETH_STALINIST:0 "Staliniste - Marionnette soviétique"
  RULE_OPTION_ETH_STALINIST_REBEL_desc:0 "L'IA tentera de faire devenir @ETHl'Éthiopie §Rcommuniste§! et d'obtenir le soutien de l'@SOVUnion soviétique, en faisant d'elle une marionnette stalinienne, l'IA tentera ensuite de se libérer de l'influence @SOVoviétique."
  RULE_OPTION_ETH_STALINIST_REBEL:0 "Staliniste - Indépendant"
  RULE_OPTION_ETH_ANARCHIST:0 "Anarcho-communiste - Libérer l'Afrique"
  RULE_OPTION_ETH_ANARCHIST_desc:0 "L'IA tentera de transformer @ETHl'Éthiopie en une fédération §Ranarcho-communiste§! avec le soutien d'anarchistes et de communistes du monde entier. L'IA tentera d'augmenter la résistance et de stimuler le gain d'autonomie dans les pays africains pour libérer l'Afrique et le Moyen-Orient."
  RULE_OPTION_ETH_ANARCHIST_ALT:0 "Communiste indépendant - Libérer l'Afrique"
  RULE_OPTION_ETH_ANARCHIST_ALT_desc:0 "L'IA tentera de transformer @ETHl'Éthiopie en une fédération §Rcommuniste§! avec le soutien d'anarchistes et de communistes du monde entier. L'IA tentera d'augmenter la résistance et de stimuler le gain d'autonomie dans les pays africains pour libérer l'Afrique."
  RULE_OPTION_ETH_COLLABORATIONIST:0 "Déclarer pour l'Italie - Sujet loyal"
  RULE_OPTION_ETH_COLLABORATIONIST_desc:0 "L'IA poignardera Haile Selassie dans le dos et prendra le parti des @ITAItaliens, faisant de @ETHl'Éthiopie une marionnette §Lfasciste§!."
  RULE_OPTION_ETH_INDEPENDENT_FASCIST:0 "Déclarer pour l'Italie - Guerre d'indépendance"
  RULE_OPTION_ETH_INDEPENDENT_FASCIST_desc:0 "L'IA poignardera Haile Selassie dans le dos et prendra le parti des @ITAItaliens, faisant de @ETHl'Éthiopie une marionnette §Lfasciste§!. Cependant, elle tentera de se libérer et de devenir une nation §Lfasciste§! indépendante."
  RULE_OPTION_DEFAULT_ETH_HOST_AI_DESC:0 "L'IA @ETHéthiopienne choisira un hôte aléatoire à tenter de convaincre au début de la partie, le @ENG Royaume-Uni est la cible la plus probable. §YCela n'aura d'effet que si Haile Selassie quitte pour parler à la Société des Nations, et que le pays hôte cible accepte!§!"
  RULE_OPTION_ENG_SOMALIA:0 "@ENG Royaume-Uni - Protéger la Somalie"
  RULE_ENG_SOMALIA_ETH_AI_DESC:0 "L'IA @ETHéthiopienne tentera d'obtenir que le @ENG Royaume-Uni les accueille en exil, et demandera éventuellement le contrôle de l'Érythrée et de la Somalie une fois que le continent sera repris. §YCela n'aura d'effet que si Haile Selassie quitte pour parler à la Société des Nations, et que le pays hôte cible accepte!§!"
  RULE_OPTION_ENG_PALESTINE:0 "@ENG Royaume-Uni - Empire de Salomon"
  RULE_ENG_PALESTINE_ETH_AI_DESC:0 "L'IA @ETHéthiopienne tentera d'obtenir que le @ENG Royaume-Uni les accueille en exil, et demandera éventuellement le contrôle de l'Érythrée et de la Palestine une fois que le continent sera repris. C'est le comportement historique. §YCela n'aura d'effet que si Haile Selassie quitte pour parler à la Société des Nations, et que le pays hôte cible accepte!§!"
  RULE_OPTION_SWE_NEUTRAL:0 "@SWESuède - Rester neutre"
  RULE_SWE_NEUTRAL_ETH_AI_DESC:0 "L'IA @ETHéthiopienne tentera d'obtenir que @SWElà Suède les accueille en exil, mais ne demandera pas à @SWElà Suède de rejoindre la guerre contre @ITA l'Italie. L'IA @ETHéthiopienne rejoindra probablement une faction en guerre contre @ITA l'Italie. §YCela n'aura d'effet que si Haile Selassie quitte pour parler à la Société des Nations, et que le pays hôte cible accepte!§!"
  RULE_OPTION_SWE_ALLIES_ETH:0 "@SWESuède - Rejoindre la guerre"
  RULE_SWE_ALLIES_ETH_AI_DESC:0 "L'IA @ETHéthiopienne tentera d'obtenir que @SWElà Suède les accueille en exil, et demandera à @SWElà Suède de rejoindre la guerre contre @ITA l'Italie. L'IA @ETHéthiopienne et @SWElà Suède rejoindront probablement une faction en guerre contre @ITA l'Italie. §YCela n'aura d'effet que si Haile Selassie quitte pour parler à la Société des Nations, et que le pays hôte cible accepte!§!"
  RULE_OPTION_JAP_ISLAND:0 "@JAPJapon - Île du Pacifique"
  RULE_JAP_ISLAND_ETH_AI_DESC:0 "L'IA @ETHéthiopienne tentera d'obtenir que @JAPle Japon les accueille en exil, et demandera le contrôle d'une île dans le Pacifique comme nouvelle base pour @ETHl'Éthiopie, devenant une marionnette de @JAPle Japon. §YCela n'aura d'effet que si Haile Selassie quitte pour parler à la Société des Nations, et que le pays hôte cible accepte!§!"
  RULE_OPTION_JAP_ARABIA:0 "@JAPJapon - Base arabe"
  RULE_JAP_ARABIA_ETH_AI_DESC:0 "L'IA @ETHéthiopienne tentera d'obtenir que @JAPle Japon les accueille en exil, et demandera à @JAPle Japon d'occuper le territoire @ENGbritannique arabe pour servir de base d'opérations pour @ETHl'Éthiopie afin de reprendre le continent, l'IA appellera probablement @JAPle Japon à la guerre contre @ITA l'Italie. §YCela n'aura d'effet que si Haile Selassie quitte pour parler à la Société des Nations, et que le pays hôte cible accepte!§!"
  RULE_OPTION_GER_MEDIATE:0 "@GERAllemagne - Médiation de la paix"
  RULE_GER_MEDIATE_ETH_AI_DESC:0 "L'IA @ETHéthiopienne tentera d'obtenir que @GERl'Allemagne les accueille en exil, et demandera à @GERl'Allemagne de médier un accord de paix entre @ETHl'Éthiopie et @ITA l'Italie. §YCela n'aura d'effet que si Haile Selassie quitte pour parler à la Société des Nations, et que le pays hôte cible accepte!§!"
  RULE_OPTION_GER_SABOTAGE:0 "@GERAllemagne - Sabotage des relations"
  RULE_GER_SABOTAGE_ETH_AI_DESC:0 "L'IA @ETHéthiopienne tentera d'obtenir que @GERl'Allemagne les accueille en exil, et tentera de saboter les relations entre @GERl'Allemagne et @ITA l'Italie, créant éventuellement une opération sous faux drapeau pour entraîner les deux grandes puissances dans une guerre l'une contre l'autre. §YCela n'aura d'effet que si Haile Selassie quitte pour parler à la Société des Nations, et que le pays hôte cible accepte!§!"
  RULE_HISTORICAL_AFA_AI_DESC:0 "@AFAL'Afar suivra le comportement historique, et aura une forte chance de se soumettre aux @ITAItaliens."
  RULE_OPTION_SUBMIT:0 "Se soumettre à l'Italie"
  RULE_SUBMIT_AFA_AI_DESC:0 "@AFAL'Afar se soumettra toujours à @ITA l'Italie lorsqu'ils demanderont l'annexion."
  RULE_OPTION_FIGHT_ITA:0 "Refuser l'annexion"
  RULE_FIGHT_ITA_AFA_AI_DESC:0 "@AFAL'Afar ne se soumettra jamais à @ITA l'Italie lorsqu'ils demanderont l'annexion."
  RULE_OPTION_FIGHT_ETH:0 "Refuser l'annexion - Attaquer l'Éthiopie"
  RULE_FIGHT_ETH_AFA_AI_DESC:0 "@AFAL'Afar ne se soumettra jamais à @ITA l'Italie lorsqu'ils demanderont l'annexion, s'ils survivent, ils tenteront de revendiquer l'empire @ETHéthiopien pour eux-mêmes."
  RULE_HISTORICAL_SWI_AI_DESC:0 "@SWILa Suisse restera entièrement neutre, tout en renforçant ses milices et ses fortifications en préparation à toute attaque. Ils pourront apporter un certain soutien aux alliés vers la fin de la guerre, selon les circonstances mondiales."
  RULE_NEUTRALITY_ALTERNATE_SWI_AI_DESC:0 "@SWILa Suisse restera entièrement neutre, mais initiera des accords sur le commerce civil et l'or avec les deux côtés de la guerre, permettant aux alliés et à l'axe d'accéder au marché suisse."
  RULE_OPTION_NEUTRALITY_MARTIAL_LAW:0 "Neutralité - Loi martiale"
  RULE_NEUTRALITY_MARTIAL_LAW_SWI_AI_DESC:0 "Dans une tentative de lutter contre l'ingérence étrangère, @SWIla Suisse déclarera la loi martiale, et installera un État policier tout en renforçant ses milices et ses fortifications en préparation à toute attaque. Ils pourront apporter un certain soutien à l'axe vers la fin de la guerre, selon les circonstances mondiales."
  RULE_OPTION_NEUTRALITY_PRO_ALLIES:0 "Neutralité - Soutien aux Alliés"
  RULE_NEUTRALITY_PRO_ALLIES_SWI_AI_DESC:0 "@SWILa Suisse restera principalement neutre, mais prendra des décisions et des focus qui favorisent les puissances §Cdémocratiques§!. Il y a un risque que les puissances §Lfascistes§! interprètent cela comme une violation de la neutralité."
  RULE_OPTION_NEUTRALITY_PRO_AXIS:0 "Neutralité - Soutien à l'Axe"
  RULE_NEUTRALITY_PRO_AXIS_SWI_AI_DESC:0 "@SWILa Suisse restera principalement neutre, mais prendra des décisions et des focus qui favorisent les puissances §Lfascistes§!. Il y a un risque que les puissances §Cdémocratiques§! interprètent cela comme une violation de la neutralité."
  RULE_OPTION_SWI_ALLIED_DEMOCRATIC:0 "Rejoindre les Alliés"
  RULE_OPTION_SWI_ALLIED_DEMOCRATIC_AI_DESC:0 "L'IA armara @SWIla Suisse et se préparera à la guerre, alignant @SWIla Suisse sur les puissances §Cdémocratiques§! du monde, rompant éventuellement la neutralité en faveur des Alliés."
  RULE_OPTION_SWI_SECRET_ALLIES:0 "Pacte secret avec les Alliés"
  RULE_OPTION_SWI_SECRET_ALLIES_AI_DESC:0 "L'IA armara @SWIla Suisse et se préparera à la guerre, alignant @SWIla Suisse sur les puissances §Cdémocratiques§! du monde, mais maintenant un vernis de neutralité. @SWILa Suisse soutiendra secrètement les puissances alliées avec des espions et un soutien industriel, et ne rejoindra la guerre que si les puissances §Cdémocratiques§! contrôlent @ITARome, @FRAParis, ou @GERBerlin."
  RULE_OPTION_SWI_FRENCH_PUPPET:0 "Marionnette française"
  RULE_SWI_FRENCH_PUPPET_SWI_AI_DESC:0 "@SWILa Suisse créera des accords commerciaux avec les puissances alliées, devenant éventuellement une marionnette de @FRAla France et déclarant la deuxième République helvétique."
  RULE_OPTION_SWI_FRENCH_PUPPET_ALPINE:0 "Marionnette française - Confédération alpine"
  RULE_SWI_FRENCH_PUPPET_ALPINE_SWI_AI_DESC:0 "@SWILa Suisse créera des accords commerciaux avec les puissances alliées, devenant éventuellement une marionnette de @FRAla France et déclarant la deuxième République helvétique. L'IA tentera de prendre le contrôle des territoires alpins et de créer la Confédération alpine."
  RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC:0 "Démocratie expansionniste"
  RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC:0 "L'IA restera §Cdémocratique§!, et essaiera de convaincre les États autour de @SWIla Suisse de rejoindre la confédération, et armara le pays en préparation au propriétaire de ces États refusant de laisser leurs États être libres."
  RULE_OPTION_SWI_EXPANSIONIST_NE:0 "Expansionniste - Entente neutre"
  RULE_OPTION_SWI_EXPANSIONIST_NE_AI_DESC:0 "L'IA restera §Cdémocratique§!, et essaiera de convaincre les États autour de @SWIla Suisse de rejoindre la confédération, et armara le pays en préparation au propriétaire de ces États refusant de laisser leurs États être libres. En plus de cela, l'IA tentera de former une faction avec d'autres pays neutres en Europe."
  RULE_OPTION_SWI_EXPANSIONIST_COMMUNIST:0 "Communisme expansionniste"
  RULE_OPTION_SWI_EXPANSIONIST_COMMUNIST_AI_DESC:0 "L'IA deviendra lentement §Rcommuniste§!, et essaiera de convaincre les États autour de @SWIla Suisse de rejoindre l'union populaire, et armara le pays en préparation au propriétaire de ces États refusant de laisser leurs États être libres."
  RULE_OPTION_SWI_AP_DEMOCRATIC:0 "Confédération alpine de Gotthard"
  RULE_OPTION_SWI_AP_DEMOCRATIC_AI_DESC:0 "L'IA @SWIssuisse tentera d'abandonner la neutralité en faveur d'un régime militariste et expansionniste dirigé par l'aile §Cdémocratique§! du Gotthardbund. L'IA tentera de former la Confédération alpine, et pourra déclarer la guerre aux pays voisins pour ce territoire."
  RULE_OPTION_SWI_AP_NE:0 "Gotthardbund - Entente neutre"
  RULE_OPTION_SWI_AP_NE_AI_DESC:0 "L'IA @SWIssuisse tentera d'abandonner la neutralité en faveur d'un régime militariste et expansionniste dirigé par l'aile §Cdémocratique§! du Gotthardbund. L'IA tentera de former la Confédération alpine, et tentera de former une faction avec d'autres pays neutres en Europe."
  RULE_OPTION_SWI_VORARLBERG:0 "Faire pression pour le Vorarlberg"
  RULE_OPTION_SWI_VORARLBERG_AI_DESC:0 "L'IA @SWIssuisse tentera d'abandonner la neutralité, et demandera à @AUL'Autriche de remettre l'État du Vorarlberg, retardant l'Anschluss. L'IA ne fera aucune autre demande à ses voisins."
  RULE_OPTION_SWI_VORARLBERG_NE:0 "Faire pression pour le Vorarlberg - Entente neutre"
  RULE_OPTION_SWI_VORARLBERG_NE_AI_DESC:0 "L'IA @SWIssuisse restera §Cdémocratique§!, mais tentera d'abandonner la neutralité, et demandera à @AUL'Autriche de remettre l'État du Vorarlberg, retardant l'Anschluss, l'IA ne fera aucune autre demande à ses voisins mais tentera de former une faction avec d'autres pays neutres en Europe."
  RULE_OPTION_SWI_IMPERIAL:0 "Ligue impériale de Gotthard"
  RULE_OPTION_SWI_IMPERIAL_AI_DESC:1 "L'IA @SWIssuisse tentera d'abandonner la neutralité et la démocratie en faveur d'un régime militariste et expansionniste dirigé par les membres du Gotthardbund. L'IA tentera de former le Protectorat alpin, et pourra déclarer la guerre aux pays voisins pour ce territoire."
  RULE_OPTION_SWI_AP_COMMUNIST:0 "Union populaire de Gotthard"
  RULE_OPTION_SWI_AP_COMMUNIST_AI_DESC:1 "L'IA @SWIssuisse tentera d'abandonner la neutralité et la démocratie en faveur d'un régime militariste et expansionniste dirigé par l'aile §Rcommuniste§! du Gotthardbund. L'IA tentera de former l'Union alpine, et pourra déclarer la guerre aux pays voisins pour ce territoire."
  RULE_OPTION_SWI_FASCIST:0 "Fasciste - Neutralité"
  RULE_OPTION_SWI_FASCIST_AI_DESC:0 "L'IA fera en sorte que @SWIla Suisse s'aligne avec @GERl'Allemagne et devienne lentement §Lfasciste§!, promouvant éventuellement Robert Tobler. L'IA tentera d'éviter de rejoindre l'Axe, cependant il y a un risque que les puissances démocratiques interprètent cela comme une violation de la neutralité et forcent @SWIla Suisse à rejoindre l'Axe quoi qu'il en soit."
  RULE_OPTION_SWI_FASCIST_AXIS_AI_DESC:0 "L'IA fera en sorte que @SWIla Suisse s'aligne avec @GERl'Allemagne et devienne lentement §Lfasciste§!, promouvant éventuellement Robert Tobler et s'alliant avec l'Axe."
  RULE_OPTION_SWI_FASCIST_PUPPET:0 "Fasciste - Marionnette de l'Axe"
  RULE_OPTION_SWI_FASCIST_PUPPET_AI_DESC:0 "L'IA fera en sorte que @SWIla Suisse s'aligne avec @GERl'Allemagne et devienne lentement §Lfasciste§!, promouvant éventuellement Rolf Henne et devenant une marionnette de la puissance §Lfasciste§! la plus proche."
  RULE_OPTION_SWI_FASCIST_PUPPET_ALPINE:0 "Fasciste - Marionnette alpine de l'Axe"
  RULE_OPTION_SWI_FASCIST_PUPPET_ALPINE_AI_DESC:0 "L'IA fera en sorte que @SWIla Suisse s'aligne avec @GERl'Allemagne et devienne lentement fasciste, promouvant éventuellement Rolf Henne et devenant une marionnette de la puissance §Lfasciste§! la plus proche. L'IA demandera le contrôle sur les territoires alpins, et si elle est en mesure de le faire, formera la Suprématie alpine."
  RULE_OPTION_GROUP_GENERAL_UI:0 "UI"
  OBSOLETE_FOCUS_BRANCHES_VISIBILITY:0 "Afficher les branches obsolètes dans l'arbre de focus"
  RULE_OPTION_HIDE:0 "Masquer"
  RULE_OPTION_HIDE_DESC:0 "Certaines branches obsolètes seront masquées dans les circonstances appropriées pour une navigation plus facile de l'arbre de focus."
  RULE_OPTION_SHOW:0 "Afficher"
  RULE_OPTION_SHOW_DESC_DESC:0 "Les branches obsolètes resteront toujours visibles dans l'arbre de focus."
  LON_NON_INTERFERENCE_RESOLUTION_CALL:0 "[FROM.GetNameDefCap] ne peut pas être appelé en raison d'une résolution de non-interférence de la Société des Nations"
  LON_NON_INTERFERENCE_RESOLUTION_JOIN:0 "Vous ne pouvez pas rejoindre [FROM.GetNameDef] en raison d'une résolution de non-interférence de la Société des Nations"
  RULE_VOLUNTEERS_ETHIOPIA_ONLY_ONE_TT:0 "Vous ne pouvez envoyer des unités volontaires qu'à [ETH.GetName] actuellement"
  ICELAND_HAS_DECLARED_NEUTRALITY_JOIN: "L'Islande a déclaré une neutralité absolue et ne peut pas rejoindre les guerres"
  ICELAND_HAS_DECLARED_NEUTRALITY_CALL: "L'Islande a déclaré une neutralité absolue et ne peut pas être appelée dans les guerres"
  DENMARK_IS_A_PUPPET_FACTION: "[DEN.GetNameDefCap] a été accordé un statut de protectorat spécial et ne peut pas rejoindre les factions"
  DENMARK_IS_A_PUPPET_JOIN: "[DEN.GetNameDefCap] a été accordé un statut de protectorat spécial et ne peut pas rejoindre les guerres"
  DENMARK_IS_A_PUPPET_CALL: "[DEN.GetNameDefCap] a été accordé un statut de protectorat spécial et ne peut pas être appelé dans les guerres"
  RULE_GROUP_PEACE_SCORE:0 "Distribution du score de paix"
  PEACE_SCORE_TO_OVERLORD:0 "Marionnettes à Suzerain"
  RULE_OPTION_PEACE_SCORE_TO_OVERLORD_YES_DESC:0 "Les marionnettes donnent une partie de leur score de paix à leur suzerain. Le ratio dépend de leur niveau d'autonomie."
  RULE_OPTION_PEACE_SCORE_TO_OVERLORD_NO_DESC:0 "Les marionnettes conservent tout le score de paix qu'elles ont gagné pendant la guerre."
  PEACE_SCORE_TO_FACTION_LEADER:0 "Membres de la faction au leader de la faction"
  RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_YES_DESC:0 "Les membres de la faction donnent 10% de leur score de paix au leader de la faction."
  RULE_OPTION_PEACE_SCORE_TO_FACTION_LEADER_NO_DESC:0 "Les membres de la faction conservent tout le score de paix qu'ils ont gagné pendant la guerre."
  PEACE_SCORE_RESET_LOW_SCORES:0 "Redistribuer les scores bas"
  RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_YES_DESC:0 "Les gagnants avec moins de 5% de participation à la guerre donnent tout leur score aux autres gagnants. Ne s'applique pas si aucun gagnant n'a au moins 10% de participation à la guerre. Ne s'applique pas aux joueurs humains."
  RULE_OPTION_PEACE_SCORE_RESET_LOW_SCORES_NO_DESC:0 "Tous les gagnants conservent tout le score de paix qu'ils ont gagné pendant la guerre."
  RULE_OPTION_HISTORICAL_SDP: "Sociaux-démocrates - Historique"
  RULE_HISTORICAL_SWE_AI_DESC: "Le parti §Csocial-démocrate§! @SWEsuédois maintiendra son emprise sur le gouvernement après les élections de 1936. @SWElà Suède restera neutre dans les affaires mondiales à moins d'être attaquée, et commercera avec toutes les autres nations occidentales indépendamment des conflits à leurs frontières."
  RULE_OPTION_SDP_ASSERTIVE: "Sociaux-démocrates - Assertifs"
  RULE_SDP_ASSERTIVE_SWE_AI_DESC: "Le parti §Csocial-démocrate§! @SWEsuédois maintiendra son emprise sur le gouvernement après les élections de 1936. @SWElà Suède restera neutre dans les affaires mondiales à moins d'être attaquée. @SWElà Suède fera des demandes aux autres pays pour affirmer ses propres intérêts sur la scène mondiale, comme la saisie de Landsverk, la demande des Åland à @FINla Finlande et l'occupation de Narvik au nom de @NORla Norvège si elle capitule, donnant à @SWElà Suède l'accès au commerce de la mer du Nord."
  RULE_OPTION_SWE_DEM_ALT: "Réarmement démocratique"
  RULE_OPTION_SWE_DEM_ALT_DESC: "Les élections @SWEsuédoises de 1936 auront lieu avec la victoire d'un parti §Cdémocratique§! aléatoire, l'IA suivra l'arbre démocratique mais maintiendra sa neutralité et se comportera de manière similaire à l'historique, tout en se réarmant plus rapidement et en penchant davantage vers des politiques de droite. L'IA enverra généralement des volontaires à @FINla Finlande pendant la guerre d'hiver."
  RULE_OPTION_SWE_ALLIES: "Démocratique - Protecteur des Alliés"
  RULE_OPTION_SWE_ALLIES_DESC: "Les élections @SWEsuédoises de 1936 auront lieu avec la victoire d'un parti §Cdémocratique§! aléatoire, l'IA suivra l'arbre démocratique, tout en se réarmant plus rapidement et en penchant davantage vers des politiques de droite. L'IA rejoindra la guerre d'hiver du côté de @FINla Finlande, et lancera également des opérations pour libérer @NORla Norvège et @DENle Danemark de tout pays qui les occupe en 1941. L'IA demandera également à rejoindre les Alliés pendant ces guerres de libération."
  RULE_OPTION_SWE_ALLIES_EXP: "Démocratique - Protecteur des Alliés assertif"
  RULE_OPTION_SWE_ALLIES_EXP_DESC: "Les élections @SWEsuédoises de 1936 auront lieu avec la victoire d'un parti §Cdémocratique§! aléatoire, l'IA suivra l'arbre démocratique, tout en se réarmant plus rapidement et en penchant davantage vers des politiques de droite. L'IA demandera les Åland à @FINla Finlande et occupera Narvik au nom de @NORla Norvège si elle capitule. @SWElà Suède se préparera également à libérer @NORla Norvège et @DENle Danemark de tout pays qui les occupe en 1941. L'IA demandera également à rejoindre les Alliés et commencera des guerres en 1943 contre @ENG l'Angleterre, @GERl'Allemagne, ou @SOVla Russie si elles ne sont pas §Cdémocratiques§!."
  RULE_OPTION_SWE_COMMUNISM: "Communisme"
  RULE_OPTION_SWE_COMMUNISM_DESC: "L'IA @SWEsuédoise suivra l'arbre §Rcommuniste§! et s'alliera soit avec l'Axe soit avec les Alliés."
  RULE_OPTION_SWE_FASCIST_INDEPENDENT: "Fasciste - Neutralité"
  RULE_OPTION_SWE_FASCIST_INDEPENDENT_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement maintiendra la neutralité dans les affaires mondiales, mais pourra rejoindre une faction s'il est attaqué."
  RULE_OPTION_SWE_FASCIST_NEU_ASSERTIVE: "Fasciste - Assertif"
  RULE_OPTION_SWE_FASCIST_NEU_ASSERTIVE_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement demandera les îles baltes à @DENle Danemark et @FINla Finlande, et demandera Narvik du nord à @NORla Norvège. Sinon, @SWElà Suède maintiendra une neutralité lâche, mais pourra rejoindre une faction fasciste si elle se trouve en guerre."
  RULE_OPTION_SWE_FASCIST_NEU_EXP: "Fasciste - Expansionniste"
  RULE_OPTION_SWE_FASCIST_NEU_EXP_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement demandera des territoires et la soumission de @NORla Norvège, @DENle Danemark et @FINla Finlande, allant jusqu'à tenter de former det Stornordiska Riket. Sinon, @SWElà Suède maintiendra une neutralité lâche."
  RULE_OPTION_SWE_FASCIST_NEU_ANTI_SOV: "Fasciste - Expansionniste anti-soviétique"
  RULE_OPTION_SWE_FASCIST_NEU_ANTI_SOV_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement demandera des territoires et la soumission de @NORla Norvège, @DENle Danemark et @FINla Finlande, allant jusqu'à tenter de former det Stornordiska Riket. @SWElà Suède déclarera une croisade anti-bolchevique en 1941, et rejoindra probablement une faction en guerre avec l'@SOVUnion soviétique."
  RULE_OPTION_SWE_FASCIST_ALLIES: "Fasciste - Alliés"
  RULE_OPTION_SWE_FASCIST_ALLIES_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement demandera à rejoindre les Alliés vers 1940."
  RULE_OPTION_SWE_FASCIST_ALLIES_ASSERTIVE: "Fasciste - Alliés assertifs"
  RULE_OPTION_SWE_FASCIST_ALLIES_ASSERTIVE_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement demandera à rejoindre les Alliés et demandera le contrôle sur les anciens territoires coloniaux de @SWElà Suède auprès des puissances démocratiques majeures @ENG@FRA@USA. L'IA demandera les îles baltes à @DENle Danemark et @FINla Finlande."
  RULE_OPTION_SWE_FASCIST_ALLIES_EXP: "Fasciste - Alliés expansionnistes"
  RULE_OPTION_SWE_FASCIST_ALLIES_EXP_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement demandera à rejoindre les Alliés et demandera le contrôle sur les anciens territoires coloniaux de @SWElà Suède auprès des puissances démocratiques majeures @ENG@FRA@USA. L'IA demandera des territoires et la soumission de @DENle Danemark et @FINla Finlande, allant jusqu'à tenter de former det Stornordiska Riket."
  RULE_OPTION_SWE_FASCIST_ALLIES_ANTI_SOV: "Fasciste - Alliés anti-soviétiques"
  RULE_OPTION_SWE_FASCIST_ALLIES_ANTI_SOV_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement demandera à rejoindre les Alliés et demandera le contrôle sur les anciens territoires coloniaux de @SWElà Suède auprès des puissances démocratiques majeures @ENG@FRA@USA. L'IA demandera des territoires et la soumission de @DENle Danemark et @FINla Finlande, allant jusqu'à tenter de former det Stornordiska Riket. @SWElà Suède déclarera une croisade anti-bolchevique en 1941, entraînant probablement les puissances alliées dans cette guerre."
  RULE_OPTION_SWE_FASCIST_FIN: "Fasciste - Défense finlandaise"
  RULE_OPTION_SWE_FASCIST_FIN_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement demandera d'abord les Åland à @FINla Finlande, tout en rejoignant leur côté pendant la guerre d'hiver. Si elles acceptent, @SWElà Suède formera une faction de défense finno-suédoise avec elles."
  RULE_OPTION_SWE_FASCIST_FIN_ASSERTIVE: "Fasciste - Défense finlandaise assertive"
  RULE_OPTION_SWE_FASCIST_FIN_ASSERTIVE_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement demandera d'abord les Åland à @FINla Finlande, tout en rejoignant leur côté pendant la guerre d'hiver. Si elles acceptent, @SWElà Suède formera une faction de défense finno-suédoise avec elles. L'IA demandera Bornholm à @DENle Danemark et Narvik à @NORla Norvège."
  RULE_OPTION_SWE_FASCIST_FIN_ANTI_SOV: "Fasciste - Défense finlandaise agressive"
  RULE_OPTION_SWE_FASCIST_FIN_ANTI_SOV_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices. Le gouvernement @SWEsuédois succombera alors à une prise de contrôle fasciste. Le nouveau gouvernement demandera d'abord les Åland à @FINla Finlande, tout en rejoignant leur côté pendant la guerre d'hiver. Si elles acceptent, @SWElà Suède formera une faction de défense finno-suédoise avec elles. L'IA demandera des territoires et la soumission de @DENle Danemark et @NORla Norvège, allant jusqu'à tenter de former det Stornordiska Riket. @SWElà Suède déclarera une croisade anti-bolchevique en 1941, entraînant @FINla Finlande dans la guerre avec eux."
  RULE_OPTION_SWE_FASCIST_PUPPET: "Reichskommissariat fasciste"
  RULE_OPTION_SWE_FASCIST_PUPPET_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices, mais ne peuvent pas lancer un coup d'État sans le soutien de @GERl'Allemagne. S'ils reçoivent ce soutien, ils deviendront une marionnette de @GERl'Allemagne, et intégreront l'économie @SWEsuédoise dans le grand Reich."
  RULE_OPTION_SWE_FASCIST_PUPPET_NORDLAND: "RK Nordland fasciste"
  RULE_OPTION_SWE_FASCIST_PUPPET_NORDLAND_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices, mais ne peuvent pas lancer un coup d'État sans le soutien de @GERl'Allemagne. S'ils reçoivent ce soutien, ils deviendront une marionnette de @GERl'Allemagne, et intégreront l'économie @SWEsuédoise dans le grand Reich. L'IA fera des revendications sur d'autres territoires @NOR@DEN@FIN@ICE nordiques et gérera tous les territoires nordiques pour le Reich en tant que Reichskommissariat Nordland."
  RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER: "RK Traître fasciste"
  RULE_OPTION_SWE_FASCIST_PUPPET_BACKSTABBER_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, les §LNSAP§! parviennent à obtenir suffisamment de membres au Riksdag pour acter la révocation des lois anti-milices, mais ne peuvent pas lancer un coup d'État sans le soutien de @GERl'Allemagne. S'ils reçoivent ce soutien, ils deviendront une marionnette de @GERl'Allemagne, et intégreront l'économie @SWEsuédoise dans le grand Reich. L'IA fera des efforts pour résister à l'influence @GERallemande, et déclarera éventuellement un Nouvel Ordre, se libérant et déclarant la guerre à leurs anciens maîtres."
  RULE_OPTION_SWE_UNALIGNED: "Monarchiste - Neutralité"
  RULE_OPTION_SWE_UNALIGNED_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, §0le roi Gustaf V§! réprimera les opportunistes fascistes et assumera le rôle qu'un roi devrait avoir. Le nouveau gouvernement maintiendra la neutralité dans les affaires mondiales, mais pourra rejoindre une faction s'il est attaqué."
