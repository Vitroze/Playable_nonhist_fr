 RULE_OPTION_DEMOCRATIC_REARM_ENG:0"Conservateurs : rejoignez le Royaume-Uni »
 RULE_DEMOCRATIC_REARM_ENG_DEN_AI_DESC:0"Le @DEN§CCParti conservateur§ danois ! remportera les élections après un vote de censure et orientera les dépenses gouvernementales vers l'armée et les fortifications. L'IA tentera de rejoindre la faction @ENGUnited Kingdom. §RRemarque :§!Le @ENGRoyaume-Uni ne doit pas être §RCommuniste§! ou §LFasciste§!"
 RULE_OPTION_DEMOCRATIC_REARM_EURO:0"Conservateurs - Rejoignez les démocraties européennes"
 RULE_DEMOCRATIC_REARM_EURO_DEN_AI_DESC:0"Le @DEN§CCParti conservateur§ danois ! remportera les élections après un vote de censure et orientera les dépenses gouvernementales vers l'armée et les fortifications. L'IA tentera de rejoindre ou de créer une faction avec une @FRA@GER@SOVEuropean Major. §RRemarque :§ ! Les options sont @FRAFrance (pas §RCommunist§! ou §LFascist§!), @GERAllemagne (pas §RCommunist§! ou §LFascist§!), ou @SOVRussia (doit être §0Monarchiste§! ou §RRight Opposition§!)."
