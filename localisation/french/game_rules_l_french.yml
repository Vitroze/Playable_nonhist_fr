 RULE_KOKOOMUS_NORDIC_EXP_FIN_AI_DESC:"@FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale, mais en restant fidèle à l'expansionniste Risto Ryti dans le Kansallinen Edistyspuolue. @FINFinlande tentera de parvenir à un accord pour fusionner avec @ESTEstonie et faire valoir ses revendications sur d'autres @LAT@LITpays baltes, et tentera également de créer un soulèvement en @KARCarélie pour déclencher une guerre expansionniste contre l'@SOVUnion soviétique. L'IA tentera de créer le Front de défense du Nord et d'inviter tous les autres §Rnon-communistes§ ! @FIN@DEN@NOR@SWEpays nordique dès qu'ils le pourront - une fois que la tension mondiale sera suffisamment élevée."
 RULE_OPTION_MONARCHIST:"Monarchie de Kokoomus"
 RULE_MONARCHIST_FIN_AI_DESC:"@FINLa Finlande maintiendra sa politique nationale et restera neutre dans la guerre mondiale, mais rester aux côtés du conservateur Pehr Evind Svinhufvud au Kansallinen Kokoomus lui permet de couronner le prince allemand Wolfgang von Hesse comme roi. L'IA aura une coopération militaire limitée avec l'@GERAllemagne pour récupérer les territoires perdus lors de la guerre d'hiver auprès des @SOVSoviets s'ils lancent l'opération Barbarossa."
