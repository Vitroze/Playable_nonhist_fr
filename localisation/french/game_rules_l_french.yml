  RULE_OPTION_FIN_COMMUNIST_PLAN: "Neutralité communiste"
  RULE_OPTION_FIN_COMMUNIST_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! signera un accord de non-agression avec l'@SOVUnion soviétique, mais restera sinon neutre dans les affaires mondiales."
  RULE_OPTION_FIN_COMMUNIST_COMINTERN_PLAN: "Staliniste Komintern"
  RULE_OPTION_FIN_COMMUNIST_COMINTERN_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! signera un accord de non-agression avec l'@SOVUnion soviétique, puis rejoindra le Komintern au début de 1939."
  RULE_OPTION_FIN_COMMUNIST_COMINTERN_KARELIA_PLAN: "Staliniste Komintern - Union carélienne"
  RULE_OPTION_FIN_COMMUNIST_COMINTERN_KARELIA_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! rejoindra le Komintern avant de demander le contrôle sur Kola et Carélie à l'@SOVUnion soviétique."
  RULE_OPTION_FIN_COMMUNIST_COMINTERN_BALTIC_PLAN: "Staliniste Komintern - Gardien des Baltes"
  RULE_OPTION_FIN_COMMUNIST_COMINTERN_BALTIC_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! rejoindra le Komintern avant de demander le contrôle sur Kola et Carélie à l'@SOVUnion soviétique. L'IA tentera d'influencer, de transformer en État fantoche ou d'annexer les États @EST@LIT@LATBaltes."
  RULE_OPTION_FIN_COMMUNIST_COMINTERN_RED_FINLAND_PLAN: "Staliniste Komintern - Finlande rouge"
  RULE_OPTION_FIN_COMMUNIST_COMINTERN_RED_FINLAND_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! rejoindra le Komintern avant de demander le contrôle sur Kola et Carélie à l'@SOVUnion soviétique. L'IA tentera d'influencer, de transformer en État fantoche ou d'annexer les États @EST@LIT@LATBaltes, et obtiendra ensuite des objectifs de guerre sur d'autres États @SWE@NOR@DEN@ICEScandinaves en 1941."
  RULE_OPTION_FIN_COMMUNIST_PRO_SOV_NORDIC_PLAN: "Union nordique staliniste"
  RULE_OPTION_FIN_COMMUNIST_PRO_SOV_NORDIC_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! signera un accord de non-agression avec l'@SOVUnion soviétique, et créera une faction de Défense nordique avec d'autres pays @SWE@NOR@DEN@ICENordiques §CDémocratiques§! et §RCommunistes§! en 1939."
  RULE_OPTION_FIN_COMMUNIST_PRO_SOV_NORDIC_BALTIC_PLAN: "Staliniste nordique - Gardien des Baltes"
  RULE_OPTION_FIN_COMMUNIST_PRO_SOV_NORDIC_BALTIC_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! signera un accord de non-agression avec l'@SOVUnion soviétique, et créera une faction de Défense nordique avec d'autres pays @SWE@NOR@DEN@ICENordiques §CDémocratiques§! et §RCommunistes§! en 1939. L'IA tentera d'influencer et de transformer en État fantoche les États @EST@LIT@LATBaltes."
  RULE_OPTION_FIN_COMMUNIST_PRO_SOV_NORDIC_SAMPI_PLAN: "Staliniste nordique - Gardien des Samis"
  RULE_OPTION_FIN_COMMUNIST_PRO_SOV_NORDIC_SAMPI_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! signera un accord de non-agression avec l'@SOVUnion soviétique, et créera une faction de Défense nordique avec d'autres pays @SWE@NOR@DEN@ICENordiques §CDémocratiques§! et §RCommunistes§! en 1939. L'IA tentera d'influencer et de transformer en État fantoche les États @EST@LIT@LATBaltes, demandera le contrôle sur les territoires Samis en @SWESuède et @NORNorvège, et déclarera éventuellement la guerre à l'@GERAllemagne en 1941."
  RULE_OPTION_FIN_COMMUNIST_ANTISOV_PLAN: "Neutralité communiste"
  RULE_OPTION_FIN_COMMUNIST_ANTISOV_PLAN_DESC: "Les communistes @FINFinlandais organiseront le mouvement de gauche, unissant socialistes, sociaux-démocrates et autres éléments de gauche afin de renverser le gouvernement. Le nouveau gouvernement §RCommuniste§! commencera à s'opposer à l'@SOVUnion soviétique, et pourrait obtenir une garantie d'une @ENG@FRApuissance majeure, mais restera sinon neutre dans les affaires mondiales."
