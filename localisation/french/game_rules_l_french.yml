 RULE_OPTION_STALIN:0"Staline - Historique"
 RULE_OPTION_STALIN_SOV_AI_DESC:0"L'IA @SOVSoviétique tentera de suivre autant que possible la chaîne historique des événements, de légères variations peuvent être apportées en fonction des événements mondiaux.
 RULE_OPTION_STALIN_ALTERNATE:0"Staline - Antifasciste"
 RULE_OPTION_ALTERNATE_SOV_AI_DESC:0"L'IA @SOVSoviétique se concentrera d'abord sur les fascistes et visera à ce que sa politique soit plus indulgente envers les puissances alliées, l'IA sera moins surprise par une invasion allemande que d'habitude."
 RULE_OPTION_STALIN_AGGRESSIVE:0"Staline - Expansionniste"
 RULE_OPTION_STALIN_AGGRESSIVE_SOV_AI_DESC:0"L’IA @SOVSoviétique se concentrera d’abord sur ses intérêts immédiats en matière d’expansion et visera à ce que ses politiques soient plus autoritaires et anticapitalistes. »
 RULE_OPTION_LEFT_TROTSKY:0"Opposition de gauche - Lev Trotsky"
 RULE_OPTION_LEFT_TROTSKY_SOV_AI_DESC:0"Le @SOVIA soviétique tentera de réintégrer Trotsky et de relancer la révolution permanente, Trotsky est §Ydécentraliste§ ! et §Yrévolutionnaire§!."
 RULE_OPTION_LEFT_SMIRNOV:0"Opposition de gauche - Ivan Smirnov"
 RULE_OPTION_LEFT_SMIRNOV_SOV_AI_DESC:0"Le @SOVl'IA soviétique tentera de réintégrer l'opposition de gauche, mais rejettera Trotsky et installera son allié Smirnov, Smirnov est §industriel§ ! et §Révolutionnaire§!."
 RULE_OPTION_LEFT_KAMENEV:0"Opposition de gauche - Lev Kamenev"
 RULE_OPTION_LEFT_KAMENEV_SOV_AI_DESC:0"L'@SOVIA soviétique tentera de réintégrer l'opposition de gauche, mais rejettera Trotsky et installera Zinovyeva Kamenev, Kamenev est §Ydécentraliste§ ! et §Ycoopératif avec l'opposition§!."
 RULE_OPTION_LEFT_MIL:0"Opposition de gauche - Leadership militaire"
 RULE_OPTION_LEFT_MIL_SOV_AI_DESC:0"L'IA @SOVSoviétique tentera de réintégrer l'opposition de gauche, mais rejettera tous les dirigeants et nommera un chef militaire aléatoire. Ce leader se comportera §Yindustriel§ ! et §Ymilitariste§!."
 RULE_LEFT_OPPOSITION_COOPERATIVE:0"Opposition à la coopération - Gauche"
 RULE_OPTION_LEFT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0"L'IA @SOVSoviétique tentera de réintégrer l'Opposition de gauche et d'inclure d'autres groupes d'opposition dans le parti, ainsi que de relancer la révolution permanente. Le but pour l’IA est d’être §Ytrès coopérative§ ! et former le Soviet suprême. §YA, un leader de gauche aléatoire sera choisi§!"
 RULE_OPTION_RIGHT_BUKHARIN:0"Opposition de droite - Nikolaï Boukharine"
 RULE_OPTION_RIGHT_BUKHARIN_SOV_AI_DESC:0"Le @SOVl'IA soviétique tentera de mettre Boukharine au pouvoir et de se retirer de la NEP. Boukharine est §Yindustriel§! et §Ycoopérer avec les capitalistes§!."
 RULE_OPTION_RIGHT_RYKOV:0"Opposition de droite - Alexeï Rykov"
 RULE_OPTION_RIGHT_RYKOV_SOV_AI_DESC:0"Le @SOVl'IA soviétique tentera d'instaurer l'opposition de droite, mais rejettera Boukharine et instituera son allié Rykov, Rykov est §industriel§ ! et un §Ymodéré§!."
 RULE_OPTION_RIGHT_ZINOVYEV:0"Opposition de droite - Grigori Zinoviev"
 RULE_OPTION_RIGHT_ZINOVYEV_SOV_AI_DESC:0"Le @SOVl'IA soviétique tentera d'instaurer l'opposition de droite, mais rejettera Boukharine et nommera le chef de faction Zinovyev, Zinovyev est §Ymilitariste§ ! et §Yrévolutionnaire§!."
 RULE_OPTION_RIGHT_MIL:0"Opposition de droite - Leadership militaire"
 RULE_OPTION_RIGHT_MIL_SOV_AI_DESC:0"L'IA @SOVSoviétique tentera de rétablir l'opposition de droite, mais rejettera tous les dirigeants et nommera un chef militaire aléatoire. Ce leader se comportera en §Militarisme§ ! et §Industriel§!."
 RULE_RIGHT_OPPOSITION_COOPERATIVE:0"Opposition à la coopération - Droite"
 RULE_OPTION_RIGHT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0"L'IA @SOVSoviétique tentera de réintégrer l'opposition de droite et d'inclure également d'autres groupes d'opposition dans le parti. Le but pour l’IA est d’être §Ytrès coopérative§ ! et former le Soviet suprême. §YA, le leader de droite aléatoire sera choisi§!"
 RULE_OPTION_COMMUNIST_SSR_LOYAL:0"RSS communiste - Loyal"
 RULE_OPTION_COMMUNIST_POL_AI_DESC:0"La grève des paysans @POLPolonais renversera le gouvernement et le §RKPP§ ! prendra le leadership, un accord avec le @SOVURSS sera conclu pour se protéger contre l'agression, et @POLPologne rendra l'Est."
 RULE_OPTION_COMMUNIST_SSR_INDEPENDENT:0"RSS communiste - Indépendance"
 RULE_OPTION_COMMUNIST_SSR_INDEPENDENT_POL_AI_DESC:0"La grève des paysans @POLPolonais renversera le gouvernement et le §RKPP§ ! prendra la direction, @POLLa Pologne cédera l'Est au @SOVUSSR, mais déclarera son indépendance en fin de partie."
 RULE_OPTION_COMMUNIST_SSR_INDEPENDENT_ALLIES:0"RSS communiste - L'indépendance rejoint les alliés"
 RULE_OPTION_COMMUNIST_SSR_INDEPENDENT_ALLIES_POL_AI_DESC:0"La grève des paysans @POLPolonais renversera le gouvernement et le §RKPP§ ! prendra le leadership, @POLLa Pologne cédera l'est au @SOVUSSR, mais déclarera son indépendance en fin de partie et tentera de rejoindre les Alliés.
 RULE_OPTION_COMMUNIST_ALLIES_POL_AI_DESC:0"La grève des paysans @POLPolonais renversera le gouvernement et le §RKPP§ ! prendra la direction du groupe dirigé par Maria Koszutska. L’IA polonaise tentera alors de rejoindre les Alliés. »
 RULE_OPTION_COMMUNIST_SSR:0"RSS communiste"
 RULE_COMMUNIST_SSR_BALTIC_AI_DESC:0"L'IA tentera d'établir un §Rcommuniste§! régime fidèle au @SOVUnion soviétique."
 RULE_OPTION_COMMUNIST_BALTIC_SSR:0"Communiste - RSS Baltique"
 RULE_COMMUNIST_BALTIC_SSR_BALTIC_AI_DESC:0"L'IA tentera d'établir un §Rcommuniste§! régime fidèle à l'@SOVUnion soviétique, puis susciter des révolutions dans les @LIT@LAT@ESTÉtats baltes pour former la RSS balte unie.
 RULE_OPTION_COMMUNIST_BELARUS_SSR:0"Communiste - RSS Baltique-Biélorussie"
 RULE_COMMUNIST_BELARUS_SSR_BALTIC_AI_DESC:0"L'IA tentera d'établir un §Rcommuniste§! régime fidèle à l'@SOVUnion soviétique, puis demander le contrôle du @BLRterritoire biélorusse dans l'@SOVUnion soviétique. Elle tentera ensuite d’annexer les États baltes @LIT@LAT@ESTBaltique pour former la RSS Baltique-Biélorussie. »
 RULE_OPTION_COMMUNIST_REVOLUTIONARY_POL_AI_DESC:0"La grève des paysans @POLPolonais renversera le gouvernement et le §RKPP§ ! prendra la direction du groupe dirigé par Maria Koszutska. @POLLa Pologne étendra ensuite son territoire aux @LIT@LAT@ESTBaltiques, et en fin de partie tentera de démanteler les pays capitalistes d'Europe.
 RULE_OPTION_SANATION_HISTORICAL:0"Centre d'Assainissement - Historique"
 RULE_OPTION_HISTORICAL_POL_AI_DESC:0"L'IA @POLPolish consolidera le gouvernement de l'État dirigé par Ignacy Mościcki et restera neutre à moins qu'elle ne soit attaquée. C'est un comportement historique."
 RULE_OPTION_SANATION_CASTLE_ALLIES:0"Centre d'assainissement - Alliés"
 RULE_OPTION_SANATION_CASTLE_ALLIES_POL_AI_DESC:0"Le @POLl'IA polonaise consolidera le gouvernement de l'État dirigé par Ignacy Mościcki, puis tentera de rejoindre les alliés (si la tension mondiale est suffisamment élevée)."
 RULE_OPTION_SANATION_CASTLE_LIT_ALLY:0"Centre d'assainissement - Alliance lituanienne"
 RULE_OPTION_SANATION_CASTLE_LIT_ALLY_POL_AI_DESC:0"L'@POLIA polonaise consolidera le gouvernement de l'État dirigé par Ignacy Mościcki, puis tentera de créer une alliance avec @LITLituanie."
 RULE_OPTION_SANATION_LEFT_ALLIES:0"Sanation Gauche - Alliés"
 RULE_OPTION_SANATION_LEFT_ALLIES_POL_AI_DESC:0"L'@POLAI polonaise consolidera le gouvernement de l'assainissement sous la direction du président de gauche Walery Sławek. L'IA tentera de rejoindre les alliés (si la tension mondiale est suffisamment élevée) et lancera une invitation à @ROMRoumanie."
 RULE_OPTION_SANATION_LEFT_BALTIC:0""Gauche Sanation - Alliance Baltique"
