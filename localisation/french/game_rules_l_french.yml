 RULE_OPTION_HUN_COMMUNIST_STALINISM_AGGR:"Staline pannonien - Bloc de l'Est divisé"
 RULE_FASCIST_HUN_AI_DESC:0"L'IA @HUNhongroise maintiendra la régence de Miklós Horthy et tentera de rejoindre l'Axe. L'IA attendra les années 1940 pour exiger des territoires mineurs de ses @CZE@ROMvoisins, à moins qu'ils n'aient déjà obtenu ce territoire par l'arbitrage @GERallemand. Cette IA n'exigera pas le Burgenland de la part de @AUSAustria ou @GERAllemagne."
 RULE_OPTION_HUN_HORTHY_AXIS_ALT_HUN_AI_DESC:"L'IA @HUNhongroise maintiendra la régence de Miklós Horthy et tentera de rejoindre l'Axe. L'IA tentera d'exiger des territoires mineurs de ses @CZE@ROMvoisins dès qu'ils le pourront, à moins qu'ils n'aient déjà obtenu ce territoire par l'arbitrage @GERallemand."
 RULE_OPTION_HUN_HORTHY_ROME_HUN_AI_DESC:"L'IA @HUNhongroise maintiendra la régence de Miklós Horthy et tentera de renouveler les protocoles de Rome avec @ITAItalie. L'IA attendra les années 1940 pour exiger des territoires mineurs à ses @CZE@ROMvoisins, à moins qu'ils n'aient déjà obtenu ce territoire par l'arbitrage @GERallemand ou @ITAitalien. Cette IA n'exigera pas le Burgenland de la part de @AUSAustria ou @GERAllemagne"
 RULE_OPTION_HUN_HORTHY_ROME_ALT_HUN_AI_DESC:"L'IA @HUNhongroise maintiendra la régence de Miklós Horthy et tentera de renouveler les protocoles de Rome avec @ITAItalie. L'IA tentera d'exiger des territoires mineurs de ses @CZE@ROMvoisins dès qu'ils le pourront, à moins qu'ils n'aient déjà obtenu ce territoire de la part du @GERallemand ou de l'@ITAitalien.
 RULE_OPTION_HUN_HORTHY_NEU_HUN_AI_DESC:"L'IA @HUNhongroise maintiendra la régence de Miklós Horthy, mais n'essaiera de rejoindre aucune faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple si elles sont toutes les deux en guerre). L'IA attendra les années 1940 pour exiger des territoires mineurs de ses @CZE@ROMvoisins, à moins qu'ils n'aient déjà obtenu ce territoire par l'arbitrage @GERallemand. Cette IA n'exigera pas le Burgenland de la part de @AUSAustria ou @GERAllemagne."
 RULE_OPTION_HUN_HORTHY_NEU_AGGR_HUN_AI_DESC:"L'IA @HUNhongroise maintiendra la régence de Miklós Horthy, mais n'essaiera de rejoindre aucune faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple si elles sont toutes les deux en guerre). L'IA tentera d'exiger des territoires mineurs de ses @CZE@ROMvoisins dès qu'ils le pourront, à moins qu'ils n'aient déjà obtenu ce territoire par l'arbitrage @GERallemand."
 RULE_ARROW_CROSS_MOVEMENT_NEU_HUN_AI_DESC:"L'IA @HUNhongroise tentera d'établir une règle absolue sous le §LAArrow Cross Party§!, mais n'essaiera de rejoindre aucune faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple si elles sont toutes les deux en guerre). @HUNHongrie ne présentera aucune revendication territoriale à ses voisins, à moins que ce territoire ne leur ait déjà été accordé par l'arbitrage @GERallemand."
 RULE_ARROW_CROSS_MOVEMENT_HUN_AI_DESC:"L'IA @HUNhongroise tentera d'établir une règle absolue sous le §LAArrow Cross Party§!, mais n'essaiera de rejoindre aucune faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple si elles sont toutes les deux en guerre). @HUNLa Hongrie attendra les années 1940 pour exiger des territoires mineurs de ses @CZE@ROM@YUG@AUSvoisins, à moins qu'ils n'aient déjà obtenu ce territoire suite à l'arbitrage @GERallemand."
 RULE_ARROW_CROSS_MOVEMENT_NEU_ANTI_COMMUNIST_HUN_AI_DESC:"L'IA @HUNhongroise tentera d'établir une règle absolue sous le §LAArrow Cross Party§!, mais n'essaiera de rejoindre aucune faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple si elles sont toutes les deux en guerre). @HUNLa Hongrie attendra les années 1940 pour exiger des territoires mineurs de ses @CZE@ROM@YUG@AUSvoisins, à moins qu'ils n'aient déjà obtenu ce territoire par l'arbitrage @GERallemand. L'IA tentera également de revendiquer les anciennes terres magyares et de lancer une nouvelle croisade contre les maux du @SOVcommunisme athée.
 RULE_ARROW_CROSS_MOVEMENT_AXIS_HUN_AI_DESC:"L'IA @HUNhongroise tentera d'établir un régime absolu sous le §LArrow Cross Party§!, et tentera de rejoindre l'Axe. @HUNHongrie ne présentera aucune revendication territoriale à ses voisins, à moins que ce territoire ne leur ait déjà été accordé par l'arbitrage @GERallemand."
 RULE_ARROW_CROSS_MOVEMENT_AXIS_EXP_HUN_AI_DESC:"L'IA @HUNhongroise tentera d'établir un régime absolu sous le §LArrow Cross Party§!, et tentera de rejoindre l'Axe. @HUNLa Hongrie attendra les années 1940 pour exiger des territoires mineurs de ses @CZE@ROM@YUG@AUSvoisins, à moins qu'ils n'aient déjà obtenu ce territoire suite à l'arbitrage @GERallemand."
 RULE_ARROW_CROSS_MOVEMENT_AXIS_ANTI_COMMUNIST_HUN_AI_DESC:"L'IA @HUNhongroise tentera d'établir un régime absolu sous le §LArrow Cross Party§!, et tentera de rejoindre l'Axe. @HUNLa Hongrie attendra les années 1940 pour exiger des territoires mineurs de ses @CZE@ROM@YUG@AUSvoisins, à moins qu'ils n'aient déjà obtenu ce territoire par l'arbitrage @GERallemand. L’IA tentera également de revendiquer les anciennes terres magyares et de lancer une nouvelle croisade contre les maux du @SOVcommunisme athée. »
 RULE_ARROW_CROSS_MOVEMENT_ROME_HUN_AI_DESC:"L'@HUNIA hongroise tentera d'établir un régime absolu sous le §LArrow Cross Party§!, en renouvelant les protocoles de Rome avec @ITAItalie. @HUNHongrie ne formulera aucune revendication territoriale envers ses voisins, à moins que ce territoire ne leur ait déjà été accordé par un arbitrage @GERallemand ou @ITAitalien."
 RULE_ARROW_CROSS_MOVEMENT_ROME_EXP_HUN_AI_DESC:"L'@HUNIA hongroise tentera d'établir un régime absolu sous le §LArrow Cross Party§!, en renouvelant les protocoles de Rome avec @ITAItalie. @HUNHongrie attendra les années 1940 pour exiger des territoires mineurs de ses @CZE@ROM@YUG@AUSvoisins, à moins qu'ils n'aient déjà obtenu ce territoire de la part du @GERallemand ou de l'@ITAitalien arbitrage."
 RULE_ARROW_CROSS_MOVEMENT_ROME_ANTI_COMMUNIST_HUN_AI_DESC:"L'@HUNIA hongroise tentera d'établir un régime absolu sous le §LArrow Cross Party§!, en renouvelant les protocoles de Rome avec @ITAItalie. @HUNLa Hongrie attendra les années 1940 pour exiger des territoires mineurs de ses @CZE@ROM@YUG@AUSvoisins, à moins qu'ils n'aient déjà obtenu ce territoire de la part du @GERallemand ou de l'@ITAitalien arbitrage. L’IA tentera également de revendiquer les anciennes terres magyares et de lancer une nouvelle croisade contre les maux du @SOVcommunisme athée. »
 RULE_FASCIST_ALTERNATE_KING_HUN_AI_DESC:"L'@HUNIA hongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§ ! Friedrich Franz de Mecklembourg-Schwerin sera roi, mais n'essaiera de rejoindre aucune faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple si elles sont toutes les deux en guerre). @HUNHongrie ne présentera aucune revendication territoriale à ses voisins, à moins que ce territoire ne leur ait déjà été accordé par l'arbitrage @GERallemand."
 RULE_FASCIST_ALTERNATE_KING_ALT_HUN_AI_DESC:"L'@HUNIA hongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§ ! Friedrich Franz de Mecklembourg-Schwerin sera roi, mais n'essaiera de rejoindre aucune faction, cependant l'IA rejoindra toujours les factions selon les règles normales du jeu (par exemple si elles sont toutes les deux en guerre). @HUNLa Hongrie attendra d'avoir une armée suffisamment importante pour exiger des territoires mineurs de ses @CZE@ROM@YUG@AUSvoisins, à moins qu'ils n'aient déjà obtenu ce territoire par l'arbitrage @GERallemand."
 RULE_FASCIST_ALTERNATE_KING_AXIS_HUN_AI_DESC:"L'@HUNIA hongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§ ! Friedrich Franz de Mecklembourg-Schwerin devient roi et tente de rejoindre l'Axe. @HUNHongrie ne présentera aucune revendication territoriale à ses voisins, à moins que ce territoire ne leur ait déjà été accordé par l'arbitrage @GERallemand."
 RULE_FASCIST_ALTERNATE_KING_AXIS_ALT_HUN_AI_DESC:"L'@HUNIA hongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§ ! Friedrich Franz de Mecklembourg-Schwerin devient roi et tente de rejoindre l'Axe. @HUNLa Hongrie attendra d'avoir une armée suffisamment importante pour exiger des territoires mineurs de ses @CZE@ROM@YUG@AUSvoisins, à moins qu'ils n'aient déjà obtenu ce territoire par l'arbitrage @GERallemand."
 RULE_FASCIST_ALTERNATE_KING_ROME_HUN_AI_DESC:"L'@HUNIA hongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§ ! Friedrich Franz de Mecklembourg-Schwerin deviendra roi, renouvelant les protocoles de Rome avec @ITAItaly. @HUNHongrie ne formulera aucune revendication territoriale envers ses voisins, à moins que ce territoire ne leur ait déjà été accordé par un arbitrage @GERallemand ou @ITAitalien."
 RULE_FASCIST_ALTERNATE_KING_ROME_ALT_HUN_AI_DESC:"L'@HUNIA hongroise mettra fin à la régence de Horthy et élira le §Lsympathisant fasciste§ ! Friedrich Franz de Mecklembourg-Schwerin deviendra roi, renouvelant les protocoles de Rome avec @ITAItaly. La @HUNHongrie attendra d'avoir une armée suffisamment importante pour exiger des territoires mineurs de ses @CZE@ROM@YUG@AUSvoisins, à moins qu'ils n'aient déjà obtenu ce territoire de la part du @GERallemand ou de l'@ITAitalien arbitrage."
 RULE_HORTHYIST_KING_HUNGARY_HUN_AI_DESC:"L'IA @HUNhongroise couronnera Miklós Horthy roi de Hongrie, en respectant techniquement les stipulations de la petite entente. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant de tenter d'établir un grand royaume hongrois en s'emparant du territoire de ses voisins directs @YUG@CZE@ROM@AUSdans les années 1940."
 RULE_HORTHYIST_KING_HUNGARY_FAST_HUN_AI_DESC:"L'IA @HUNhongroise couronnera Miklós Horthy roi de Hongrie, en respectant techniquement les stipulations de la petite entente. L'IA tentera ensuite d'établir un grand royaume hongrois en s'emparant du territoire de ses voisins directs @YUG@CZE@ROM@AUSdirects dès qu'ils le pourront, préparés ou non."
 RULE_HORTHYIST_KING_HUNGARY_ANTI_COMMUNIST_HUN_AI_DESC:"L'IA @HUNhongroise couronnera Miklós Horthy roi de Hongrie, en respectant techniquement les stipulations de la petite entente. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant de tenter d'établir un grand royaume hongrois en s'emparant du territoire de ses @YUG@CZE@ROM@AUSvoisins directs dans les années 1940, et d'attaquer directement les régimes communistes majeurs et proches du monde en fin de partie.
 RULE_HORTHYIST_KING_HUNGARY_ALT_HUN_AI_DESC:"L'IA @HUNhongroise couronnera Miklós Horthy roi de Hongrie, en respectant techniquement les stipulations de la petite entente. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant de tenter d'établir un grand royaume hongrois en s'emparant du territoire de ses @YUG@CZE@ROM@AUSvoisins directs dans les années 1940, et de tenter de former un royaume apostolique en attaquant d'autres @YUG@ROM@CZE@AUS@POL@GRE@TURnearby et @SOV@ENG@FRAnations impériales pour les anciennes revendications magyares."
 RULE_HORTHYIST_KING_HUNGARY_ALLIES_HUN_AI_DESC:"L'IA @HUNhongroise couronnera István Horthy comme roi de Hongrie, en respectant techniquement les stipulations de la petite entente. L'IA construira ensuite son industrie et son armée tout en tentant de rejoindre les @ENGanglais dans une alliance, avant de tenter d'établir un grand royaume hongrois en s'emparant du territoire de ses @YUG@CZE@ROM@AUSvoisins directs dans les années 1940."
 RULE_HORTHYIST_KING_HUNGARY_ALLIES_FAST_HUN_AI_DESC:"L'IA @HUNhongroise couronnera István Horthy comme roi de Hongrie, en respectant techniquement les stipulations de la petite entente. L'IA tentera de rejoindre l'@ENGEnglish dans une alliance, tout en essayant d'établir un grand royaume hongrois en s'emparant du territoire de ses @YUG@CZE@ROM@AUSvoisins directs dès qu'ils le pourront, préparés ou non.
 RULE_HORTHYIST_KING_HUNGARY_ALLIES_ANTI_COMMUNISM_HUN_AI_DESC:"L'IA @HUNhongroise couronnera István Horthy comme roi de Hongrie, en respectant techniquement les stipulations de la petite entente. L'IA construira ensuite son industrie et son armée tout en tentant de rejoindre les @ENGanglais dans une alliance, avant de tenter d'établir un grand royaume hongrois en s'emparant du territoire de ses @YUG@CZE@ROM@AUSvoisins directs dans les années 1940, et d'attaquer directement les §Rcommunistes§ majeurs et proches ! régimes dans le monde en fin de partie. »
 RULE_OPTION_DEMOCRATIC_HUN_AI_DESC:"L'@HUNIA hongroise tentera de devenir une monarchie constitutionnelle en empruntant la voie appropriée dans l'arbre des priorités nationales, en élisant le §Cdémocratique§ ! sympathisant Carl V Wilhelm en tant que nouveau roi apostolique. Cette IA restera généralement neutre dans les affaires mondiales. »
 RULE_OPTION_DEMOCRATIC_ALLIES_HUN_AI_DESC:"L'@HUNIA hongroise tentera de devenir une monarchie constitutionnelle en empruntant la voie appropriée dans l'arbre des priorités nationales, en élisant le §Cdémocratique§ ! sympathisant Carl V Wilhelm en tant que nouveau roi apostolique. @HUNHongrie tentera de rejoindre les Alliés avant 1939. »
 RULE_OPTION_DEMOCRATIC_BALKAN_HUN_AI_DESC:"L'@HUNIA hongroise tentera de devenir une monarchie constitutionnelle en empruntant la voie appropriée dans l'arbre des priorités nationales, en élisant le §Cdémocratique§ ! sympathisant Carl V Wilhelm en tant que nouveau roi apostolique. @HUNHongrie tentera de créer une alliance et une union avec @ROMRoumanie, avec la possibilité d'inviter d'autres @CZE@YUG@BUL@ALB@GRE@AUSpays des Balkans."
 RULE_OPTION_AUSTRIA_HUNGARY_HUN_AI_DESC:"L'IA @HUNhongroise restaurera le règne des Habsbourg sur la nation, en sélectionnant Otto von Habsburg comme dirigeant s'il est disponible. @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et tentera de recréer les puissances centrales avec @GERAllemagne. L'IA peut exiger des terres @CROcroates de @YUGYougoslavie, et @TRATransylvanie de @ROMRoumanie."
 RULE_OPTION_AUSTRIA_HUNGARY_CP_AGGR_HUN_AI_DESC:"L'IA @HUNhongroise restaurera le règne des Habsbourg sur la nation, en sélectionnant Otto von Habsburg comme dirigeant s'il est disponible. @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et tentera de recréer les puissances centrales avec @GERAllemagne. L'IA exigera des terres @CROcroates de @YUGYougoslavie, @TRATransylvanie de @ROMRoumanie et @UKRGalacia de @POLPologne, et tentera de restaurer complètement l'@AUS@HUNEmpire austro-hongrois.
 RULE_OPTION_AUSTRIA_HUNGARY_ALLIES_HUN_AI_DESC:"L'IA @HUNhongroise restaurera le règne des Habsbourg sur la nation, en sélectionnant Otto von Habsburg comme dirigeant s'il est disponible. @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et tentera de recréer l'ancienne grande alliance avec le @ENGRoyaume-Uni. L'IA peut exiger des terres @CROcroates de @YUGYougoslavie, et @TRATransylvanie de @ROMRoumanie."
 RULE_OPTION_AUSTRIA_HUNGARY_ALLIES_AGGR_HUN_AI_DESC:"L'IA @HUNhongroise restaurera le règne des Habsbourg sur la nation, en sélectionnant Otto von Habsburg comme dirigeant s'il est disponible. @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et tentera de recréer l'ancienne grande alliance avec le @ENGRoyaume-Uni. L'IA exigera des terres @CROcroates de @YUGYougoslavie, @TRATransylvanie de @ROMRoumanie et @UKRGalacia de @POLPologne, et tentera de restaurer complètement l'@AUS@HUNEmpire austro-hongrois.
 RULE_OPTION_AUSTRIA_HUNGARY_HB_HUN_AI_DESC:"L'IA @HUNhongroise restaurera le règne des Habsbourg sur la nation, en sélectionnant Otto von Habsburg comme dirigeant s'il est disponible. @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et créera une alliance royaliste avec leurs nations soumises pour exiger que @POLLa Pologne revienne au pouvoir des Habsbourg, ainsi que @UKRUkraine si @AUS@HUNAutriche-Hongrie contrôle ce territoire. L'IA peut exiger des terres @CROcroates de @YUGYougoslavie, et @TRATransylvanie de @ROMRoumanie."
 RULE_OPTION_AUSTRIA_HUNGARY_HB_AGGR_HUN_AI_DESC:"L'IA @HUNhongroise restaurera le règne des Habsbourg sur la nation, en sélectionnant Otto von Habsburg comme dirigeant s'il est disponible. @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, et créera une alliance royaliste avec leurs nations soumises pour exiger que les autres nations reviennent au pouvoir des Habsbourg. L'IA exigera des terres @CROcroates de @YUGYougoslavie, @TRATransylvanie de @ROMRoumanie, @UKRGalacia de @POLPologne, et tentera de restaurer complètement l'@AUS@HUNEmpire austro-hongrois."
 RULE_OPTION_AUSTRIA_HUNGARY_NEU_AGGR_HUN_AI_DESC:"L'IA @HUNhongroise restaurera le règne des Habsbourg sur la nation, en sélectionnant Otto von Habsburg comme dirigeant s'il est disponible. @HUNHongrie exigera que les titres des Habsbourg soient restaurés à la fois en @AUSAutriche et en @CZETchécoslovaquie, mais ne créera pas sa propre faction, ni ne tentera de rejoindre les puissances centrales ou les alliés. L'IA exigera des terres @CROcroates de @YUGYougoslavie, @TRATransylvanie de @ROMRoumanie, @UKRGalacia de @POLPologne, et tentera de restaurer complètement l'@AUS@HUNEmpire austro-hongrois."
 RULE_HABSBURG_HUNGARY_HUN_AI_DESC:"L'IA @HUNhongroise élira Joseph August von Habsburg comme son roi. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant de tenter de restaurer la Grande Hongrie sous la domination des Habsbourg en s'emparant du territoire de ses voisins directs @YUG@CZE@ROMdans les années 1940."
 RULE_HABSBURG_HUNGARY_FAST_HUN_AI_DESC:"L'IA @HUNhongroise élira Joseph August von Habsburg comme son roi. L'IA tentera ensuite de restaurer la Grande Hongrie sous la domination des Habsbourg en s'emparant du territoire de ses @YUG@CZE@ROMvoisins directs dès qu'ils le pourront, préparés ou non."
 RULE_HABSBURG_HUNGARY_ANTI_COMMUNIST_HUN_AI_DESC:"L'IA @HUNhongroise élira Joseph August von Habsburg comme son roi. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant de tenter de restaurer la Grande Hongrie sous la domination des Habsbourg en s'emparant du territoire de ses @YUG@CZE@ROMvoisins directs dans les années 1940, et d'attaquer directement les §Rcommunistes§ majeurs et proches ! régimes dans le monde en fin de partie. »
 RULE_HABSBURG_HUNGARY_ALT_HUN_AI_DESC:"L'IA @HUNhongroise élira Joseph August von Habsburg comme son roi. L'IA construira ensuite son industrie et son armée pendant un certain temps, avant de tenter de restaurer la Grande Hongrie sous la domination des Habsbourg en s'emparant du territoire de ses @YUG@CZE@ROMvoisins directs dans les années 1940, et de tenter de former un royaume apostolique en attaquant d'autres @YUG@ROM@CZE@AUS@POL@GRE@TURnearby et @SOV@ENG@FRAnations impériales pour les anciennes revendications magyares."
 RULE_REPUBLICAN_DEMOCRACY_HUN_AI_DESC:"L'IA @HUNhongroise s'opposera à Horthy et tentera d'instaurer la §Cdémocratie§ ! à la nation via la révolution, en établissant la Deuxième République et en formant la Fédération danubienne avec d'autres @CZE@YUG@AUS@BUL@GRE@ROMnations des Balkans, l'IA n'exigera pas l'autonomie de @TRASzékely par rapport à @ROMRoumanie."
 RULE_REPUBLICAN_DEMOCRACY_NEU_HUN_AI_DESC:"L'IA @HUNhongroise s'opposera à Horthy et tentera d'instaurer la §Cdémocratie§ ! à la nation via la révolution, établissant la Deuxième République hongroise. L’IA n’imposera aucune exigence à ses voisins et ne formera pas sa propre faction. »
 RULE_REPUBLICAN_DEMOCRACY_AGGR_HUN_AI_DESC:"L'IA @HUNhongroise s'opposera à Horthy et tentera d'instaurer la §Cdémocratie§ ! à la nation via la révolution, en établissant la Deuxième République et en formant la Fédération danubienne avec d'autres @CZE@YUG@AUS@BUL@GRE@ROMnations des Balkans, l'IA exigera l'autonomie de @TRASzékely par rapport à @ROMRoumanie, et poursuivra l'expansion de sa faction de manière plus agressive.
 RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_FAST_HUN_AI_DESC:"L'IA @HUNhongroise s'opposera à Horthy et tentera d'instaurer la §Cdémocratie§ ! à la nation via la révolution, en établissant la Deuxième République et en embrassant le Mouvement Dragon. L'IA commencera à attaquer ses voisins dès que possible pour tenter de restaurer la Grande Hongrie. »
 RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_HUN_AI_DESC:"L'IA @HUNhongroise s'opposera à Horthy et tentera d'instaurer la §Cdémocratie§ ! à la nation via la révolution, en établissant la Deuxième République et en embrassant le Mouvement Dragon. L’IA commencera à attaquer ses voisins dans les années 1940 pour tenter de restaurer la Grande Hongrie. »
 RULE_REPUBLICAN_DEMOCRACY_EXPANSIONIST_AGGR_HUN_AI_DESC:"L'IA @HUNhongroise s'opposera à Horthy et tentera d'instaurer la §Cdémocratie§ ! à la nation via la révolution, en établissant la Deuxième République et en embrassant le Mouvement Dragon. L'IA commencera à attaquer ses voisins dès que possible pour tenter de restaurer la Grande Hongrie. L’IA commencera également à attaquer tous les §Ynon-démocratiques§ ! Après cela, c'est un grand pays européen."
 RULE_OPTION_COMMUNIST_HUN_AI_DESC:"L'IA @HUNhongroise s'opposera à Horthy et tentera de provoquer un §Rcommuniste§ ! révolution menée par Mátyás Rákosi, qui tentera de rejoindre le Komintern. Cette IA n'attaquera pas ses voisins."
 RULE_OPTION_COMMUNIST_AGGR_HUN_AI_DESC:"L'IA @HUNhongroise s'opposera à Horthy et tentera de provoquer un §Rcommuniste§ ! révolution menée par Mátyás Rákosi, qui tentera de rejoindre le Komintern. Cette IA a fait pression sur l'@SOVUnion soviétique pour diviser la @ROMRoumanie et ensuite attaquer la @CZETchécoslovaquie à cause des revendications de la @HUNhongroise."
 RULE_RESTORE_THE_SOCIALIST_REPUBLIC_HUN_AI_DESC:"L'IA @HUNhongroise s'opposera à Horthy et tentera de provoquer une révolution socialiste dirigée par Béla Kun, Restaurer la République fédérative socialiste. La @HUNHongrie adoptera le revanchisme et attaquera ses @CZE@ROM@YUGvoisins à cause de leurs revendications nécessaires à la réalisation d'un Grand État hongrois rouge, et peut-être même d'un État uni des Balkans.
 RULE_RESTORE_THE_SOCIALIST_REPUBLIC_NEU_HUN_AI_DESC:"L'IA @HUNhongroise s'opposera à Horthy et tentera de provoquer une révolution socialiste dirigée par Béla Kun, Restaurer la République fédérative socialiste. @HUNHongrie rejettera le revanchisme et tentera de rester neutre dans les affaires mondiales. »
