 RULE_OPTION_HUN_DEMOCRATIC_KING_ALLIES:"Roi Démocratique - Rejoignez les Alliés"
 RULE_OPTION_HUN_DEMOCRATIC_KING_BALKAN:"Roi Démocratique - Pacte Balkanique"
