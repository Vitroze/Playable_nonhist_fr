 RULE_OPTION_DEN_MONARCHIST_EXP_NORD_AI_DESC:0"La droite renversera le gouvernement, laissant au pouvoir le roi Christian X, qui tentera d’envahir et d’annexer @NOR@SWEles voisins nordiques et de fantocher diplomatiquement @LIT@LAT@ESTles pays baltes. L'IA tentera de former l'Union @DEN@NOR@SWEKalmar."
