  RULE_DEMOCRATIC_ALTERNATE_FRA_AI_DESC:1 "L'IA @FRAFrançaise tentera de rester §Cdémocratique§! pour former la Petite Entente afin de contenir l'Allemagne. Si la @CZETchécoslovaquie crée cette faction, elle la rejoindra à la place (le DLC \"Mort ou Dishonneur\" est requis)."
  RULE_DEMOCRATIC_STRESA_FRONT_FRA_AI_DESC:1 "L'IA @FRAFrançaise tentera de rester §Cdémocratique§! pour former le Front de Stresa avec l'@ITAItalie en échange de concessions territoriales, et tentera de convaincre le @ENGRoyaume-Uni d'accepter les deux dans les Alliés."
  RULE_DEMOCRATIC_FRANCO_SOVIET_TREATY_FRA_AI_DESC:1 "L'IA @FRAFrançaise restera §Cdémocratique§! et tentera de créer un traité de garanties mutuelles avec l'@SOVUnion soviétique."
  RULE_OPTION_COMMUNIST_FRA_AI_DESC:0 "L'IA @FRAFrançaise tentera de devenir §Rcommuniste§! et de rejoindre le Komintern en suivant les branches pertinentes de l'arbre de focus national."
  RULE_OPTION_COMMUNIST_ANTIFA_FRA_AI_DESC:0 "L'IA @FRAFrançaise tentera de devenir §Rcommuniste§! et de créer une coalition anti-fasciste avec les pays §Rcommunistes§! et §Cdémocratiques§! voisins."
  RULE_OPTION_COMMUNIST_REVOLUTIONARY_FRA_AI_DESC:0 "L'IA @FRAFrançaise tentera de devenir §Rcommuniste§! et d'instiguer des révolutions dans les pays européens."
  RULE_OPTION_DEMOCRATIC_HISTORICAL_FRA_AI_DESC:0 "L'IA @FRAFrançaise restera §Cdémocratique§! et tentera de suivre la chaîne d'événements historiques autant que possible."
  RULE_FASCIST_FRA_AI_DESC:0 "L'IA @FRAFrançaise tentera de devenir §Lfasciste§! et de faire cause commune avec une @GERAllemagne §Lfasciste§!, en suivant la voie pertinente dans l'arbre de focus national."
  RULE_FASCIST_LATIN_ENTENTE_FRA_AI_DESC:0 "L'IA @FRAFrançaise tentera de devenir §Lfasciste§! et de créer une Entente latine avec l'@SPREspagne, le @PORPortugal et l'@ITAItalie pour s'opposer à la fois à l'@GERAllemagne et au @ENGRoyaume-Uni."
  RULE_OPTION_BALKAN_DOMINANCE_ROM_AI_DESC:0 "L'IA @ROMRoumaine maintiendra le règne royal du roi Carol, et tentera éventuellement d'établir la suprématie sur ses voisins des Balkans."
  RULE_OPTION_STANDARD_ROM_AI_DESC:0 "L'IA @ROMRoumaine peut changer de camp dans les grandes guerres de fin de partie, ceci est le comportement standard."
  RULE_OPTION_LOYAL_ROM_AI_DESC:0 "L'IA @ROMRoumaine ne changera pas de camp en utilisant son arbre de focus et ses décisions."
  RULE_OPTION_DEMOCRATIC_ROM_AI_DESC:0 "L'IA @ROMRoumaine tentera de réformer le pays en une §Cdémocratie§! fonctionnelle et de s'allier avec d'autres grandes puissances démocratiques.\n§YLa Roumanie peut changer de camp dans les grandes guerres de fin de partie sauf si la règle de jeu est désactivée.§!"
  RULE_OPTION_SANITAIRE_ROM_AI_DESC:0 "L'IA @ROMRoumaine tentera de réformer le pays en une §Cdémocratie§! fonctionnelle et de s'allier avec la @POLPologne, en ravivant le concept Entre les Mers."
  RULE_COMMUNIST_ROM_AI_DESC:0 "L'IA @ROMRoumaine tentera de forger une alliance avec une grande puissance §Rcommuniste§!.\n§YLa Roumanie peut changer de camp dans les grandes guerres de fin de partie sauf si la règle de jeu est désactivée.§!"
  RULE_OPTION_COMMUNIST_YUG_AI_DESC:0 "La @YUGYougoslavie reconnaîtra l'@SOVUnion soviétique et recevra une aide économique de leur part, puis §Rabolira la monarchie§! et rejoindra le Komintern."
  RULE_OPTION_COMMUNIST_NEUTRAL_YUG_AI_DESC:0 "La @YUGYougoslavie reconnaîtra l'@SOVUnion soviétique et recevra une aide économique de leur part, puis §Rabolira la monarchie§!. L'IA ne rejoindra pas le Komintern ni ne formera aucune faction."
  RULE_OPTION_COMMUNIST_SLAVIC_YUG_AI_DESC:0 "La @YUGYougoslavie reconnaîtra l'@SOVUnion soviétique et abolira la monarchie, formant la §RRépublique fédérale socialiste§!. L'IA tentera de promouvoir le communisme en @BULBulgarie et en @ALBAlbanie et formera une faction avec eux."
  RULE_OPTION_COMMUNIST_BALKAN_YUG_AI_DESC:0 "La @YUGYougoslavie reconnaîtra l'@SOVUnion soviétique et abolira la monarchie, formant la §RRépublique fédérale socialiste§!. L'IA tentera de promouvoir le communisme dans les @BUL@ALB@ROM@GRE@HUNBalkans et formera une alliance avec autant de pays communistes balkaniques que possible."
  RULE_HISTORICAL_YUG_AI_DESC:0 "La @YUGYougoslavie suivra la chaîne d'événements historiques, restant neutre, mais tentera de signer le Pacte tripartite en 1941, si le @ENGRoyaume-Uni (ou une autre grande puissance §Cdémocratique§!) le refuse alors la @YUGYougoslavie reculera et rejoindra les Alliés en 1942."
  RULE_BIGGER_NEUTRAL_YUG_AI_DESC:0 "La @YUGYougoslavie suivra la chaîne d'événements historiques, restant neutre, mais n'essayera pas de signer le Pacte tripartite ou de rejoindre les Alliés, et essaiera de rester aussi neutre que possible."
  RULE_SMALLER_NEUTRAL_YUG_AI_DESC:0 "La @YUGYougoslavie cédera à la fois la Slovénie et la Macédoine à ses voisins, empêchant les disputes sur ces territoires. L'IA n'essayera pas de signer le Pacte tripartite ou de rejoindre les Alliés, et essaiera de rester aussi neutre que possible."
  RULE_SPLIT_U_NEUTRAL_YUG_AI_DESC:0 "La @YUGYougoslavie divisera le pays en territoires plus petits. L'IA n'essayera pas de signer le Pacte tripartite ou de rejoindre les Alliés, et essaiera de rester aussi neutre que possible. L'IA réunira les royaumes balkaniques en fin de partie."
  RULE_SPLIT_I_NEUTRAL_YUG_AI_DESC:0 "La @YUGYougoslavie divisera le pays en territoires plus petits. L'IA n'essayera pas de signer le Pacte tripartite ou de rejoindre les Alliés, et essaiera de rester aussi neutre que possible. L'IA libérera les royaumes balkaniques en fin de partie, ne laissant que la @SERSerbie."
  RULE_SPLIT_I_NEUTRAL_LEAGUE_YUG_AI_DESC:0 "La @YUGYougoslavie divisera le pays en territoires plus petits. L'IA n'essayera pas de signer le Pacte tripartite ou de rejoindre les Alliés, et essaiera de rester aussi neutre que possible. L'IA libérera les royaumes balkaniques en fin de partie, formant la Ligue de défense balkanique avec eux."
  RULE_BIGGER_ALLIES_YUG_AI_DESC:0 "La @YUGYougoslavie tentera de rejoindre les Alliés en 1940 tout en se réformant lentement en une §Cdémocratie§!."
  RULE_SMALLER_ALLIES_YUG_AI_DESC:0 "La @YUGYougoslavie cédera à la fois la Slovénie et la Macédoine à ses voisins, empêchant les disputes sur ces territoires. Ensuite, l'IA tentera de rejoindre les Alliés en 1940 tout en se réformant lentement en une §Cdémocratie§!."
  RULE_SPLIT_U_ALLIES_YUG_AI_DESC:0 "La @YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de rejoindre les Alliés en 1940 tout en se réformant lentement en une §Cdémocratie§! et réunira les royaumes balkaniques en fin de partie."
  RULE_SPLIT_I_ALLIES_YUG_AI_DESC:0 "La @YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de rejoindre les Alliés en 1940 tout en se réformant lentement en une §Cdémocratie§! et libérera les royaumes balkaniques en fin de partie, ne laissant que la @SERSerbie."
  RULE_BIGGER_ALLIANCE_YUG_AI_DESC:0 "La @YUGYougoslavie tentera de former un mariage royal et une alliance avec une puissance monarchiste en 1940."
  RULE_SMALLER_ALLIANCE_YUG_AI_DESC:0 "La @YUGYougoslavie cédera à la fois la Slovénie et la Macédoine à ses voisins, empêchant les disputes sur ces territoires. Ensuite, l'IA tentera de former un mariage royal et une alliance avec une puissance monarchiste en 1940."
  RULE_SPLIT_U_ALLIANCE_YUG_AI_DESC:0 "La @YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de former un mariage royal et une alliance avec une puissance monarchiste en 1940, et réunira les royaumes balkaniques en fin de partie."
  RULE_SPLIT_I_ALLIANCE_YUG_AI_DESC:0 "La @YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de former un mariage royal et une alliance avec une puissance monarchiste en 1940, et libérera les royaumes balkaniques en fin de partie, ne laissant que la @SERSerbie."
  RULE_BIGGER_AXIS_YUG_AI_DESC:0 "La @YUGYougoslavie tentera de rejoindre l'Axe en 1940 tout en se réformant lentement en une §Ldictature fasciste§!."
  RULE_BIGGER_AXIS_EXPANSION_YUG_AI_DESC:0 "La @YUGYougoslavie tentera d'échanger Zara contre l'adhésion à la faction de l'@ITAItalie (ou de l'Axe) en 1940 tout en se réformant lentement en une §Ldictature fasciste§!. L'IA tentera de revendiquer et d'annexer la @BULBulgarie."
  RULE_SMALLER_AXIS_YUG_AI_DESC:0 "La @YUGYougoslavie cédera à la fois la Slovénie et la Macédoine à ses voisins, empêchant les disputes sur ces territoires. Ensuite, l'IA tentera de rejoindre l'Axe en 1940 tout en se réformant lentement en une §Ldictature fasciste§!."
  RULE_SPLIT_U_AXIS_YUG_AI_DESC:0 "La @YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de rejoindre l'Axe en 1940 tout en se réformant lentement en une §Ldictature fasciste§! et réunira les royaumes balkaniques en fin de partie."
  RULE_SPLIT_U_AXIS_EXPANSION_YUG_AI_DESC:0 "La @YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera d'échanger Zara contre l'adhésion à la faction de l'@ITAItalie (ou de l'Axe) en 1940, tout en se réformant lentement en une §Ldictature fasciste§!. L'IA tentera de revendiquer et de transformer en État fantoche la @BULBulgarie, et réunira les royaumes balkaniques en fin de partie."
  RULE_SPLIT_I_AXIS_YUG_AI_DESC:0 "La @YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de rejoindre l'Axe en 1940 tout en se réformant lentement en une §Ldictature fasciste§! et libérera les royaumes balkaniques en fin de partie, ne laissant que la @SERSerbie."
  RULE_OPTION_DEMOCRATIC_CZE_AI_DESC:0 "L'IA @CZETchécoslovaque tentera de rester §Cdémocratique§! et se concentrera principalement sur son développement interne en suivant les voies pertinentes de l'arbre de focus national."
  RULE_OPTION_COMMUNIST_CZE_AI_DESC:0 "L'IA @CZETchécoslovaque tentera de réformer le pays en §Rcommunisme§! et d'entrer dans une alliance avec l'@SOVUnion soviétique ou une autre nation communiste majeure."
  RULE_OPTION_DEMOCRATIC_ALTERNATE_CZE_AI_DESC:0 "L'IA @CZETchécoslovaque tentera de former une faction propre pour se défendre tout en restant §Cdémocratique§!, en suivant les voies pertinentes de l'arbre de focus national."
  RULE_FASCIST_PARTNER_CZE_AI_DESC:0 "L'IA @CZETchécoslovaque tentera de rendre le pays §Lfasciste§! et d'entrer dans un partenariat égal avec l'@GERAllemagne."
  RULE_FASCIST_ALLY_CZE_AI_DESC:0 "L'IA @CZETchécoslovaque tentera de rendre le pays §Lfasciste§! et d'entrer dans un arrangement de marionnette avec l'@GERAllemagne."
  RULE_FASCIST_PUPPET_CZE_AI_DESC:0 "L'IA @CZETchécoslovaque tentera de rendre le pays §Lfasciste§! et de livrer les Sudètes à l'@GERAllemagne."
  RULE_HISTORICAL_CZE_AI_DESC:0 "L'IA @CZETchécoslovaque suivra la chaîne d'événements historiques autant que possible."
  RULE_FASCIST_ROM_AI_DESC:0 "L'IA @ROMRoumaine tentera de §Lsuivre l'histoire§! et de rejoindre l'Axe.\n§YLa Roumanie peut changer de camp dans les grandes guerres de fin de partie sauf si la règle de jeu est désactivée.§!"
  RULE_FASCIST_ALTERNATE_ROM_AI_DESC:0 "L'IA @ROMRoumaine tentera de former un État §Lfasciste clérical§! sous Codreanu ou Goga, et tentera de rejoindre l'Axe.\n§YLa Roumanie peut changer de camp dans les grandes guerres de fin de partie sauf si la règle de jeu est désactivée.§!"
  RULE_OPTION_COMMUNIST_AST_AI_DESC:0 "L'IA @ASTAustralienne tentera de rendre le pays §Rcommuniste§! et de s'allier avec le Komintern. Elle exigera que le gouvernement de la @NZLNouvelle-Zélande se soumette à la volonté du peuple."
  RULE_COMMUNIST_ALTERNATE_AST_AI_DESC:0 "L'IA @ASTAustralienne tentera de rendre le pays §Rcommuniste§! et de s'isoler du monde. Elle exigera que le gouvernement de la @NZLNouvelle-Zélande se soumette à la volonté du peuple, et finira par s'attaquer à la menace @JAPJaponaise."
  RULE_OPTION_DEMOCRATIC_HISTORICAL_AST_AI_DESC:0 "L'IA @ASTAustralienne restera §Cdémocratique§! et tentera de suivre la chaîne d'événements et de décisions historiques dans l'arbre de focus national."
  RULE_DEMOCRATIC_ALTERNATE_AST_AI_DESC:0 "L'IA @ASTAustralienne tentera d'obtenir une pleine indépendance vis-à-vis du @ENGRoyaume-Uni tout en restant §Cdémocratique§! et de s'allier avec les @USAÉtats-Unis, elle offrira de protéger les @INSIndes orientales si les @HOLPays-Bas capitulent."
  RULE_FASCIST_AST_AI_DESC:0 "L'IA @ASTAustralienne tentera de devenir §Lfasciste§!, de commencer un coup d'État dans les @INSIndes orientales et de s'allier avec le @JAPJapon."
  RULE_FASCIST_ALTERNATE_AST_AI_DESC:0 "L'IA @ASTAustralienne tentera de devenir §Lfasciste§!, de commencer un coup d'État dans les @INSIndes orientales puis de devenir isolationniste. Elle finira par exiger la @NZLNouvelle-Zélande."
  RULE_OPTION_COMMUNIST_CAN_AI_DESC:0 "L'IA @CANCanadienne tentera de devenir §Rcommuniste§! et de rejoindre le Komintern."
  RULE_OPTION_COMMUNIST_ALTERNATE_CAN_AI_DESC:0 "L'IA @CANCanadienne tentera de devenir §Rcommuniste§! et d'entrer en isolation, en soutenant les travailleurs du monde dans leurs luttes."
  RULE_OPTION_COMMUNIST_TROTSKYITE_CAN_AI_DESC:0 "L'IA @CANCanadienne tentera de devenir §Rcommuniste§! et d'embrasser les trotskystes, déclarant éventuellement la guerre pour libérer les @USAÉtats-Unis en fin de partie. (cela ne se passe généralement pas bien)"
  RULE_OPTION_DEMOCRATIC_HISTORICAL_CAN_AI_DESC:0 "L'IA @CANCanadienne restera §Cdémocratique§! et tentera de suivre la chaîne d'événements et de décisions historiques dans l'arbre de focus national."
  RULE_DEMOCRATIC_ALTERNATE_CAN_AI_DESC:0 "L'IA @CANCanadienne restera §Cdémocratique§! et tentera d'obtenir une pleine indépendance et de créer une alliance avec les @USAÉtats-Unis, en suivant la voie pertinente dans l'arbre de focus national."
  RULE_FASCIST_CAN_AI_DESC:0 "L'IA @CANCanadienne tentera de devenir §Lfasciste§! et de s'allier avec l'@GERAllemagne en suivant la voie pertinente dans l'arbre de focus national."
  RULE_FASCIST_ALTERNATE_CAN_AI_DESC:0 "L'IA @CANCanadienne tentera de devenir §Lfasciste§! et de soutenir les synarchistes au @MEXMexique pour attaquer les @USAÉtats-Unis des deux côtés dès 1939."
  RULE_OPTION_COMMUNIST_ALTERNATE_SAF_AI_DESC:0 "L'IA @SAFSud-Africaine tentera de devenir §Rcommuniste§! et de libérer les peuples d'Afrique du joug colonial, en suivant la voie pertinente de l'arbre de focus national."
  RULE_OPTION_COMMUNIST_SAF_AI_DESC:0 "L'IA @SAFSud-Africaine tentera de devenir §Rcommuniste§! et de rejoindre le Komintern, elle pourrait exiger Madagascar de la @FRAFrance, mais ne déclenchera pas de guerre."
  RULE_OPTION_DEMOCRATIC_HISTORICAL_SAF_AI_DESC:0 "L'IA @SAFSud-Africaine restera §Cdémocratique§! et suivra le plan historique autant que possible."
  RULE_DEMOCRATIC_ALTERNATE_SAF_AI_DESC:0 "L'IA @SAFSud-Africaine tentera de rester §Cdémocratique§! et de prendre un rôle plus affirmé dans la relation avec le pays mère, en suivant la voie pertinente dans l'arbre de focus national."
  RULE_FASCIST_SAF_AI_DESC:0 "L'IA @SAFSud-Africaine tentera de devenir §Lfasciste§! et de parvenir à un arrangement avec l'@GERAllemagne, en suivant la voie pertinente dans l'arbre de focus national."
  RULE_FASCIST_ALTERNATE_SAF_AI_DESC:0 "L'IA @SAFSud-Africaine tentera de devenir §Lfasciste§! et de rester indépendante, elle déclarera éventuellement la guerre pour les colonies @ENGBritanniques au nom du roi Edward."
  RULE_OPTION_COMMUNIST_NZL_AI_DESC:0 "L'IA @NZLNéo-Zélandaise tentera de devenir §Rcommuniste§! et de rejoindre le Komintern en suivant la voie pertinente dans l'arbre de focus national."
  RULE_OPTION_DEMOCRATIC_HISTORICAL_NZL_AI_DESC:0 "L'IA @NZLNéo-Zélandaise restera §Cdémocratique§! et tentera de suivre la chaîne d'événements historiques autant que possible."
  RULE_DEMOCRATIC_ALTERNATE_NZL_AI_DESC:0 "L'IA @NZLNéo-Zélandaise tentera de rester §Cdémocratique§! et d'établir une pleine souveraineté en suivant la voie pertinente dans l'arbre de focus national."
  RULE_FASCIST_NZL_AI_DESC:0 "L'IA @NZLNéo-Zélandaise tentera de devenir §Lfasciste§! et de s'allier avec le @JAPJapon en suivant la voie pertinente dans l'arbre de focus national."
  RULE_OPTION_COMMUNIST_RAJ_AI_DESC:0 "L'IA @RAJIndienne tentera d'obtenir son indépendance en §Rs'alliant avec l'@SOVUnion soviétique§!, en suivant la voie pertinente dans l'arbre de focus national."
  RULE_OPTION_DEMOCRATIC_HISTORICAL_RAJ_AI_DESC:0 "L'IA @RAJIndienne restera loyale envers le @ENGRoyaume-Uni et tentera de suivre la chaîne d'événements historiques."
  RULE_FASCIST_RAJ_AI_DESC:0 "L'IA @RAJIndienne tentera d'obtenir son §Lindépendance§! par une alliance avec l'Axe en suivant la voie pertinente dans l'arbre de focus national."
  RULE_FASCIST_ALTERNATE_RAJ_AI_DESC:0 "L'IA @RAJIndienne tentera d'obtenir son §Lindépendance§! par une alliance avec la Sphère de co-prospérité en suivant la voie pertinente dans l'arbre de focus national."
  RULE_OPTION_GOE_HISTORICAL: "GOE - Historique"
  RULE_OPTION_GOE_HISTORICAL_RAJ_AI_DESC: "$RULE_OPTION_DEMOCRATIC_HISTORICAL_RAJ_AI_DESC$"
  RULE_OPTION_GOE_INDIA_UNITED: "GOE - Inde Unie"
  RULE_OPTION_GOE_INDIA_UNITED_RAJ_AI_DESC: "L'Inde s'efforcera de devenir indépendante, de rester §CDémocratique§! et de rejoindre les Alliés, mais de rester unie en tant qu'un seul pays et d'éviter la Partition."
  RULE_OPTION_GOE_INDIA_FASCISM_BOSE: "GOE - Chandra Bose non aligné"
  RULE_OPTION_GOE_INDIA_FASCISM_BOSE_RAJ_AI_DESC: "L'Inde suivra la voie de la résistance et choisira §LChandra Bose§! comme son dirigeant, adoptant une position plus militante envers l'indépendance."
  RULE_OPTION_GOE_INDIA_FASCISM_HINDUTVA: "GOE - Fascisme Hindutva"
  RULE_OPTION_GOE_INDIA_FASCISM_HINDUTVA_RAJ_AI_DESC: "L'Inde suivra la voie de la résistance et choisira §LSavarkar§! comme son dirigeant, adoptant une position plus militante envers l'indépendance et essayant de former l'Akhand Bharat."
  RULE_OPTION_GOE_INDIA_EAST_INDIA_COMPANY: "GOE - Compagnie des Indes orientales"
  RULE_OPTION_GOE_INDIA_EAST_INDIA_COMPANY_RAJ_AI_DESC: "L'Inde se brisera et les Anglais réinstaureront la Compagnie des Indes orientales."
  RULE_OPTION_GOE_INDIA_MUGHAL: "GOE - Empire moghol"
  RULE_OPTION_GOE_INDIA_MUGHAL_RAJ_AI_DESC: "L'Inde essaiera de former l'Empire moghol."
  RULE_OPTION_GOE_INDIA_COMMUNISM: "GOE - Communisme (Socialisme agraire)"
  RULE_OPTION_GOE_INDIA_COMMUNISM_RAJ_AI_DESC: "L'Inde tentera d'obtenir l'indépendance via l'arbre de focus communiste. Si elle réussit, l'Inde se concentrera sur la croissance économique agricole et l'établissement de sa propre idéologie socialiste unique."
  RULE_OPTION_GOE_INDIA_COMMUNISM_URBAN: "GOE - Communisme (Industrialisme urbain)"
  RULE_OPTION_GOE_INDIA_COMMUNISM_URBAN_RAJ_AI_DESC: "L'Inde tentera d'obtenir l'indépendance via l'arbre de focus communiste. Si elle réussit, l'Inde se concentrera sur l'urbanisation et l'industrialisation rapide de la société, et tentera de demander de l'aide à l'Union soviétique."
  RULE_OPTION_STALIN:0 "Staline - Historique"
  RULE_OPTION_STALIN_SOV_AI_DESC:0 "L'IA @SOVSoviétique tentera de suivre la chaîne d'événements historiques autant que possible, de légères variations peuvent être faites en fonction des événements mondiaux."
  RULE_OPTION_STALIN_ALTERNATE:0 "Staline - Anti-fasciste"
  RULE_OPTION_ALTERNATE_SOV_AI_DESC:0 "L'IA @SOVSoviétique se concentrera d'abord sur les fascistes et orientera ses politiques pour être plus indulgente envers les puissances alliées, l'IA sera moins surprise par une invasion allemande que la normale."
  RULE_OPTION_STALIN_AGGRESSIVE:0 "Staline - Expansionniste"
  RULE_OPTION_STALIN_AGGRESSIVE_SOV_AI_DESC:0 "L'IA @SOVSoviétique se concentrera d'abord sur ses intérêts immédiats en expansion et orientera ses politiques pour être plus autoritaire et anti-capitaliste."
  RULE_OPTION_LEFT_TROTSKY:0 "Opposition de gauche - Lev Trotsky"
  RULE_OPTION_LEFT_TROTSKY_SOV_AI_DESC:0 "L'IA @SOVSoviétique essaiera de réinstaurer Trotsky et de relancer la révolution permanente, Trotsky est §Ydécentralisateur§! et §Yrévolutionnaire§!."
  RULE_OPTION_LEFT_SMIRNOV:0 "Opposition de gauche - Ivan Smirnov"
  RULE_OPTION_LEFT_SMIRNOV_SOV_AI_DESC:0 "L'IA @SOVSoviétique essaiera de réinstaurer l'opposition de gauche, mais rejettera Trotsky et installera son allié Smirnov, Smirnov est §Yindustrialiste§! et §Yrévolutionnaire§!."
  RULE_OPTION_LEFT_KAMENEV:0 "Opposition de gauche - Lev Kamenev"
  RULE_OPTION_LEFT_KAMENEV_SOV_AI_DESC:0 "L'IA @SOVSoviétique essaiera de réinstaurer l'opposition de gauche, mais rejettera Trotsky et installera le Zinovyevite Kamenev, Kamenev est §Ydécentralisateur§! et §Ycoopératif avec l'opposition§!."
  RULE_OPTION_LEFT_MIL:0 "Opposition de gauche - Direction militaire"
  RULE_OPTION_LEFT_MIL_SOV_AI_DESC:0 "L'IA @SOVSoviétique essaiera de réinstaurer l'opposition de gauche, mais rejettera tous les dirigeants et installera un dirigeant militaire aléatoire. Ce dirigeant se comportera de manière §Yindustrialiste§! et §Ymilitariste§!."
  RULE_LEFT_OPPOSITION_COOPERATIVE:0 "Opposition coopérative - Gauche"
  RULE_OPTION_LEFT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "L'IA @SOVSoviétique essaiera de réinstaurer l'opposition de gauche et d'inclure d'autres groupes d'opposition dans le parti ainsi que de relancer la révolution permanente. Le but de l'IA est d'être §Ytrès coopérative§! et de former le Soviet suprême. §YUn dirigeant de gauche aléatoire sera choisi§!"
  RULE_OPTION_RIGHT_BUKHARIN:0 "Opposition de droite - Nikolaï Boukharine"
  RULE_OPTION_RIGHT_BUKHARIN_SOV_AI_DESC:0 "L'IA @SOVSoviétique essaiera de mettre Boukharine au pouvoir, et de reformer la NEP. Boukharine est §Yindustrialiste§! et §Ycoopératif avec les capitalistes§!."
  RULE_OPTION_RIGHT_RYKOV:0 "Opposition de droite - Alekseï Rykov"
  RULE_OPTION_RIGHT_RYKOV_SOV_AI_DESC:0 "L'IA @SOVSoviétique essaiera d'installer l'opposition de droite, mais rejettera Boukharine et installera son allié Rykov, Rykov est §Yindustrialiste§! et un §Ymodéré§!."
  RULE_OPTION_RIGHT_ZINOVYEV:0 "Opposition de droite - Grigori Zinoviev"
  RULE_OPTION_RIGHT_ZINOVYEV_SOV_AI_DESC:0 "L'IA @SOVSoviétique essaiera d'installer l'opposition de droite, mais rejettera Boukharine et installera le dirigeant de faction Zinoviev, Zinoviev est §Ymilitariste§! et §Yrévolutionnaire§!."
  RULE_OPTION_RIGHT_MIL:0 "Opposition de droite - Direction militaire"
  RULE_OPTION_RIGHT_MIL_SOV_AI_DESC:0 "L'IA @SOVSoviétique essaiera de réinstaurer l'opposition de droite, mais rejettera tous les dirigeants et installera un dirigeant militaire aléatoire. Ce dirigeant se comportera de manière §Ymilitariste§! et §Yindustrialiste§!."
  RULE_OPTION_RIGHT_OPPOSITION_COOPERATIVE:0 "Opposition coopérative - Droite"
  RULE_OPTION_RIGHT_OPPOSITION_COOPERATIVE_SOV_AI_DESC:0 "L'IA @SOVSoviétique essaiera de réinstaurer l'opposition de droite et d'inclure d'autres groupes d'opposition dans le parti également. Le but de l'IA est d'être §Ytrès coopérative§! et de former le Soviet suprême. §YUn dirigeant de droite aléatoire sera choisi§!"
  RULE_OPTION_COMMUNIST_SSR_LOYAL:0 "Communiste URSS - Loyal"
  RULE_OPTION_COMMUNIST_POL_AI_DESC:0 "La grève des paysans @POLPolonais renversera le gouvernement, et le §RKPP§! prendra le leadership, une entente avec l'@SOVURSS sera faite pour se protéger contre l'agression, et la @POLPologne abandonnera l'est."
  RULE_OPTION_COMMUNIST_SSR_INDEPENDENT:0 "Communiste URSS - Indépendant"
  RULE_OPTION_COMMUNIST_SSR_INDEPENDENT_POL_AI_DESC:0 "La grève des paysans @POLPolonais renversera le gouvernement, et le §RKPP§! prendra le leadership, la @POLPologne abandonnera l'est à l'@SOVURSS, mais déclarera son indépendance en fin de partie."
  RULE_OPTION_COMMUNIST_SSR_INDEPENDENT_ALLIES:0 "Communiste URSS - Indépendant Rejoindre les Alliés"
  RULE_OPTION_COMMUNIST_SSR_INDEPENDENT_ALLIES_POL_AI_DESC:0 "La grève des paysans @POLPolonais renversera le gouvernement, et le §RKPP§! prendra le leadership, la @POLPologne abandonnera l'est à l'@SOVURSS, mais déclarera son indépendance en fin de partie et tentera de rejoindre les Alliés."
  RULE_OPTION_COMMUNIST_ALLIES_POL_AI_DESC:0 "La grève des paysans @POLPolonais renversera le gouvernement, et le §RKPP§! prendra le leadership dirigé par Maria Koszutska. L'IA polonaise tentera ensuite de rejoindre les Alliés."
  RULE_OPTION_COMMUNIST_SSR:0 "Communiste URSS"
  RULE_COMMUNIST_SSR_BALTIC_AI_DESC:0 "L'IA tentera d'établir un régime §Rcommuniste§! loyal à l'@SOVUnion soviétique."
  RULE_OPTION_COMMUNIST_BALTIC_SSR:0 "Communiste - RSS baltique"
  RULE_COMMUNIST_BALTIC_SSR_BALTIC_AI_DESC:0 "L'IA tentera d'établir un régime §Rcommuniste§! loyal à l'@SOVUnion soviétique, puis d'instiguer des révolutions dans les États @LIT@LAT@ESTBaltes pour former l'URSS baltique unie."
  RULE_OPTION_COMMUNIST_BELARUS_SSR:0 "Communiste - RSS biélorusso-baltique"
  RULE_COMMUNIST_BELARUS_SSR_BALTIC_AI_DESC:0 "L'IA tentera d'établir un régime §Rcommuniste§! loyal à l'@SOVUnion soviétique, puis demandera le contrôle sur le territoire @BLRBiélorusse dans l'@SOVUnion soviétique. Elle tentera ensuite d'annexer les États @LIT@LAT@ESTBaltes pour former la RSS biélorusso-baltique."
  RULE_OPTION_COMMUNIST_REVOLUTIONARY_POL_AI_DESC:0 "La grève des paysans @POLPolonais renversera le gouvernement, et le §RKPP§! prendra le leadership dirigé par Maria Koszutska. La @POLPologne étendra ensuite son territoire dans les pays @LIT@LAT@ESTBaltes, et en fin de partie, tentera de démanteler les pays capitalistes en Europe."
  RULE_OPTION_SANATION_HISTORICAL:0 "Centre Sanation - Historique"
  RULE_OPTION_HISTORICAL_POL_AI_DESC:0 "L'IA @POLPolonaise consolidera le gouvernement de la Sanation sous Ignacy Mościcki, et restera neutre sauf si elle est attaquée. Ceci est un comportement historique."
  RULE_OPTION_SANATION_CASTLE_ALLIES:0 "Centre Sanation - Alliés"
  RULE_OPTION_SANATION_CASTLE_ALLIES_POL_AI_DESC:0 "L'IA @POLPolonaise consolidera le gouvernement de la Sanation sous Ignacy Mościcki, puis tentera de rejoindre les Alliés (si la tension mondiale est suffisamment élevée)."
  RULE_OPTION_SANATION_CASTLE_LIT_ALLY:0 "Centre Sanation - Alliance lituanienne"
  RULE_OPTION_SANATION_CASTLE_LIT_ALLY_POL_AI_DESC:0 "L'IA @POLPolonaise consolidera le gouvernement de la Sanation sous Ignacy Mościcki, puis tentera de créer une alliance avec la @LITLituanie."
  RULE_OPTION_SANATION_LEFT_ALLIES:0 "Sanation Gauche - Alliés"
  RULE_OPTION_SANATION_LEFT_ALLIES_POL_AI_DESC:0 "L'IA @POLPolonaise consolidera le gouvernement de la Sanation sous le président de gauche, Walery Sławek. L'IA tentera de rejoindre les Alliés (si la tension mondiale est suffisamment élevée), et étendra une invitation à la @ROMRoumanie."
  RULE_OPTION_SANATION_LEFT_BALTIC:0 "Sanation Gauche - Alliance baltique"
  RULE_OPTION_SANATION_LEFT_BALTIC_POL_AI_DESC:0 "L'IA @POLPolonaise consolidera le gouvernement de la Sanation sous le président de gauche, Walery Sławek. L'IA tentera de former une alliance avec les États @LIT@LAT@ESTBaltes, et la @ROMRoumanie."
  RULE_OPTION_SANATION_LEFT_INTERMARIUM:0 "Sanation Gauche - Intermarium"
  RULE_OPTION_SANATION_LEFT_INTERMARIUM_POL_AI_DESC:0 "L'IA @POLPolonaise consolidera le gouvernement de la Sanation sous le président de gauche, Walery Sławek. L'IA tentera de former une alliance avec les États @LIT@LAT@ESTBaltes, et étendra l'adhésion à autant de pays européens que possible."
  RULE_OPTION_SANATION_RIGHT_ALLIES:0 "Sanation Droite - Alliés"
  RULE_OPTION_SANATION_RIGHT_ALLIES_POL_AI_DESC:0 "L'IA @POLPolonaise consolidera le gouvernement de la Sanation sous le président de droite, Edward Rydz-Śmigły. L'IA tentera de rejoindre les Alliés (si la tension mondiale est suffisamment élevée) et exigera l'annexion de la @LITLituanie."
  RULE_OPTION_SANATION_RIGHT_OZON:0 "Sanation Droite - Revanchisme"
  RULE_OPTION_SANATION_RIGHT_OZON_POL_AI_DESC:0 "L'IA @POLPolonaise consolidera le gouvernement de la Sanation sous le président de droite, Edward Rydz-Śmigły. L'IA mettra en œuvre une politique de §Lrevanchisme polonais§!, et fera des demandes à ses voisins."

  RULE_FASCIST_POL_AI_DESC:0 "L'IA @POLpolonaise rédigera une constitution nationaliste et §Lfasciste§!, et se réconciliera avec @GERl'Allemagne pour obtenir une protection, en échange de territoires @SOVoviétiques."
  RULE_OPTION_DEMOCRATIC_ALLIES:0 "Démocratique - Rejoindre les Alliés"
  RULE_OPTION_DEMOCRATIC_POL_AI_DESC:0 "La grève des paysans @POLpolonais renversera le gouvernement, et le §CPSL§! prendra le leadership. L'IA polonaise tentera ensuite de rejoindre les Alliés. Avec le DLC 'No Step Back', l'IA fera pression pour @LIBle Liberia et garantira les pays @EST@LAT@LIT baltes."
  RULE_OPTION_DEMOCRATIC_MORGES:0 "Démocratique - Pacte de Morges"
  RULE_OPTION_DEMOCRATIC_MORGES_POL_AI_DESC:0 "La grève des paysans @POLpolonais renversera le gouvernement, et le §CPSL§! prendra le leadership. L'IA polonaise tentera ensuite de créer le Front de Morges avec @FRAla France, inviter @ROMla Roumanie dans la faction et faire pression pour @LIBle Liberia."
  RULE_OPTION_DEMOCRATIC_MIEDZYMORZE:0 "Démocratique - Międzymorze"
  RULE_OPTION_DEMOCRATIC_MIEDZYMORZE_POL_AI_DESC:0 "La grève des paysans @POLpolonais renversera le gouvernement, et le §CPSL§! prendra le leadership. L'IA polonaise tentera ensuite de créer le Międzymorze avec @FRAla France, et inviter autant de pays européens que possible dans le pacte."
  RULE_OPTION_GERMAN_PUPPET:0 "Fasciste - Loyauté allemande"
  RULE_OPTION_FASCIST_POL_INDEPENDENT:0 "Fasciste - Indépendance polonaise"
  RULE_FASCIST_INDEPENDENT_POL_AI_DESC:0 "L'IA @POLpolonaise rédigera une constitution nationaliste et §Lfasciste§!, et se réconciliera avec @GERl'Allemagne pour obtenir une protection, mais déclarera son indépendance de @GERl'Allemagne en fin de partie."
  RULE_OPTION_FALANGE:0 "Falangiste - Commonwealth"
  RULE_FALANGE_POL_AI_DESC:0 "L'IA @POLpolonaise rédigera une constitution nationaliste et §Lfasciste§!, et embrassera le Falangisme. Ils créeront une faction falangiste et demanderont à @LITla Lituanie de former le @POL@LIT Commonwealth polono-lituanien."
  RULE_OPTION_FALANGE_INTERNATIONAL:0 "Falangiste International"
  RULE_FALANGE_INTERNATIONAL_POL_AI_DESC:0 "L'IA @POLpolonaise rédigera une constitution nationaliste et §Lfasciste§!, et embrassera le Falangisme. L'IA tentera de créer un Intermarium falangiste avec autant d'alliés que possible pour s'opposer à la fois à @GERl'Allemagne et à l'@SOVUnion soviétique."
  RULE_OPTION_COMMONWEALTH:0 "Monarchiste - Commonwealth"
  RULE_COMMONWEALTH_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera Friedrich Christian comme roi et tentera de restaurer le @POL@LIT Commonwealth polono-lituanien, y compris les territoires de l'est."
  RULE_OPTION_COMMONWEALTH_ALLIES:0 "Monarchiste - Commonwealth des Alliés"
  RULE_COMMONWEALTH_ALLIES_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera Friedrich Christian comme roi et tentera de restaurer le @POL@LIT Commonwealth polono-lituanien. Ils tenteront ensuite de rejoindre les Alliés."
  RULE_OPTION_COMMONWEALTH_ALLIANCE:0 "Pacte monarchiste - Commonwealth"
  RULE_COMMONWEALTH_ALLIANCE_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera Friedrich Christian comme roi et tentera de restaurer le @POL@LIT Commonwealth polono-lituanien. Ils chercheront ensuite à former une faction avec une puissance impériale européenne continentale si elle existe."
  RULE_OPTION_ROMANIA_ALLIES:0 "Monarchiste - Alliés polono-roumains"
  RULE_ROMANIA_ALLIES_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera un Hohenzollern comme roi et tentera de former une union avec @ROMla Roumanie. Ils tenteront ensuite de rejoindre les Alliés."
  RULE_ROMANIA_ALLIANCE:0 "Pacte monarchiste - Pologne-Roumanie"
  RULE_ROMANIA_ALLIANCE_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera un Hohenzollern comme roi et tentera de former une union avec @ROMla Roumanie. Ils chercheront ensuite à former une faction avec une puissance impériale européenne continentale si elle existe."
  RULE_OPTION_ROMANIA:0 "Monarchiste - Pologne-Roumanie"
  RULE_ROMANIA_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera un Hohenzollern comme roi et tentera de former une union avec @ROMla Roumanie. L'IA tentera ensuite de revendiquer @SLOla Slovaquie et @HUNla Hongrie comme unions personnelles."
  RULE_OPTION_HABSBURG:0 "Monarchiste - Roi des Habsbourg"
  RULE_HABSBURG_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera Karl Albrecht von Habsburg comme roi et tentera de former une union avec @CZEla Tchécoslovaquie. L'IA tentera ensuite de créer une alliance des Habsbourg ou de faire pression sur les revendications sur @HUNla Hongrie."
  RULE_OPTION_HABSBURG_ALLIES:0 "Monarchiste - Alliés des Habsbourg"
  RULE_HABSBURG_ALLIES_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera Karl Albrecht von Habsburg comme roi et tentera de former une union avec @CZEla Tchécoslovaquie. L'IA tentera ensuite de rejoindre les Alliés."
  RULE_OPTION_HABSBURG_ALLIANCE:0 "Pacte monarchiste - Roi des Habsbourg"
  RULE_HABSBURG_ALLIANCE_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera Karl Albrecht von Habsburg comme roi et tentera de former une union avec @CZEla Tchécoslovaquie. Ils chercheront ensuite à former une faction avec une puissance impériale européenne continentale si elle existe."
  RULE_OPTION_BERMONDT:0 "Monarchiste - Bermondtien"
  RULE_BERMONDT_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera Pavel Bermondt-Avalov comme roi, fera des demandes sur le territoire @GERallemand, et envahira l'@SOVUnion soviétique en fin de partie."
  RULE_OPTION_BERMONDT_ALLIANCE:0 "Pacte monarchiste - Bermondtien"
  RULE_BERMONDT_ALLIANCE_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera Pavel Bermondt-Avalov comme roi et cherchera ensuite à former une faction avec une puissance impériale européenne continentale si elle existe."
  RULE_OPTION_BERMONDT_RK_LOYAL:0 "Monarchiste - Axe Bermondtien"
  RULE_BERMONDT_RK_LOYAL_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera Pavel Bermondt-Avalov comme roi et s'alignera avec les intérêts @GERallemands en échange de territoires @SOVoviétiques."
  RULE_OPTION_BERMONDT_RK_INDEPENDENT:0 "Monarchiste - Rebelle Bermondtien"
  RULE_BERMONDT_RK_INDEPENDENT_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera Pavel Bermondt-Avalov comme roi et s'alignera avec les intérêts @GERallemands, mais déclarera son indépendance de @GERl'Allemagne en fin de partie."
  RULE_OPTION_ROMANOV:0 "Monarchiste - Romanov"
  RULE_ROMANOV_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera 'Anastasia Romanov' comme roi et visera à créer une Union slave !"
  RULE_OPTION_ROMANOV_ALLIANCE:0 "Pacte monarchiste - Romanov"
  RULE_ROMANOV_ALLIANCE_POL_AI_DESC:0 "L'IA @POLpolonaise couronnera 'Anastasia Romanov' comme roi, mais ses ambitions seront tempérées ! L'IA cherchera à former une faction avec une puissance impériale européenne continentale si elle existe, mais ne s'alliera pas avec @SOVla Russie."
  RULE_OPTION_UNITED_FRONT_CHI_AI_DESC:0 "L'IA @CHIchinoise tentera de se concentrer sur l'unification de la Chine et la formation du Front uni."
  RULE_OPTION_INTERIOR_CHI_AI_DESC:0 "L'IA @CHIchinoise tentera de consolider le pouvoir en Chine en prenant le contrôle des seigneurs de la guerre avant de se lancer dans un conflit avec le @JAPJapon."
  RULE_OPTION_HISTORICAL_CHI_AI_DESC:0 "L'IA @CHIchinoise maintiendra la domination de Chiang Kai-Shek."
  RULE_OPTION_FOCUS_HISTORICAL_CHI_AI_DESC:0 "L'IA @CHIchinoise passera du temps à construire le pays, et ne tentera de former le Front uni que si la situation mondiale l'exige (par exemple si la @PRCChine communiste propose une alliance)."
  RULE_OPTION_DEMOCRATIC_CHI_AI_DESC:0 "L'IA @CHIchinoise tentera de se réformer lentement en une §Cdémocratie§! moderne en utilisant les politiques de Yuan."
  RULE_OPTION_MAOIST_PRC_AI_DESC:0 "L'IA @PRCcommuniste chinoise suivra la politique du §Rmaoïsme§!, ce chemin a un comportement légèrement différent selon que l'option de focus historique est activée ou non."
  RULE_OPTION_MARXIST_ORTHODOXY_PRC_AI_DESC:0 "L'IA @PRCcommuniste chinoise suivra la politique du §Rmarxisme soviétique§! en promouvant Wang Ming plutôt que Mao, finissant par rejoindre le Komintern."
  RULE_OPTION_SOCIAL_DEMOCRACY_PRC_AI_DESC:0 "L'IA @PRCcommuniste chinoise suivra la politique de la §Rdémocratie sociale§! en promouvant Zhang Lan plutôt que Mao, rejoignant le @CHIgouvernement nationaliste et 'retirant' Chiang Kai-Shek du leadership de la Chine."
  RULE_OPTION_COMMUNIST_USA_AI_DESC:0 "L'IA @USAaméricaine tentera de devenir §Rcommuniste§! et de rejoindre le Komintern."
  RULE_OPTION_COMMUNIST_ALTERNATE_USA_AI_DESC:0 "L'IA @USAaméricaine tentera de devenir §Rcommuniste§! et de rejoindre la @PRCChine communiste dans leur lutte."
  RULE_OPTION_DEMOCRATIC_HISTORICAL_USA_AI_DESC:0 "L'IA @USAaméricaine restera §Cdémocratique§! et tentera de suivre la chaîne d'événements historiques autant que possible."
  RULE_DEMOCRATIC_INTERVENTION_USA_AI_DESC:0 "L'IA @USAaméricaine restera §Cdémocratique§! et tentera de prendre un rôle plus actif dans les affaires mondiales en suivant le chemin pertinent dans l'arbre de focus national."
  RULE_DEMOCRATIC_NEUTRALITY_USA_AI_DESC:0 "L'IA @USAaméricaine restera §Cdémocratique§! et tentera de maintenir la neutralité aussi longtemps que possible, cette option d'IA sera annulée si l'IA se trouve en guerre, quelle qu'en soit la raison."
  RULE_FASCIST_USA_AI_DESC:0 "L'IA @USAaméricaine tentera de devenir §Lfasciste§! et de ressusciter la confédération, puis tentera de créer un Dominion nord-américain."
  RULE_JUNTA_USA_AI_DESC:0 "L'IA @USAaméricaine aura une §Lfasciste§! et une junte militaire prendre le contrôle du pays, MacArthur ne renoncera pas au pouvoir après le coup d'État, et l'IA ne sécurisera que les intérêts immédiats à @CUBACuba et @MEXle Mexique."
  RULE_HEGEMONY_USA_AI_DESC:0 "L'IA @USAaméricaine se lancera sur un chemin de guerre, et tentera d'installer la liberté et la §Cdémocratie§! dans le monde entier. Par la force."
  RULE_OPTION_OBEDIENCE_MAN_AI_DESC:0 "L'IA @MANmandchoue tentera de rester loyale et de ne pas s'affirmer. §RCette voie ne fonctionnera que si @JAPle Japon est§! §Lfasciste§! ou monarchiste.§!"
  RULE_OPTION_CHINESE_LEADERSHIP_MAN_AI_DESC:0 "L'IA @MANmandchoue tentera de rester loyale et de s'affirmer comme le gouvernement de coopération @JAPjaponais en @CHIChine §RCette voie ne fonctionnera que si @JAPle Japon est§! §Lfasciste§! ou monarchiste.§!"
  RULE_OPTION_MANCHU_QING_MAN_AI_DESC:0 "L'IA @MANmandchoue tentera de se libérer et, si elle obtient la liberté, tentera de conquérir la @CHIChine pour le mandat céleste @MANmandchou."
  RULE_OPTION_FIVE_PEOPLES_QING_MAN_AI_DESC:0 "L'IA @MANmandchoue tentera de se libérer et, si elle obtient la liberté, tentera de vassaliser la @CHIChine, adoptant la politique 'Cinq Races sous une Union'."
  RULE_OPTION_COOPERATE_NAT:0 "Alignement @CHInationaliste"
  RULE_OPTION_COOPERATE_NAT_AI_DESC:0 "Ce seigneur de la guerre s'alignera avec le @CHIKuomintang et coopérera avec eux, mais se défendra toujours contre l'agression nationaliste."
  RULE_OPTION_TAKEOVER_NAT:0 "Prise de contrôle @CHInationaliste"
  RULE_OPTION_TAKEOVER_NAT_AI_DESC:0 "Ce seigneur de la guerre s'alignera avec le @CHIKuomintang et coopérera avec eux, et tentera également de prendre le contrôle en tant que leader du gouvernement nationaliste."
  RULE_OPTION_OPPOSITION_NAT:0 "Gouvernement d'opposition"
  RULE_OPTION_OPPOSITION_NAT_AI_DESC:0 "Ce seigneur de la guerre renoncera à s'aligner avec toute faction existante, et formera un nouveau gouvernement en opposition à la fois aux @CHInationalistes et aux @PRCcommunistes."
  RULE_OPTION_COOPERATE_COM:0 "Alignement @PRCcommuniste"
  RULE_OPTION_COOPERATE_COM_AI_DESC:0 "Ce seigneur de la guerre s'alignera avec les §R@PRCcommunistes§! et coopérera avec eux, mais se défendra toujours contre l'agression communiste."
  RULE_OPTION_TAKEOVER_COM:0 "Prise de contrôle @PRCcommuniste"
  RULE_OPTION_TAKEOVER_COM_AI_DESC:0 "Ce seigneur de la guerre s'alignera avec les §R@PRCcommunistes§! et coopérera avec eux, et tentera également de prendre le contrôle en tant que leader du mouvement communiste en faisant des concessions aux @SOVoviétiques."
  RULE_OPTION_OPPOSITION_COM:0 "Mouvement communiste d'opposition"
  RULE_OPTION_OPPOSITION_COM_AI_DESC:0 "Ce seigneur de la guerre renoncera à s'aligner avec toute faction existante, et formera un nouveau mouvement §Rcommuniste§! en opposition à la fois aux @CHInationalistes et aux @PRCcommunistes."
  RULE_OPTION_COOPERATE_JAP:0 "Alignement @JAPjaponais"
  RULE_OPTION_COOPERATE_JAP_AI_DESC:0 "Ce seigneur de la guerre s'alignera avec le @JAPJapon et coopérera avec eux contre d'autres factions chinoises, mais se défendra toujours contre l'agression japonaise."
  RULE_ALLOW_GUARANTEES_SAME_IDEOLOGY_TOOLTIP:0 "Règle du jeu : §RLes pays ne peuvent garantir que les pays partageant leur idéologie dirigeante.§!"
  RULE_ALLOW_GUARANTEES_BLOCKED_TOOLTIP:0 "Règle du jeu : §RLes pays ne peuvent jamais garantir d'autres pays.§!"
  RULE_ALLOW_MILITARY_ACCESS_SAME_IDEOLOGY_TT:0 "Règle du jeu : §RLes pays peuvent obtenir un accès militaire et des droits d'accostage des pays partageant la même idéologie dirigeante.§!"
  RULE_ALLOW_MILITARY_ACCESS_BLOCKED_TT:0 "Règle du jeu : §RLes pays ne peuvent jamais obtenir un accès militaire et des droits d'accostage d'un autre pays en dehors d'une faction.§!"
  RULE_ALLOW_LEND_LEASE_SAME_IDEOLOGY_TT:0 "Règle du jeu : §RLes pays ne peuvent prêter-bailer du matériel qu'aux pays partageant la même idéologie dirigeante.§!"
  RULE_ALLOW_LEND_LEASE_SAME_FACTION_TT:0 "Règle du jeu : §RLes pays ne peuvent prêter-bailer du matériel qu'aux pays de la même faction.§!"
  RULE_ALLOW_LEND_LEASE_BLOCKED_TT:0 "Règle du jeu : §RLes pays ne peuvent jamais prêter-bailer du matériel à un autre pays.§!"
  RULE_VOLUNTEERS_BLOCKED_TT:0 "Règle du jeu : §RLes pays ne peuvent jamais envoyer de volontaires à un autre pays.§!"
  RULE_VOLUNTEERS_NOT_ANARCHISTS_TT:0 "§RLes États souverains ne peuvent pas envoyer de volontaires aux anarchistes !§!"
  RULE_VOLUNTEERS_PORTUGAL_SCW_TT:0 "§RLe Portugal ne peut pas envoyer de volontaires à une faction espagnole qu'il ne soutient pas.§!"
  RULE_VOLUNTEERS_BULGARIA_SCW_TT:0 "§RLa Bulgarie ne peut pas envoyer de volontaires à une faction espagnole qu'elle ne soutient pas.§!"
  RULE_VOLUNTEERS_SOVIET_CHINA_SUPPORT_CHOSEN_ONE_TT:0 "§RL'Union soviétique ne peut pas envoyer de volontaires à une faction chinoise qu'elle ne soutient pas.§!"
  RULE_VOLUNTEERS_SOVIET_CHINA_ONLY_ONE_TT:0 "§RNous ne pouvons pas envoyer de volontaires à plus d'une faction chinoise.§!"
  RULE_VOLUNTEERS_SOVIET_SCW_TT:0 "§RL'Union soviétique ne peut pas envoyer de volontaires à une faction espagnole qui s'est rebellée contre le gouvernement républicain.§!"
  RULE_VOLUNTEERS_SOVIET_SCW_COVERT_POUM_TT:0 "§RL'Union soviétique est toujours sous la doctrine stalinienne et ne peut pas envoyer de volontaires à une faction espagnole qui s'est rebellée contre le gouvernement républicain.§!"
  RULE_VOLUNTEERS_SOVIET_SCW_POUM_TT:0 "§RLa République socialiste soviétique soutient le POUM et ne peut pas envoyer de volontaires à une autre faction espagnole.§!"
  RULE_VOLUNTEERS_SOVIET_EXILES_SCW_TT:0 "§RLe gouvernement russe ne peut envoyer des volontaires qu'aux rebelles espagnols combattant contre le gouvernement espagnol légitime.§!"
  RULE_VOLUNTEERS_SAME_IDEOLOGY_TT:0 "Règle du jeu : §RLes pays ne peuvent envoyer des volontaires qu'aux pays partageant la même idéologie dirigeante.§!"
  RULE_KICK_FROM_FACTION_BLOCKED_TOOLTIP:0 "Règle du jeu : §RLe leader d'une faction ne peut expulser aucun membre de la faction.§!"
  RULE_ASSUME_LEADERSHIP_BLOCKED_TOOLTIP:0 "Règle du jeu : §RLes pays ne peuvent pas prendre le contrôle du leadership d'une faction.§!"
  RULE_ALLOW_LEAVE_FACTION_BLOCKED_TOOLTIP:0 "Règle du jeu : §RLes pays ne peuvent pas quitter une faction sauf par le biais de focus nationaux et d'événements.§!"
  RULE_COUP_BLOCKED_TT:0 "Règle du jeu : §RLes pays ne peuvent pas préparer ou exécuter de coups d'État dans une autre nation.§!"
  RULE_COUP_AI_ONLY_TT:0 "Règle du jeu : §RLes pays ne peuvent préparer et exécuter des coups d'État que contre des nations non jouées par un humain.§!"
  RULE_BOOST_PARTY_BLOCKED_TT:0 "Règle du jeu : §RLes pays ne peuvent pas augmenter la popularité des partis dans un autre pays.§!"
  RULE_BOOST_PARTY_PLAYER_ONLY_TT:0 "Règle du jeu : §RLes pays ne peuvent augmenter la popularité des partis que dans les pays avec un joueur humain.§!"
  RULE_BOOST_PARTY_AI_ONLY_TT:0 "Règle du jeu : §RLes pays ne peuvent augmenter la popularité des partis que dans les pays non joués par un humain.§!"
  RULE_WARGOALS_BLOCKED_TT:0 "Règle du jeu : §RLes objectifs de guerre ne peuvent être obtenus que par le biais de focus nationaux, d'événements et de décisions.§!"
  RULE_ALLOW_LICENSING_BLOCKED_TT:0 "Règle du jeu : §RLes pays ne peuvent jamais acquérir de licences de production en dehors de décisions et d'événements spéciaux.§!"
  RULE_ALLOW_LICENSING_SAME_FACTION_TT:0 "Règle du jeu : §RLes pays ne peuvent acquérir de licences de production qu'auprès de pays de la même faction.§!"
  RULE_ALLOW_LICENSING_SAME_IDEOLOGY_TT:0 "Règle du jeu : §RLes pays ne peuvent acquérir de licences de production qu'auprès de pays partageant la même idéologie dirigeante.§!"
  RULE_OPTION_DEMOCRATIC_ENG_AI_DESC:0 "L'IA @ENGBritannique restera §Cdémocratique§! et tentera de protéger la @POLPologne et de mener les alliés dans leur guerre défensive contre les @GERAllemands, en suivant le chemin pertinent dans l'arbre de focus national."
  RULE_OPTION_TRADE_UNIONS:0 "Communiste - Komintern"
  RULE_OPTION_TRADE_UNIONS_ENG_AI_DESC:0 "L'IA @ENGBritannique deviendra §Rcommuniste§! et rejoindra le Komintern pour lutter contre le fascisme."
  RULE_OPTION_COMMUNIST_COMINTERN_2:0 "Communiste - Komintern Anticapitaliste"
  RULE_OPTION_COMMUNIST_COMINTERN_2_ENG_AI_DESC:0 "L'IA @ENGBritannique deviendra §Rcommuniste§! et rejoindra le Komintern pour lutter contre le capitalisme. La plupart du temps, cela conduit à une guerre en fin de partie contre les @USAÉtats-Unis."
  RULE_OPTION_COMMUNIST_BCA_ENG_AI_DESC:0 "L'IA @ENGBritannique deviendra §Rcommuniste§!, formera sa propre faction et imposera la décolonisation aux puissances européennes."
  RULE_OPTION_COMMUNIST_BCA_2_ENG_AI_DESC:0 "L'IA @ENGBritannique deviendra §Rcommuniste§! et s'unira avec les autres puissances communistes d'Europe de l'Ouest (si elles existent)."
  RULE_OPTION_THE_KINGS_PARTY:0 "Renforcer le Parti du Roi"
  RULE_OPTION_THE_KINGS_PARTY_AXIS:0 "Renforcer le Parti du Roi - Rejoindre l'Axe"
  RULE_OPTION_THE_KINGS_PARTY_ENG_AI_DESC:0 "L'IA @ENGBritannique tentera de soutenir le mariage du roi Edward VIII avec Wallis Simpson et de renforcer le Parti du Roi, en suivant le chemin pertinent dans l'arbre de focus national."
  RULE_OPTION_THE_KINGS_PARTY_AXIS_ENG_AI_DESC:0 "L'IA @ENGBritannique tentera de soutenir le mariage du roi Edward VIII avec Wallis Simpson et de renforcer le Parti du Roi, puis rejoindra la faction de @GERl'Allemagne."
  RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT:0 "Plus d'apaisement"
  RULE_OPTION_DEMOCRATIC_NO_MORE_APPEASEMENT_ENG_AI_DESC:0 "L'IA @ENGBritannique tentera de mettre fin à sa politique d'apaisement et de la remplacer par une politique d'§Cinterventionnisme démocratique§!."
  RULE_OPTION_ORGANIZE_THE_BLACKSHIRTS:0 "Organiser les Chemises noires"
  RULE_OPTION_FASCIST_ANTI_GERMAN:0 "Chemises noires anti-allemandes"
  RULE_OPTION_ORGANIZE_THE_BLACKSHIRTS_ENG_AI_DESC:0 "L'IA @ENGBritannique tentera d'organiser les §Lchemises noires§! et de devenir §Lfasciste§!, et tentera de reconquérir l'empire."
  RULE_OPTION_FASCIST_ANTI_GERMAN_ENG_AI_DESC:0 "L'IA @ENGBritannique tentera d'organiser les §Lchemises noires§! et de devenir §Lfasciste§!, et finira par faire la guerre à @GERl'Allemagne pour empêcher une hégémonie continentale."
  RULE_OPTION_ENG_NO_DECOLONIZE:0 "Pas de décolonisation"
  RULE_OPTION_ENG_NO_DECOLONIZE_NO_CIVILWAR:0 "Pas de décolonisation - Pas de guerre civile"
  RULE_OPTION_ENG_NO_DECOLONIZE_AI_DESC:0 "L'IA @ENGBritannique ne décolonisera jamais - Cela conduira à une guerre civile si l'IA devient communiste."
  RULE_OPTION_ENG_NO_DECOLONIZE_NO_CIVILWAR_AI_DESC:0 "L'IA @ENGBritannique ne décolonisera jamais - La guerre civile communiste a été désactivée (cela fonctionne également pour un joueur @ENGBritannique)."
  RULE_OPTION_DEMOCRATIC_DECOLONIZE_ENG_AI_DESC:0 "L'IA @ENGBritannique restera §Cdémocratique§! et mettra en œuvre une politique de décolonisation."
  RULE_OPTION_DEMOCRATIC_HISTORICAL_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de rester neutre dans les affaires mondiales, fin 1939, l'IA choisira un chemin basé sur l'influence commerciale de @GERl'Allemagne et de @ENGL'Angleterre. (l'IA @ENGBritannique investit généralement plus que l'IA @GERallemande)"
  RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY:0 "Communiste - Indépendant"
  RULE_OPTION_COMMUNIST_COMINTERN_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de raviver l'héritage de la mutinerie 'De Zeven Provinciën' et deviendra §Rcommuniste§!, puis rejoindra le Komintern."
  RULE_OPTION_COMMUNIST_WESTERN_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de raviver l'héritage de la mutinerie 'De Zeven Provinciën' et deviendra §Rcommuniste§!, puis tentera de rejoindre toute faction §Rcommuniste§! occidentale si elle existe."
  RULE_OPTION_LEGACY_OF_THE_DE_ZEVEN_PROVINCIEN_MUTINY_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de raviver l'héritage de la mutinerie 'De Zeven Provinciën' et deviendra §Rcommuniste§!, et maintiendra que les Pays-Bas sont le seul bastion du vrai communisme, et ne rejoindra aucune alliance."
  RULE_OPTION_ORANJE_BOVEN:0 "Monarchiste - Rejoindre les Alliés"
  RULE_OPTION_ORANJE_BOVEN_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de soutenir le monarchisme et de mettre la reine Wilhelmina au pouvoir, puis rejoindra les Alliés pour s'opposer à @GERl'Allemagne."
  RULE_OPTION_ORANJE_BOVEN_2:0 "Monarchiste - Wilhelminisme"
  RULE_OPTION_ORANJE_BOVEN_2_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de soutenir le monarchisme et de mettre la reine Wilhelmina au pouvoir, puis rejoindra soit @GERl'Allemagne si elle est monarchiste, ou déclarera la guerre si elle ne l'est pas."
  RULE_OPTION_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA:0 "Démocratique - Déplacement à Batavia"
  RULE_DEMOCRATIC_CONTINUE_THE_WAR_IN_BATAVIA_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise restera §Cdémocratique§!, et rejoindra les alliés fin 1940, si elle capitule jamais, elle déplacera sa capitale à Batavia dans les @INSIndes orientales."
  RULE_OPTION_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS:0 "Démocratique - Travaux de la Zuiderzee"
  RULE_DEMOCRATIC_CONTINUE_THE_ZUIDERZEE_WORKS_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise restera §Cdémocratique§!, et rejoindra les alliés en 1939, elle se concentrera sur la construction sur le continent et la défense du continent."
  RULE_CAVE_TO_THE_GERMANS_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de §Lcéder aux @GERAllemands§! dans la guerre commerciale, et de s'allier avec eux une fois devenue §Lfasciste§!, en suivant le chemin pertinent dans l'arbre de focus national."
  RULE_FASCIST_ALTERNATE_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de §Lcéder aux @GERAllemands§! dans la guerre commerciale, mais rejettera l'Axe, rejoignant plutôt une autre alliance européenne fasciste, l'alliance de @FRANapoléon ou le parti du roi en @ENGBritannique, si l'une de ces options existe."
  RULE_OPTION_NETHERLANDS_FIRST:0 "Fasciste - Les Pays-Bas d'abord"
  RULE_NETHERLANDS_FIRST_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de §Lcéder aux @GERAllemands§! dans la guerre commerciale, mais rejettera l'Axe, visant plutôt des ambitions plus élevées dans des Pays-Bas unis et tentera éventuellement de reprendre les anciennes colonies."
  RULE_OPTION_DEMOCRATIC_BENELUX:0 "Démocratique - Benelux"
  RULE_DEMOCRATIC_BENELUX_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de rester §Cdémocratique§! et de mener les pays bas vers la création du @BEL@HOL@LUXBenelux."
  RULE_OPTION_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES:0 "Démocratique - Union européenne"
  RULE_DEMOCRATIC_LEAD_THE_MINOR_DEMOCRACIES_HOL_AI_DESC:0 "L'IA @HOLnéerlandaise tentera de rester §Cdémocratique§! et de mener les §Cdémocraties§! mineures de l'Europe dans la création d'une Union européenne."
  RULE_OPTION_SECULAR_REPUBLIC:0 "République laïque"
  RULE_OPTION_SECULAR_REPUBLIC_DESC:0 "@MEXLe Mexique tendra vers un sécularisme modéré et une §Crépublique démocratique§!. L'état de droit sera renforcé au @MEXMexique par Manuel Ávila Camacho après les élections de 1940. C'est la voie historique pour le @MEXMexique."
  RULE_OPTION_SECULAR_REPUBLIC_LEFT:0 "République laïque semi-marxiste"
  RULE_OPTION_SECULAR_REPUBLIC_LEFT_DESC:0 "@MEXLe Mexique tendra vers un sécularisme complet et une §Crépublique démocratique§!. Les syndicats seront renforcés au @MEXMexique par Vicente Lombardo après les élections de 1940, mais le @MEXMexique restera démocratique."
  RULE_OPTION_SECULAR_REPUBLIC_RIGHT:0 "République démocratique"
  RULE_OPTION_SECULAR_REPUBLIC_RIGHT_DESC:0 "@MEXLe Mexique tendra vers une influence chrétienne modérée et une §Crépublique démocratique§!. La faction de Cedillo sera renforcée au @MEXMexique et Francisco Múgica gagnera les élections de 1940."
  RULE_OPTION_SOCIAL_CATHOLICISM:0 "Catholicisme social"
  RULE_OPTION_SOCIAL_CATHOLICISM_DESC:0 "Des réformateurs modérés au sein de l'Église catholique créeront un nouveau concordat au sein du @MEXMexique, mettant fin aux troubles sociaux du totalitarisme, et introduisant la §Cdémocratie catholique§! sous le leadership fidèle de l'archevêque Luis María Martínez."
  RULE_OPTION_LEFT_MODERATES:0 "Institutionnalisme de gauche"
  RULE_OPTION_LEFT_MODERATES_DESC:0 "@MEXLe Mexique tendra vers un sécularisme modéré et préservera les aspects révolutionnaires du PNR, sans pencher vers la démocratie. Les valeurs libérales seront renforcées au @MEXMexique par Francisco Múgica ou Manuel Ávila Camacho, dont l'un gagnera les élections de 1940 avec le soutien de Calles."
  RULE_OPTION_SECULAR_MODERATES:0 "Institutionnalisme laïque"
  RULE_OPTION_SECULAR_MODERATES_DESC:0 "@MEXLe Mexique tendra vers un sécularisme modéré et préservera les valeurs sur lesquelles le PNR a été fondé sans pencher vers la démocratie. L'état de droit sera renforcé au @MEXMexique par Lázaro Cárdenas, qui restera en fonction avec le soutien de Calles même après les élections de 1940."
  RULE_OPTION_RIGHT_MODERATES:0 "Institutionnalisme de Calles"
  RULE_OPTION_RIGHT_MODERATES_DESC:0 "@MEXLe Mexique tendra vers un sécularisme modéré et préservera les aspects nationalistes du PNR, sans pencher vers la démocratie. Le Jefe Máximo et le gouverneur de San Luis Potosí seront renforcés au @MEXMexique et Saturnino Cedillo gagnera les élections de 1940 avec le soutien de Calles."
  RULE_OPTION_FASCIST_DICTATORSHIP:0 "Dictature de Calles"
  RULE_OPTION_FASCIST_DICTATORSHIP_DESC:0 "Plutarco Calles, Saturnino Cedillo et les autres hommes forts militaires avorteront les tentatives naissantes de démocratie du @MEXMexique, et créeront une dictature athée et §Lfasciste§! sous le leadership restauré du Jefe Máximo; Plutarco E. Calles."
  RULE_OPTION_FASCIST_JUNTA:0 "Junte de Cedillo"
  RULE_OPTION_FASCIST_JUNTA_DESC:0 "Plutarco Calles, Saturnino Cedillo et les autres hommes forts militaires avorteront les tentatives naissantes de démocratie du @MEXMexique, et créeront une junte chrétienne et §Lfasciste§! sous le leadership du gouverneur de San Luis Potosí; Saturnino Cedillo Martínez."
  RULE_OPTION_MEX_FALANGIST:0 "Dictature synarchiste"
  RULE_OPTION_MEX_FALANGIST_DESC:0 "Après l'exil de Plutarco Calles et l'arrestation de Cedillo, d'autres hommes forts militaires sous la bannière synarchiste de Salvador Abascal mettront fin aux tentatives naissantes de démocratie du @MEXMexique, et créeront une dictature falangiste."
  RULE_OPTION_THEOCRATIC_ORDER:0 "Ordre théocratique"
  RULE_OPTION_THEOCRATIC_ORDER_DESC:0 "Les synarchistes et les Cristeros prendront le pouvoir au @MEXMexique sous l'œil attentif de Jesús Degollado Guízar, créant un nouvel ordre latino-américain au service de Dieu."
  RULE_OPTION_INSTITUTIONAL_COMMUNISM:0 "Communisme institutionnel"
  RULE_OPTION_INSTITUTIONAL_COMMUNISM_DESC:0 "@MEXLe Mexique tendra vers un sécularisme complet et les valeurs révolutionnaires du parti seront prises à des fins §Rcommunistes§!. L'état de droit sera renforcé au @MEXMexique par Lázaro Cárdenas, qui restera en fonction après l'annulation des élections de 1940."
  RULE_OPTION_INSTITUTIONAL_COMMUNISM_LEFT:0 "Socialisme révolutionnaire"
  RULE_OPTION_INSTITUTIONAL_COMMUNISM_LEFT_DESC:0 "@MEXLe Mexique tendra vers un sécularisme complet et les valeurs révolutionnaires du parti seront prises à des fins §Rcommunistes§!. Les syndicats seront renforcés au @MEXMexique par Vicente Lombardo après les élections de 1940, qui prendra une position interventionniste dans les affaires mondiales."
  RULE_OPTION_INSTITUTIONAL_COMMUNISM_RIGHT:0 "Socialisme chrétien"
  RULE_OPTION_INSTITUTIONAL_COMMUNISM_RIGHT_DESC:0 "@MEXLe Mexique tendra vers une influence chrétienne et les valeurs révolutionnaires du parti seront prises à des fins §Rcommunistes§!. Les sociaux-démocrates et les socialistes chrétiens seront renforcés au @MEXMexique par Francisco Múgica après les élections de 1940."
  RULE_OPTION_SOVIET_REPUBLIC:0 "République soviétique"
  RULE_OPTION_SOVIET_REPUBLIC_DESC:0 "@MEXLe Mexique tendra vers un sécularisme complet et les valeurs révolutionnaires du parti seront prises à des fins §Rcommunistes§!. Les staliniens seront renforcés au @MEXMexique par Dionisio Encina après les élections de 1940, qui prendra une position interventionniste dans les affaires mondiales, et se concentrera sur le renforcement de l'armée révolutionnaire."
  RULE_OPTION_CARDENISMO:0 "Cardénisme"
  RULE_OPTION_CARDENISMO_DESC:0 "@MEXLe Mexique tendra vers le §Rcommunisme§! jusqu'à ce que le parti soit renversé par une faction trotskiste, Hernán Laborde prendra le contrôle de cette faction en 1940 ou avant. Le @MEXMexique se concentrera sur les affaires politiques internes avant de prendre une position interventionniste dans les affaires mondiales."
  RULE_OPTION_TROTSKY:0 "Coup de Trotsky"
  RULE_OPTION_TROTSKY_DESC:0 "@MEXLe Mexique tendra vers le §Rcommunisme§! jusqu'à ce que le parti soit renversé par une faction trotskiste, puis Lev Trotsky lui-même prendra le contrôle de cette faction en 1940 ou avant UNIQUEMENT s'il a été exilé de @NORla Norvège. Le @MEXMexique se concentrera sur les affaires politiques internes avant de prendre une position interventionniste dans les affaires mondiales, et tentera de former une grande faction §Rcommuniste§! avec des membres du monde entier pour s'opposer au stalinisme."
  RULE_OPTION_CEDILLO_REBELS:0 "Rébellion de Cedillo"
  RULE_OPTION_CEDILLO_REBELS_DESC:0 "Saturnino Cedillo Martínez et les autres hommes forts militaires organiseront et lanceront une rébellion contre Cárdenas, avec le soutien de Plutarco E. Calles, et créeront une §Ljunte fasciste§! après une guerre civile contre le parti."
  RULE_OPTION_FP_NEUTRAL_DESC:0 "@MEXLe Mexique restera neutre dans les affaires mondiales, et ne s'alignera avec aucune faction, ni ne créera sa propre faction, sauf s'ils sont impliqués dans une guerre."
  RULE_OPTION_FP_USA:0 "S'aligner avec les @USAÉtats-Unis"
  RULE_OPTION_FP_USA_DESC:0 "@MEXLe Mexique alignera sa politique étrangère avec les @USAÉtats-Unis, et tentera de rejoindre toute faction à laquelle ils appartiennent. C'est le comportement historique."
  RULE_OPTION_FP_ENG:0 "S'aligner avec le @ENG Royaume-Uni"
  RULE_OPTION_FP_ENG_DESC:0 "@MEXLe Mexique alignera sa politique étrangère avec le @ENG Royaume-Uni, et tentera de rejoindre toute faction à laquelle ils appartiennent."
  RULE_OPTION_FP_GER:0 "S'aligner avec @GERl'Allemagne"
  RULE_OPTION_FP_GER_DESC:0 "@MEXLe Mexique alignera sa politique étrangère avec @GERl'Allemagne, et tentera de rejoindre toute faction à laquelle ils appartiennent."
  RULE_OPTION_FP_SOV:0 "S'aligner avec l'@SOVURSS"
  RULE_OPTION_FP_SOV_DESC:0 "@MEXLe Mexique alignera sa politique étrangère avec l'@SOVURSS, et tentera de rejoindre toute faction à laquelle ils appartiennent."
  RULE_OPTION_FP_HISPANIC:0 "Alliance hispanique"
  RULE_OPTION_FP_HISPANIC_DESC:0 "@MEXLe Mexique tentera de créer sa propre faction avec des puissances §Lfascistes§! et §gnon-alignées§! en Amérique latine. §Y Nécessite que le @MEXMexique soit soit §Lfasciste§! §Y ou §gnon-aligné§!"
  RULE_OPTION_FP_BOLIVARIAN:0 "Alliance bolivarienne"
  RULE_OPTION_FP_BOLIVARIAN_DESC:0 "@MEXLe Mexique tentera de créer sa propre faction avec des puissances §Rcommunistes§! et §gnon-alignées§! en Amérique latine. §Y Nécessite que le @MEXMexique soit soit §Rcommuniste§! §Y ou §gnon-aligné§!"
  RULE_OPTION_EXPANSION:0 "Marcher vers le sud"
  RULE_OPTION_EXPANSION_DESC:0 "@MEXLe Mexique commencera à s'étendre vers le sud en direction de l'Amérique centrale et du sud. L'IA peut tenter d'attaquer les @USAÉtats-Unis à un moment donné si cela se passe bien. §Y Nécessite l'alignement avec @GERl'Allemagne ou @SOVl'Union soviétique, ou la création de l'Alliance hispanique ou bolivarienne.§!"
  RULE_OPTION_NO_EXPANSION:0 "Pas d'expansion"
  RULE_OPTION_NO_EXPANSION_DESC:0 "L'IA n'attaquera pas ses voisins, même si elle en a l'opportunité."
  AMERICAS_COLONIZATION_STATUS:0 "Statut de colonisation des Amériques"
  RULE_OPTION_DEFAULT_COLONIZATION_DESC:0 "Le monde est colonisé comme dans l'histoire."
  RULE_OPTION_AMERICAS_DECOLONIZED:0 "Amériques décolonisées"
  RULE_OPTION_AMERICAS_DECOLONIZED_DESC:0 "Toutes les nations colonisées libérables dans les Amériques sont libérées en tant que nations libres et indépendantes dès le début de la partie."
  RULE_OPTION_AMERICAS_DEIMPERIALIZED: "Amériques dé-impérialisées"
  RULE_OPTION_AMERICAS_DEIMPERIALIZED_DESC: "Tous les tags amérindiens dans les Amériques sont libérés dès le début de la partie."
  QUEBEC_COLONIZATION_STATUS: "Statut de colonisation du Québec"
