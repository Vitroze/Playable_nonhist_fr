 RULE_OPTION_HIDE:0"Cacher"
 RULE_OPTION_HIDE_DESC:0"Certaines branches obsolètes seront masquées dans les circonstances appropriées pour faciliter la navigation dans l'arbre de focus."
 RULE_OPTION_SHOW:0"Montrer"
 RULE_OPTION_SHOW_DESC_DESC:0"Les branches obsolètes resteront toujours visibles dans l'arbre de focus."

