 RULE_OPTION_RAJ_FRAGMENTED_DESC:0"Toutes les nations constitutives libérables composant le Raj britannique sont libérées en tant que nations libres et indépendantes au début du jeu. "
 ITA_FRAGMENTATION_STATUS:0"Statut de fragmentation italienne"
 RULE_OPTION_ITA_FRAGMENTED:0"Inverser le Risorgimento"
 RULE_OPTION_ITA_FRAGMENTED_DESC:0"Annule le Risorgimento en Italie et rétablit les frontières telles qu'elles étaient juste avant. »
 RULE_OPTION_NATIONALIST_HISTORICAL:0"Boostez Franco"
 RULE_OPTION_SPA_NATIONALIST_HISTORICAL:0"Francoisme - Neutralité"
 RULE_OPTION_SPA_NATIONALIST_AXIS:0"Francoisme - Rejoignez l'Axe"
 RULE_OPTION_SPA_NATIONALIST_ALLIES:0"Francoïsme - Rejoignez les Alliés"
 RULE_OPTION_SPA_NATIONALIST_LATIN_BLOC:0"Francoisme - Forme Bloc Latin"
 RULE_OPTION_NATIONALIST_HISTORICAL_DESC:0"Franco prendra le contrôle du front nationaliste, une stratégie aléatoire sera décidée à partir de là.\n§YAI NE CHOISIRA PAS LES FALANISTES AVEC CETTE OPTION, ET LES CARLISTES NE SONT PAS PROBABLES DE SE REBELLER§!"
 RULE_OPTION_SPA_NATIONALIST_HISTORICAL_DESC:0"Après sa victoire, Franco tentera de rester neutre dans le monde à moins d'être attaqué. \n§YBOOSTING FALANGISTES OU CARLISTES ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_SPA_NATIONALIST_AXIS_DESC:0"Après sa victoire, §LFranco§! tentera de rejoindre l'axe en supposant que @GERAllemagne ou @ITAItalie sont §LFascistes§!.\n§YBOOSTING FALANGISTES OU CARLISTES ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_SPA_NATIONALIST_ALLIES_DESC:0"Après sa victoire, §gFranco§! tentera de rejoindre les alliés en supposant que les @USAÉtats-Unis ou @ENGRoyaume-Uni soient §CDémocrates§!.\n§YBOOSTING FALANGISTES OU CARLISTES ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_SPA_NATIONALIST_LATIN_BLOC_DESC:0"Après sa victoire, Franco tentera de former une faction du Bloc Latin avec @PORPortugal. Dans le cas contraire, il restera neutre à moins d'être attaqué ou entraîné dans une guerre avec @PORPortugal.\n§YBOOSTER LES FALANGISTES OU LES CARLISTES ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_SECOND_REPUBLIC:0"Boostez les Républicains"
 RULE_OPTION_SPD_SECOND_REPUBLIC_ALLIES:0"Républicains : rejoignez les alliés »
 RULE_OPTION_SPD_SECOND_REPUBLIC_AXIS:0"Républicains - Accord de l'Axe"
 RULE_OPTION_SPD_SECOND_REPUBLIC_LOYALIST:0"Républicains – Restez fidèles"
 RULE_OPTION_SECOND_REPUBLIC_DESC:0"Le §Cdémocratique§! Le gouvernement de @SPREspagne maintiendra la Deuxième République et deviendra une marionnette du @SOVSoviétique (si le @SOVSoviets ont envoyé un soutien adéquat), une stratégie aléatoire sera décidée à partir de là.\n§YAI NE CHOISIRA PAS LES STALINISTES AVEC CETTE OPTION§!"
 RULE_OPTION_SPD_SECOND_REPUBLIC_ALLIES_DESC:0"Après le §CRépublicain§ ! victoire, @SPRSpain utilisera le soutien de @SOVSoviétique pour se remettre de la guerre civile et exiger l'indépendance en fin de partie. Ils tenteront alors de rejoindre une alliance démocratique.\n§YBOOSTER LES STALINISTES ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_SPD_SECOND_REPUBLIC_AXIS_DESC:0"Après le §CRépublicain§ ! victoire, @SPRSpain utilisera le soutien de @SOVSoviétique pour se remettre de la guerre civile et exiger l'indépendance en fin de partie. Ils parviendront ensuite à un accord avec l'Axe pour vaincre l'@SOVUnion Soviétique.\n§YBOOSTING STALINISTES ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_SPD_SECOND_REPUBLIC_LOYALIST_DESC:0"Après le §RRépublicain§ ! victoire, @SPREspagne utilisera le @SOVsoutien soviétique pour se remettre de la guerre civile, puis élire §Rcommuniste§ ! ministres au gouvernement. Ils rejoindront l'@SOVUnion Soviétique pour vaincre le fascisme, en obtenant des objectifs de guerre sur §Lfasciste§ ! pays.\n§YBOOSTER LES STALINISTES ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_FALANGIST:0"Boostez les Phalangistes"
 RULE_OPTION_SPA_FALANGIST:0"Phalangiste - Impérialiste"
 RULE_OPTION_SPA_FALANGIST_AXIS:0"Falangiste - Rejoignez l'Axe"
 RULE_OPTION_FALANGIST_DESC:0"Les §LFalangistes§! sous José Antonio Primo de Rivera rejettera le carlisme et mettra en place un État à parti unique, une stratégie aléatoire sera décidée à partir de là.\n§YAI NE CHOISIRA PAS FRANCO AVEC CETTE OPTION§!"
 RULE_OPTION_SPA_FALANGIST_DESC:0"Après la victoire de la §LFalange§!, l'Espagne cherchera à restaurer l'impérialisme espagnol.\n§YBOOSTING FRANCO ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_SPA_FALANGIST_AXIS_DESC:0"Après la victoire de la §LFalange§!, l'Espagne tentera de rejoindre l'axe.\n§YBOOSTING FRANCO ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_CARLIST:0"Boostez les Carlistes"
 RULE_OPTION_SPB_CARLIST:0"Carlistes - Lente reprise"
 RULE_OPTION_SPB_CARLIST_AGGRESSIVE:0"Carlistes - Récupérez l'Empire"
 RULE_OPTION_CARLIST_DESC:0"Les carlistes dirigés par Manuel Fal Condé rejetteront le falangisme et assureront un retour à la monarchie absolutiste d’autrefois, sous la direction de son roi carliste légitime. Une stratégie aléatoire sera décidée à partir de là.\n§YAI NE CHOISIRA PAS FRANCO AVEC CETTE OPTION§!"
 RULE_OPTION_SPB_CARLIST_DESC:0""
 RULE_OPTION_SPB_CARLIST_AGGRESSIVE_DESC:0"Après la victoire carliste, @SPREspagne déclarera rapidement la guerre à @PORPortugal, puis tentera de reprendre les possessions impériales.\n§YCELA NE PRENDRA EFFET QUE SI LES CARLISTES REBELLES\nBOOSTANT FRANCO ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_ANARCHIST:0"Boostez les anarchistes"
 RULE_OPTION_ANARCHIST_DESC:0"Les communes anarchistes d’Aragon et de Catalogne s’uniront pour vaincre les fascistes et les communistes et résisteront complètement à la notion même d’État-nation. Une stratégie aléatoire sera décidée à partir de là.\n§YPOUM N'EXISTERA PAS AVEC CETTE OPTION§!"
 RULE_OPTION_SPC_ANARCHIST:0"Anarchistes - Défense Ibérique"
 RULE_OPTION_SPC_ANARCHIST_GLOBAL:0"Anarchistes - Conseil Global"
 RULE_OPTION_SPC_ANARCHIST_DESC:0"Après la victoire anarchiste, les communes absorberont Iberia et resteront ensuite en dehors des événements mondiaux.\n§YBOOSTING POUM ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_SPC_ANARCHIST_GLOBAL_DESC:0"Après la victoire anarchiste, les communes absorberont l'Ibérie et tenteront ensuite d'apporter des révolutions anarchistes dans le monde entier.\n§YBOOSTING POUM ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_INDEPENDENT_COMMUNIST:0"Boostez POUM"
 RULE_OPTION_SPC_INDEPENDENT_COMMUNIST:0"Communistes du POUM - Lente reprise"
 RULE_OPTION_SPC_INDEPENDENT_COMMUNIST_AGGRESSIVE:0"Communistes du POUM - Agressifs"
 RULE_OPTION_INDEPENDENT_COMMUNIST_DESC:0"Le POUM et ses alliés anarchistes se débarrasseront du joug stalinien et chercheront leur propre §Rcommuniste§ indépendant ! idéologie, une stratégie aléatoire sera décidée à partir de là.\n§YCNT/FAI N'EXISTERA PAS AVEC CETTE OPTION§!"
 RULE_OPTION_SPC_INDEPENDENT_COMMUNIST_DESC:0"Après la victoire communiste, @SPREspagne prendra du temps pour se reconstruire après la guerre civile et finira par déclarer la guerre au @PORPortugal.\n§YCNT/FAI N'EXISTERA PAS AVEC CETTE OPTION§!"
 RULE_OPTION_SPC_INDEPENDENT_COMMUNIST_AGGRESSIVE_DESC:0"Après la victoire communiste et un certain temps pour se rétablir, @SPREspagne poursuivra une politique étrangère plus puritaine en déclarant des guerres d'agression contre ses ennemis idéologiques.\n§YCNT/FAI N'EXISTERA PAS AVEC CETTE OPTION§!"
 RULE_OPTION_STALINIST:0"Boostez les staliniens"
 RULE_OPTION_SPD_STALINIST:0"Stalinien - Administration Soviétique"
 RULE_OPTION_SPD_STALINIST_FREE:0"Staliniste - République Autonome"
 RULE_OPTION_STALINIST_DESC:0"Les vrais §RCommunistes§!, suivant leurs ordres du @SOVMoscou, résisteront aux anarchistes et aux fascistes, réduiront l'influence des communistes indépendants et inaugureront une nouvelle ère pour la Deuxième République sous la direction stalinienne.\n§YREPUBLICANS N'EXISTERONT PAS AVEC CETTE OPTION§!"
 RULE_OPTION_SPD_STALINIST_DESC:0"Après la victoire stalinienne, @SPREspagne restera sous la direction de @SOVSoviet comme une marionnette pendant qu'elle se remet de la guerre civile.\n§YBOOSTING RÉPUBLICAINS ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_SPD_STALINIST_FREE_DESC:0"Après la victoire stalinienne, le @SPREspagne se concentrera sur sa reconstruction après la guerre civile, puis se déclarera membre autonome du Komintern, puis déclarera la guerre au @PORPortugal et entamera un §Rcommuniste§ ! soulèvement en @FRAFrance en fin de partie.\n§YBOOSTING RÉPUBLICAINS ÉCRASERA CETTE OPTION§!"
 RULE_OPTION_HISTORICAL_POR_AI_DESC:0"Sous le régime de Salazar, @PORPortugal renforcera l'Estado Novo et tentera de rester neutre pendant la guerre mondiale."
 RULE_OPTION_ANGLO_PORTUGESE_POR_AI_DESC:0"Sous le régime de Salazar, @PORPortugal renforcera l'Estado Novo et honorera l'@ENG@PORAlliance anglo-portugaise, rejoignant la faction de @ENGBritain à moins qu'elle ne soit sous §Rcommuniste§ ! profession."
 RULE_OPTION_FASCIST_POR_AI_DESC:0"Rafael Pereira prendra le contrôle du @PORPortugal en tant que §LFdictateur fasciste§!, tentant de rejoindre l'Axe en fin de partie et de commencer ses opérations au @BRABrésil."
 RULE_OPTION_FASCIST_FIFTH_EMPIRE:0"Le Cinquième Empire"
 RULE_OPTION_FASCIST_FIFTH_EMPIRE_DESC:1"Le @PORLe gouvernement portugais adoptera le §LFascisme§!, en tentant de récupérer ses territoires perdus en Afrique, en Asie et en Amérique, redevenant ainsi une puissance majeure. »
 RULE_OPTION_FASCIST_SUPPORT_SPAIN:0"Fasciste - Intervention espagnole"
 RULE_OPTION_FASCIST_SUPPORT_SPAIN_DESC:1"Rafael Pereira prendra le contrôle du @PORPortugal en tant que §LFdictateur fasciste§!, rejoindra les @SPRNationalistes dans la guerre civile et formera un pacte diplomatique avec le @SPREspagne."
 RULE_OPTION_NEUTRALITY_MONARCHIST:0"Monarchiste"
 RULE_OPTION_NEUTRALITY_MONARCHIST_DESC:0"Après la restauration de la monarchie au @PORPortugal, le roi Duarte fera appel aux monarchistes @BRAbrésiliens et tentera de restaurer le @POR@BRAEmpire du Portugal et du Brésil."
 RULE_OPTION_NEUTRALITY_MONARCHIST_SUPPORT_SPAIN:0"Monarchiste - Soutenez les Carlistes"
 RULE_OPTION_NEUTRALITY_MONARCHIST_SUPPORT_SPAIN_DESC:0"Après la restauration de la monarchie au @PORPortugal, le roi Duarte enverra son soutien aux factions carlistes du @SPREspagne, rejoignant ainsi la guerre civile à leurs côtés. Après cela, il fera appel aux monarchistes @BRAbrésiliens et tentera de restaurer l'@POR@BRAEmpire du Portugal et du Brésil en faction avec @SPREspagne."
 RULE_OPTION_DEMOCRATIC_POR_AI_DESC:1"Influencé par le @ENGRoyaume-Uni, un §Cdémocratique§! Le gouvernement renversera le régime autoritaire de Salazar et, avec l’aide des @ENGBritish, se concentrera sur le développement de l’industrie nationale avant de rejoindre les Alliés. »
 RULE_OPTION_DEMOCRATIC_IBERIAN_SUMMIT:0"Démocratique - Intervention espagnole"
 RULE_OPTION_DEMOCRATIC_IBERIAN_SUMMIT_POR_AI_DESC:0"Influencé par le @ENGRoyaume-Uni, un §Cdémocratique§! Le gouvernement renversera le régime autoritaire de Salazar et rejoindra le @SPRRépublicains dans la guerre civile, en organisant un sommet ibérique pour soumettre des candidatures communes aux Alliés.
 RULE_OPTION_COMMUNIST_COMINTERN_DESC:0"@PORPortugal va §s'aligner§ ! envers le @SOVUnion soviétique, en soutenant la @SPRRépublique espagnole et en tentant de rejoindre le Komintern.
 RULE_OPTION_COMMUNIST_INDEPENDENT:0"Républiques socialistes européennes unies"
 RULE_OPTION_COMMUNIST_INDEPENDENT_DESC:0"§RCommunistes§! renversera le gouvernement et luttera contre les nationalistes espagnols pendant la guerre civile espagnole, unifiant la péninsule ibérique en Républiques socialistes européennes unifiées, influençant la politique sud-américaine.
 RULE_OPTION_MONARCHIST_ORLEANIST:0"Monarchiste : Maison d'Orléans"
 RULE_OPTION_MONARCHIST_LEGITIMIST:0"Monarchiste : Maison de Bourbon"
 RULE_OPTION_MONARCHIST_BONAPARTIST:0"Monarchiste : Maison de Bonapart"
 RULE_MONARCHIST_ORLEANIST_FRA_AI_DESC:0"L'IA @FRAFrench tentera de restaurer la @FRAmonarchie française et de placer le prétendant orléaniste sur le trône en empruntant le chemin approprié sur l'arbre des focus."
 RULE_MONARCHIST_LEGITIMIST_FRA_AI_DESC:0"L'IA @FRAFrench tentera de restaurer la @FRAmonarchie française et de placer le prétendant légitimiste sur le trône en empruntant le chemin approprié sur l'arbre des focus."
 RULE_MONARCHIST_BONAPARTIST_FRA_AI_DESC:0"L'IA @FRAFrench tentera de restaurer la @FRAmonarchie française et de placer le prétendant bonapartiste sur le trône en empruntant le chemin approprié sur l'arbre des focus."
 RULE_ALLOW_RELEASE_NATIONS_KURDISTAN_TOOLTIP:0"§Y[ROOT.GetName]§! n'est pas autorisé à publier §Y[KUR.GetName]§!."
 RULE_OPTION_DEMOCRATIC_BALTIC_UNION:0"Démocratique - Union Baltique"
 RULE_OPTION_DEMOCRATIC_BALTIC_ENTENTE:0"Démocratique - Entente Baltique"
 RULE_DEMOCRATIC_LIT_AI_DESC:0"@LITLituanie tentera de se réformer pour devenir une §Cdémocratie§! moderne, sans quoi elle restera en dehors des affaires mondiales."
 RULE_DEMOCRATIC_LAT_AI_DESC:0"@LATLa Lettonie tentera de se réformer pour devenir une §Cdémocratie§! moderne, sans quoi elle restera en dehors des affaires mondiales."
 RULE_DEMOCRATIC_EST_AI_DESC:0"@ESTEstonie tentera de se réformer pour devenir une §Cdémocratie§! moderne, sans quoi elle restera en dehors des affaires mondiales."
 RULE_DEMOCRATIC_ALLIES_LIT_AI_DESC:0"@LITLa Lituanie tentera de se réformer en une §Cdémocratie§! moderne, l'IA tentera de rejoindre les alliés au début des années 1940."
 RULE_DEMOCRATIC_ALLIES_LAT_AI_DESC:0"@LATLa Lettonie tentera de se réformer en une §Cdémocratie§! moderne, l'IA tentera de rejoindre les alliés au début des années 1940."
 RULE_DEMOCRATIC_ALLIES_EST_AI_DESC:0"L'@ESTEstonie tentera de se réformer en une §Cdémocratie§! moderne, l'IA tentera de rejoindre les alliés au début des années 1940."
 RULE_DEMOCRATIC_BALTIC_UNION_LIT_AI_DESC:0"@LITLituanie tentera de se réformer pour devenir une §Cdémocratie§! moderne et de créer une union avec les @LAT@ESTÉtats baltes. L'IA tentera d'inviter @SWE@NOR@DEN@FINles pays scandinaves au début des années 1940."
 RULE_DEMOCRATIC_BALTIC_ENTENTE_LIT_AI_DESC:0"@LITLituanie tentera de se réformer en une §Cdémocratie§! moderne et de créer une faction avec les @LAT@ESTÉtats baltes."
 RULE_DEMOCRATIC_BALTIC_UNION_LAT_AI_DESC:0"@LATLa Lettonie tentera de se réformer en une §Cdémocratie§! moderne et de créer une union avec les @LIT@ESTÉtats baltes. L'IA tentera d'inviter @SWE@NOR@DEN@FINles pays scandinaves au début des années 1940."
 RULE_DEMOCRATIC_BALTIC_ENTENTE_LAT_AI_DESC:0"@LATLa Lettonie tentera de se réformer en une §Cdémocratie§! moderne et de créer une faction avec les @LIT@ESTÉtats baltes."
 RULE_DEMOCRATIC_BALTIC_UNION_EST_AI_DESC:0"L'@ESTEstonie tentera de se réformer pour devenir une §Cdémocratie§! moderne et de créer une union avec les @LIT@LATÉtats baltes. L'IA tentera d'inviter @SWE@NOR@DEN@FINles pays scandinaves au début des années 1940."
 RULE_DEMOCRATIC_BALTIC_ENTENTE_EST_AI_DESC:0"L'@ESTEstonie tentera de se réformer en une §Cdémocratie§! moderne et de créer une faction avec les @LIT@LATÉtats baltes."
 RULE_ENTENTE_EST_AI_DESC:0"@ESTEstonie tentera d’officialiser l’Entente balte et de survivre face aux @SOVSoviets. »
 RULE_ENTENTE_LAT_AI_DESC:0"@LATLettonie tentera d'officialiser l'Entente balte et de survivre face aux @SOVSoviets."
 RULE_HISTORICAL_EST_AI_DESC:0"L'@ESTIA estonienne restera neutre pendant la majeure partie de la campagne et maintiendra la dictature nationaliste. C'est un comportement historique."
 RULE_HISTORICAL_LAT_AI_DESC:0"L'IA @LATlettonne restera neutre pendant la majeure partie de la campagne et maintiendra la dictature nationaliste. C'est un comportement historique."
 RULE_HISTORICAL_LIT_AI_DESC:0"L'IA @LITlituanienne restera neutre pendant la majeure partie de la campagne et maintiendra la dictature nationaliste. C'est un comportement historique."
 RULE_OPTION_LTS_OCCUPATION:0"Nationalistes - Collaborateurs"
 RULE_LTS_OCCUPATION_LIT_AI_DESC:0"L'@LITIA lituanienne maintiendra la dictature nationaliste et collaborera en tant que marionnette de l'@GERAllemagne ou du @SOVSoviets si l'un ou l'autre fait des demandes."
 RULE_LTS_OCCUPATION_LAT_AI_DESC:0"L'@LATIA lettone maintiendra la dictature nationaliste et collaborera en tant que marionnette de l'@GERAllemagne ou du @SOVSoviets si l'un ou l'autre fait des demandes."
 RULE_LTS_OCCUPATION_EST_AI_DESC:0"L'@ESTIA estonienne maintiendra la dictature nationaliste et collaborera en tant que marionnette de l'@GERAllemagne ou du @SOVSoviets si l'un ou l'autre fait des demandes."
 RULE_OPTION_JUNTA_RULE:0"Junte militaire"
 RULE_JUNTA_RULE_LIT_AI_DESC:0"L'armée lituanienne @LIT fusionnera avec le gouvernement civil et appliquera la loi martiale. Le nouveau gouvernement tentera ensuite d'imposer un régime militaire sur les @LAT@ESTÉtats baltes au début des années 1940."
 RULE_JUNTA_RULE_LAT_AI_DESC:0"L'armée lettone du @LAT fusionnera avec le gouvernement civil et appliquera la loi martiale. Le nouveau gouvernement tentera ensuite d'imposer le régime militaire sur les @LIT@ESTÉtats baltes au début des années 1940."
 RULE_OPTION_PL_ALLIES:0"Nationalistes - Alliés"
 RULE_PL_ALLIES_EST_AI_DESC:0"L'@ESTIA estonienne maintiendra la dictature nationaliste, l'IA tentera de rejoindre les alliés au début des années 1940"
 RULE_OPTION_JUNTA_ALLIES:0"Junte militaire - Alliés"
 RULE_JUNTA_ALLIES_LIT_AI_DESC:0"L'armée lituanienne fusionnera avec le gouvernement civil et appliquera la loi martiale. Le nouveau gouvernement tentera ensuite de rejoindre les alliés au début des années 1940."
 RULE_JUNTA_ALLIES_LAT_AI_DESC:0"L'armée lettone fusionnera avec le gouvernement civil et appliquera la loi martiale. Le nouveau gouvernement tentera ensuite de rejoindre les alliés au début des années 1940."
 RULE_OPTION_LTS_BALTIC_UNION:0"Nationalistes - Union Baltique"
 RULE_LTS_BALTIC_UNION_LIT_AI_DESC:0"L'@LITIA lituanienne maintiendra la dictature nationaliste et tentera ensuite de former une union avec le @LAT@ESTÉtats baltes. L'IA tentera d'inviter @SWE@NOR@DEN@FINles pays scandinaves au début des années 1940."
 RULE_PL_BALTIC_UNION_EST_AI_DESC:0"L'@ESTIA estonienne maintiendra la dictature nationaliste et tentera ensuite de former une union avec le @LIT@LATÉtats baltes. L'IA tentera d'inviter @SWE@NOR@DEN@FINles pays scandinaves au début des années 1940."
 RULE_OPTION_LTS_BALTIC_ENTENTE:0"Nationalistes - Entente Baltique"
 RULE_LTS_BALTIC_ENTENTE_LIT_AI_DESC:0"L'@LITIA lituanienne maintiendra la dictature nationaliste et tentera ensuite de former une faction avec les @LAT@ESTÉtats baltes."
 RULE_PL_BALTIC_ENTENTE_EST_AI_DESC:0"L'@ESTIA estonienne maintiendra la dictature nationaliste et tentera ensuite de former une faction avec les @LIT@LATÉtats baltes."
 RULE_OPTION_MONARCHIST:0"Monarchiste"
 RULE_OPTION_MONARCHIST_LIT_AI_DESC:0"@LITLituanie tentera de restaurer la monarchie et de revendiquer le @POL@LITCommonwealth polono-lituanien."
 RULE_OPTION_MONARCHIST_AGGRESSIVE:0"Monarchiste - Grand Commonwealth"
 RULE_OPTION_MONARCHIST_AGGRESSIVE_LIT_AI_DESC:0"@LITLituanie tentera de restaurer la monarchie et de revendiquer le @POL@LITCommonwealth polono-lituanien, puis envahira l'@SOVUnion soviétique pour former le Grand Commonwealth.
 RULE_OPTION_BALTIC_ENTENTE:0"Entente Baltique"
 RULE_OPTION_FP_NEUTRAL:0"Parti paysan - Neutre"
 RULE_FP_LAT_AI_DESC:0"L'IA @LATlettonne restera neutre pendant la majeure partie de la campagne et restaurera l'influence du Parti paysan."
 RULE_OPTION_FP_BALTIC_UNION:0"Parti paysan - Union balte"
 RULE_FP_BALTIC_UNION_LAT_AI_DESC:0"Le @LATIA letton restaurera l'influence du Parti paysan et tentera ensuite de former une union avec le @LIT@ESTÉtats baltes. L'IA tentera d'inviter @SWE@NOR@DEN@FINles pays scandinaves au début des années 1940."
 RULE_OPTION_FP_BALTIC_ENTENTE:0"Parti Paysan - Entente Baltique"
 RULE_FP_BALTIC_ENTENTE_LAT_AI_DESC:0"L'@LATIA lettone restaurera l'influence du Parti paysan et tentera ensuite de former une faction avec les @LIT@ESTÉtats baltes."
 RULE_OPTION_FASCIST_RK_OSTLAND:0"Fasciste - Axe Ostland"
 RULE_OPTION_FASCIST_RK_BALTIC:0"Fasciste - Axe - Empire Baltique"
 RULE_OPTION_FASCIST_BALTIC:0"Fasciste - Empire balte"
 RULE_OPTION_FASCIST_BALTIC_2:0"Fasciste - Empire balte-scandinave"
 RULE_OPTION_FASCIST_BALTIC_3:0"Fasciste - Fraternité Baltique"
 RULE_OPTION_FASCIST_FINLAND:0"Fasciste - Coup d'Etat finlandais de l'Axe"
 RULE_OPTION_FASCIST_AXIS_SCANDI:0"Fasciste - Axe Empire Scandinave"
 RULE_OPTION_FASCIST_AXIS_UGRA:0"Fasciste - Axe Finno-Ugra"
 RULE_OPTION_FASCIST_SCANDI:0"Fasciste - Empire Scandinave"
 RULE_OPTION_FASCIST_UGRA:0"Fasciste - Finno-Ugra"
 RULE_FASCIST_FINLAND_EST_AI_DESC:0"L'@ESTIA estonienne demandera aux Vaps d'établir un §Lgouvernement fasciste§!, l'IA tentera alors de putschiser le gouvernement de @FINFinalnd, et rejoindra ensuite l'Axe avec @FINFinlande."
 RULE_FASCIST_AXIS_SCANDI_EST_AI_DESC:0"L'@ESTIA estonienne demandera aux Vaps d'établir un §Lgouvernement fasciste§!, l'IA tentera alors de putschiser le gouvernement de @FINFinalnd, et rejoindra ensuite l'Axe avec @FINFinlande. L'IA tentera de former @DEN@SWE@NOR@FINScandinavie en envahissant ces pays.
 RULE_FASCIST_SCANDI_EST_AI_DESC:0"L'@ESTIA estonienne demandera aux Vaps d'établir un §Lgouvernement fasciste§!, l'IA tentera ensuite de putschiser le gouvernement de @FINFinalnd, et tentera de former @DEN@SWE@NOR@FINScandinavie en envahissant ces pays en fin de partie. (la plupart du temps, ça ne se passe jamais bien)"
 RULE_FASCIST_AXIS_UGRA_EST_AI_DESC:0"L'@ESTIA estonienne demandera aux Vaps d'établir un §Lgouvernement fasciste§!, l'IA tentera alors de s'unir avec @FINFinalnd, et rejoindra ensuite l'Axe. L’IA tentera d’unir les peuples finno-urges. »
 RULE_FASCIST_UGRA_EST_AI_DESC:0"L'@ESTIA estonienne demandera aux Vaps d'établir un §Lgouvernement fasciste§!, l'IA tentera ensuite de s'unir avec @FINFinalnd et tentera d'unir les peuples finno-urgiques en envahissant @SWESuède et @NORNorvège, ainsi que l'@SOVUnion soviétique en fin de partie.
 RULE_FASCIST_RK_OSTLAND_LAT_AI_DESC:0"L'IA @LATlettonne permettra §LPērkonkrusts§ ! pour renverser le gouvernement, et rejoindra @GERAllemagne. L'IA tentera alors de former l'Ostland et de gagner du territoire dans l'@SOVUnion Soviétique."
 RULE_FASCIST_RK_BALTIC_LAT_AI_DESC:0"L'IA @LATlettonne permettra §LPērkonkrusts§ ! pour renverser le gouvernement, et rejoindra @GERAllemagne. L’IA tentera alors de former l’Empire Baltique. »
 RULE_FASCIST_BALTIC_LAT_AI_DESC:0"L'IA @LATlettonne permettra §LPērkonkrusts§ ! pour renverser le gouvernement, mais rejettera une alliance @GERallemande, puis tentera de prendre le contrôle des @LIT@ESTÉtats baltes."
 RULE_FASCIST_BALTIC_2_LAT_AI_DESC:0"L'IA @LATlettonne permettra §LPērkonkrusts§ ! pour renverser le gouvernement, mais rejettera une alliance @GERallemande, puis tentera de prendre le contrôle des @LIT@ESTÉtats baltes, et finalement attaquer les @SWE@DEN@NOR@FINpays scandinaves."
 RULE_FASCIST_BALTIC_3_LAT_AI_DESC:0"L'IA @LATlettonne permettra §LPērkonkrusts§ ! pour renverser le gouvernement, mais rejettera une alliance @GERallemande, puis tentera de proposer une alliance à d'autres §LFascistes§ ! @LIT@ESTÉtats baltes, ou marionnettes avec eux s'ils ne sont pas fascistes."
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION:0"Communiste - Fédération Balkanique"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_BUL_AI_DESC:0"@BULBulgarie tentera de former une §RBalliance balkanique§!, incitant ses voisins à embrasser la révolution et, à terme, unifier les Balkans."
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_AUTONOMY:0"Communiste - Républiques autonomes des Balkans"
 RULE_OPTION_COMMUNIST_BALKAN_FEDERATION_AUTONOMY_BUL_AI_DESC:0"@BULBulgarie tentera de former une §RBalliance balkanique§!, influençant son §RCommuniste§! voisins à embrasser la révolution et à promouvoir la collaboration en tant que pays indépendants. »
 RULE_OPTION_COMMUNIST_BUL_AI_DESC:0"@BULBulgarie passera au §Rcommunisme§ ! et tenter de rejoindre le Komintern et de lutter avec ses camarades @SOVSoviétiques contre le fascisme et le capitalisme en Europe. »
 RULE_OPTION_DEMOCRATIC_LIBERAL:0"Démocrates - Alliés"
 RULE_OPTION_DEMOCRATIC_LIBERAL_BUL_AI_DESC:0"Le gouvernement dirigé par Nikola Mushanov suivra le §Csocialiste§ ! politiques et tenter de rejoindre les Alliés.
 RULE_OPTION_DEMOCRATIC_TSARDOM_ALLIES:0"Régence Démocratique - Alliés"
 RULE_OPTION_DEMOCRATIC_TSARDOM_ALLIES_BUL_AI_DESC:0"Le @BULBulgare §CParti Démocratique§! tentera de rejoindre les Alliés en fin de partie alors qu'ils conspirent contre le tsar Boris pour le destituer du pouvoir et former un conseil de régence.
 RULE_OPTION_DEMOCRATIC_TSARDOM_BALKANS:0"Régence Démocratique - Fédération Balkanique"
 RULE_OPTION_DEMOCRATIC_TSARDOM_BALKANS_BUL_AI_DESC:1"Le @BULBulgare §CParti Démocratique§! cherchera à améliorer ses relations avec ses voisins §Cdémocratiques§! et §gnon-aligné§! nations pour former une confédération balkanique en fin de partie, et éventuellement unifier les balkans en un seul pays.
 RULE_OPTION_DEMOCRATIC_SOCIALIST:0"Alliance Démocratique-Balkanique"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BUL_AI_DESC:1"Le gouvernement dirigé par Nikola Mushanov suivra le §Csocialiste§ ! politiques, cherchant à améliorer ses relations avec ses voisins §CDémocratiques§! nations pour former une confédération balkanique et défendre les Balkans contre les agresseurs étrangers.
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BALKANS:0"Fédération Démocratique-Balkanique"
 RULE_OPTION_DEMOCRATIC_SOCIALIST_BALKANS_BUL_AI_DESC:1"Le gouvernement dirigé par Nikola Mushanov suivra le §Csocialiste§ ! politiques, cherchant à améliorer ses relations avec ses voisins §CDémocratiques§! nations pour former une confédération balkanique et, à terme, unifier les balkans en un seul pays. »
 RULE_OPTION_FASCIST_BUL_AI_DESC:0"Comme le §Lfascisme§! Dans le pays, le leader de droite Hristo Lukov tentera de rejoindre l'Axe, renversant finalement le tsar et imposant une dictature militaire.
 RULE_OPTION_FASCIST_THIRD_EMPIRE:0"Fasciste - Troisième Empire"
 RULE_OPTION_FASCIST_THIRD_EMPIRE_BUL_AI_DESC:0"Comme le §Lfascisme§! Dans le pays, le leader de droite Hristo Lukov tentera de rejoindre l'Axe, renversant finalement le tsar et formant le Troisième Empire bulgare.
 RULE_OPTION_FASCIST_BALKANS_DOMINANCE:0"Fasciste - Domination des Balkans"
 RULE_OPTION_FASCIST_BALKANS_DOMINANCE_BUL_AI_DESC:0"Comme le §Lfascisme§! se lève dans le pays, le leader de droite Hristo Lukov renversera le tsar et imposera une dictature militaire, puis affirmera la domination bulgare sur les Balkans.
 RULE_OPTION_BORIS_AXIS:0"Boris III - Rejoignez l'Axe"
 RULE_OPTION_HISTORICAL_BUL_AI_DESC:0"Le tsar Boris III conduira le pays vers l'Axe, en s'appuyant sur l'arbitrage du @GERallemand pour étendre pacifiquement les frontières de la @BULbulgare, signant finalement le pacte tripartite et retardant la participation de la @BULbulgare à la guerre, un conseil de régence prendra le relais en fin de partie.
 RULE_OPTION_THE_RETURN_OF_FERDINAND:0"Le retour de Ferdinand Ier"
 RULE_OPTION_THE_RETURN_OF_FERDINAND_BUL_AI_DESC:0"Après la mort du tsar Boris III, son père Ferdinand Ier montera à nouveau sur le trône, cherchant à se venger de ceux qui lui ont fait du tort il y a des décennies. »
 RULE_OPTION_REGENCY_COUNCIL:0"Régence Neutre"
 RULE_OPTION_REGENCY_COUNCIL_BUL_AI_DESC:0"Après la mort du tsar Boris III, un conseil de régence sera formé et déclarera la Bulgarie pays neutre dans les affaires mondiales jusqu'à ce que Siméon II soit majeur."
 RULE_OPTION_BORIS_ALLIES:0"Boris III - Rejoignez les alliés"
 RULE_OPTION_BORIS_ALLIES_BUL_AI_DESC:0"Le tsar Boris III conduira le pays vers les Alliés, en s'appuyant sur l'arbitrage britannique pour élargir les frontières bulgares de manière pacifique ou par la force."
 RULE_OPTION_BALKAN_PRUSSIA:0"Boris III - Domination de l'Axe dans les Balkans"
 RULE_OPTION_BALKAN_PRUSSIA_BUL_AI_DESC:0"Le tsar Boris III dirigera le pays dans un renforcement étendu de ses forces militaires et navales, rejoignant l'Axe en fin de partie et tentant d'assurer la suprématie sur le Bosphore.
 RULE_OPTION_METAXIST:0"Historique - Métaxisme"
 RULE_OPTION_METAXIST_GRE_AI_DESC:0"@GREGreece poursuivra une politique de neutralité tout en développant les idées du métaxisme. »
 RULE_OPTION_MONARCHIST_GRE_AI:0"Monarchiste - Alliés"
 RULE_OPTION_MONARCHIST_GRE_AI_DESC:0"@GREGrèce deviendra une monarchie absolue et cherchera à rejoindre les Alliés. »
 RULE_OPTION_MONARCHIST_GRE_ALTERNATE_AI:0"Monarchiste - Pouvoirs centraux"
 RULE_OPTION_MONARCHIST_ALTERNATE_GRE_AI_DESC:0"@GREGreece deviendra une monarchie absolue et cherchera à rejoindre les puissances centrales avec @GERAllemagne ou @AUS@HUNAutriche-Hongrie."
 RULE_OPTION_STALINIST_GRE_AI:0"Staliniste"
 RULE_OPTION_STALINIST_GRE_AI_DESC:0"@GREGrèce passera au §RStalinisme§ ! et tenter de rejoindre le Komintern et déclencher une bataille pour le Bosphore avec @TURTurkey."
 RULE_OPTION_COMMUNIST_GRE_AI:0"Communiste"
 RULE_OPTION_ALTERNATE_COMMUNIST_GRE_AI_DESC:0"@GREGrèce passera au §RSocialisme§ ! et tenter de combattre le fascisme en Europe aux côtés de la @YUGYougoslavie communiste."
 RULE_OPTION_DEMOCRATIC_GRE_AI:0"Vénézéliste"
 RULE_OPTION_VENEZELIST_GRE_AI_DESC:0"@GREGrèce deviendra une §Démocratie§! et se battra pour le droit de réaliser l'Idée Megali."
 RULE_OPTION_DEMOCRATIC_GRE_AI_DESC:0"Le @GREGrèce deviendra une §Cdémocratie§! et restera neutre dans les affaires mondiales. »
 RULE_OPTION_FASCISM_METAXIST:0"Fasciste - Métaxiste"
 RULE_OPTION_FASCISM_METAXIST_GRE_AI_DESC:0"@GREGrèce deviendra un §LFasciste métaxiste§ ! Monarchie et tentative de rejoindre l'Axe, sabotant les relations de l'Axe avec la @TURTurquie et tentant de former la @GREGrande Grèce."
 RULE_OPTION_FASCISM_HELLENOTURKISM:0"Fasciste - helléno-turcisme"
 RULE_OPTION_FASCISM_HELLENOTURKISM_GRE_AI_DESC:0"@GREGrèce deviendra §LNational-Socialiste§ ! république et tenter de rejoindre l'Axe aux côtés de @TURTurquie."
 RULE_OPTION_FASCIST_ALTERNATE_GRE_AI:0"Fasciste anatolien"
 RULE_OPTION_FASCISM_ALTERNATE_GRE_AI_DESC:0"@GREGrèce deviendra démocratique, subira un §Leffondrement du gouvernement§!, puis continuera à aspirer aux plus grandes ambitions..."
 RULE_OPTION_HISTORICAL_TUR_AI:0"Neutralité kémaliste"
 RULE_OPTION_HISTORICAL_IDEO_TUR_AI_DESC:1"@TURTurquie poursuivra la politique kémaliste sous la direction d'İsmet İnönü et maintiendra plus longtemps sa neutralité dans les affaires mondiales.
 RULE_OPTION_KEMALIST_NATIONALIST_TUR_AI:0"Interventionniste Kémaliste"
 RULE_OPTION_KEMALIST_NATIONALIST_TUR_AI_DESC:1"@TURTurkey poursuivra la politique du kémalisme sous la direction d'İsmet İnönü.
 RULE_OPTION_KEMALIST_DEMOCRATIC_TUR_AI:0"Démocratie kémaliste"
 RULE_OPTION_KEMALIST_DEMOCRATIC_TUR_AI_DESC:1"@TURTurquie va passer à une §CKdémocratie maliste§ ! sous la direction de Celâl Bayar, et maintenir plus longtemps notre neutralité dans les affaires mondiales. »
 RULE_OPTION_FUNDAMENTALIST_NEUTRAL_TUR_AI:0"Neutralité traditionaliste"
 RULE_OPTION_FUNDAMENTALIST_NEUTRAL_TUR_AI_DESC:0"@TURTurquie réformera la politique du kémalisme pour répondre aux besoins des islamistes fondamentalistes sous la direction de Fevzi Çakmak et maintiendra plus longtemps sa neutralité dans les affaires mondiales.
 RULE_OPTION_FUNDAMENTALIST_NATIONALIST_TUR_AI:0"Interventionniste traditionaliste"
 RULE_OPTION_FUNDAMENTALIST_NATIONALIST_TUR_AI_DESC:0"@TURTurquie réformera la politique du kémalisme pour répondre aux besoins des islamistes fondamentalistes, en transition vers une §gdictature quasi-fasciste§ ! sous la direction de Fevzi Çakmak."
 RULE_OPTION_DEMOCRATIC_FUNDAMENTALIST_TUR_AI:0"Démocratie traditionaliste"
 RULE_OPTION_DEMOCRATIC_FUNDAMENTALIST_TUR_AI_DESC:1"@TURTurquie va passer à une §Cdémocratie traditionaliste§ ! sous la direction d'Adnan Menderes, et maintenir plus longtemps notre neutralité dans les affaires mondiales. »
 RULE_OPTION_FASCIST_TUR_AI:0"Le fascisme kémaliste"
 RULE_OPTION_FASCIST_TUR_AI_DESC:0"@TURTurquie réformera la politique du kémalisme pour répondre aux besoins du mouvement Kadro et des §LFChemises rouges fascistes§ ! sous la direction de Recep Peker."
 RULE_OPTION_FASCIST_TUR_AI:0"Le fascisme kémaliste"
 RULE_OPTION_FASCIST_TUR_AI_DESC:0"@TURTurquie réformera la politique du kémalisme pour répondre aux besoins du mouvement Kadro et des §LFChemises rouges fascistes§ ! sous la direction de Recep Peker."
 RULE_OPTION_COMMUNIST_TUR_AI:0"Le communisme kémaliste"
 RULE_OPTION_COMMUNIST_TUR_AI_DESC:0"@TURTurquie réformera la politique du kémalisme pour répondre aux besoins du mouvement Kadro et de la milice ouvrière communiste§! sous la direction de Şevket Süreyya Aydemir."
 RULE_OPTION_OTTOMAN:0"Restaurer le sultanat ottoman"
 RULE_OPTION_OTTOMAN_DESC:0"La République de @TURTurquie s'effondrera et le sultanat ottoman renaîtra de ses cendres au pouvoir. §YL'option choisie pour l'Alignement Turc sera ignorée !§!"
 RULE_OPTION_HISTORICAL_TUR_AI_DESC:0"@TURTurkey s'alignera de manière aléatoire avec des chances plus élevées attribuées aux pays qui ont la même idéologie, mais les pays qui investissent davantage dans la Turquie au début et au milieu du jeu auront beaucoup plus de chances que @TURTurkey s'aligne sur eux. En supposant qu'ils soient un pays éligible pour l'alignement @TURTurkish. §Y(doit être soit :@ENG@GER@SOV@SPR ou le plus grand§! §Cdémocratique§!§Y/§!§Lfasciste§!§Y/§!§Rcommuniste§! §Ychef de faction ou pays indépendant en Europe - @FRA@ITA@YUG@GRE, @POL(non communiste), @BUL(pas fasciste)§!"
 RULE_OPTION_NEUTRALITY_TUR_AI_DESC:0"@TURLa Turquie ne s’alignera jamais sur une puissance étrangère à moins qu’elle ne se retrouve en guerre. »
 RULE_OPTION_JOIN_BRITAIN_TUR_AI_DESC:0"@TURTurquie s'alignera toujours sur le @ENGRoyaume-Uni, même s'il s'agit d'une idéologie différente. L'IA rejoindra @ENGBritain plus tôt si elle a plus d'influence."
 RULE_OPTION_JOIN_GERMANY_TUR_AI_DESC:0"@TURTurquie s'alignera toujours sur @GERAllemagne, même s'il s'agit d'une idéologie différente. L'IA rejoindra @GERAllemagne plus tôt si elle a plus d'influence."
 RULE_OPTION_JOIN_SOVIET_TUR_AI_DESC:0"@TURTurquie s'alignera toujours sur l'@SOVUnion soviétique, même s'il s'agit d'une idéologie différente. L'IA rejoindra les @SOVSoviets plus tôt si ceux-ci ont plus d'influence.§YCette voie ne fonctionnera que pour a§ ! §RCommuniste§! §Y@SOVUnion soviétique.§!"
 RULE_OPTION_JOIN_EURO_TUR_AI_DESC:0"@TURTurquie s'alignera toujours sur un §Cdémocratique§ ! chef de faction en Europe (pas les Alliés !). L'IA rejoindra cette faction plus tôt si elle a plus d'influence.§YCe chemin en nécessite au moins un§ ! §Cdémocratique§! §Yleader de faction en Europe continentale§!"
 RULE_OPTION_JOIN_MED_F_TUR_AI_DESC:0"@TURTurquie s'alignera toujours sur un §Lfasciste§ ! pays bordant la Méditerranée. L'IA rejoindra cette faction plus tôt si elle a plus d'influence.§YCe chemin en nécessite au moins un§ ! §Lfasciste§! §Ynation des éléments suivants NON dans l'Axe :§!@ITA@FRA@YUG@SPR@GRE@POL"
 RULE_OPTION_JOIN_MED_C_TUR_AI_DESC:0"@TURTurquie s'alignera toujours sur un §Rcommuniste§ ! pays bordant la Méditerranée. L'IA rejoindra cette faction plus tôt si elle a plus d'influence.§YCe chemin en nécessite au moins un§ ! §Rcommuniste§! §Ynation des éléments suivants PAS dans le Komintern :§!@SPR@FRA@ITA@YUG@GRE@BUL"
 RULE_OPTION_BALKAN_ENTENTE:0"Sauvegarder les Balkans"
 RULE_OPTION_BALKAN_ENTENTE_DESC:0"@TURTurquie s'engagera à maintenir la sécurité dans les Balkans et tentera de former une faction avec @GREGreece, @ROMRomania et @YUGYugoslavia.
 RULE_OPTION_PEACE_TUR_AI_DESC:0"@TURLa Turquie tentera de ne pas déclencher de nouvelles guerres ni d'étendre son territoire"
 RULE_OPTION_AGGR_TUR_AI_DESC:0"@TURTurquie n'aura aucune restriction sur le déclenchement de nouvelles guerres ou l'expansion de son territoire, mais ne déclenchera pas de guerres ridicules ni n'essaiera de créer un empire touraniste.
 RULE_OPTION_TUR_TURAN_DESC:0"@TURTurquie n'aura aucune restriction quant au déclenchement de nouvelles guerres ou à l'expansion de son territoire, et descendra dans la partie ambition touraniste de son arbre de concentration.
 RULE_EXILES_TSARIST_ROME:0"Exilés tsaristes - Troisième Rome"
 RULE_OPTION_EXILES_TSARIST_ROME_SOV_AI_DESC:0"L'IA @SOVSoviétique expulsera les communistes par la guerre civile, réintégrera la Russie tsariste et promouvra le métropolite Mélétius au rang d'archi-patriarche du Troisième Empire romain de l'Église orthodoxe.
 RULE_EXILES_TSARIST_PROTECTOR:0"Exilés tsaristes - Protecteur slave"
 RULE_OPTION_EXILES_TSARIST_PROTECTOR_SOV_AI_DESC:0"Le @SOVl'IA soviétique expulsera les communistes par la guerre civile, réintégrera la Russie tsariste, tentera de recréer la triple entente et donnera des garanties au monde slave.
 RULE_EXILES_TSARIST_SLAVIC:0"Exilés tsaristes - Nationalisme panslave"
 RULE_OPTION_EXILES_TSARIST_SLAVIC_SOV_AI_DESC:0"Le @SOVl'IA soviétique expulsera les communistes par la guerre civile, réintégrera la Russie tsariste et exigera l'annexion des nations slaves pour créer l'Union panslave.
 RULE_EXILES_FASCIST_AXIS:0"Exilés fascistes - Rejoignez l'Axe"
 RULE_OPTION_EXILES_FASCIST_AXIS_SOV_AI_DESC:0"Le @SOVIA soviétique expulsera les communistes par la guerre civile, établira un §fasciste§ ! gouvernement, puis tenter de rejoindre l’Axe. »
 RULE_EXILES_FASCIST_AXIS_AMERICAS:0"Exilés fascistes - Axe Berlin-Moscou-Tokyo"
 RULE_OPTION_EXILES_FASCIST_AXIS_AMERICAS_SOV_AI_DESC:0"Le @SOVIA soviétique expulsera les communistes par la guerre civile, établira un §Lfasciste§ ! gouvernement, puis tentez de rejoindre l'Axe, en invitant @JAPJapan dans la faction s'ils ont un gouvernement fasciste. En fin de partie, @SOVRussia influencera l'Amérique du Sud et tentera de reprendre les @USAAlaska."
 RULE_EXILES_FASCIST_PACIFIC:0"Exilés fascistes - Empire du Pacifique"
 RULE_OPTION_EXILES_FASCIST_PACIFIC_SOV_AI_DESC:0"Le @SOVIA soviétique expulsera les communistes par la guerre civile, établira un §Lfasciste§ ! gouvernement, puis tenter d'entrer en guerre avec le @JAPJapon et le @CHIChine, pour établir un empire dans le Pacifique, influencer l'Amérique du Sud et entrer en guerre en fin de partie avec les @USAUSA.
 RULE_EXILES_FASCIST_JAPAN_PUPPET:0"Exilés fascistes - Marionnette japonaise"
 RULE_OPTION_EXILES_FASCIST_JAPAN_PUPPET_SOV_AI_DESC:0"Le @SOVIA soviétique expulsera les communistes par la guerre civile, établira un §Lfasciste§ ! gouvernement avec le soutien du @JAPJaponais, et rester une fidèle marionnette du @JAPJaponais."
 RULE_EXILES_FASCIST_JAPAN_PUPPET_REBEL:0"Exilés fascistes - Marionnette rebelle"
 RULE_OPTION_EXILES_FASCIST_JAPAN_PUPPET_REBEL_SOV_AI_DESC:0"Le @SOVIA soviétique expulsera les communistes par la guerre civile et établira un §Lfasciste§ ! gouvernement avec le soutien du @JAPJaponais. Mais il déclarera son indépendance du @JAPJapon dans les années 1940"
 RULE_OPTION_RIGHT_COUP_ALWAYS:0"Staline a toujours été tué"
 RULE_OPTION_RIGHT_COUP_ALWAYS_AI_DESC:0"Staline est tué avant de pouvoir mobiliser les forces armées, et l'opposition prend le pouvoir sans guerre civile.\n§YIl faut une voie d'opposition de droite pour avoir un quelconque effet§!"
 RULE_OPTION_ALWAYS_UNION:0"Toujours"
 RULE_OPTION_ALWAYS_UNION_FRA_AI_DESC:0"La @FRA@ENGUnion franco-britannique formera toujours\n§Yexige que @FRAFrance capitule dans la même faction que @ENGBritain§!"
 RULE_OPTION_ALWAYS_DENY_FRA_AI_DESC:0"La @FRAFrançaise niera toujours que le @GERAllemagne remilitarise la Rhénanie. (cela mène généralement à la guerre)"
 RULE_OPTION_RIGHT_COUP_NEVER:0"Staline n'a jamais tué"
 RULE_OPTION_RIGHT_COUP_NEVER_AI_DESC:0"Staline ne peut pas être tué avant d'avoir pu mobiliser les forces armées, et la guerre civile commencera toujours.\n§YIl faut une voie d'opposition de droite pour avoir un effet§!"
 RULE_OPTION_NEVER_UNION:0"Jamais"
 RULE_OPTION_NEVER_UNION_FRA_AI_DESC:0"La @FRA@ENGFranco British Union ne se formera jamais."
 RULE_OPTION_NEVER_DENY_FRA_AI_DESC:0"La @FRAFrançaise ne niera jamais que l’@GERAllemagne remilitarise la Rhénanie."
 RULE_OPTION_NEVER_DENY_AUS_AI_DESC:0"Les @AUSAutrichiens ne refuseront jamais à l'@GERAllemagne l'Anschluss."
 RULE_OPTION_ALWAYS_DENY_AUS_AI_DESC:0"Les @AUSAutrichiens refuseront toujours à @GERAllemagne l'Anchluss. (cela mène généralement à la guerre)"
 RULE_OPTION_FASCIST_LIVONIA:0"Axe fasciste - Livonie"
 RULE_OPTION_FASCIST_LIVONIA_2:0"Fasciste - Expansion livonienne"
 RULE_OPTION_FASCIST_COMMONWEALTH:0"Axe fasciste - Commonwealth"
 RULE_OPTION_FASCIST_MEMEL:0"Fasciste - Soutenez la Pologne"
 RULE_FASCIST_MEMEL_LIT_AI_DESC:0"L'IA @LITLituanienne organisera les partisans d'Iron Wolf et créera un §Lfasciste§ ! gouvernement. L'IA rejettera alors l'Axe et soutiendra les Phalangistes en @POLPologne."
 RULE_FASCIST_LIVONIA_2_LIT_AI_DESC:0"L'IA @LITLituanienne organisera les partisans d'Iron Wolf et créera un §Lfasciste§ ! gouvernement. L'IA rejettera alors l'Axe et commencera les invasions des @LAT@ESTÉtats Baltiques et de la @POLPologne."
 RULE_FASCIST_LIT_AI_DESC:0"L'IA @LITLituanienne organisera les partisans d'Iron Wolf et créera un §Lfasciste§ ! gouvernement. L’IA tentera alors de rejoindre l’Axe et de former le Grand Commonwealth lituanien. »
 RULE_FASCIST_LIVONIA_LIT_AI_DESC:0"L'IA @LITLituanienne organisera les partisans d'Iron Wolf et créera un §Lfasciste§ ! gouvernement. L'IA tentera alors de rejoindre l'Axe et de former la Livonie en prenant le contrôle des autres @LAT@ESTÉtats baltes."
 RULE_FASCIST_EST_AI_DESC:0"L'@ESTIA estonienne demandera aux Vaps d'établir un §Lfasciste§ ! gouvernement, et rejoindra ensuite l'Axe.
 RULE_COMMUNIST_BALTIC_AI_DESC:0"L'IA tentera d'établir un §Rcommuniste§! régime, mais rejettera le soutien du @SOVsoviétique."
 RULE_OPTION_COMMUNIST_UNITED_BALTIC:0"Communiste - Pays Baltes Unis"
 RULE_COMMUNIST_UNITED_BALTIC_AI_DESC:0"L'IA tentera d'établir un §Rcommuniste§! régime, mais rejettera le soutien de @SOVsoviétique, incitant à des révolutions dans les @LIT@LAT@ESTÉtats baltes pour former la République populaire balte unie.
 RULE_OPTION_COMMUNIST_BELARUS:0"Communiste - Unification biélorusse"
 RULE_COMMUNIST_BELARUS_BALTIC_AI_DESC:0"L'IA tentera d'établir un §Rcommuniste§! régime, mais rejettera le soutien du @SOVsoviétique, provoquant une révolution en @BLRBiélorussie et annexant le @LIT@LAT@ESTÉtats baltes pour former la République unie balte-biélorussie.
 RULE_OPTION_ETH_HISTORICAL:0"Société des Nations - Historique"
 RULE_HISTORICAL_ETH_AI_DESC:0"L'@ETHIA éthiopienne tentera de vaincre l'@ITAItalie en utilisant la Ligue des nations, et si cela échoue, elle tentera de s'exiler. Par la suite, elle tentera de récupérer son territoire d’origine et de reconstruire l’@ETHEthiopie. L’IA ne tentera pas d’influencer les nations africaines. §YEL'Éthiopie peut encore être annexée si @ITAL'Italie les bat rapidement !§!"
 RULE_OPTION_LEAVE_PAN_AFRICAN:0"Société des Nations - Libérer l'Afrique"
 RULE_ETH_LEAVE_PAN_AFRICAN_AI_DESC:0"L'@ETHIA éthiopienne tentera de vaincre l'@ITAItalie en utilisant la Ligue des nations, et si cela échoue, elle tentera de s'exiler. Par la suite, elle tentera de récupérer son territoire d’origine et de reconstruire l’@ETHEthiopie. L'IA attaquera les puissances coloniales pour libérer l'Afrique en fin de partie. §YEL'Éthiopie peut encore être annexée si @ITAL'Italie les bat rapidement !§!"
 RULE_OPTION_LEAVE_AFRICAN_UNION:0"Société des Nations - Union Africaine"
 RULE_ETH_LEAVE_AFRICAN_UNION_AI_DESC:0"L'@ETHIA éthiopienne tentera de vaincre l'@ITAItalie en utilisant la Ligue des nations, et si cela échoue, elle tentera de s'exiler. Par la suite, elle tentera de récupérer son territoire d’origine et de reconstruire l’@ETHEthiopie. L’IA augmentera la résistance et stimulera le gain d’autonomie dans les pays africains pour libérer l’Afrique en fin de partie. §YEL'Éthiopie peut encore être annexée si @ITAL'Italie les bat rapidement !§!"
 RULE_OPTION_LEAVE_FEDERAL_AFRICAN_UNION:0"Société des Nations - Union Fédérale"
 RULE_ETH_LEAVE_FEDERAL_AFRICAN_UNION_AI_DESC:0"L'@ETHIA éthiopienne tentera de vaincre l'@ITAItalie en utilisant la Ligue des nations, et si cela échoue, elle tentera de s'exiler. Par la suite, il tentera de récupérer son territoire d'origine et de reconstruire l'@ETHEthiopie, en formant une union fédérale et en accordant l'autonomie au Mekwanint. L’IA augmentera la résistance et stimulera le gain d’autonomie dans les pays africains pour libérer l’Afrique en fin de partie. §YEL'Éthiopie peut encore être annexée si @ITAL'Italie les bat rapidement !§!"
 RULE_OPTION_ETH_IMPERIAL_JAH:0"Impérial - Empire Rastafari"
 RULE_ETH_IMPERIAL_JAH_AI_DESC:0"L'@ETHIA éthiopienne tentera de vaincre l'Italie seule, sans obtenir l'aide de la Société des Nations. Par la suite, il tentera d’étendre son empire en exigeant que les nations caribéennes se soumettent. »
 RULE_OPTION_ETH_IMPERIAL_SOLOMON:0"Impérial - Héritier de Salomon"
 RULE_ETH_IMPERIAL_SOLOMON_AI_DESC:0"L'@ETHIA éthiopienne tentera de vaincre l'Italie seule, sans obtenir l'aide de la Société des Nations. Par la suite, il tentera d’étendre son empire en exigeant la terre sainte en Palestine. »
 RULE_OPTION_ETH_IMPERIAL_PAN_AFRICAN:0"Impérial - Libérer l'Afrique"
 RULE_ETH_IMPERIAL_PAN_AFRICAN_AI_DESC:0"L'@ETHIA éthiopienne tentera de vaincre l'Italie seule, sans obtenir l'aide de la Société des Nations. Par la suite, il tentera d’étendre son empire en attaquant les puissances coloniales pour libérer l’Afrique. »
 RULE_OPTION_ETH_IMPERIAL_AFRICAN_UNION:0"Impériale - Union Africaine"
 RULE_ETH_IMPERIAL_AFRICAN_UNION_AI_DESC:0"L'@ETHIA éthiopienne tentera de vaincre l'Italie seule, sans obtenir l'aide de la Société des Nations. Par la suite, il tentera d’étendre son empire en augmentant la résistance et en favorisant les gains d’autonomie dans les pays africains pour libérer l’Afrique. »
 RULE_OPTION_ETH_IMPERIAL_AFRICAN_UNION_FEDERAL:0"Impérial - Union Fédérale"
 RULE_ETH_IMPERIAL_AFRICAN_UNION_FEDERAL_AI_DESC:0"L'@ETHIA éthiopienne tentera de vaincre l'Italie seule, sans obtenir l'aide de la Société des Nations. Il formera par la suite une union fédérale en accordant l'autonomie au Mekwanint. L’IA tentera plus tard d’étendre son empire en augmentant la résistance et en favorisant les gains d’autonomie dans les pays africains pour libérer l’Afrique. »
 RULE_OPTION_ETH_STALINIST_desc:0"L'IA tentera de transformer @ETHEthiopie §Rcommuniste§ ! et obtenir le soutien de l'@SOVUnion Soviétique, la transformant en une marionnette stalinienne."
 RULE_OPTION_ETH_STALINIST:0"Staliniste - Marionnette Soviétique"
 RULE_OPTION_ETH_STALINIST_REBEL_desc:0"L'IA tentera de transformer @ETHEthiopie §Rcommuniste§ ! et obtenir le soutien de l'@SOVUnion Soviétique, la transformant en une marionnette stalinienne, l'IA tentera plus tard de se libérer de l'influence du @SOVSoviétique."
 RULE_OPTION_ETH_STALINIST_REBEL:0"Stalinien - Indépendant"
 RULE_OPTION_ETH_ANARCHIST:0"Anarcho-communiste - Libérer l'Afrique"
 RULE_OPTION_ETH_ANARCHIST_desc:0"L'IA tentera de transformer @ETHEthiopie en §Ranarcho-communiste§ ! fédération avec le soutien d’anarchistes et de communistes du monde entier. L’IA tentera d’accroître la résistance et de stimuler les gains d’autonomie dans les pays africains pour libérer l’Afrique et le Moyen-Orient. »
 RULE_OPTION_ETH_ANARCHIST_ALT:0"Communiste Indépendant - Libérez l'Afrique"
 RULE_OPTION_ETH_ANARCHIST_ALT_desc:0"L'IA tentera de transformer @ETHEthiopie en §Rcommuniste§ ! fédération avec le soutien d’anarchistes et de communistes du monde entier. L’IA tentera d’accroître la résistance et de stimuler le gain d’autonomie dans les pays africains pour libérer l’Afrique. »
 RULE_OPTION_ETH_COLLABORATIONIST:0"Déclarer pour l'Italie - Sujet Fidèle"
 RULE_OPTION_ETH_COLLABORATIONIST_desc:0"L'IA poignardera Haile Selassie dans le dos et se rangera du côté des @ITAItaliens, faisant de @ETHEthiopie un §Lfasciste§ ! fantoche."
 RULE_OPTION_ETH_INDEPENDENT_FASCIST:0"Déclarer pour l'Italie - Guerre d'Indépendance"
 RULE_OPTION_ETH_INDEPENDENT_FASCIST_desc:0"L'IA poignardera Haile Selassie dans le dos et se rangera du côté des @ITAItaliens, faisant de @ETHEthiopie un §Lfasciste§ ! fantoche. Cependant, il tentera de se libérer et de devenir un §Lfasciste§ indépendant ! nation."
 RULE_OPTION_DEFAULT_ETH_HOST_AI_DESC:0"L'IA @ETHEthiopienne choisira un hôte aléatoire pour tenter de l'influencer au début du jeu, le @ENGRoyaume-Uni étant la cible la plus probable. §YCela ne prendra effet que si Hailé Sélassié part parler à la Société des Nations, et que le pays hôte cible accepte !§!"
 RULE_OPTION_ENG_SOMALIA:0"@ENGRoyaume-Uni - Protégez la Somalie"
 RULE_ENG_SOMALIA_ETH_AI_DESC:0"L'@ETHIA éthiopienne tentera d'amener le @ENGRoyaume-Uni à les accueillir en exil et demandera éventuellement le contrôle de l'Érythrée et de la Somalie une fois le continent repris. §YCela ne prendra effet que si Hailé Sélassié part parler à la Société des Nations, et que le pays hôte cible accepte !§!"
 RULE_OPTION_ENG_PALESTINE:0"@ENGRoyaume-Uni - Empire Salomon"
 RULE_ENG_PALESTINE_ETH_AI_DESC:0"L'@ETHIA éthiopienne tentera d'amener le @ENGRoyaume-Uni à les accueillir en exil et demandera éventuellement le contrôle de l'Érythrée et de la Palestine une fois le continent repris. C’est un comportement historique. §YCela ne prendra effet que si Hailé Sélassié part parler à la Société des Nations, et que le pays hôte cible accepte !§!"
 RULE_OPTION_SWE_NEUTRAL:0"@SWESuède - Restez neutre"
 RULE_SWE_NEUTRAL_ETH_AI_DESC:0"L'@ETHIA éthiopienne tentera d'amener @SWESweden à les héberger en exil, mais ne demandera pas à @SWESweden de se joindre à la guerre contre @ITAItalie. L'IA @ETHEthiopienne rejoindra probablement une faction en guerre avec @ITAItaly. §YCela ne prendra effet que si Hailé Sélassié part parler à la Société des Nations, et que le pays hôte cible accepte !§!"
 RULE_OPTION_SWE_ALLIES_ETH:0"@SWESuède - Rejoignez la guerre"
 RULE_SWE_ALLIES_ETH_AI_DESC:0"L'@ETHIA éthiopienne tentera d'amener @SWESweden à les accueillir en exil et demandera à @SWESweden de se joindre à la guerre contre @ITAItalie. L'@ETHEthiopian AI et @SWESweden rejoindront probablement une faction en guerre avec @ITAItaly. §YCela ne prendra effet que si Hailé Sélassié part parler à la Société des Nations, et que le pays hôte cible accepte !§!"
 RULE_OPTION_JAP_ISLAND:0"@JAPJapon - Îles du Pacifique"
 RULE_JAP_ISLAND_ETH_AI_DESC:0"L'IA @ETHEthiopienne tentera de convaincre @JAPJapan de les héberger en exil et demandera le contrôle d'une île du Pacifique comme nouvelle base pour @ETHEthiopie, devenant ainsi une marionnette @JAPjaponaise. §YCela ne prendra effet que si Hailé Sélassié part parler à la Société des Nations, et que le pays hôte cible accepte !§!"
 RULE_OPTION_JAP_ARABIA:0"@JAPJapon - Base arabe"
 RULE_JAP_ARABIA_ETH_AI_DESC:0"L'@ETHIA éthiopienne tentera d'amener @JAPJapan à les héberger en exil, et demandera à @JAPJapan d'occuper le @ENGle territoire arabe britannique pour servir de base d'opérations à @ETHEthiopie pour reprendre le continent. L'IA appellera probablement @JAPJapan à faire la guerre à @ITAItalie. §YCela ne prendra effet que si Hailé Sélassié part parler à la Société des Nations, et que le pays hôte cible accepte !§!"
 RULE_OPTION_GER_MEDIATE:0"@GERAllemagne - Paix médiatisée"
 RULE_GER_MEDIATE_ETH_AI_DESC:0"L'@ETHIA éthiopienne tentera d'amener l'@GERAllemagne à les accueillir en exil et demandera à l'@GERAllemagne de servir de médiateur pour un accord de paix entre l'@ETHÉthiopie et l'@ITAItalie. §YCela ne prendra effet que si Hailé Sélassié part parler à la Société des Nations, et que le pays hôte cible accepte !§!"
 RULE_OPTION_GER_SABOTAGE:0"@GERAllemagne - Relations sabotage"
 RULE_GER_SABOTAGE_ETH_AI_DESC:0"L'@ETHIA éthiopienne tentera d'amener l'@GERAllemagne à les accueillir en exil, et tentera de saboter les relations entre l'@GERAllemagne et l'@ITAItalie, créant finalement une opération sous fausse bannière pour entraîner les deux grandes puissances dans une guerre l'une contre l'autre. §YCela ne prendra effet que si Hailé Sélassié part parler à la Société des Nations, et que le pays hôte cible accepte !§!"
 RULE_HISTORICAL_AFA_AI_DESC:0"@AFAAfar suivra son comportement historique et aura de grandes chances de se soumettre aux @ITAItalians."
 RULE_OPTION_SUBMIT:0"Soumettre à l'Italie"
 RULE_SUBMIT_AFA_AI_DESC:0"L'@AFAAfar se soumettra toujours à l'@ITAItalie lorsqu'elle demandera l'annexion."
 RULE_OPTION_FIGHT_ITA:0"Refuser l'annexion"
 RULE_FIGHT_ITA_AFA_AI_DESC:0"L'@AFAAfar ne se soumettra jamais à l'@ITAItalie lorsqu'elle demandera l'annexion."
 RULE_OPTION_FIGHT_ETH:0"Nier l'annexion - Attaquer l'Éthiopie"
 RULE_FIGHT_ETH_AFA_AI_DESC:0"L'@AFAAfar ne se soumettra jamais à l'@ITAItalie lorsqu'elle demandera l'annexion. S'ils survivent, ils tenteront de revendiquer l'@ETHl'empire éthiopien pour eux-mêmes."
 RULE_HISTORICAL_SWI_AI_DESC:0"@SWISwitzerland restera totalement neutre, tout en renforçant ses milices et ses fortifications en prévision de toute attaque. Ils pourraient apporter un certain soutien aux alliés vers la fin de la guerre, en fonction des circonstances mondiales. »
 RULE_NEUTRALITY_ALTERNATE_SWI_AI_DESC:0"@SWISwitzerland restera totalement neutre, mais conclura des accords sur le commerce des civils et de l'or avec les deux parties à la guerre, permettant aux alliés et à l'axe d'accéder au marché suisse.
 RULE_OPTION_NEUTRALITY_MARTIAL_LAW:0"Neutralité - Loi martiale"
 RULE_NEUTRALITY_MARTIAL_LAW_SWI_AI_DESC:0"Pour tenter de lutter contre l'ingérence étrangère, @SWISwitzerland déclarera la loi martiale et installera un État policier tout en renforçant ses milices et ses fortifications en prévision de toute attaque. Ils pourraient apporter un certain soutien à l’axe vers la fin de la guerre, en fonction des circonstances mondiales. »
 RULE_OPTION_NEUTRALITY_PRO_ALLIES:0"Neutralité - Soutenir les Alliés"
 RULE_NEUTRALITY_PRO_ALLIES_SWI_AI_DESC:0"@SWISuisse restera globalement neutre, mais prendra des orientations et des décisions qui favorisent la §Cdémocratique§ ! pouvoirs, il y a un risque que §Lfasciste§! les puissances peuvent interpréter cela comme une violation de la neutralité. »
 RULE_OPTION_NEUTRALITY_PRO_AXIS:0"Neutralité - Axe de soutien"
 RULE_NEUTRALITY_PRO_AXIS_SWI_AI_DESC:0"@SWISuisse restera globalement neutre, mais prendra des orientations et des décisions qui favorisent §Lfasciste§ ! pouvoirs, Il y a un risque que §Cdémocratique§! les puissances peuvent interpréter cela comme une violation de la neutralité. »
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC:0"Rejoignez les alliés"
 RULE_OPTION_SWI_ALLIED_DEMOCRATIC_AI_DESC:0"L'IA armera @SWISuisse et préparera la guerre, alignant @SWISuisse sur la §Cdémocratique§ ! puissances du monde, rompant finalement la neutralité en faveur des Alliés. »
 RULE_OPTION_SWI_SECRET_ALLIES:0"Pacte secret avec les Alliés"
 RULE_OPTION_SWI_SECRET_ALLIES_AI_DESC:0"L'IA armera @SWISuisse et préparera la guerre, alignant @SWISuisse sur la §Cdémocratique§ ! puissances du monde, mais en maintenant une apparence de neutralité. @SWILa Suisse soutiendra secrètement les puissances alliées avec des espions et un soutien industriel, et ne rejoindra la guerre que si §Cdémocratique§ ! contrôle les pouvoirs @ITARome, @FRAParis ou @GERBerlin."
 RULE_OPTION_SWI_FRENCH_PUPPET:0"Marionnette française"
 RULE_SWI_FRENCH_PUPPET_SWI_AI_DESC:0"@SWISuisse conclura des accords commerciaux avec les puissances alliées, devenant finalement une marionnette de @FRAFrance et déclarant la deuxième République helvétique"
 RULE_OPTION_SWI_FRENCH_PUPPET_ALPINE:0"Marionnette Française - Confédération Alpine"
 RULE_SWI_FRENCH_PUPPET_ALPINE_SWI_AI_DESC:0"@SWISwitzerland conclura des accords commerciaux avec les puissances alliées, devenant finalement une marionnette de @FRAFrance et déclarant la deuxième République helvétique. L'IA tentera de s'emparer des territoires alpins et de créer la Confédération alpine."
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC:0"Démocratie expansionniste"
 RULE_OPTION_SWI_EXPANSIONIST_DEMOCRATIC_AI_DESC:0"L'IA restera §Cdémocratique§!, et tentera de convaincre les États autour de @SWISuisse de rejoindre la confédération, et armera le pays en prévision du refus des propriétaires de ces États de laisser leurs États libres.
 RULE_OPTION_SWI_EXPANSIONIST_NE:0"Expansionniste - Entente Neutre"
 RULE_OPTION_SWI_EXPANSIONIST_NE_AI_DESC:0"L'IA restera §Cdémocratique§!, et tentera de convaincre les États autour de @SWISuisse de rejoindre la confédération, et armera le pays en prévision du refus des propriétaires de ces États de laisser leurs États libres. En plus de cela, l’IA tentera de former une faction avec d’autres pays neutres en Europe. »
 RULE_OPTION_SWI_EXPANSIONIST_COMMUNIST:0"Communisme expansionniste"
 RULE_OPTION_SWI_EXPANSIONIST_COMMUNIST_AI_DESC:0"L'IA se tournera lentement vers les §Rcommunistes§!, et tentera de convaincre les États autour de @SWISuisse de rejoindre l'union populaire, et armera le pays en prévision du refus des propriétaires de ces États de laisser leurs États être libres.
 RULE_OPTION_SWI_AP_DEMOCRATIC:0"Confédération alpine du Saint-Gothard"
 RULE_OPTION_SWI_AP_DEMOCRATIC_AI_DESC:0"L'@SWISwiss AI tentera d'abandonner la neutralité au profit d'un régime militariste et expansionniste dirigé par le §Cdémocratique§ ! aile du Gotthardbund. L'IA tentera de former la Confédération alpine et pourrait déclarer la guerre aux pays voisins pour ce territoire. »
 RULE_OPTION_SWI_AP_NE:0"Gotthardbund - Entente Neutre"
 RULE_OPTION_SWI_AP_NE_AI_DESC:0"L'@SWISwiss AI tentera d'abandonner la neutralité au profit d'un régime militariste et expansionniste dirigé par le §Cdémocratique§ ! aile du Gotthardbund. L’IA tentera de former la Confédération alpine et tentera de former une faction avec d’autres pays neutres en Europe. »
 RULE_OPTION_SWI_VORARLBERG:0"Presse pour le Vorarlberg"
 RULE_OPTION_SWI_VORARLBERG_AI_DESC:0"L'@SWISwiss AI tentera d'abandonner la neutralité et exigera que l'@AUSAutriche lui cède l'État du Vorarlberg, retardant ainsi l'Anchluss. L’IA n’exigera plus rien de ses voisins. »
 RULE_OPTION_SWI_VORARLBERG_NE:0"Presse pour le Vorarlberg - Entente Neutre"
 RULE_OPTION_SWI_VORARLBERG_NE_AI_DESC:0"L'IA @SWISuisse restera §Cdémocratique§!, mais tentera d'abandonner la neutralité et exigera que l'@AUSAutriche lui cède l'État du Vorarlberg, retardant ainsi l'Anchluss. L'IA ne fera plus d'exigences à ses voisins mais tentera de former une faction avec d'autres pays neutres en Europe.
 RULE_OPTION_SWI_IMPERIAL:0"Ligue Impériale du Saint-Gothard"
 RULE_OPTION_SWI_IMPERIAL_AI_DESC:1"L'@SWISwiss AI tentera d'abandonner la neutralité et la démocratie en faveur d'un régime militariste et expansionniste dirigé par les membres du Gotthardbund. L'IA tentera de former un protectorat alpin et pourrait déclarer la guerre aux pays voisins pour ce territoire. »
 RULE_OPTION_SWI_AP_COMMUNIST:0"Union populaire du Saint-Gothard"
 RULE_OPTION_SWI_AP_COMMUNIST_AI_DESC:1"L'@SWISwiss AI tentera d'abandonner la neutralité et la démocratie au profit d'un régime militariste et expansionniste dirigé par le §Rcommuniste§ ! aile du Gotthardbund. L'IA tentera de former l'Union alpine et pourrait déclarer la guerre aux pays voisins pour ce territoire. »
 RULE_OPTION_SWI_FASCIST:0"Fasciste - Neutralité"
 RULE_OPTION_SWI_FASCIST_AI_DESC:0"L'IA amènera la @SWISuisse à s'aligner sur l'@GERAllemagne et à transformer lentement le pays en §Lfasciste§!, pour finalement promouvoir Robert Tobler. L'IA tentera d'éviter de rejoindre l'Axe, mais il existe un risque que les pouvoirs démocratiques interprètent cela comme une violation de la neutralité et forcent @SWISwitzerland à entrer sans précaution dans l'Axe.
 RULE_OPTION_SWI_FASCIST_AXIS_AI_DESC:0"L'IA amènera le @SWI la Suisse à s'aligner sur le @GER l'Allemagne et à transformer lentement le pays §Lfasciste§!, pour finalement promouvoir Robert Tobler et s'allier avec l'Axe.
 RULE_OPTION_SWI_FASCIST_PUPPET:0"Fasciste - Marionnette de l'Axe"
 RULE_OPTION_SWI_FASCIST_PUPPET_AI_DESC:0"L'IA amènera la @SWISuisse à s'aligner sur l'@GERAllemagne et à transformer lentement le pays §Lfasciste§!, pour finalement promouvoir Rolf Henne et devenir une marionnette du §Lfasciste§ le plus proche ! pouvoir."
 RULE_OPTION_SWI_FASCIST_PUPPET_ALPINE:0"Fasciste - Axis Puppet Alpine"
 RULE_OPTION_SWI_FASCIST_PUPPET_ALPINE_AI_DESC:0"L'IA amènera la @SWISuisse à s'aligner sur l'@GERAllemagne et à transformer lentement le pays en fasciste, pour finalement promouvoir Rolf Henne et devenir une marionnette du §Lfasciste§ le plus proche ! pouvoir. L’IA demandera le contrôle des territoires alpins et, si elle y parvient, formera la Suprématie alpine. »
 RULE_GROUP_GENERAL_UI:0"interface utilisateur"
