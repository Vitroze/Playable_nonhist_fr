 RULE_OPTION_DEN_MONARCHIST_NEU_AI_DESC:0"La droite renversera le gouvernement, laissant le roi Christian X au pouvoir. Le roi maintiendra la politique de neutralité du @DENDanemark et ne s'immiscera pas dans les affaires mondiales. »
 RULE_OPTION_DEN_MONARCHIST_ALLIANCE_ENG:0"Monarchiste - Rejoignez le Royaume-Uni"
 RULE_OPTION_DEN_MONARCHIST_ALLIANCE_ENG_AI_DESC:0"La droite renversera le gouvernement en laissant au pouvoir le roi Christian X, qui tentera de former une alliance avec le @ENGRoyaume-Uni. §RRemarque :§!Le @ENGRoyaume-Uni ne doit pas être §RCommuniste§!"
 RULE_OPTION_DEN_MONARCHIST_ALLIANCE_NORD:0"Monarchiste - Ligue Nordique"
 RULE_OPTION_DEN_MONARCHIST_ALLIANCE_NORD_AI_DESC:0"La droite renversera le gouvernement, laissant au pouvoir le roi Christian X, qui tentera de former une alliance avec les @SWE@NOR@FIN@ICEpays nordiques. §RRemarque :§!L'IA §YONIQUEMENT§! allié §gnon-aligné§! pays."
 RULE_OPTION_DEN_MONARCHIST_ALLIANCE_ROYAL:0"Monarchiste - Alliance Royale"
 RULE_OPTION_DEN_MONARCHIST_ALLIANCE_ROYAL_AI_DESC:0"La droite renversera le gouvernement en laissant au pouvoir le roi Christian X, qui tentera de former une alliance avec une @ENG@FRA@GER@SOVEuropean Major. §RRemarque :§!L'IA §YONIQUEMENT§! allié §0monarchiste§! pays."
 RULE_OPTION_DEN_MONARCHIST_NEU_EXP:0"Monarchiste - Marionnette Nordique"
 RULE_OPTION_DEN_MONARCHIST_NEU_EXP_AI_DESC:0"La droite renversera le gouvernement, laissant au pouvoir le roi Christian X, qui tentera d'influencer et de manipuler diplomatiquement @NOR@SWE@ICENordic et @LIT@LAT@ESTBaltic."
 RULE_OPTION_DEN_MONARCHIST_DIPLO_NORD:0"Diplo monarchiste - Union de Kalmar"
 RULE_OPTION_DEN_MONARCHIST_DIPLO_NORD_AI_DESC:0"La droite renversera le gouvernement, laissant au pouvoir le roi Christian X, qui tentera d’influencer et de manipuler diplomatiquement @NOR@SWE@ICENordic et @LIT@LAT@ESTBaltic. L'IA tentera d'annexer @NORNorvège et @SWESweden, formant ainsi l'@DEN@NOR@SWEUnion de Kalmar."
 RULE_OPTION_DEN_MONARCHIST_DIPLO_BALTIC:0"Diplo monarchiste - Dominion balte"
 RULE_OPTION_DEN_MONARCHIST_DIPLO_BALTIC_AI_DESC:0"La droite renversera le gouvernement, laissant au pouvoir le roi Christian X, qui tentera d'influencer et de manipuler diplomatiquement les pays @NOR@SWE@ICENordiques. L'IA tentera d'annexer la @NORNorvège et la @SWESuède, formant l'@DEN@NOR@SWEUnion de Kalmar, et lancera des campagnes de guerre pour sécuriser la @FINFinlande et la @EST@LAT@LIT@POLmer Baltique."
 RULE_OPTION_DEN_MONARCHIST_DIPLO_GER:0"Diplo monarchiste - Vengeance 1864"
 RULE_OPTION_DEN_MONARCHIST_DIPLO_GER_AI_DESC:0"La droite renversera le gouvernement, laissant au pouvoir le roi Christian X, qui tentera d'influencer et de manipuler diplomatiquement les pays @NOR@SWE@ICENordiques. L'IA tentera d'annexer @NORNorvège et @SWESweden, formant l'@DEN@NOR@SWEKalmar Union, et lancera des campagnes de guerre pour sécuriser @FINFinlande avant de déclarer la guerre à @GERAllemagne pour venger les résultats de la Seconde Guerre du Schleswig.
