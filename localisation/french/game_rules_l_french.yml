 RULE_OPTION_FIN_FASCIST_COUP_AXIS_DESC:"La @FINDroite finlandaise, dirigée par le §LPMouvement populaire patriotique§!, organisera un coup d'État contre le gouvernement avant de rejoindre l'Axe en 1939."
