 RULE_OPTION_HISTORICAL_LUX_NA_INT_AI_DESC:"Lors des élections de 1937, la §Chambre de Nassau§! prendront le pouvoir au @LUXLuxembourg mais ne se concentreront pas sur la neutralité, les laissant plus ouverts aux affaires mondiales. »
