 RULE_DEMOCRATIC_ALTERNATE_FRA_AI_DESC:1"L'IA @FRAFrançaise tentera de rester §Cdémocratique§ ! pour former la Petite Entente pour contenir l'Allemagne. Si @CZE Tchécoslovaquie crée cette faction, elle la rejoindra à la place (DLC "Mort ou déshonneur" requis)."
 RULE_DEMOCRATIC_STRESA_FRONT_FRA_AI_DESC:1"L'IA @FRAFrançaise tentera de rester §Cdémocratique§ ! former le Front de Stresa avec l'@ITAItalie en échange de concessions territoriales, et tenter de convaincre le @ENGRoyaume-Uni d'accepter les deux chez les alliés."
 RULE_DEMOCRATIC_FRANCO_SOVIET_TREATY_FRA_AI_DESC:1"L'IA @FRAFrançaise restera §Cdémocratique§ ! et tenter de créer un traité de garanties mutuelles avec l'@SOVUnion soviétique."
 RULE_OPTION_COMMUNIST_FRA_AI_DESC:0"La @FRAIA française va tenter de devenir §Rcommuniste§ ! et rejoignez le Komintern en parcourant les branches pertinentes de l'arbre des priorités nationales.
 RULE_OPTION_COMMUNIST_ANTIFA_FRA_AI_DESC:0"La @FRAIA française va tenter de devenir §Rcommuniste§ ! et créez une coalition antifasciste avec les §Rcommunistes§ proches ! et §Cdémocratique§! pays"
 RULE_OPTION_COMMUNIST_REVOLUTIONARY_FRA_AI_DESC:0"La @FRAIA française va tenter de devenir §Rcommuniste§ ! et susciter des révolutions dans les pays européens.
 RULE_OPTION_DEMOCRATIC_HISTORICAL_FRA_AI_DESC:0"L'IA @FRAFrançaise restera §Cdémocratique§ ! et tenter de suivre autant que possible la chaîne historique des événements. »
 RULE_FASCIST_FRA_AI_DESC:0"La @FRAIA française va tenter de devenir §Lfasciste§ ! et faites cause commune avec un §Lfasciste§ ! @GERAllemagne, en suivant le chemin pertinent dans l'arbre des priorités nationales."
 RULE_FASCIST_LATIN_ENTENTE_FRA_AI_DESC:0"La @FRAIA française va tenter de devenir §Lfasciste§ ! et créer une Entente latine avec @SPRSpain, @PORPortugal et @ITAItaly pour s'opposer à la fois à @GERAllemagne et à @ENGBritain"
 RULE_OPTION_BALKAN_DOMINANCE_ROM_AI_DESC:0"L’IA @ROMRoumaine conservera le règne royal du roi Carol et tentera éventuellement d’établir la suprématie sur ses voisins des Balkans. »
 RULE_OPTION_STANDARD_ROM_AI_DESC:0"L'IA @ROMRoumanie peut changer de camp dans les guerres majeures de fin de partie, c'est le comportement standard."
 RULE_OPTION_LOYAL_ROM_AI_DESC:0"L'IA @ROMRoumanie n'échangera pas de camp en utilisant son arbre de focus et ses décisions."
 RULE_OPTION_DEMOCRATIC_ROM_AI_DESC:0"L'@ROMIA roumaine tentera de réformer le pays pour en faire une §Cdémocratie§ fonctionnelle ! et s'allier avec d'autres grandes puissances démocratiques.\n§YLa Roumanie peut changer de camp dans les guerres majeures de fin de partie à moins que la règle du jeu ne soit désactivée.§!"
 RULE_OPTION_SANITAIRE_ROM_AI_DESC:0"L'@ROMIA roumaine tentera de réformer le pays pour en faire une §Cdémocratie§ fonctionnelle ! et allié avec @POLPoland, relançant le concept Between the Seas."
 RULE_COMMUNIST_ROM_AI_DESC:0"L'@ROMIA roumaine va tenter de nouer une alliance avec un §Rcommuniste§ majeur ! pouvoir.\n§YLa Roumanie peut changer de camp dans les guerres majeures de fin de partie à moins que la règle du jeu ne soit désactivée.§!"
 RULE_OPTION_COMMUNIST_YUG_AI_DESC:0"@YUGYougoslavie reconnaîtra l'@SOVUnion soviétique et en recevra une aide économique, plus tard §Rabolir la monarchie§ ! et rejoindre le Komintern."
 RULE_OPTION_COMMUNIST_NEUTRAL_YUG_AI_DESC:0"@YUGYougoslavie reconnaîtra l'@SOVUnion soviétique et en recevra une aide économique, plus tard §Rabolir la monarchie§!. L’IA ne rejoindra pas le Komintern et ne créera aucune faction. »
 RULE_OPTION_COMMUNIST_SLAVIC_YUG_AI_DESC:0"@YUGYougoslavie reconnaîtra l'@SOVUnion soviétique et abolira la monarchie, formant la §RSRépublique fédérale socialiste§!. L'IA tentera de promouvoir le communisme en @BULBulgarie et en @ALBAlbanie et formera une faction avec eux."
 RULE_OPTION_COMMUNIST_BALKAN_YUG_AI_DESC:0"@YUGYougoslavie reconnaîtra l'@SOVUnion soviétique et abolira la monarchie, formant la §RSRépublique fédérale socialiste§!. L'IA tentera de promouvoir le communisme dans les @BUL@ALB@ROM@GRE@HUNBalkans et de former une alliance avec autant de pays communistes des Balkans que possible."
 RULE_HISTORICAL_YUG_AI_DESC:0"La @YUGYougoslavie suivra la chaîne historique des événements, en restant neutre, mais tentera ensuite de signer le Pacte tripartite en 1941, si le @ENGRoyaume-Uni (ou une autre grande puissance §Cdémocratique§!) nie cela, alors la @YUGYougoslavie reculera et rejoindra les Alliés en 1942."
 RULE_BIGGER_NEUTRAL_YUG_AI_DESC:0"@YUGYougoslavia suivra la chaîne historique des événements, en restant neutre, mais ne tentera pas de signer le Pacte tripartite ni de rejoindre les Alliés, et essaiera de rester aussi neutre que possible.
 RULE_SMALLER_NEUTRAL_YUG_AI_DESC:0"@YUGYougoslavie cédera la Slovénie et la Macédoine à ses voisins, évitant ainsi les différends sur ces territoires. L’IA ne tentera pas de signer le Pacte Tripartite ni de rejoindre les Alliés, et tentera de rester aussi neutre que possible. »
 RULE_SPLIT_U_NEUTRAL_YUG_AI_DESC:0"@YUGYougoslavie divisera le pays en territoires plus petits. L’IA ne tentera pas de signer le Pacte Tripartite ni de rejoindre les Alliés et tentera de rester aussi neutre que possible. L’IA réunira les royaumes des Balkans en fin de partie. »
 RULE_SPLIT_I_NEUTRAL_YUG_AI_DESC:0"@YUGYougoslavie divisera le pays en territoires plus petits. L’IA ne tentera pas de signer le Pacte Tripartite ni de rejoindre les Alliés et tentera de rester aussi neutre que possible. L'IA libérera les royaumes des Balkans en fin de partie, ne laissant que @SERSerbie"
 RULE_SPLIT_I_NEUTRAL_LEAGUE_YUG_AI_DESC:0"@YUGYougoslavie divisera le pays en territoires plus petits. L’IA ne tentera pas de signer le Pacte Tripartite ni de rejoindre les Alliés et tentera de rester aussi neutre que possible. L'IA libérera les royaumes des Balkans en fin de partie, formant avec eux la faction de la Ligue de défense des Balkans.
 RULE_BIGGER_ALLIES_YUG_AI_DESC:0"@YUGYougoslavie tentera de rejoindre les Alliés en 1940 tout en se reformant lentement en une §Cdémocratie§!."
 RULE_SMALLER_ALLIES_YUG_AI_DESC:0"@YUGYougoslavie cédera la Slovénie et la Macédoine à ses voisins, évitant ainsi les différends sur ces territoires. Ensuite, l'IA tentera de rejoindre les Alliés en 1940 tout en se reformant lentement en une §Cdémocratie§!."
 RULE_SPLIT_U_ALLIES_YUG_AI_DESC:0"@YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de rejoindre les Alliés en 1940 tout en se reformant lentement en une §Cdémocratie§ ! et réunifier les royaumes des Balkans en fin de partie. »
 RULE_SPLIT_I_ALLIES_YUG_AI_DESC:0"@YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de rejoindre les Alliés en 1940 tout en se reformant lentement en une §Cdémocratie§ ! et libérer les royaumes des Balkans en fin de partie, ne laissant que @SERSerbie"
 RULE_BIGGER_ALLIANCE_YUG_AI_DESC:0"@YUGYougoslavie tentera de former un mariage royal et une alliance avec un pouvoir monarchiste en 1940. »
 RULE_SMALLER_ALLIANCE_YUG_AI_DESC:0"@YUGYougoslavie cédera la Slovénie et la Macédoine à ses voisins, évitant ainsi les différends sur ces territoires. Ensuite, l’IA tentera de nouer un mariage royal et une alliance avec un pouvoir monarchiste en 1940. »
 RULE_SPLIT_U_ALLIANCE_YUG_AI_DESC:0"@YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l’IA tentera de former un mariage royal et une alliance avec une puissance monarchiste en 1940, et de réunifier les royaumes des Balkans en fin de partie. »
 RULE_SPLIT_I_ALLIANCE_YUG_AI_DESC:0"@YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de former un mariage royal et une alliance avec une puissance monarchiste en 1940, et de libérer les royaumes des Balkans en fin de partie, ne laissant que @SERSerbie.
 RULE_BIGGER_AXIS_YUG_AI_DESC:0"@YUGYougoslavie tentera de rejoindre l'Axe en 1940 tout en se reformant lentement en une §Ldictature fasciste§!."
 RULE_BIGGER_AXIS_EXPANSION_YUG_AI_DESC:0"@YUGYougoslavie tentera d'échanger Zara contre son adhésion à la faction de @ITAItalie (ou l'Axe) en 1940 tout en se reformant lentement en une §Ldictature fasciste§!. L'IA tentera de revendiquer et d'annexer la @BULBulgarie."
 RULE_SMALLER_AXIS_YUG_AI_DESC:0"@YUGYougoslavie cédera la Slovénie et la Macédoine à ses voisins, évitant ainsi les différends sur ces territoires. Ensuite, l'IA tentera de rejoindre l'Axe en 1940 tout en se reformant lentement en une §Ldictature fasciste§!."
 RULE_SPLIT_U_AXIS_YUG_AI_DESC:0"@YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de rejoindre l'Axe en 1940 tout en se reformant lentement en une §Ldictature fasciste§ ! et réunifier les royaumes des Balkans en fin de partie. »
 RULE_SPLIT_U_AXIS_EXPANSION_YUG_AI_DESC:0"@YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera d'échanger Zara contre une adhésion à la faction de l'ITAItalie (ou l'Axe) en 1940, tout en se reformant lentement en une §Ldictature fasciste§!. L'IA tentera de revendiquer et de manipuler la @BULBulgarie, et de réunir les royaumes des Balkans en fin de partie."
 RULE_SPLIT_I_AXIS_YUG_AI_DESC:0"@YUGYougoslavie divisera le pays en territoires plus petits. Ensuite, l'IA tentera de rejoindre l'Axe en 1940 tout en se reformant lentement en une §Ldictature fasciste§ ! et libérer les royaumes des Balkans en fin de partie, ne laissant que @SERSerbie"
 RULE_OPTION_DEMOCRATIC_CZE_AI_DESC:0"L'IA @CZETchécoslovaque tentera de rester §Cdémocratique§ ! et se concentrer principalement sur son développement interne en empruntant les chemins pertinents de l'arbre des priorités nationales.
 RULE_OPTION_COMMUNIST_CZE_AI_DESC:0"L'IA @CZETchécoslovaque tentera de réformer le pays vers le §Rcommunisme§ ! et conclure une alliance avec le @SOVUnion soviétique ou une autre grande nation communiste.
 RULE_OPTION_DEMOCRATIC_ALTERNATE_CZE_AI_DESC:0"L'IA @CZETchécoslovaque tentera de former sa propre faction pour se défendre tout en restant §Cdémocratique§!, en empruntant les voies pertinentes de l'arbre des priorités nationales."
 RULE_FASCIST_PARTNER_CZE_AI_DESC:0"L'IA @CZETchécoslovaque tentera de transformer le pays en §Lfasciste§ ! et entrez dans un partenariat égal avec @GERAllemagne"
 RULE_FASCIST_ALLY_CZE_AI_DESC:0"L'IA @CZETchécoslovaque tentera de transformer le pays en §Lfasciste§ ! et concluez un accord fantoche avec @GERAllemagne."
 RULE_FASCIST_PUPPET_CZE_AI_DESC:0"L'IA @CZETchécoslovaque tentera de transformer le pays en §Lfasciste§ ! et livrez les Studeten à @GERAllemagne."
 RULE_HISTORICAL_CZE_AI_DESC:0"L'IA @CZETchécoslovaque suivra autant que possible la chaîne historique des événements."
 RULE_FASCIST_ROM_AI_DESC:0"L'@ROMIA roumaine tentera de §Lsuivre l'historique§ ! et rejoignez l'Axe.\on§PYLa Roumanie peut changer de camp dans les guerres majeures de fin de partie à moins que la règle du jeu ne soit désactivée.§!"
 RULE_FASCIST_ALTERNATE_ROM_AI_DESC:0"L'@ROMIA roumaine tentera de former un §Lclérical fasciste§ ! état sous Codreanu ou Goga, et tentera de rejoindre l'Axe.\n§YLa Roumanie peut changer de camp dans les guerres majeures de fin de partie à moins que la règle du jeu ne soit désactivée.§!"
 RULE_OPTION_COMMUNIST_AST_AI_DESC:0"L'@ASTIA australienne tentera de transformer le pays en §Rcommuniste§ ! et allié avec le Komintern. Il exigera que le gouvernement de @NZLNouvelle-Zélande se soumette à la volonté du peuple. »
 RULE_COMMUNIST_ALTERNATE_AST_AI_DESC:0"L'@ASTIA australienne tentera de transformer le pays en §Rcommuniste§ ! et s'isoler du monde. Il exigera que le gouvernement de @NZLNouvelle-Zélande se remette de la volonté du peuple et qu'il s'attaque finalement à la menace @JAPjaponaise."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_AST_AI_DESC:0"L’@ASTIA australienne restera §Cdémocratique§ ! et tenter de suivre la chaîne historique des événements et des décisions dans l'arbre des priorités nationales.
 RULE_DEMOCRATIC_ALTERNATE_AST_AI_DESC:0"L'@ASTIA australienne tentera d'obtenir une totale indépendance du @ENGRoyaume-Uni tout en restant §Cdémocratique§ ! et allié des @USAÉtats-Unis, il proposera de protéger les @INSIndes orientales si les @HOLPays-Bas capitulent."
 RULE_FASCIST_AST_AI_DESC:0"L'@ASTIA australienne tentera de devenir §Lfasciste§!, de lancer un coup d'État aux @INSIndes orientales et de s'allier avec le @JAPJapon."
 RULE_FASCIST_ALTERNATE_AST_AI_DESC:0"L'@ASTIA australienne tentera de devenir §Lfasciste§!, de lancer un coup d'État aux @INSIndes orientales, puis de devenir isolationniste. Finalement exigeant @NZLNew Zealand."
 RULE_OPTION_COMMUNIST_CAN_AI_DESC:0"L'IA @CANCanadienne tentera de devenir §Rcommuniste§ ! et rejoignez le Komintern."
 RULE_OPTION_COMMUNIST_ALTERNATE_CAN_AI_DESC:0"L'IA @CANCanadienne tentera de devenir §Rcommuniste§ ! et s'isoler, en soutenant les travailleurs du monde entier dans leurs luttes. »
 RULE_OPTION_COMMUNIST_TROTSKYITE_CAN_AI_DESC:0"L'IA @CANCanadienne tentera de devenir §Rcommuniste§ ! et embrassez les trotskistes, déclarant finalement la guerre pour libérer les États-Unis en fin de partie. (la plupart du temps, ça ne se passe jamais bien)"
 RULE_OPTION_DEMOCRATIC_HISTORICAL_CAN_AI_DESC:0"L'IA @CANCanadienne restera §Cdémocratique§ ! et tenter de suivre la chaîne historique des événements et des décisions dans l'arbre des priorités nationales.
 RULE_DEMOCRATIC_ALTERNATE_CAN_AI_DESC:0"L'IA @CANCanadienne restera §Cdémocratique§ ! et tenter d'obtenir une indépendance totale et de créer une alliance avec les @USAUnited States, en empruntant la voie appropriée dans l'arbre des priorités nationales.
 RULE_FASCIST_CAN_AI_DESC:0"L'IA @CANCanadienne tentera de devenir §Lfasciste§ ! et alliez-vous à @GERAllemagne en suivant le chemin pertinent dans l'arbre des priorités nationales.
 RULE_FASCIST_ALTERNATE_CAN_AI_DESC:0"L'IA @CANCanadienne tentera de devenir §Lfasciste§ ! et soutenez les synarchistes du @MEXMexique pour attaquer les @USAÉtats-Unis des deux côtés dès 1939. »
 RULE_OPTION_COMMUNIST_ALTERNATE_SAF_AI_DESC:0"L'@SAFIA sud-africaine tentera de devenir §Rcommuniste§ ! et libérer les peuples d'Afrique de la domination coloniale, en suivant la voie pertinente de l'arbre des priorités nationales.
 RULE_OPTION_COMMUNIST_SAF_AI_DESC:0"L'@SAFIA sud-africaine tentera de devenir §Rcommuniste§ ! et rejoignez le Komintern, il peut exiger Madagascar de la @FRAFrance, mais ne déclenchera pas de guerre."
 RULE_OPTION_DEMOCRATIC_HISTORICAL_SAF_AI_DESC:0"L’@SAFIA sud-africaine restera §Cdémocratique§ ! et suivre le plan historique autant que possible.
 RULE_DEMOCRATIC_ALTERNATE_SAF_AI_DESC:0"L'@SAFIA sud-africaine tentera de rester §Cdémocratique§ ! et jouer un rôle plus affirmé dans la relation avec la mère patrie, en suivant la voie appropriée dans l'arbre des priorités nationales.
 RULE_FASCIST_SAF_AI_DESC:0"L'@SAFIA sud-africaine tentera de devenir §Lfasciste§ ! et parvenir à un accord avec @GERAllemagne, en suivant le chemin approprié dans l'arbre des priorités nationales.
 RULE_FASCIST_ALTERNATE_SAF_AI_DESC:0"L'@SAFIA sud-africaine tentera de devenir §Lfasciste§ ! et restera indépendant, il finira par déclarer la guerre aux colonies britanniques au nom du roi Édouard."
 RULE_OPTION_COMMUNIST_NZL_AI_DESC:0"L'IA @NZLNew Zealand tentera de devenir §Rcommuniste§ ! et rejoignez le Komintern en suivant la voie appropriée dans l'arbre des priorités nationales.
 RULE_OPTION_DEMOCRATIC_HISTORICAL_NZL_AI_DESC:0"L'IA @NZLNew Zealand restera §Cdémocratique§ ! et tenter de suivre autant que possible la chaîne historique des événements. »
 RULE_DEMOCRATIC_ALTERNATE_NZL_AI_DESC:0"L'IA @NZLNew Zealand tentera de rester §Cdémocratique§ ! et établir la pleine souveraineté en suivant la voie appropriée dans l'arbre des priorités nationales.
 RULE_FASCIST_NZL_AI_DESC:0"L'IA @NZLNew Zealand tentera de devenir §Lfasciste§ ! et alliez-vous à @JAPJapan en empruntant le chemin pertinent dans l'arbre des priorités nationales.
 RULE_OPTION_COMMUNIST_RAJ_AI_DESC:0"Le @RAJIndian AI tentera de gagner son indépendance en §se ralliant à l'@SOVUnion soviétique§!, en empruntant la voie pertinente dans l'arbre des priorités nationales.
