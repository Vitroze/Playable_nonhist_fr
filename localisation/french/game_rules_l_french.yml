  RULE_OPTION_SWE_MONARCHIST_FIN_ASSERTIVE_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, §0le roi Gustaf V§! réprimera les opportunistes fascistes et assumera le rôle qu'un roi devrait avoir. Le nouveau gouvernement demandera d'abord les Åland à @FINla Finlande, tout en rejoignant leur côté pendant la guerre d'hiver. Si elles acceptent, @SWElà Suède formera une faction de défense finno-suédoise avec elles. L'IA demandera Bornholm à @DENle Danemark et Narvik à @NORla Norvège."
  RULE_OPTION_SWE_MONARCHIST_FIN_ANTI_SOV: "Monarchiste - Défense finlandaise agressive"
  RULE_OPTION_SWE_MONARCHIST_FIN_ANTI_SOV_DESC: "Avec des craintes suscitées d'une résurgence de l'influence bolchevique, §0le roi Gustaf V§! réprimera les opportunistes fascistes et assumera le rôle qu'un roi devrait avoir. Le nouveau gouvernement demandera d'abord les Åland à @FINla Finlande, tout en rejoignant leur côté pendant la guerre d'hiver. Si elles acceptent, @SWElà Suède formera une faction de défense finno-suédoise avec elles. L'IA demandera des territoires et la soumission de @DENle Danemark et @NORla Norvège, allant jusqu'à tenter de former det Stornordiska Riket. @SWElà Suède déclarera une croisade anti-bolchevique en 1941, entraînant @FINla Finlande dans la guerre avec eux."
  RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL: "Conseil de défense nordique centralisé"
  RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_DESC: "Les élections @SWEsuédoises de 1936 auront lieu avec la victoire d'un parti §Cdémocratique§! aléatoire, l'IA prendra un rôle plus actif dans la défense de la Scandinavie en tentant de former le @SWE@NOR@DEN@FINConseil de défense nordique pour protéger les §Cdémocratiques§! et §gnon-alignés§! Nordiques en les transformant en États fantoches."
  RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_EXP: "Conseil centralisé assertif"
  RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_COUNCIL_EXP_DESC: "Les élections @SWEsuédoises de 1936 auront lieu avec la victoire d'un parti §Cdémocratique§! aléatoire, l'IA prendra un rôle plus actif dans la défense de la Scandinavie en rejoignant d'abord la guerre d'hiver du côté de @FINla Finlande puis en tentant de former le @SWE@NOR@DEN@FINConseil de défense nordique pour protéger les §Cdémocratiques§! et §gnon-alignés§! Nordiques en les transformant en États fantoches. L'IA commencera des guerres en fin de partie contre @ENG l'Angleterre, @GER l'Allemagne, ou @SOV la Russie si elles ne sont pas §Cdémocratiques§!."
  RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION: "Conseil nordique décentralisé"
  RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION_DESC: "Les élections @SWEsuédoises de 1936 auront lieu avec la victoire d'un parti §Cdémocratique§! aléatoire, l'IA prendra un rôle plus actif dans la défense de la Scandinavie en tentant de former le @SWE@NOR@DEN@FINConseil de défense nordique pour protéger les §Cdémocratiques§! et §gnon-alignés§! Nordiques en s'alliant avec eux. L'IA se concentrera sur le bien-être et la stabilité plutôt que sur le renforcement militaire."
  RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION_EXP: "Conseil nordique décentralisé Alt"
  RULE_OPTION_SWE_DEMOCRATIC_NORDIC_DEFENCE_FACTION_EXP_DESC: "Les élections @SWEsuédoises de 1936 auront lieu avec la victoire d'un parti §Cdémocratique§! aléatoire, l'IA prendra un rôle plus actif dans la défense de la Scandinavie en saisissant d'abord les Åland puis en tentant de former le @SWE@NOR@DEN@FINConseil de défense nordique pour protéger les §Cdémocratiques§! et §gnon-alignés§! Nordiques en s'alliant avec eux. L'IA se concentrera sur le renforcement militaire plutôt que sur le bien-être et la stabilité."
  RULE_OPTION_SWE_COMMUNIST_FLYG: "Socialisme de Flyg - Neutralité"
  RULE_OPTION_SWE_COMMUNIST_FLYG_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et le pro-allemand Nils Flyg deviendra Premier ministre. Flyg maintiendra son emprise sur le pouvoir, mais maintiendra la position neutre précédente de @SWElà Suède, à part l'embargo sur l'@SOVUnion soviétique et en penchant vers le commerce de l'Axe."
  RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS: "Socialisme de Flyg - Axe"
  RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et le pro-allemand Nils Flyg deviendra Premier ministre. Flyg maintiendra son emprise sur le pouvoir, et alignera @SWElà Suède avec @GERl'Allemagne. @SWElà Suède rejoindra soit l'Axe soit une autre faction §Rcommuniste§! non stalinienne en 1941."
  RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS_AGGR: "Socialisme de Flyg - Axe assertif"
  RULE_OPTION_SWE_COMMUNIST_FLYG_AXIS_AGGR_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et le pro-allemand Nils Flyg deviendra Premier ministre. Flyg maintiendra son emprise sur le pouvoir, et demandera les Åland à @FINla Finlande. @SWElà Suède rejoindra soit l'Axe soit une autre faction §Rcommuniste§! non stalinienne en 1940, et déclarera la guerre à @ENG l'Angleterre et à @SOVla Russie si elles sont soit staliniens soit non communistes peu après."
  RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC: "Socialisme de Flyg - Union nordique"
  RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et le pro-allemand Nils Flyg deviendra Premier ministre. Flyg maintiendra son emprise sur le pouvoir, et créera l'Union de défense scandinave en 1941, invitant les pays §Rcommunistes§! et §Cdémocratiques§! @NOR@DEN@ICE@FIN nordiques."
  RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC_AGGR: "Socialisme de Flyg - Union nordique assertive"
  RULE_OPTION_SWE_COMMUNIST_FLYG_NORDIC_AGGR_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et le pro-allemand Nils Flyg deviendra Premier ministre. Flyg maintiendra son emprise sur le pouvoir, et rejoindra la guerre d'hiver du côté de @FINla Finlande, tout en soutenant les révolutions en @NORla Norvège et @DENle Danemark. @SWElà Suède créera l'Union de défense scandinave en 1940, invitant les pays §Rcommunistes§! et §Cdémocratiques§! @NOR@DEN@ICE@FIN nordiques, et commencera bientôt des guerres avec @GERl'Allemagne, @ENG l'Angleterre et @SOVla Russie si elles ne sont pas staliniens elles-mêmes."
  RULE_OPTION_SWE_COMMUNIST_KILBOM: "Socialisme de Kilbom - Neutralité"
  RULE_OPTION_SWE_COMMUNIST_KILBOM_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt renversé par le pro-allié Karl Kilbom, qui maintiendra la position neutre précédente de @SWElà Suède, à part l'embargo sur @GERl'Allemagne et en penchant vers le commerce des Alliés."
  RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES: "Socialisme de Kilbom - Alliés"
  RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt renversé par le pro-allié Karl Kilbom, qui alignera @SWElà Suède avec le @ENG Royaume-Uni. @SWElà Suède rejoindra soit les Alliés soit une autre faction §Rcommuniste§! non stalinienne en 1941."
  RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES_AGGR: "Socialisme de Kilbom - Alliés assertifs"
  RULE_OPTION_SWE_COMMUNIST_KILBOM_ALLIES_AGGR_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt renversé par le pro-allié Karl Kilbom, qui demandera les Åland à @FINla Finlande. @SWElà Suède rejoindra soit les Alliés soit une autre faction §Rcommuniste§! non stalinienne en 1940, et déclarera la guerre à @GERl'Allemagne et à @SOVla Russie si elles sont soit staliniens soit non communistes peu après."
  RULE_OPTION_SWE_COMMUNIST_LINDEROT: "Socialisme de Linderot - Neutralité"
  RULE_OPTION_SWE_COMMUNIST_LINDEROT_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt renversé par le stalinien Sven Linderot, qui maintiendra la position neutre précédente de @SWElà Suède, à part l'embargo sur @GERl'Allemagne et en penchant vers le commerce du Komintern."
  RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN: "Socialisme de Linderot - Komintern"
  RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt renversé par le stalinien Sven Linderot, qui alignera @SWElà Suède avec l'@SOVUnion soviétique. @SWElà Suède rejoindra soit le Komintern soit une autre faction §Rcommuniste§! stalinienne en 1941."
  RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN_AGGR: "Socialisme de Linderot - Komintern assertif"
  RULE_OPTION_SWE_COMMUNIST_LINDEROT_COMINTERN_AGGR_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt renversé par le stalinien Sven Linderot, qui demandera les Åland à @FINla Finlande. @SWElà Suède rejoindra soit le Komintern soit une autre faction §Rcommuniste§! stalinienne en 1940, et déclarera la guerre à @GERl'Allemagne et @ENG l'Angleterre si elles ne sont pas staliniens elles-mêmes peu après."
  RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC: "Socialisme de Linderot - Union nordique"
  RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt renversé par le stalinien Sven Linderot, qui créera l'Union de défense scandinave en 1941, invitant les pays §Rcommunistes§! et §Cdémocratiques§! @NOR@DEN@ICE@FIN nordiques."
  RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC_AGGR: "Socialisme de Linderot - Union nordique assertive"
  RULE_OPTION_SWE_COMMUNIST_LINDEROT_NORDIC_AGGR_DESC: "Avec la radio @SWEsuédoise s'alignant avec les syndicats, le parti §Rsocialiste§! obtiendra suffisamment de sièges au Riksdag pour former une majorité et Nils Flyg deviendra Premier ministre. Flyg sera cependant bientôt renversé par le stalinien Sven Linderot, qui rejoindra la guerre d'hiver du côté de @FINla Finlande, tout en soutenant les révolutions en @NORla Norvège et @DENle Danemark. @SWElà Suède créera l'Union de défense scandinave en 1940, invitant les pays §Rcommunistes§! et §Cdémocratiques§! @NOR@DEN@ICE@FIN nordiques, et commencera bientôt des guerres avec @GERl'Allemagne, @ENG l'Angleterre et @SOVla Russie si elles ne sont pas staliniens elles-mêmes."
  RULE_OPTION_NOR_STALINIST: "Staliniste - Neutralité"
  RULE_OPTION_NOR_STALINIST_AI_DESC: "Le mouvement ouvrier @NORnorvégien augmentera la popularité du §Rcommunisme§!, tout en alignant la @NORNorvège sur l'Union soviétique de Staline, une révolution mettra le NKP au pouvoir, qui maintiendra la politique précédente du gouvernement de rester neutre dans les affaires mondiales sans rejoindre le Komintern."
  RULE_OPTION_NOR_STALINIST_EXP: "Staliniste - Libération de la Finlande"
  RULE_OPTION_NOR_STALINIST_EXP_AI_DESC: "Le mouvement ouvrier @NORnorvégien augmentera la popularité du §Rcommunisme§!, tout en alignant la @NORNorvège sur l'Union soviétique de Staline, une révolution mettra le NKP au pouvoir, qui commencera une guerre pour libérer la @FINFinlande de leurs oppresseurs capitalistes sans rejoindre le Komintern."
  RULE_OPTION_NOR_STALINIST_COMINTERN: "Staliniste - Komintern"
  RULE_OPTION_NOR_STALINIST_COMINTERN_AI_DESC: "Le mouvement ouvrier @NORnorvégien augmentera la popularité du §Rcommunisme§!, tout en alignant la @NORNorvège sur l'Union soviétique de Staline, une révolution mettra le NKP au pouvoir, qui demandera à rejoindre le Komintern, ou la plus grande faction stalinienne si Staline a été chassé de l'@SOVUnion soviétique."
  RULE_OPTION_NOR_STALINIST_COMINTERN_EXP: "Staliniste - Libération finlandaise du Komintern"
  RULE_OPTION_NOR_STALINIST_COMINTERN_EXP_AI_DESC: "Le mouvement ouvrier @NORnorvégien augmentera la popularité du §Rcommunisme§!, tout en alignant la @NORNorvège sur l'Union soviétique de Staline. Une révolution mettra le NKP au pouvoir, qui demandera à rejoindre le Komintern, ou la plus grande faction stalinienne si Staline a été chassé de l'@SOVUnion soviétique. L'IA commencera une guerre pour libérer la @FINFinlande de leurs oppresseurs capitalistes et l'entraînera dans le Komintern."
  RULE_OPTION_NOR_TROSTSKYIST: "Trotskyste - Neutralité"
  RULE_OPTION_NOR_TROSTSKYIST_AI_DESC: "Le mouvement ouvrier @NORnorvégien augmentera la popularité du §Rcommunisme§!, tout en gardant Lev Trotskij dans le pays et en rejetant la position stalinienne du NKP, une révolution mettra le Parti des travailleurs au pouvoir, qui maintiendra la politique précédente du gouvernement de rester neutre dans les affaires mondiales sans rejoindre ou créer une faction."
  RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL: "Trotskyste - Internationale"
  RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_AI_DESC: "Le mouvement ouvrier @NORnorvégien augmentera la popularité du §Rcommunisme§!, tout en gardant Lev Trotskij dans le pays et en rejetant la position stalinienne du NKP. Une révolution mettra le Parti des travailleurs au pouvoir, qui rejoindra d'autres factions §Rcommunistes§! non staliniens en Scandinavie ou en Europe, ou en créera une. L'IA garantira la @FINFinlande."
  RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_NORD: "Trotskyste - Internationale Scandinavie"
  RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_NORD_AI_DESC: "Le mouvement ouvrier @NORnorvégien augmentera la popularité du §Rcommunisme§!, tout en gardant Lev Trotskij dans le pays et en rejetant la position stalinienne du NKP. Une révolution mettra le Parti des travailleurs au pouvoir, qui rejoindra d'autres factions §Rcommunistes§! non staliniens en Scandinavie ou en Europe, ou en créera une. L'IA garantira ensuite la @FINFinlande, et commencera des guerres expansionnistes contre le @DEN Danemark et la @SWElà Suède."
  RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_SOV: "Trotskyste - Internationale soviétique"
  RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_SOV_AI_DESC: "Le mouvement ouvrier @NORnorvégien augmentera la popularité du §Rcommunisme§!, tout en gardant Lev Trotskij dans le pays et en rejetant la position stalinienne du NKP. Une révolution mettra le Parti des travailleurs au pouvoir, qui rejoindra d'autres factions §Rcommunistes§! non staliniens en Scandinavie ou en Europe, ou en créera une. L'IA garantira ensuite la @FINFinlande, et commencera des guerres expansionnistes contre le @DEN Danemark et la @SWElà Suède, avant d'attaquer l'@SOVUnion soviétique en 1941 (si elles ne sont pas alliées)."
  RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_GER: "Trotskyste - Internationale allemande"
  RULE_OPTION_NOR_TROSTSKYIST_INTERNATIONAL_GER_AI_DESC: "Le mouvement ouvrier @NORnorvégien augmentera la popularité du §Rcommunisme§!, tout en gardant Lev Trotskij dans le pays et en rejetant la position stalinienne du NKP. Une révolution mettra le Parti des travailleurs au pouvoir, qui rejoindra d'autres factions §Rcommunistes§! non staliniens en Scandinavie ou en Europe, ou en créera une. L'IA garantira ensuite la @FINFinlande, et commencera des guerres expansionnistes contre le @DEN Danemark et la @SWElà Suède, avant d'attaquer l'@GERAllemagne en 1941 (si elles ne sont pas alliées)."
  RULE_OPTION_NOR_FASCIST: "Samling de Quisling - Neutralité"
  RULE_OPTION_NOR_FASCIST_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Quisling dirigera son nouveau gouvernement, mais restera autrement neutre dans les affaires mondiales à moins d'être provoqué ou attaqué."
  RULE_OPTION_NOR_FASCIST_V_RU: "Samling de Quisling - Bjarmeland"
  RULE_OPTION_NOR_FASCIST_V_RU_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Quisling dirigera son nouveau gouvernement, et tentera de réformer l'Empire norvégien en faisant des demandes aux autres pays @SWE@DEN nordiques. Faire éventuellement des revendications et des demandes sur le nord-ouest de la Russie auprès de l'@SOVUnion soviétique en 1941."
  RULE_OPTION_NOR_FASCIST_V_UK: "Samling de Quisling - Bretland"
  RULE_OPTION_NOR_FASCIST_V_UK_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Quisling dirigera son nouveau gouvernement, et tentera de réformer l'Empire norvégien en faisant des demandes aux autres pays @SWE@DEN nordiques. Faire éventuellement des revendications et des demandes sur l'@IREIrlande, @CANNewfoundland et @SCOÉcosse auprès du @ENG Royaume-Uni en 1941 et 1942."
  RULE_OPTION_NOR_FASCIST_AXIS: "Samling de Quisling - Axe"
  RULE_OPTION_NOR_FASCIST_AXIS_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Quisling dirigera son nouveau gouvernement, et demandera à rejoindre l'Axe."
  RULE_OPTION_NOR_FASCIST_AXIS_V_RU: "Samling de Quisling - Axe Bjarmeland"
  RULE_OPTION_NOR_FASCIST_AXIS_V_RU_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Quisling dirigera son nouveau gouvernement, et demandera à rejoindre l'Axe avant d'essayer de réformer l'Empire norvégien en faisant des demandes aux autres pays @SWE@DEN nordiques. Faire éventuellement des revendications et des demandes sur le nord-ouest de la Russie auprès de l'@SOVUnion soviétique en 1941."
  RULE_OPTION_NOR_FASCIST_AXIS_V_UK: "Samling de Quisling - Axe Bretland"
  RULE_OPTION_NOR_FASCIST_AXIS_V_UK_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Quisling dirigera son nouveau gouvernement, et demandera à rejoindre l'Axe avant d'essayer de réformer l'Empire norvégien en faisant des demandes aux autres pays @SWE@DEN nordiques. Faire éventuellement des revendications et des demandes sur l'@IREIrlande, @CANNewfoundland et @SCOÉcosse auprès du @ENG Royaume-Uni en 1941 et 1942."
  RULE_OPTION_NOR_FASCIST_AXIS_RK: "Reichskommissariat loyal"
  RULE_OPTION_NOR_FASCIST_AXIS_RK_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Josef Terboven dirigera ce nouveau gouvernement, et fera de la @NORNorvège une marionnette de l'Axe avant de remettre le leadership à l'officier SS Jonas Lie, qui transformera le pays en un Reichskommissariat plus fiable pour les puissances de l'Axe."
  RULE_OPTION_NOR_FASCIST_AXIS_PUPPET: "Reichskommissariat autonome"
  RULE_OPTION_NOR_FASCIST_AXIS_PUPPET_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Josef Terboven dirigera ce nouveau gouvernement, et fera de la @NORNorvège une marionnette de l'Axe avant de remettre le leadership à Vidkun Quisling, qui sera maintenant coincé à diriger un sujet de l'Axe au lieu d'un partenaire."
  RULE_OPTION_NOR_FASCIST_PAN_GERMANIC: "Samling de Quisling - Pan-germanique"
  RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Quisling dirigera son nouveau gouvernement, et créera sa propre faction pan-germanique, invitant tous les pays §Lfascistes§! et §gnon-alignés§! @GER@SWE@DEN@SWI@HOL@LUX@BEL@AUS germaniques qui ne sont pas déjà dans une faction."
  RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_RU: "Quisling - Pan-germanique Bjarmeland"
  RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_RU_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Quisling dirigera son nouveau gouvernement, et créera sa propre faction pan-germanique, invitant tous les pays §Lfascistes§! et §gnon-alignés§! @GER@SWE@DEN@SWI@HOL@LUX@BEL@AUS germaniques qui ne sont pas déjà dans une faction avant d'essayer de réformer l'Empire norvégien en faisant des demandes aux autres pays @SWE@DEN nordiques. Faire éventuellement des revendications et des demandes sur le nord-ouest de la Russie auprès de l'@SOVUnion soviétique en 1941."
  RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_UK: "Quisling - Pan-germanique Bretland"
  RULE_OPTION_NOR_FASCIST_PAN_GERMANIC_V_UK_AI_DESC: "Avec des luttes internes au Storting, l'influence du §LNasjonal Samling§! augmentera avec le temps en @NORNorvège, et aboutira éventuellement lorsque Vidkun Quisling marchera sur Oslo et lancera un coup d'État. Quisling dirigera son nouveau gouvernement, et créera sa propre faction pan-germanique, invitant tous les pays §Lfascistes§! et §gnon-alignés§! @GER@SWE@DEN@SWI@HOL@LUX@BEL@AUS germaniques qui ne sont pas déjà dans une faction avant d'essayer de réformer l'Empire norvégien en faisant des demandes aux autres pays @SWE@DEN nordiques. Faire éventuellement des revendications et des demandes sur l'@IREIrlande, @CANNewfoundland et @SCOÉcosse auprès du @ENG Royaume-Uni en 1941 et 1942."
  RULE_OPTION_DEMOCRATIC_ALT_NOR: "Conservateurs"
  RULE_DEMOCRATIC_ALT_NOR_AI_DESC: "Après un vote de défiance au Storting, le §CHøyre§! formera un nouveau gouvernement §Cconservateur§!, prenant une approche plus active de la défense de la @NORNorvège, et combattant l'influence communiste et fasciste."
  RULE_OPTION_DEMOCRATIC_ALLIES: "Conservateurs - Alliés"
  RULE_DEMOCRATIC_ALLIES_NOR_AI_DESC: "Après un vote de défiance au Storting, le §CHøyre§! formera un nouveau gouvernement §Cconservateur§!, prenant une approche plus active de la défense de la @NORNorvège, et combattant l'influence communiste et fasciste. La @NORNorvège tentera de rejoindre les Alliés en 1939."
  RULE_OPTION_DEMOCRATIC_ALLIES_EXP: "Conservateurs - Expansionnistes des Alliés"
  RULE_DEMOCRATIC_ALLIES_EXP_NOR_AI_DESC: "Après un vote de défiance au Storting, le §CHøyre§! formera un nouveau gouvernement §Cconservateur§!, prenant une approche plus active de la défense de la @NORNorvège, et combattant l'influence communiste et fasciste. La @NORNorvège tentera de rejoindre les Alliés en 1938 avant de commencer des campagnes agressives pour sécuriser le @DENDanemark et la @SWESuède."
  RULE_OPTION_DEMOCRATIC_NORDIC: "Conservateurs - Conseil nordique"
  RULE_DEMOCRATIC_NORDIC_NOR_AI_DESC: "Après un vote de défiance au Storting, le §CHøyre§! formera un nouveau gouvernement §Cconservateur§!, prenant une approche plus active de la défense de la @NORNorvège, et combattant l'influence communiste et fasciste. La @NORNorvège tentera de créer le Conseil nordique en 1939."
  RULE_OPTION_DEMOCRATIC_NORDIC_EXP: "Conservateurs - Conseil nordique expansionniste"
  RULE_DEMOCRATIC_NORDIC_EXP_NOR_AI_DESC: "Après un vote de défiance au Storting, le §CHøyre§! formera un nouveau gouvernement §Cconservateur§!, prenant une approche plus active de la défense de la @NORNorvège, et combattant l'influence communiste et fasciste. La @NORNorvège tentera de créer le Conseil nordique en 1939 avant de commencer des campagnes agressives pour sécuriser le @DENDanemark et la @SWESuède s'ils ne rejoignent pas. L'IA peut déclarer la guerre à l'@GERAllemagne en 1942 ou plus tard selon la situation mondiale."
  RULE_OPTION_NOR_MONARCHIST: "Royaume de Norvège"
  RULE_OPTION_NOR_MONARCHIST_AI_DESC: "Avec des luttes internes au Storting, le baron Wedel-Jarlsberg commencera à faire pression sur le roi Haakon VII pour démanteler le Storting et transformer la @NORNorvège en une monarchie oligarchique. Le prince Olav sera nommé commandant naval et la @NORNorvège rejoindra soit une faction monarchiste majeure soit en créera une propre, tout en exigeant les territoires coloniaux du @DENDanemark en @ICEIslande et @GRNGroenland."
  RULE_OPTION_NOR_MONARCHIST_NORD: "Empire norvégien"
  RULE_OPTION_NOR_MONARCHIST_NORD_AI_DESC: "Avec des luttes internes au Storting, le baron Wedel-Jarlsberg commencera à faire pression sur le roi Haakon VII pour démanteler le Storting et transformer la @NORNorvège en une monarchie oligarchique. Le prince Olav sera nommé commandant de l'armée et la @NORNorvège rejoindra soit une faction monarchiste majeure soit en créera une propre, tout en exigeant l'annexion du @DENDanemark et des territoires de la @SWESuède."
  RULE_OPTION_NOR_MONARCHIST_SOV: "Grand Empire norvégien"
  RULE_OPTION_NOR_MONARCHIST_SOV_AI_DESC: "Avec des luttes internes au Storting, le baron Wedel-Jarlsberg commencera à faire pression sur le roi Haakon VII pour démanteler le Storting et transformer la @NORNorvège en une monarchie oligarchique. Le prince Olav sera nommé commandant de l'armée et la @NORNorvège rejoindra soit une faction monarchiste majeure soit en créera une propre, tout en exigeant l'annexion du @DENDanemark et des territoires de la @SWESuède. L'IA exigera également des territoires de Bjarmeland auprès de l'@SOVUnion soviétique en 1941."
  RULE_OPTION_KOKOOMUS_HISTORICAL: "Kansalliset Puolueet - Historique"
  RULE_HISTORICAL_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale. L'IA aura une coopération militaire limitée avec l'@GERAllemagne pour récupérer les territoires perdus pendant la guerre d'hiver auprès des @SOVoviétiques s'ils commencent l'opération Barbarossa."
  RULE_OPTION_KOKOOMUS_ALTERNATE: "Kansalliset Puolueet - Alternatif"
  RULE_KOKOOMUS_ALTERNATE_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale. L'IA s'appuiera sur la coopération militaire avec l'@GERAllemagne dès qu'ils le pourront, et donnera la priorité à la construction de l'économie et de la situation politique plutôt qu'aux objectifs militaires."
  RULE_OPTION_KOKOOMUS_BALTIC: "Kansalliset Puolueet - Revendications baltes"
  RULE_KOKOOMUS_BALTIC_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale. La @FINFinlande tentera de parvenir à un accord pour fusionner avec l'@ESTEstonie et faire des revendications sur d'autres nations @LAT@LIT baltes. L'IA aura une coopération militaire limitée avec l'@GERAllemagne pour récupérer les territoires perdus pendant la guerre d'hiver auprès des @SOVoviétiques s'ils commencent l'opération Barbarossa."
  RULE_OPTION_KOKOOMUS_EXP: "Risto Ryti - Expansionnisme"
  RULE_KOKOOMUS_EXP_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale, mais en restant avec l'expansionniste Risto Ryti dans le Kansallinen Edistyspuolue. La @FINFinlande tentera de parvenir à un accord pour fusionner avec l'@ESTEstonie et faire des revendications sur d'autres nations @LAT@LIT baltes, et tentera également de créer un soulèvement en @KARCarélie pour provoquer une guerre expansionniste contre l'@SOVUnion soviétique. L'IA aura une coopération militaire limitée avec l'@GERAllemagne."
  RULE_OPTION_KOKOOMUS_ALLIES: "Kansalliset Puolueet - Alliés"
  RULE_KOKOOMUS_ALLIES_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques. L'IA tentera de rejoindre les Alliés dans les années 1940 - généralement après la fin de la guerre d'hiver."
  RULE_OPTION_KOKOOMUS_ALLIES_BALTIC: "Kansalliset Puolueet - Revendications baltes des Alliés"
  RULE_KOKOOMUS_ALLIES_BALTIC_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques. La @FINFinlande tentera de parvenir à un accord pour fusionner avec l'@ESTEstonie et faire des revendications sur d'autres nations @LAT@LIT baltes. L'IA tentera de rejoindre les Alliés dès qu'elle le pourra - une fois que la tension mondiale sera suffisamment élevée."
  RULE_OPTION_KOKOOMUS_ALLIES_EXP: "Risto Ryti - Expansionnisme des Alliés"
  RULE_KOKOOMUS_ALLIES_EXP_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale, mais en restant avec l'expansionniste Risto Ryti dans le Kansallinen Edistyspuolue. La @FINFinlande tentera de parvenir à un accord pour fusionner avec l'@ESTEstonie et faire des revendications sur d'autres nations @LAT@LIT baltes, et tentera également de créer un soulèvement en @KARCarélie pour provoquer une guerre expansionniste contre l'@SOVUnion soviétique. L'IA tentera de rejoindre les Alliés dès qu'elle le pourra - une fois que la tension mondiale sera suffisamment élevée."
  RULE_OPTION_KOKOOMUS_NORDIC: "Kansalliset Puolueet - Front nordique"
  RULE_KOKOOMUS_NORDIC_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques. L'IA tentera de créer le Front de défense nordique et d'inviter tous les autres pays §Rnon-communistes§! @FIN@DEN@NOR@SWE nordiques dans les années 1940 - généralement après la fin de la guerre d'hiver."
  RULE_OPTION_KOKOOMUS_NORDIC_BALTIC: "Kansalliset Puolueet - Revendications baltes nordiques"
  RULE_KOKOOMUS_NORDIC_BALTIC_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques. La @FINFinlande tentera de parvenir à un accord pour fusionner avec l'@ESTEstonie et faire des revendications sur d'autres nations @LAT@LIT baltes. L'IA tentera de créer le Front de défense nordique et d'inviter tous les autres pays §Rnon-communistes§! @FIN@DEN@NOR@SWE nordiques dès qu'elle le pourra - une fois que la tension mondiale sera suffisamment élevée."
  RULE_OPTION_KOKOOMUS_NORDIC_EXP: "Risto Ryti - Expansionnisme nordique"
  RULE_KOKOOMUS_NORDIC_EXP_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale, en passant par les partis politiques nationaux historiques et en restant neutre dans la guerre mondiale, mais en restant avec l'expansionniste Risto Ryti dans le Kansallinen Edistyspuolue. La @FINFinlande tentera de parvenir à un accord pour fusionner avec l'@ESTEstonie et faire des revendications sur d'autres nations @LAT@LIT baltes, et tentera également de créer un soulèvement en @KARCarélie pour provoquer une guerre expansionniste contre l'@SOVUnion soviétique. L'IA tentera de créer le Front de défense nordique et d'inviter tous les autres pays §Rnon-communistes§! @FIN@DEN@NOR@SWE nordiques dès qu'elle le pourra - une fois que la tension mondiale sera suffisamment élevée."
  RULE_OPTION_MONARCHIST: "Monarchie de Kokoomus"
  RULE_MONARCHIST_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale et restera neutre dans la guerre mondiale, mais en restant avec le conservateur Pehr Evind Svinhufvud dans le Kansallinen Kokoomus lui permet de couronner le prince allemand Wolfgang von Hesse comme roi. L'IA aura une coopération militaire limitée avec l'@GERAllemagne pour récupérer les territoires perdus pendant la guerre d'hiver auprès des @SOVoviétiques s'ils commencent l'opération Barbarossa."
  RULE_OPTION_MONARCHIST_EXP: "Monarchie de Kokoomus - Expansionnisme"
  RULE_MONARCHIST_EXP_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale et restera neutre dans la guerre mondiale, mais en restant avec le conservateur Pehr Evind Svinhufvud dans le Kansallinen Kokoomus lui permet de couronner le prince allemand Wolfgang von Hesse comme roi. La @FINFinlande tentera de parvenir à un accord pour fusionner avec l'@ESTEstonie et faire des revendications sur d'autres nations @LAT@LIT baltes, et tentera également de créer un soulèvement en @KARCarélie pour provoquer une guerre expansionniste contre l'@SOVUnion soviétique. L'IA aura une coopération militaire limitée avec l'@GERAllemagne pour récupérer les territoires perdus pendant la guerre d'hiver auprès des @SOVoviétiques s'ils commencent l'opération Barbarossa."
  RULE_OPTION_MONARCHIST_ALLIES: "Monarchie de Kokoomus - Alliés"
  RULE_MONARCHIST_ALLIES_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale et restera neutre dans la guerre mondiale, mais en restant avec le conservateur Pehr Evind Svinhufvud dans le Kansallinen Kokoomus lui permet de couronner le prince allemand Wolfgang von Hesse comme roi. L'IA tentera de rejoindre les Alliés dans les années 1940 - généralement après la fin de la guerre d'hiver."
  RULE_OPTION_MONARCHIST_ALLIES_EXP: "Monarchie de Kokoomus - Revendications baltes des Alliés"
  RULE_MONARCHIST_ALLIES_EXP_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale et restera neutre dans la guerre mondiale, mais en restant avec le conservateur Pehr Evind Svinhufvud dans le Kansallinen Kokoomus lui permet de couronner le prince allemand Wolfgang von Hesse comme roi. La @FINFinlande tentera de parvenir à un accord pour fusionner avec l'@ESTEstonie et faire des revendications sur d'autres nations @LAT@LIT baltes. L'IA tentera de rejoindre les Alliés dès qu'elle le pourra - une fois que la tension mondiale sera suffisamment élevée."
  RULE_OPTION_MONARCHIST_NORDIC: "Monarchie de Kokoomus - Front nordique"
  RULE_MONARCHIST_NORDIC_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale et restera neutre dans la guerre mondiale, mais en restant avec le conservateur Pehr Evind Svinhufvud dans le Kansallinen Kokoomus lui permet de couronner le prince allemand Wolfgang von Hesse comme roi. L'IA tentera de créer le Front de défense nordique et d'inviter tous les autres pays §Rnon-communistes§! @FIN@DEN@NOR@SWE nordiques dans les années 1940 - généralement après la fin de la guerre d'hiver."
  RULE_OPTION_MONARCHIST_NORDIC_EXP: "Monarchie de Kokoomus - Revendications baltes nordiques"
  RULE_MONARCHIST_NORDIC_EXP_FIN_AI_DESC: "La @FINFinlande maintiendra sa politique nationale et restera neutre dans la guerre mondiale, mais en restant avec le conservateur Pehr Evind Svinhufvud dans le Kansallinen Kokoomus lui permet de couronner le prince allemand Wolfgang von Hesse comme roi. L'IA tentera de créer le Front de défense nordique et d'inviter tous les autres pays §Rnon-communistes§! @FIN@DEN@NOR@SWE nordiques dès qu'elle le pourra - une fois que la tension mondiale sera suffisamment élevée."
  RULE_OPTION_DEN_HISTORICAL: "Sociaux-démocrates - Historique"
  RULE_HISTORICAL_DEN_AI_DESC: "Les sociaux-démocrates @DENDanois resteront au pouvoir et orienteront les dépenses gouvernementales vers le bien-être social. L'IA tentera de maintenir la neutralité. C'est la voie historique."
  RULE_OPTION_DEN_DEMOCRATIC_BALANCE: "Libéraux - Équilibre"
  RULE_DEMOCRATIC_BALANCE_DEN_AI_DESC: "Le parti §Clibéral§! @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers un équilibre entre le bien-être et le militaire. L'IA tentera de maintenir la neutralité."
  RULE_OPTION_DEMOCRATIC_REARM_NEUTRAL: "Libéraux - Réarmement"
  RULE_DEMOCRATIC_REARM_NEUTRAL_DEN_AI_DESC: "Le parti §Clibéral§! @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers le militaire et les fortifications. L'IA tentera de maintenir la neutralité."
  RULE_OPTION_DEMOCRATIC_REARM_ENG: "Conservateurs - Rejoindre le Royaume-Uni"
  RULE_DEMOCRATIC_REARM_ENG_DEN_AI_DESC: "Le parti §Cconservateur§! @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers le militaire et les fortifications. L'IA tentera de rejoindre la faction du @ENG Royaume-Uni. §RNote:§! Le @ENG Royaume-Uni ne doit pas être §Rcommuniste§! ou §Lfasciste§!"
  RULE_OPTION_DEMOCRATIC_REARM_EURO: "Conservateurs - Rejoindre les démocraties européennes"
  RULE_DEMOCRATIC_REARM_EURO_DEN_AI_DESC: "Le parti §Cconservateur§! @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers le militaire et les fortifications. L'IA tentera de rejoindre ou de créer une faction avec un @FRA@GER@SOV majeur européen. §RNote:§! Les options sont @FRAFrance (pas §Rcommuniste§! ou §Lfasciste§!), @GERAllemagne (pas §Rcommuniste§! ou §Lfasciste§!), ou @SOVRussie (doit être §0monarchiste§! ou §Ropposition de droite§!)."
  RULE_OPTION_DEMOCRATIC_REARM_NORD: "Conservateurs - Alliance nordique"
  RULE_DEMOCRATIC_REARM_NORD_DEN_AI_DESC: "Le parti §Cconservateur§! @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers le militaire et les fortifications. L'IA tentera de rejoindre ou de créer une faction avec les pays @SWE@NOR@FIN@ICE nordiques. §RNote:§! l'IA n'alliera pas les pays qui sont §Rcommunistes§!, §Lfascistes§! ou §0monarchistes§!."
  RULE_OPTION_FP_WELFARE: "Parti des agriculteurs - Bien-être"
  RULE_FP_WELFARE_DEN_AI_DESC: "Le parti des agriculteurs @DENDanois gagnera les élections après un vote de défiance et orientera les dépenses gouvernementales vers le bien-être social. L'IA tentera de maintenir la neutralité."
  RULE_OPTION_FP_BALANCE: "Parti des agriculteurs - Équilibre"
  RULE_FP_BALANCE_DEN_AI_DESC: "Le parti des agriculteurs @DENDanois gagnera les élections après un vote de défiance et orientera les dépenses gouvernementales vers un équilibre entre le bien-être et le militaire. L'IA tentera de maintenir la neutralité."
  RULE_OPTION_FP_REARM_GER: "Parti des agriculteurs - Rejoindre l'Allemagne"
  RULE_FP_REARM_GER_DEN_AI_DESC: "Le parti des agriculteurs @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers le militaire et les fortifications. L'IA tentera de rejoindre la faction de l'@GERAllemagne. §RNote:§! L'@GERAllemagne ne doit pas être §Rcommuniste§!."
  RULE_OPTION_FP_REARM_EURO: "Parti des agriculteurs - Rejoindre les puissances européennes"
  RULE_FP_REARM_EURO_DEN_AI_DESC: "Le parti des agriculteurs @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers le militaire et les fortifications. L'IA tentera de rejoindre ou de créer une faction avec un @ENG@FRA@SOV majeur européen. §RNote:§! Les options sont le @ENG Royaume-Uni, le @FRA France et le @SOV Russie, et ne doivent pas être §Rcommunistes§!."
  RULE_OPTION_FP_REARM_NORD: "Parti des agriculteurs - Alliance nordique"
  RULE_FP_REARM_NORD_DEN_AI_DESC: "Le parti des agriculteurs @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers le militaire et les fortifications. L'IA tentera de rejoindre ou de créer une faction avec les pays @SWE@NOR@FIN@ICE nordiques. §RNote:§! l'IA n'alliera pas les pays qui sont §Rcommunistes§!."
  RULE_OPTION_COMMUNIST_WELFARE: "Communistes - Bien-être"
  RULE_COMMUNIST_WELFARE_DEN_AI_DESC: "Le parti §Rcommuniste§! @DENDanois gagnera les élections après un vote de défiance et orientera les dépenses gouvernementales vers le bien-être social. L'IA tentera de maintenir la neutralité."
  RULE_OPTION_COMMUNIST_BALANCE: "Communistes - Équilibre"
  RULE_COMMUNIST_BALANCE_DEN_AI_DESC: "Le parti §Rcommuniste§! @DENDanois gagnera les élections après un vote de défiance et orientera les dépenses gouvernementales vers un équilibre entre le bien-être et le militaire. L'IA tentera de maintenir la neutralité."
  RULE_OPTION_COMMUNIST_REARM_SOV: "Communistes - Rejoindre les Soviétiques"
  RULE_COMMUNIST_REARM_SOV_DEN_AI_DESC: "Le parti §Rcommuniste§! @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers le militaire et les fortifications. L'IA tentera de rejoindre la faction de l'@SOVUnion soviétique. §RNote:§! Les @SOVoviétiques doivent être §Rcommunistes§!."
  RULE_OPTION_COMMUNIST_REARM_EURO: "Communistes - Internationale européenne"
  RULE_COMMUNIST_REARM_EURO_DEN_AI_DESC: "Le parti §Rcommuniste§! @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers le militaire et les fortifications. L'IA tentera de rejoindre ou de créer une faction avec un @ENG@FRA@GER majeur européen. §RNote:§! Les options sont le @ENG Royaume-Uni, le @FRA France et le @GER Allemagne, et doivent être §Rcommunistes§! et ne pas être dans une faction avec l'@SOVUnion soviétique."
  RULE_OPTION_COMMUNIST_REARM_NORD: "Communistes - Union nordique"
  RULE_COMMUNIST_REARM_NORD_DEN_AI_DESC: "Le parti §Rcommuniste§! @DENDanois gagnera les élections après un vote de défiance, et orientera les dépenses gouvernementales vers le militaire et les fortifications. L'IA tentera de rejoindre ou de créer une faction avec les pays @SWE@NOR@FIN@ICE nordiques. §RNote:§! l'IA n'alliera que les pays qui sont §Rcommunistes§!."
  RULE_OPTION_DEN_MONARCHIST_NEU: "Monarchiste - Neutralité"
  RULE_OPTION_DEN_MONARCHIST_NEU_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir. Le roi maintiendra la politique de neutralité du @DENDanemark, et n'interférera pas dans les affaires mondiales."
  RULE_OPTION_DEN_MONARCHIST_ALLIANCE_ENG: "Monarchiste - Rejoindre le Royaume-Uni"
  RULE_OPTION_DEN_MONARCHIST_ALLIANCE_ENG_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir, qui tentera de former une alliance avec le @ENG Royaume-Uni. §RNote:§! Le @ENG Royaume-Uni ne doit pas être §Rcommuniste§!."
  RULE_OPTION_DEN_MONARCHIST_ALLIANCE_NORD: "Monarchiste - Ligue nordique"
  RULE_OPTION_DEN_MONARCHIST_ALLIANCE_NORD_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir, qui tentera de former une alliance avec les pays @SWE@NOR@FIN@ICE nordiques. §RNote:§! L'IA n'alliera que les pays §gnon-alignés§!."
  RULE_OPTION_DEN_MONARCHIST_ALLIANCE_ROYAL: "Monarchiste - Alliance royale"
  RULE_OPTION_DEN_MONARCHIST_ALLIANCE_ROYAL_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir, qui tentera de former une alliance avec un @ENG@FRA@GER@SOV majeur européen. §RNote:§! L'IA n'alliera que les pays §0monarchistes§!."
  RULE_OPTION_DEN_MONARCHIST_NEU_EXP: "Monarchiste - Marionnettes nordiques"
  RULE_OPTION_DEN_MONARCHIST_NEU_EXP_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir, qui tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques et @LIT@LAT@EST baltes diplomatiquement."
  RULE_OPTION_DEN_MONARCHIST_DIPLO_NORD: "Monarchiste Diplo - Union de Kalmar"
  RULE_OPTION_DEN_MONARCHIST_DIPLO_NORD_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir, qui tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques et @LIT@LAT@EST baltes diplomatiquement. L'IA tentera d'annexer la @NORNorvège et la @SWESuède, formant l'@DEN@NOR@SWEUnion de Kalmar."
  RULE_OPTION_DEN_MONARCHIST_DIPLO_BALTIC: "Monarchiste Diplo - Dominion baltique"
  RULE_OPTION_DEN_MONARCHIST_DIPLO_BALTIC_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir, qui tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques diplomatiquement. L'IA tentera d'annexer la @NORNorvège et la @SWESuède, formant l'@DEN@NOR@SWEUnion de Kalmar, et commencera des campagnes de guerre pour sécuriser la @FINFinlande et la mer @EST@LAT@LIT@POLBaltique."
  RULE_OPTION_DEN_MONARCHIST_DIPLO_GER: "Monarchiste Diplo - Venger 1864"
  RULE_OPTION_DEN_MONARCHIST_DIPLO_GER_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir, qui tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques diplomatiquement. L'IA tentera d'annexer la @NORNorvège et la @SWESuède, formant l'@DEN@NOR@SWEUnion de Kalmar, et commencera des campagnes de guerre pour sécuriser la @FINFinlande avant de déclarer la guerre à l'@GERAllemagne pour venger les résultats de la Seconde Guerre de Schleswig."
  RULE_OPTION_DEN_MONARCHIST_EXP_NORD: "Expansionniste monarchiste - Union de Kalmar"
  RULE_OPTION_DEN_MONARCHIST_EXP_NORD_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir, qui tentera d'envahir et d'annexer les voisins @NOR@SWE nordiques et de transformer en marionnettes les pays @LIT@LAT@EST baltes diplomatiquement. L'IA tentera de former l'@DEN@NOR@SWEUnion de Kalmar."
  RULE_OPTION_DEN_MONARCHIST_EXP_BALTIC: "Expansionniste monarchiste - Dominion baltique"
  RULE_OPTION_DEN_MONARCHIST_EXP_BALTIC_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir, qui tentera d'envahir et d'annexer les pays @NOR@SWE nordiques. L'IA tentera de former l'@DEN@NOR@SWEUnion de Kalmar, et commencera des campagnes de guerre pour sécuriser la @FINFinlande et la mer @EST@LAT@LIT@POLBaltique."
  RULE_OPTION_DEN_MONARCHIST_EXP_GER: "Expansionniste monarchiste - Venger 1864"
  RULE_OPTION_DEN_MONARCHIST_EXP_GER_AI_DESC: "L'aile droite renversera le gouvernement, laissant le roi Christian X au pouvoir, qui tentera d'envahir et d'annexer les pays @NOR@SWE nordiques. L'IA tentera de former l'@DEN@NOR@SWEUnion de Kalmar, et commencera des campagnes de guerre pour sécuriser la @FINFinlande avant de déclarer la guerre à l'@GERAllemagne pour venger les résultats de la Seconde Guerre de Schleswig."
  RULE_OPTION_DEN_FASCIST_AXIS_NEU: "Fasciste de l'Axe"
  RULE_OPTION_DEN_FASCIST_AXIS_NEU_AI_DESC: "L'aile droite renversera le gouvernement avec le soutien de l'@GERAllemagne, laissant le §LDNSAP§! au pouvoir. L'IA maintiendra la stature neutre du @DENDanemark mais depuis les puissances de l'Axe, rejoindra la guerre avec l'@GERAllemagne lorsque le moment viendra."
  RULE_OPTION_DEN_FASCIST_AXIS_NEU_EXP: "Fasciste de l'Axe - Marionnettes nordiques"
  RULE_OPTION_DEN_FASCIST_AXIS_NEU_EXP_AI_DESC: "L'aile droite renversera le gouvernement avec le soutien de l'@GERAllemagne, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques et @LIT@LAT@EST baltes diplomatiquement."
  RULE_OPTION_DEN_FASCIST_AXIS_DIPLO_NORD: "Fasciste de l'Axe Diplo - Union de la Norvège"
  RULE_OPTION_DEN_FASCIST_AXIS_DIPLO_NORD_AI_DESC: "L'aile droite renversera le gouvernement avec le soutien de l'@GERAllemagne, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques et @LIT@LAT@EST baltes diplomatiquement, et tentera d'annexer la @NORNorvège."
  RULE_OPTION_DEN_FASCIST_AXIS_DIPLO_BALTIC: "Fasciste de l'Axe Diplo - Dominion baltique"
  RULE_OPTION_DEN_FASCIST_AXIS_DIPLO_BALTIC_AI_DESC: "L'aile droite renversera le gouvernement avec le soutien de l'@GERAllemagne, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques diplomatiquement, et tentera d'annexer la @NORNorvège. L'IA commencera finalement des campagnes de guerre pour sécuriser la @FINFinlande et la mer @EST@LAT@LIT@POLBaltique."
  RULE_OPTION_DEN_FASCIST_AXIS_DIPLO_ENG: "Fasciste de l'Axe Diplo - Danelaw"
  RULE_OPTION_DEN_FASCIST_AXIS_DIPLO_ENG_AI_DESC: "L'aile droite renversera le gouvernement avec le soutien de l'@GERAllemagne, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques et @LIT@LAT@EST baltes diplomatiquement, et tentera d'annexer la @NORNorvège. L'IA commencera finalement des campagnes de guerre pour sécuriser la @FINFinlande avant de déclarer la guerre au @ENG Royaume-Uni pour rétablir le Danelaw."
  RULE_OPTION_DEN_FASCIST_AXIS_EXP_NORD: "Fasciste de l'Axe - Union de la Norvège"
  RULE_OPTION_DEN_FASCIST_AXIS_EXP_NORD_AI_DESC: "L'aile droite renversera le gouvernement avec le soutien de l'@GERAllemagne, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'envahir et d'annexer la @NORNorvège et de transformer en marionnettes les pays @LIT@LAT@EST baltes diplomatiquement."
  RULE_OPTION_DEN_FASCIST_AXIS_EXP_BALTIC: "Fasciste de l'Axe - Dominion baltique"
  RULE_OPTION_DEN_FASCIST_AXIS_EXP_BALTIC_AI_DESC: "L'aile droite renversera le gouvernement avec le soutien de l'@GERAllemagne, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'envahir et d'annexer la @NORNorvège. En fin de partie, l'IA commencera des campagnes de guerre pour sécuriser la @FINFinlande et la mer @EST@LAT@LIT@POLBaltique."
  RULE_OPTION_DEN_FASCIST_AXIS_EXP_ENG: "Fasciste de l'Axe - Danelaw"
  RULE_OPTION_DEN_FASCIST_AXIS_EXP_ENG_AI_DESC: "L'aile droite renversera le gouvernement avec le soutien de l'@GERAllemagne, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'envahir et d'annexer la @NORNorvège et de transformer en marionnettes les pays @LIT@LAT@EST baltes diplomatiquement. En fin de partie, l'IA commencera des campagnes de guerre pour sécuriser la @FINFinlande avant de déclarer la guerre au @ENG Royaume-Uni pour rétablir le Danelaw."
  RULE_OPTION_DEN_FASCIST_NEU: "Fasciste - Neutralité"
  RULE_OPTION_DEN_FASCIST_NEU_AI_DESC: "L'aile droite renversera le gouvernement, laissant le §LDNSAP§! au pouvoir. Le nouveau gouvernement maintiendra la politique de neutralité du @DENDanemark, et n'interférera pas dans les affaires mondiales."
  RULE_OPTION_DEN_FASCIST_NEU_EXP: "Fasciste - Marionnettes nordiques"
  RULE_OPTION_DEN_FASCIST_NEU_EXP_AI_DESC: "L'aile droite renversera le gouvernement, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques et @LIT@LAT@EST baltes diplomatiquement."
  RULE_OPTION_DEN_FASCIST_DIPLO_NORD: "Fasciste Diplo - Union de la Norvège"
  RULE_OPTION_DEN_FASCIST_DIPLO_NORD_AI_DESC: "L'aile droite renversera le gouvernement, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques et @LIT@LAT@EST baltes diplomatiquement, et tentera d'annexer la @NORNorvège."
  RULE_OPTION_DEN_FASCIST_DIPLO_BALTIC: "Fasciste Diplo - Dominion baltique"
  RULE_OPTION_DEN_FASCIST_DIPLO_BALTIC_AI_DESC: "L'aile droite renversera le gouvernement, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques diplomatiquement, et tentera d'annexer la @NORNorvège. L'IA commencera finalement des campagnes de guerre pour sécuriser la @FINFinlande et la mer @EST@LAT@LIT@POLBaltique."
  RULE_OPTION_DEN_FASCIST_DIPLO_ENG: "Fasciste Diplo - Danelaw"
  RULE_OPTION_DEN_FASCIST_DIPLO_ENG_AI_DESC: "L'aile droite renversera le gouvernement, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'influencer et de transformer en marionnettes les pays @NOR@SWE@ICE nordiques et @LIT@LAT@EST baltes diplomatiquement, et tentera d'annexer la @NORNorvège. L'IA commencera finalement des campagnes de guerre pour sécuriser la @FINFinlande avant de déclarer la guerre au @ENG Royaume-Uni pour rétablir le Danelaw."
  RULE_OPTION_DEN_FASCIST_EXP_NORD: "Fasciste - Union de la Norvège"
  RULE_OPTION_DEN_FASCIST_EXP_NORD_AI_DESC: "L'aile droite renversera le gouvernement, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'envahir et d'annexer la @NORNorvège et de transformer en marionnettes les pays @LIT@LAT@EST baltes diplomatiquement."
  RULE_OPTION_DEN_FASCIST_EXP_BALTIC: "Fasciste - Dominion baltique"
  RULE_OPTION_DEN_FASCIST_EXP_BALTIC_AI_DESC: "L'aile droite renversera le gouvernement, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'envahir et d'annexer la @NORNorvège. En fin de partie, l'IA commencera des campagnes de guerre pour sécuriser la @FINFinlande et la mer @EST@LAT@LIT@POLBaltique."
  RULE_OPTION_DEN_FASCIST_EXP_ENG: "Fasciste - Danelaw"
  RULE_OPTION_DEN_FASCIST_EXP_ENG_AI_DESC: "L'aile droite renversera le gouvernement, laissant le §LDNSAP§! au pouvoir. L'IA tentera d'envahir et d'annexer la @NORNorvège et de transformer en marionnettes les pays @LIT@LAT@EST baltes diplomatiquement. En fin de partie, l'IA commencera des campagnes de guerre pour sécuriser la @FINFinlande avant de déclarer la guerre au @ENG Royaume-Uni pour rétablir le Danelaw."
  RULE_OPTION_OVERLORD_RESIST: "Résister au Suzerain"
  RULE_OVERLORD_RESIST_DEN_AI_DESC: "Si le @DENDanemark est transformé en État fantoche, il cherchera à obtenir son indépendance de son pays suzerain, et travaillera lentement vers la déclaration d'indépendance. C'est un comportement historique."
  RULE_OPTION_OVERLORD_RESIST_INDP: "Déclarer l'indépendance"
  RULE_OVERLORD_RESIST_INDP_DEN_AI_DESC: "Si le @DENDanemark est transformé en État fantoche, il cherchera à obtenir son indépendance de son pays suzerain et déclarera son indépendance dès qu'il le pourra. L'IA rejettera toutes les demandes de son pays suzerain."
  RULE_OPTION_OVERLORD_NO_SURRENDER: "Pas de reddition"
  RULE_OVERLORD_NO_SURRENDER_DEN_AI_DESC: "Le @DENDanemark ne permettra pas qu'il soit transformé en État fantoche s'il se trouve en guerre, il se battra jusqu'au bout."
  RULE_OPTION_OVERLORD_COMPLY: "Collaboration"
  RULE_OVERLORD_COMPLY_DEN_AI_DESC: "Si le @DENDanemark est transformé en État fantoche, il cherchera à collaborer avec son pays suzerain et à prêter allégeance."
  RULE_OPTION_OVERLORD_COMPLY_EXP: "Expansionnisme collaboratif"
  RULE_OVERLORD_COMPLY_EXP_DEN_AI_DESC: "Si le @DENDanemark est transformé en État fantoche, il cherchera à collaborer avec son pays suzerain et à prêter allégeance. L'IA demandera à son suzerain de lui accorder des revendications dans les pays @NOR@SWE@ICE@FIN nordiques, même si cela signifie commencer de nouvelles guerres."
  RULE_OPTION_OVERLORD_COMPLY_INDP: "Pétition pour l'indépendance"
  RULE_OVERLORD_COMPLY_INDP_DEN_AI_DESC: "Si le @DENDanemark est transformé en État fantoche, il cherchera à collaborer avec son pays suzerain et à prêter allégeance. L'IA demandera l'indépendance à son suzerain et rejoindra sa faction en tant que partenaire et non en tant que fantoche."
  RULE_OPTION_OVERLORD_COMPLY_SABOTAGE: "Sabotage collaboratif"
  RULE_OVERLORD_COMPLY_SABOTAGE_DEN_AI_DESC: "Si le @DENDanemark est transformé en État fantoche, il cherchera à collaborer avec son pays suzerain, mais sabotera secrètement son suzerain et déclarera plus tard une guerre d'indépendance."
  RULE_OPTION_DEN_MONARCHIST: "Monarchie expansionniste"
  RULE_OPTION_DEN_MONARCHIST_AI_DESC: "Le roi Christian X essaiera de sécuriser les ressources naturelles et de renforcer les capacités militaires du @DENDanemark en contrôlant le reste des pays nordiques par tous les moyens nécessaires."
  RULE_OPTION_DEN_FASCIST: "Danemark fasciste"
  RULE_OPTION_DEN_FASCIST_AI_DESC: "Le parti §Lfasciste§! essaiera de s'emparer du pouvoir au @DENDanemark et de rétablir l'ancien Empire de la mer du Nord @DEN@NOR@ENG."
  RULE_HISTORICAL_ICE_AI_DESC: "L'IA @ICE islandaise essaiera de maintenir la neutralité et cherchera la protection des États-Unis lorsque nécessaire."
  RULE_OPTION_ICE_SUPPORT: "Soutien au Danemark"
  RULE_OPTION_ICE_SUPPORT_AI_DESC: "L'IA @ICE islandaise essaiera de soutenir une défense @DEN danoise contre tout attaquant."
  RULE_OPTION_ICE_FASCIST: "Fasciste"
  RULE_OPTION_ICE_FASCIST_AI_DESC: "L'IA @ICE islandaise dénoncera le roi @DEN danois, et essaiera de créer un empire §Lfasciste§! en mer du Nord."
  RULE_OPTION_ICE_COMMUNIST: "Communiste"
  RULE_OPTION_ICE_COMMUNIST_AI_DESC: "L'IA @ICE islandaise dénoncera la monarchie, et établira un État §Rcommuniste§! en @ICE Islande."
  RULE_OPTION_HISTORICAL_NORWAY: "Gouvernement travailliste - Historique"
  RULE_HISTORICAL_NOR_AI_DESC: "La @NORNorvège maintiendra le parti §Clabour§! de Nygaardsvold. Le gouvernement maintiendra sa position pacifiste précédente à moins d'être attaqué. Vidkun Quisling sera arrêté avant de pouvoir instiguer un coup d'État. Si la @NORNorvège capitule, elle continuera à se battre en tant que gouvernement en exil. C'est un comportement historique."
  RULE_OPTION_HISTORICAL_FASCIST_Q: "Gouvernement travailliste - Coup d'État de Quisling"
  RULE_HISTORICAL_FASCIST_Q_NOR_AI_DESC: "La @NORNorvège maintiendra le parti §Clabour§! de Nygaardsvold. Le gouvernement maintiendra sa position pacifiste précédente à moins d'être attaqué. Si la @NORNorvège est attaquée par une puissance §Lfasciste§!, Vidkun Quisling prendra le contrôle des studios de diffusion NRK à Oslo et convaincra la police locale de le soutenir dans un coup d'État §Lfasciste§!, rejoignant la faction de l'attaquant et conduisant Quisling à devenir le nouveau 'premier ministre'."
  RULE_OPTION_HISTORICAL_FASCIST_RK: "Gouvernement travailliste - Coup d'État de Terboven"
  RULE_HISTORICAL_FASCIST_RK_NOR_AI_DESC: "La @NORNorvège maintiendra le parti §Clabour§! de Nygaardsvold. Le gouvernement maintiendra sa position pacifiste précédente à moins d'être attaqué. Si la @NORNorvège est attaquée par une puissance §Lfasciste§!, Vidkun Quisling prendra le contrôle des studios de diffusion NRK à Oslo et convaincra la police locale de le soutenir dans un coup d'État §Lfasciste§!, rejoignant la faction de l'attaquant. Quisling sera bientôt renversé par Josef Terboven qui mènera la Norvège à devenir un sujet de la nation attaquante."

  ### AMÉRIQUE DU SUD ###

  CHL_AI_BEHAVIOR: "@CHL Chili"
  RULE_HISTORICAL_CHL_AI_DESC: "L'IA chilienne renforcera le système §Cdémocratique§! et choisira de soutenir les politiques socio-démocratiques tout en maintenant l'équilibre des pouvoirs, et ne rejoindra la lutte mondiale que si elle s'éternise."
  RULE_OPTION_CHL_COMMUNIST: "La République socialiste du Chili"
  RULE_OPTION_CHL_COMMUNIST_AI_DESC: "L'IA chilienne utilisera l'instabilité causée par les fascistes pour exiger la démission d'Arturo Alessandri, et augmentera les pouvoirs présidentiels afin qu'ils puissent instaurer un État §Rcommuniste§!."
  RULE_OPTION_CHL_OPERATION_BOLIVAR: "Coopération avec l'opération Bolivar"
  RULE_OPTION_CHL_OPERATION_BOLIVAR_DESC: "L'IA chilienne empruntera la voie du §Lfascisme§!, choisissant de se ranger du côté du Reich allemand si l'occasion se présente, pour finalement entrer en guerre et tenter de restaurer l'ancien Royaume du Chili."
  RULE_OPTION_CHL_PAN_HISPANISM: "Pan-Hispanisme"
  RULE_OPTION_CHL_PAN_HISPANISM_DESC: "L'IA chilienne empruntera la voie du §Lfascisme§!, choisissant finalement de ne se ranger du côté d'aucune des grandes puissances mondiales. Elle tentera ensuite soit de conquérir le monde hispanique, soit de l'unir diplomatiquement."
  RULE_OPTION_CHL_ANTI_IMPERIALISM: "Anti-impérialisme"
  RULE_OPTION_CHL_ANTI_IMPERIALISM_DESC: "L'IA chilienne choisira de soutenir les diverses organisations Mapuche, qui finiront par prendre le contrôle du pays. Elle mènera ensuite une croisade contre l'impérialisme, chassant les États contrôlés par l'Europe d'Amérique du Sud et d'Amérique centrale."
  RULE_OPTION_CHL_LE_DELUGE: "Le Royaume d'Araucanie et de Patagonie"
  RULE_OPTION_CHL_LE_DELUGE_DESC: "L'IA chilienne se tournera vers la tradition et chassera ainsi Alessandri du pouvoir, instaurant Ibáñez à sa place. Elle entrera ensuite dans une guerre civile, dans laquelle Antoine III restaurera l'ancien Royaume d'Araucanie et de Patagonie, se déclarant successeur de Napoléon."
  BRA_AI_BEHAVIOR: "@BRA Brésil"
  RULE_HISTORICAL_BRA_AI_DESC: "Vargas tentera de rester au pouvoir en éliminant soigneusement l'opposition politique au Brésil avant de rejoindre finalement les Alliés et de travailler avec les États-Unis."
  RULE_OPTION_FASCISM: "Fascisme"
  RULE_FASCISM_BRA_AI_DESC: "Le mouvement §Lintégraliste§! trahira Vargas et installera l'un des leurs comme dirigeant. Ils tenteront ensuite de dominer l'Amérique du Sud par la diplomatie et la force."
  RULE_DEMOCRATIC_BRA_AI_DESC: "Le Brésil tentera de renverser Vargas en mettant fin à l'état d'urgence. Il tentera ensuite de réformer la nation, en augmentant la participation §Cdémocratique§! avant de coopérer finalement avec les États-Unis contre les puissances de l'Axe."
  RULE_OPTION_MONARCHIST_HENRIQUE: "Monarchiste - Dom Pedro Henrique"
  RULE_OPTION_MONARCHIST_HENRIQUE_DESC: "L'IA tentera de réformer l'Empire du Brésil en obtenant le soutien pour Pedro Henrique en tant qu'héritier légitime du trône. Il tentera ensuite de conquérir ou d'intégrer les voisins du Brésil."
  RULE_OPTION_MONARCHIST_ALCANTARA: "Monarchiste - Dom Pedro de Alcântara"
  RULE_OPTION_MONARCHIST_ALCANTARA_DESC: "L'IA tentera de réformer l'Empire du Brésil en obtenant le soutien pour Pedro de Alcântara en tant qu'héritier légitime du trône. Il tentera ensuite de se réunifier avec le Portugal par la diplomatie ou la force."
  RULE_OPTION_BRA_COMMUNIST_STALINISM: "Communisme - Luís Carlos Prestes"
  RULE_OPTION_BRA_COMMUNIST_STALINISM_DESC: "Le Brésil tentera de renverser le gouvernement démocratique et de le remplacer par un gouvernement §Rcommuniste§! aligné sur les Soviétiques, dirigé par Luís Carlos Prestes. Il rejoindra ensuite le Komintern et aidera l'Union soviétique."
  RULE_OPTION_BRA_COMMUNIST_INDEPENDENT: "Communisme - Aliança Nacional Libertadora"
  RULE_OPTION_BRA_COMMUNIST_INDEPENDENT_DESC: "Le Brésil ressuscitera l'ANL et tentera de renverser le gouvernement démocratique. Il sera remplacé par le conseil de l'ANL qui mettra ensuite en œuvre des réformes §Rcommunistes§! avant de tenter finalement de libérer le continent du fascisme et de l'impérialisme."
  ARG_AI_BEHAVIOR: "@ARG Argentine"
  RULE_HISTORICAL_ARG_AI_DESC: "L'IA tentera d'adhérer aux événements historiques en évitant l'entrée dans la guerre et en coopérant progressivement avec le Royaume-Uni et les États-Unis."
  RULE_FASCISM_ARG_AI_DESC: "L'IA tentera de transformer le pays en §Lfasciste§! et rejoindra les puissances de l'Axe pour ouvrir un nouveau front en Amérique du Sud."
  RULE_COMMUNIST_ARG_AI_DESC: "L'IA tentera de transformer le pays en §Rcommuniste§! et rejoindra le Komintern pour se concentrer sur la propagation de leur idéologie en Amérique du Sud."
  RULE_DEMOCRATIC_ARG_AI_DESC: "L'IA tentera de devenir §Cdémocratique§! et rejoindra les Alliés pour sauvegarder la démocratie et la liberté en Amérique du Sud."
  RULE_ALLOW_RELEASE_NATIONS_NOT_CHILE_TOOLTIP: "§Y[CHL.GetName]§! ne peut libérer ce pays que via le focus §YCroisade contre l'impérialisme§! ou en suivant les branches §Cdémocratique§! ou §Ycommuniste§! dans l'§Yarbre de focus§!."
  RULE_ALLOW_RELEASE_NATIONS_NOT_QUEBEC_TOOLTIP: "§Y[CAN.GetName]§! ne peut libérer ce pays qu'en complétant soit §Y$CAN_forced_quebec_conscription$§! ou §Y$CAN_compromise_with_quebec$§!."
  RULE_OPTION_HISTORICAL_PAR_AI_DESC: "L'IA restera en dehors de la politique mondiale et se concentrera sur les questions internes, passant par des instabilités qui la tiendront à l'écart de la guerre."
  RULE_OPTION_COMMUNIST_PAR_AI_DESC: "L'IA maintiendra le gouvernement §Rcommuniste§! de Rafael Franco et cherchera à se venger de la Bolivie pour la guerre du Chaco."
  RULE_OPTION_COMMUNIST_PAR_AI: "Communiste"
  RULE_OPTION_DEMOCRATIC_PAR_AI_DESC: "L'IA combattra le coup d'État de Rafael Franco et entrera dans une guerre civile pour essayer de maintenir son gouvernement §Cdémocratique§! intact."
  RULE_OPTION_DEMOCRATIC_PAR_AI: "Démocratique"
  URG_AI_BEHAVIOR: "@URG Uruguay"
  RULE_OPTION_HISTORICAL_URG_AI_DESC: "L'IA essaiera de rester en dehors des affaires mondiales et de se concentrer sur l'industrialisation interne, en mettant le parti Colorado au pouvoir. Ne rejoignant les alliés qu'à la fin de la guerre."
  RULE_OPTION_DEMOCRATIC_ALT_AI_URG_DESC: "L'IA essaiera de rester en dehors des affaires mondiales et de se concentrer sur l'industrialisation interne, en mettant le parti §CBlanco§! au pouvoir. Ne rejoignant les alliés qu'à la fin de la guerre."
  RULE_OPTION_DEMOCRATIC_ALT_AI: "Démocratique Alt"
  RULE_OPTION_FASCIST_AI_URG_DESC: "L'IA s'alignera avec l'Axe, transformant le pays en un §Ltremplin§! pour une conquête de l'Amérique du Sud."
  RULE_OPTION_FASCIST_URG_AI: "Fasciste"
  RULE_OPTION_DISPERSE_MILITARY_POWER: "Disperser le pouvoir militaire"
  RULE_OPTION_DISPERSE_MILITARY_POWER_AI_DESC: "L'IA restera neutre dans les affaires mondiales et essaiera de développer son propre pays à moins d'être provoquée."
  RULE_OPTION_DICTATORSHIP_NEUTRAL: "Dictature neutre"
  RULE_OPTION_DICTATORSHIP_NEUTRAL_AI_DESC: "L'IA suivra la voie d'une dictature autoritaire mais essaiera de rester neutre."
  DICTATORSHIP_WARMONGER: "Belliciste"
  RULE_OPTION_DICTATORSHIP_WARMONGER_AI_DESC: "L'IA suivra la voie d'une dictature autoritaire et essaiera d'étendre son territoire."
  PAR_AI_BEHAVIOR: "@PAR Paraguay"
  RULE_ALLOW_RELEASE_NATIONS_NO_SLOVAKIA_TOOLTIP: "§Y[HUN.GetName]§! et §Y[CZE.GetName]§! ne peuvent libérer ce pays que par le biais d'événements ou de focus."
  AUS_AI_BEHAVIOR: "@AUS Autriche"
  RULE_OPTION_HISTORICAL_AUS_AI_DESC: "L'IA deviendra §Lfasciste§! et tentera d'éviter l'Anschluss avec le Vaterländische Front à la tête."
  RULE_OPTION_MONARCHIST_PUPPET_AUS_AI: "Monarchiste - Sujétion"
  RULE_OPTION_MONARCHIST_PUPPET_AUS_AI_DESC: "L'IA tentera de réformer l'Empire austro-hongrois en reconstruisant leur armée et en exigeant la sujétion des pays qui occupent maintenant leurs anciennes terres."
  RULE_OPTION_MONARCHIST_ANNEX_AUS_AI: "Monarchiste - Annexion"
  RULE_OPTION_MONARCHIST_ANNEX_AUS_AI_DESC: "L'IA tentera de réformer l'Empire autrichien en reconstruisant leur armée puis en s'étendant et en annexant leurs anciens territoires perdus."
  RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI: "Non-aligné fédératif"
  RULE_OPTION_AUS_NEUTRALITY_FEDERATIVE_AI_DESC: "L'IA tentera de former la Fédération danubienne en invitant d'autres nations le long du Danube sous une règle §gnon-alignée§!."
  RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI: "Autrichien soviétique"
  RULE_OPTION_AUS_COMMUNIST_SOV_ALIGNED_AI_DESC: "L'IA tentera de devenir §Rcommuniste§! et de renverser le gouvernement avant de s'aligner avec l'URSS et de rejoindre le Komintern."
  RULE_OPTION_AUS_COMMUNIST_AI: "Communiste"
  RULE_OPTION_AUS_COMMUNIST_AI_DESC: "L'IA tentera de devenir §Rcommuniste§! et de renverser le gouvernement. En adhérant à un programme austromarxiste strict, ils créeront leur propre faction."
  RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI: "Autrichien démocratique - Fédératif"
  RULE_OPTION_AUS_DEMOCRATIC_FEDERATIVE_AI_DESC: "L'IA tentera de former la Fédération danubienne en invitant d'autres nations le long du Danube sous une règle §Cdémocratique§!."
  RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI: "Autrichien démocratique - Alliés"
  RULE_OPTION_AUS_DEMOCRATIC_ALLIES_AI_DESC: "L'IA tentera de rejoindre les Alliés en rétablissant la §Cdémocratie§! en Autriche."
  RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI: "Autrichien démocratique - Fédération alpine"
  RULE_OPTION_AUS_DEMOCRATIC_ALPINE_FEDERATION_AI_DESC: "L'IA tentera de rétablir la §Cdémocratie§! en Autriche et de former la Fédération alpine."
  RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI: "Historique alternatif - Östfrei!"
  RULE_OPTION_AUS_ANTI_ANSCLUSS_STRESS_AI_DESC: "L'IA suivra largement le chemin historique, mais tentera d'éviter l'Anschluss par tous les moyens possibles, se battant bec et ongles pour leur indépendance jusqu'à la fin. Cela pourrait présenter un défi ou un retard à l'éclatement de la guerre."
  BEL_AI_BEHAVIOR: "@BEL Belgique"
  RULE_OPTION_HISTORICAL_BEL_AI: "Historique"
  RULE_OPTION_HISTORICAL_BEL_AI_DESC: "La Belgique essaiera d'abord d'éviter les attaques, mais se repliera ensuite au Congo et continuera la guerre de là-bas."
  RULE_OPTION_NATIONALIST_FASCIST_BEL_AI: "Nationalistes fascistes (Rexist)"
  RULE_OPTION_NATIONALIST_FASCIST_BEL_AI_DESC: "L'IA choisira les §Lfascistes rexistes§!, et établira un État industriel grand et très développé, puis aidera les fascistes dans la guerre."
  RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI: "Fascistes expansionnistes (VNV)"
  RULE_OPTION_EXPANSIONIST_FASCIST_BEL_AI_DESC: "L'IA choisira les §Lnationalistes flamands fascistes§!, et essaiera agressivement d'unir les pays bas, puis se retournera contre la France."
  RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI: "Démocrates défensifs"
  RULE_OPTION_DEFENSIVE_DEMOCRAT_BEL_AI_DESC: "L'IA se débarrassera des chaînes de leur roi à la volonté faible, et essaiera de défendre la Belgique à tout prix tout en restant §Cdémocratique§!."
  RULE_OPTION_COMMUNIST_BEL_AI: "Socialistes"
  RULE_OPTION_COMMUNIST_BEL_AI_DESC: "L'IA permettra au parti travailliste de gagner les élections, puis commencera lentement à s'aligner avec le bloc §Rcommuniste§!."
  COG_AI_BEHAVIOR: "@COG Congo belge"
  RULE_OPTION_HISTORICAL_COG_AI_DESC: "L'IA congolaise restera avec la Belgique et utilisera sa relation avec la nation à son plein potentiel, cherchant finalement une autonomie accrue."
  RULE_OPTION_COG_DEM_INDEPENDENCE_AI: "Mouvements d'émancipation démocratiques"
  RULE_OPTION_COG_DEM_INDEPENDENCE_AI_DESC: "L'IA congolaise essaiera d'obtenir son indépendance dès que possible par des moyens pacifiques, et fera ensuite campagne pour la §Cdémocratie§! à travers l'Afrique."
  RULE_OPTION_COG_COM_INDEPENDENCE_AI: "Mouvements d'émancipation communistes"
  RULE_OPTION_COG_COM_INDEPENDENCE_AI_DESC: "L'IA congolaise essaiera d'obtenir son indépendance dès que possible par des moyens pacifiques, et essaiera ensuite de propager le §Rcommunisme§! à travers l'Afrique."
  RULE_OPTION_COG_COM_REVOLUTION_AI: "La révolution des Simbas"
  RULE_OPTION_COG_COM_REVOLUTION_AI_DESC: "L'IA congolaise essaiera de se libérer de ses seigneurs coloniaux par une §Rrévolution§! violente et une guerre civile subséquente, et essaiera ensuite de propager le §Rcommunisme§! à travers le continent africain."
  AFG_AI_BEHAVIOR: "@AFG Afghanistan"
  RULE_OPTION_HISTORICAL_AFG_AI_DESC: "L'IA afghane essaiera de rester neutre tout au long de la période tout en essayant d'obtenir des concessions économiques de la part des Alliés, du Komintern et des puissances de l'Axe."
  RULE_OPTION_FASCISM_AFG_AI_DESC: "L'IA afghane essaiera de chasser le roi Zahir Shah et de le remplacer par §LAmanullah Khan§! qui essaiera ensuite de moderniser rapidement le pays. L'Afghanistan cherchera ensuite à étendre ses frontières avec l'aide des puissances de l'Axe."
  RULE_OPTION_DEMOCRATIC_AFG_AI_DESC: "L'IA afghane poussera le roi Zahir Shah à chasser ses oncles avant de continuer sur une voie de réformes radicales. Cela aboutira à ce que l'Afghanistan devienne une §Cdémocratie§! et rejoigne les Alliés."
  RULE_OPTION_COMMUNIST_AFG_AI_DESC: "L'IA afghane se rapprochera de l'Union soviétique et mettra en œuvre des réformes radicales pour transformer la nation en un État §Rcommuniste§!. Il essaiera ensuite de prendre le contrôle de l'Asie centrale en rejoignant le Komintern."
  IRQ_AI_BEHAVIOR: "@IRQ Irak"
  RULE_OPTION_HISTORICAL_IRQ_AI: "Historique"
  RULE_OPTION_HISTORICAL_IRQ_AI_DESC: "L'IA oscillera entre les coups historiques, aboutissant à ce que la Place d'Or prenne le contrôle et fasse la guerre au Royaume-Uni avant de finalement restaurer la monarchie et de se rendre."
  RULE_OPTION_FASCISM_IRQ_AI: "Fascisme - Place d'Or"
  RULE_OPTION_FASCISM_IRQ_AI_DESC: "L'IA essaiera de mettre la §LPlace d'Or§! au pouvoir dès que possible avant de rejoindre l'Axe pour combattre le Royaume-Uni. Ils essaieront ensuite d'annexer les territoires arabes voisins."
  RULE_OPTION_HASHEMITE_IRQ_AI: "Hachémite - Non-aligné"
  RULE_OPTION_HASHEMITE_IRQ_AI_DESC: "L'IA essaiera de rester loyal envers le Royaume-Uni tout en renforçant son pouvoir dans la région, prenant progressivement le contrôle de l'administration du territoire et formant finalement la Fédération arabe hachémite."
  RULE_OPTION_SIDQI_IRQ_AI: "Bakr Sidqi - Non-aligné"
  RULE_OPTION_SIDQI_IRQ_AI_DESC: "Bakr Sidqi lancera son coup historique mais ne sera pas assassiné. Au lieu de cela, le gouvernement travaillera avec l'Iran et la Turquie pour former un bloc de puissance régionale."
  RULE_OPTION_KURDISTAN_IRQ_AI: "Indépendance du Kurdistan"
  RULE_OPTION_KURDISTAN_IRQ_AI_DESC: "Les §CKurdes§! du nord de l'Irak lanceront une révolte contre le gouvernement irakien. S'ils réussissent, ils essaieront d'unifier leurs terres à travers la Turquie et l'Iran."
  RULE_ALLOW_RELEASE_NATIONS_NOT_RAJ_TOOLTIP: "§Y[RAJ.GetName]§! ne peut libérer ce pays qu'en complétant §Y$RAJ_a_secular_state$§!, §Y$RAJ_incorporation_of_the_east_india_company$§!, §Y$RAJ_hindutva$§!, §Y$RAJ_netaji$§! ou en complétant §YPartition§!"
  PER_AI_BEHAVIOR: "@PER Iran"
  RULE_OPTION_HISTORICAL_PER_AI: "Historique"
  RULE_OPTION_HISTORICAL_PER_AI_DESC: "L'IA travaillera à travers des réformes politiques et renforcera leur militaire, avant d'être envahie et de capituler immédiatement."
  RULE_OPTION_IMPERIAL_PER_AI: "Impérial - Non-aligné"
  RULE_OPTION_IMPERIAL_PER_DESC: "L'IA établira une monarchie absolue en tant que Reza Shah Pahlavi et travaillera à une campagne de conquête au Moyen-Orient."
  RULE_OPTION_DEMOCRATIC_PER_AI: "Démocratique - Monarchie constitutionnelle"
  RULE_OPTION_DEMOCRATIC_PER_DESC: "L'IA forcerà des limites constitutionnelles sur le Shah et suivra une voie de §Cdémocratie§! avant de tenter finalement de rejoindre une faction démocratique."
  RULE_OPTION_COMMUNISM_PER_AI: "Communisme - Tudeh"
  RULE_OPTION_COMMUNISM_PER_DESC: "L'IA s'engagera dans une révolution qui laissera le parti Tudeh aligné sur les Soviétiques au pouvoir. Le régime §Rcommuniste§! tentera de déstabiliser la région."
  RULE_OPTION_FASCISM_PER_AI: "Fascisme - SUMKA"
  RULE_OPTION_FASCISM_PER_DESC: "L'IA unira les nationalistes du pays et formera le SUMKA, apportant un régime §Lfasciste§! au pays. Il tentera de rejoindre une faction §Lfasciste§! et de déclarer la guerre à leurs voisins."
  RULE_OPTION_HISTORICAL_GENERIC_AI_DESC: "L'IA conservera son idéologie actuelle à la date de départ de 1936."
  RULE_OPTION_HISTORICAL_GENERIC_NA_NEU_AI: "Neutralité non-alignée"
  RULE_OPTION_HISTORICAL_GENERIC_NA_NEU_AI_DESC: "L'IA restera fidèle à l'idéologie §gnon-alignée§! ou y basculera, et adoptera l’axe de neutralité afin de rester en dehors des affaires mondiales."
  RULE_OPTION_HISTORICAL_GENERIC_NA_INT_AI: "Non-aligné"
  RULE_OPTION_HISTORICAL_GENERIC_NA_INT_AI_DESC: "L'IA restera fidèle à l'idéologie §gnon-alignée§! ou y basculera, mais n’adoptera pas l’axe de neutralité, la laissant plus ouverte aux affaires mondiales."
  RULE_OPTION_HISTORICAL_GENERIC_DEM_NEU_AI: "Neutralité démocratique"
  RULE_OPTION_HISTORICAL_GENERIC_DEM_NEU_AI_DESC: "L'IA restera fidèle à l'idéologie §Cdémocratique§! ou y basculera, et adoptera l’axe de neutralité afin de rester en dehors des affaires mondiales."
  RULE_OPTION_HISTORICAL_GENERIC_DEM_INT_AI: "Démocratique"
  RULE_OPTION_HISTORICAL_GENERIC_DEM_INT_AI_DESC: "L'IA restera fidèle à l'idéologie §Cdémocratique§! ou y basculera, mais n’adoptera pas l’axe de neutralité, la laissant plus ouverte aux affaires mondiales."
  RULE_OPTION_HISTORICAL_GENERIC_COM_AI: "Communiste"
  RULE_OPTION_HISTORICAL_GENERIC_COM_AI_DESC: "L'IA restera fidèle à l'idéologie §Rcommuniste§! ou y basculera."
  RULE_OPTION_HISTORICAL_GENERIC_FAS_AI: "Fasciste"
  RULE_OPTION_HISTORICAL_GENERIC_FAS_AI_DESC: "L'IA restera fidèle à l'idéologie §Lfasciste§! ou y basculera."
  RULE_OPTION_HISTORICAL_LUX_NA_NEU_AI: "Monarchiste – Neutralité"
  RULE_OPTION_HISTORICAL_LUX_NA_NEU_AI_DESC: "Lors des élections de 1937, la §gMaison de Nassau§! s’emparera du pouvoir au @LUXLuxembourg et adoptera l’axe de neutralité afin de tenter de rester en dehors des affaires mondiales."
  RULE_OPTION_HISTORICAL_LUX_NA_INT_AI: "Monarchiste"
  RULE_OPTION_HISTORICAL_LUX_NA_INT_AI_DESC: "Lors des élections de 1937, la §gMaison de Nassau§! s’emparera du pouvoir au @LUXLuxembourg, mais n’adoptera pas l’axe de neutralité, laissant le pays plus ouvert aux affaires mondiales."
  RULE_OPTION_HISTORICAL_LUX_DEM_NEU_AI_DESC: "@LUXLuxembourg restera §Cdémocratique§!, avec Pierre Dupong à la tête de la nation."
  RULE_OPTION_HISTORICAL_LUX_DEM_INT_AI_DESC: "@LUXLuxembourg restera §Cdémocratique§!, en conservant Joseph Bech à la tête de la nation."
  RULE_OPTION_HISTORICAL_BOL_NA_NEU_AI: "Coup d’État socialiste militaire – Ruilova"
  RULE_OPTION_HISTORICAL_BOL_NA_NEU_AI_DESC: "@BOLBolivie subira un coup d’État renversant le gouvernement démocratique, laissant un §gGouvernement militaire socialiste§! dirigé par David Toro Ruilova."
  RULE_OPTION_HISTORICAL_BOL_NA_INT_AI: "Coup d’État socialiste militaire – Beccera"
  RULE_OPTION_HISTORICAL_BOL_NA_INT_AI_DESC: "@BOLBolivie subira un coup d’État renversant le gouvernement démocratique, laissant un §gGouvernement militaire socialiste§! dirigé par David Toro Ruilova, qui sera rapidement contraint de démissionner par son partenaire Germán Busch Beccera."
  RULE_OPTION_HISTORICAL_BOL_DEM_INT_AI: "Plurinationalisme démocratique"
  RULE_OPTION_HISTORICAL_BOL_DEM_INT_AI_DESC: "@BOLBolivie vaincra le coup d’État socialiste, restera §Cdémocratique§! et adoptera une politique de plurinationalisme, renommant le pays et intégrant plus rapidement les États non-noyaux potentiellement contrôlés."
  PHI_AI_BEHAVIOR: "@PHI Les Philippines"
  RULE_OPTION_HISTORICAL_PHI_AI: "Historique"
  RULE_OPTION_HISTORICAL_PHI_AI_DESC: "Les Philippines resteront alignées avec les États-Unis."
  RULE_OPTION_FLEXIBLE_PHI_AI: "Flexible"
  RULE_OPTION_FLEXIBLE_PHI_AI_DESC: "Les Philippines joueront les États-Unis et le Japon l’un contre l’autre afin de maximiser leur potentiel."
  RULE_OPTION_FASCIST_PHI_AI: "Fascisme"
  RULE_OPTION_FASCIST_PHI_AI_DESC: "Les Philippines s’aligneront sur le Japon, risquant de sombrer elles-mêmes dans le fascisme."
  RULE_OPTION_MONARCHIST_PHI_AI: "Hispanique"
  RULE_OPTION_MONARCHIST_PHI_AI_DESC: "Les élections philippines seront annulées, permettant au $PHI_neutrality_party_long$ de prendre le pouvoir jusqu’à une guerre d’indépendance avec le soutien de nations hispaniques amies, aboutissant à l’instauration d’une monarchie."
  RULE_OPTION_COMMUNIST_PHI_AI: "Communisme maritime"
  RULE_OPTION_COMMUNIST_PHI_AI_DESC: "Le soleil rouge se lèvera sur les Philippines, alors que le communisme maritime s’imposera et cherchera à diffuser l’esprit d’égalité à travers les océans du monde."
  RULE_OPTION_MACARTHUR_PHI_AI: "Déclarer l’état d’urgence militaire"
  RULE_OPTION_MACARTHUR_PHI_AI_DESC: "Après la chute du gouvernement philippin, une figure militaire émergera et dirigera la nation contre tous les agresseurs."
  RULE_ALLOW_RELEASE_NATIONS_WARLORD_CHINA_TOOLTIP: "§Y[ROOT.GetNameDefCap]§! ne peut pas libérer §Y[CHI.GetNameDef]§! ni §Y[PRC.GetNameDef]§!."